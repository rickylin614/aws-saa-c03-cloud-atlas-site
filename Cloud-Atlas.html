</script><script>
/* 從零解說與推理練習：前24課。與 curriculum.js 的 lesson id 對應。 */
window.LESSON_GUIDES_A = (() => {
  const guides = {};
  const add = (id,intro,analogy,outcome,steps,situation,reasoning,conclusion,question,options,answer,explanations) => {
    guides[id] = {intro,analogy,outcome,steps:steps.map(([title,explanation,example])=>({title,explanation,example})),workedExample:{situation,reasoning,conclusion},check:{question,options,answer,explanations}};
  };
  add('foundations',
    '先不用背任何AWS服務名稱。想像你在手機上開訂餐網站：你按下「查看菜單」，手機把一段詢問送到另一台電腦，那台電腦找出菜單並把結果送回來。這段詢問叫做請求；負責接收請求、執行程式、回傳結果的電腦叫伺服器。伺服器不是神祕的東西，它也是電腦，只是通常放在專門機房，持續提供服務。這一課要學的是：一個網站需要哪些基本工作，以及某台電腦壞掉時，怎樣讓客人還能下單。',
    '把網站想成餐廳：客人的手機像點餐窗口，運算像廚房，資料儲存像訂單簿。雲端不是沒有廚房，而是向供應商租用可以增減的廚房與設備。',
    '你能畫出「手機→處理請求的程式→保存訂單的地方」，再指出單台伺服器故障時會中斷哪一段。',
    [
      ['網站到底在做什麼？','一個網站至少包含讓人操作的畫面、處理事情的程式，以及需要長期保存的資料。程式執行計算或業務規則，例如確認餐點價格、檢查是否售完；資料儲存負責把菜單、帳號和訂單留下來。這兩項工作可以放在同一台電腦，但概念上要分開，因為程式可以重新啟動，客人已付款的訂單卻不能隨意消失。','你重新開啟手機App，畫面可以重新下載；昨天已付款的訂單仍應存在。這正是程式與持久資料的差別。'],
      ['雲端是在租什麼？','傳統做法是自己買電腦、安排機房、接電和網路，還要處理設備故障。使用雲端時，這些實體設備仍存在，只是由AWS等供應商管理。你透過網站或程式要求一台可執行應用的電腦，或一個保存檔案的空間，再依服務的使用方式付費。你仍需決定誰能登入、保存什麼資料、是否需要備份，不能把「租設備」理解成「所有事情都有人替我做」。','平日只需要兩個廚房，週末訂單增加再租更多設備，比一開始買下尖峰時才會用到的全部設備更有彈性。'],
      ['Region與AZ：把故障範圍分清楚','Region是AWS提供服務的一個地理區域；你先選擇在哪個區域建立系統，以考慮客人距離、法規和服務供應。Region裡又有多個Availability Zone，簡稱AZ，可用區是彼此隔離的機房設施群。單一AZ失效，不應等同整個Region都失效。因此，把兩份應用放在不同AZ，可以降低同一處故障讓兩份一起停止的機會；放兩台在同一AZ則沒有跨越這個故障邊界。','兩間廚房若在同一棟大樓，停電時可能一起停止；放在兩個隔離地點，才比較能承受單一地點故障。'],
      ['能繼續服務，和能找回資料，是兩件事','可用性問的是「現在能不能使用」；備份問的是「資料壞了或刪了，能不能找回以前的版本」。另一台伺服器可以在第一台壞掉時接手，改善可用性；但如果程式把訂單錯刪，兩邊也可能一起看到錯誤結果。備份則保留某個時間的資料副本，還原通常需要時間。好的設計會同時想故障接手和資料還原，而不是挑其中一個就當作全部解決。','備用點餐機能繼續收單，但不一定能找回被刪除的昨日訂單；訂單簿影本能找回資料，但不能立即代替正在收單的機器。'],
      ['親手追一次請求與回應','HTTP是一套讓瀏覽器與網站交換請求和回應的規則，不是某台電腦的品牌。你按下送出訂單，瀏覽器送出包含餐點內容的請求；伺服器執行程式，確認價格與庫存，再把需要保存的訂單寫入資料儲存，最後回傳成功或失敗的結果。HTTPS則在這種通訊上加入傳輸保護，降低途中內容被窺看或修改的風險。它不能取代伺服器內的正確權限、資料保存或備份。','現在試著用手指畫五步：按下按鈕→送出請求→程式檢查→保存訂單→收到結果。如果在保存前就回覆成功，客人可能看到成功畫面，系統卻還沒有留下訂單。']
    ],
    '你的訂餐網站目前只有一台電腦，菜單程式和所有訂單都在上面。老闆說：「壞一台電腦也要能繼續接單，而且誤刪訂單時要找得回來。」',
    ['先畫出手機、應用程式、訂單資料三個部分。這讓你知道哪些東西能重建，哪些資料必須保留下來。','再處理單台電腦故障：讓兩份應用在不同AZ執行，並安排入口把請求送到仍健康的那一份。這裡先理解分工，不急著背服務名稱。','接著處理資料層：使用能跨AZ接手的資料庫配置，並安排獨立備份與還原測試。跨AZ資料副本是為了繼續服務，備份是為了回到較早狀態。','最後檢查需求是否包含整個Region停止。若沒有，不必一開始就做更昂貴、更複雜的跨Region系統；先滿足已說清楚的故障範圍。'],
    '這一課的成果不是背出一串縮寫，而是能說出網站的三項工作、租用雲端的意思，以及「讓服務接手」和「把資料找回來」的不同。後續課程才把每一項工作對應到AWS服務。',
    '網站已在兩個AZ各執行一份應用，為什麼仍需要備份？',
    ['因為跨AZ副本可能也收到同一次誤刪，備份才提供較早的還原點。','因為兩個AZ其實就是同一台電腦。','因為備份會自動把所有服務變成永不停止。'],0,
    ['正確。接手處理故障與回復歷史資料的目的不同；複寫可能把錯誤一併傳過去。','不正確。AZ是隔離的機房設施群；需要備份不是因為它們是同一台電腦。','不正確。備份要經過還原流程，並不保證即時或永不中斷。']);

  add('exam-map',
    'SAA考試不是要求你把AWS產品型錄背下來，而是給你一段公司的需求，請你選出最適合的設計。把「最適合」想成同時符合幾個條件：能完成工作、資料受到保護、故障時有辦法處理，並且不花不必要的錢。你會發現兩個選項都能做同一件事，但其中一個不符合「最少管理工作」或「資料必須立即讀取」的限制。這一課教你把長題目拆成可以比較的條件。',
    '像替家人選交通方式：飛機、高鐵、汽車都能到目的地，但行李、時間、預算和出發地會改變最佳答案。',
    '看到情境題時，你能先寫出需求與限制，再用理由排除選項，而不是只挑最熟悉的服務。',
    [
      ['把「想要」與「一定要」分開','題目裡的需求不一定有相同重要性。「每天處理報表」是在說要完成的工作；「不能遺失已接受的資料」是不能違反的限制；「管理工作最少」則是在可行方案之間做比較的目標。先排除違反必要限制的方案，再比較成本或管理負擔。否則你容易選到便宜卻無法完成工作的答案。','題目要求立即開啟封存檔案，任何必須先等待還原的儲存方式，都不能只因單價較低就獲選。'],
      ['把四大領域看成四個問題','安全架構問「誰能做什麼、資料如何保護」；韌性架構問「設備或依賴故障後怎麼繼續」；效能架構問「系統能否在需要的時間內處理足夠工作」；成本最佳化問「滿足需求後，如何避免付不需要的費用」。同一個設計會同時回答這四個問題，不是每個服務只屬於單一考科。','同一個S3儲存桶可以討論存取權限、資料副本、讀取速度與儲存級別，四個角度各自關心不同事情。'],
      ['把錯題變成可修正的原因','做完一題，不只記住正確選項。試著補完三句話：「我忽略了哪個條件？」「正確方案靠什麼機制滿足它？」「我選的方案會在哪裡失敗？」如果你只能說某個字眼對應某個服務，代表理解可能還停在記憶。本站的領域練習用來找缺口，計時模擬考則練習分配時間；它們不會模擬AWS完整的尺度化計分。','你把讀取副本當成資料庫故障接手方案，就應回頭比較「增加讀取能力」與「自動接手」兩種目的，而不是只抄題號。']
    ],
    '公司每晚跑一次兩小時的資料轉換，可以重試，白天不使用這組運算。題目問哪種方式更具成本效益。',
    ['先確認工作是批次，不是持續對客人提供的即時網站，所以不必全年維持相同容量。','再抓住可以重試的條件，代表某些可中斷的運算方案可能可行，但仍要確認程式能保存進度或重新執行。','最後比較「工作結束就釋放容量」與「長期保留閒置主機」，而不是直接替現有主機買最長的折扣承諾。'],
    '答案應來自工作特性與限制。換成不能中斷的即時付款系統，原本適合的可中斷批次方案就不再自然成立。',
    '題目同時要求最低成本與不能中斷，你應先做哪一件事？',
    ['先選所有選項中單價最低的。','先排除會違反不能中斷條件的方案，再比較可行方案的總成本。','只要使用託管服務就一定符合全部條件。'],1,
    ['單價最低不代表符合業務要求，也可能忽略其他計費項目。','正確。硬性限制先決定哪些方案可行，最佳化目標再用來選出其中最合適者。','託管服務能減少部分管理工作，但仍有容量、功能與故障行為的差異。']);

  add('iam',
    '你可以登入AWS帳號，不代表帳號裡每一段程式都應擁有同樣權限。身分與存取管理IAM，處理的是「誰正在提出要求，以及這個要求是否被允許」。這裡的誰可以是人，也可以是執行中的程式。先用一個簡單句型理解權限：讓某個身分，在某個資源上，執行指定動作。把範圍寫得越接近真正需要，就越能避免一處出錯牽連其他資料。',
    '公司門禁卡既要證明你是誰，也要決定你能開哪扇門；拿得到卡片，不代表能進所有辦公室。',
    '你能分清「誰可以取得角色」與「角色取得後能做什麼」，並為程式設計不含長期金鑰的最小權限。',
    [
      ['先讀懂一條權限在說什麼','政策是授權規則的文件。Action表示動作，例如讀取物件或刪除資料；Resource表示動作能作用的對象；Effect表示允許或拒絕；Condition則加上條件，例如必須使用安全連線。最小權限不是一律禁止，而是只開放完成任務需要的動作及對象。若程式只讀報表，就沒有理由讓它刪除整個儲存桶。','「報表程式可以讀取reports資料夾中的物件」比「報表程式可以對全部S3資源做任何事」更貼近工作需求。'],
      ['為什麼程式應該使用角色？','角色是一組可以被受信任身分暫時取得的權限。程式透過AWS提供的機制取得有到期時間的憑證，不必在程式碼裡保存長期存取金鑰。角色有兩個不同問題：信任政策決定誰能取得它，權限政策決定取得之後能做什麼。只有信任而沒有讀資料權限，程式仍然不能讀資料。','讓EC2上的報表程式取得指定角色，角色只允許讀取報表桶；換機器時不必把某個人的長期金鑰複製過去。'],
      ['遇到拒絕時，沿著授權鏈檢查','AWS不是只看你最近新增的那份政策。身分政策、資源上的政策，以及適用的組織限制都可能影響同一個要求。明確拒絕代表有一條規則明白寫出禁止，不能靠另一條允許直接蓋過。排查時先確認實際使用的身分、動作與資源，再找拒絕原因；不要為了讓程式跑通就改成全帳號管理員。','你允許程式讀取報表，但儲存桶要求透過指定私有端點存取。程式若走其他路徑，仍可能收到AccessDenied。']
    ],
    '網站需要顯示S3中的商品圖片，但負責圖片讀取的程式不應能刪除圖片，也不應接觸薪資資料。',
    ['把身分明確定義成這個網站的執行角色，而不是網站開發者的個人IAM使用者。','把可執行動作限制在需要的讀取動作，資源限制為商品圖片的桶或指定前綴；若使用加密金鑰，另外確認解密授權。','測試允許路徑應成功，也測試刪除圖片與讀薪資桶應失敗。成功不只是在說能讀，更要證明不該做的事不能做。'],
    '用角色避免散布長期金鑰，用最小權限限制事故範圍，用正反兩種測試確認政策符合需求。',
    '已允許EC2取得某個角色，但該角色沒有任何S3讀取權限。結果是？',
    ['取得角色就自動能讀所有S3。','只要再建立一個安全群組就能讀。','能取得角色，但仍沒有讀取S3資料的授權。'],2,
    ['信任政策只解決誰能取得角色，不會自動增加資料操作權限。','安全群組處理網路流量，不會替代S3的身分授權。','正確。必須分別設計信任與操作權限。']);

  add('organizations',
    '一家公司通常不只一個網站，也不只有正式環境。若開發人員的測試、正式訂單、稽核日誌全擠在同一個AWS帳號，權限誤設或資源配額問題就更容易互相影響。多帳號設計先把不同用途隔開，再集中管理。Organizations是管理這些帳號的工具；它不是把所有帳號資料混在一起，也不是替每個使用者直接授權。',
    '把AWS帳號想成有獨立門鎖的房間，Organizations像大樓管理。公司可以統一收帳單、訂共同規則，但各房間仍有自己的鑰匙與內容。',
    '你能說明為什麼要分帳號、組織護欄與個別授權如何分工，以及員工登入和消費者登入應使用不同工具。',
    [
      ['帳號隔離解決什麼問題？','AWS帳號是資源、權限與許多服務配額的重要隔離邊界。把正式與測試放在不同帳號，能減少測試操作直接影響正式資料的機會；把日誌放到另外的帳號，則能降低一般工作負載管理員修改稽核證據的能力。集中付款方便看總費用，但不會讓某帳號自動能讀另一帳號的資料。','測試程式不小心啟動大量主機，應主要影響測試帳號的配額與費用，不應直接占掉正式系統需要的資源。'],
      ['護欄是上限，不是通行證','服務控制政策SCP用來限制成員帳號最多可以擁有哪些權限。例如公司禁止某些帳號在不允許的區域建立資源，即使該帳號裡有人擁有廣泛管理權限，也會受到適用限制。可是SCP並不替人新增權限；實際操作仍需要IAM等政策授權。部署限制前應先在測試範圍驗證，避免把正常管理路徑一起封住。','公司大樓規定夜間不開放實驗室，不代表白天任何路人都能進實驗室；白天仍要有自己的門禁權限。'],
      ['把登入與帳號治理分工','IAM Identity Center協助員工集中登入多個AWS帳號與應用，讓管理者用權限集合分配工作範圍。Cognito則主要服務你開發的App使用者，例如顧客註冊與社群登入。Control Tower協助建立有治理基線的多帳號環境。這些服務各自處理不同層次，不能只因為都有「帳號」兩字就互換。','工程師進公司AWS管理環境可使用Identity Center；訂餐顧客用Google帳號登入你的App，則是不同的應用身分需求。']
    ],
    '公司新增三個產品，每個產品都有測試與正式環境，希望工程師一次登入，同時讓安全團隊集中保存日誌。',
    ['先依環境與責任切分帳號，安排正式、測試、日誌和安全用途，再依共同治理需求把帳號分組。','使用Identity Center分配工程師到不同帳號的角色權限，避免每個帳號都建立一份長期使用者與密碼。','使用適用的SCP限制不允許的行為，並把集中日誌帳號的寫入與管理權限分開；新增護欄前先測試正常工作是否仍可完成。'],
    '多帳號提供隔離，集中登入減少身分管理負擔，護欄限制整體風險；三者互補，沒有任一項能自動代替另外兩項。',
    'SCP允許使用S3，但某位使用者沒有任何S3操作授權，他能直接讀取物件嗎？',
    ['不能，SCP是權限上限，仍需要實際授權。','能，SCP會自動建立IAM權限。','能，集中付款就代表所有資料共用。'],0,
    ['正確。允許某項服務出現在可授權範圍，不等於已經授權某個身分。','SCP不會自動建立IAM操作權限。','集中付款與資料存取是不同問題。']);

  add('kms-secrets',
    '加密不是把一個開關打開，就再也不用想安全問題。你要同時問：資料存放時如何保護、傳輸時如何保護、誰可以拿到解密能力，以及程式用的密碼放在哪裡。KMS負責管理保護資料所需的金鑰；Secrets Manager等工具保存密碼與其他機密。金鑰和密碼都需要權限控制，但它們在系統中的用途並不相同。',
    '資料加密像把文件鎖進保險箱，金鑰管理像控制保險箱鑰匙；傳輸加密則像把文件送往另一地點時使用受保護的運送通道。',
    '你能指出資料、金鑰、傳輸與程式機密各自的保護方式，並理解為什麼有讀取權限仍可能無法解密。',
    [
      ['先分開看保存與傳送','靜態加密保護已儲存在磁碟或儲存服務中的資料；傳輸加密保護資料從一個地方送到另一個地方的過程。網站啟用HTTPS使用TLS保護瀏覽器連線，但這不會自動把資料庫磁碟加密。反過來，資料庫磁碟已加密，也不代表應用到資料庫的連線已受TLS保護。每一段都要依需求確認。','客人以HTTPS送出訂單、應用以TLS連資料庫、資料庫保存時使用靜態加密，是三個彼此相關但獨立的決定。'],
      ['KMS如何參與大型資料加密？','大型資料通常由資料金鑰加密，再由KMS管理的金鑰保護這把資料金鑰，稱為信封加密。這樣不必把整個大檔案當成一次KMS加密請求。讀取加密物件時，系統既要允許讀取物件，也要允許使用相關金鑰。跨帳號分享資料尤其要注意：資料桶願意給你資料，不代表金鑰管理者也允許你解開。','把鎖住的箱子交給合作公司，卻沒給他們受控的開鎖權限，他們仍然無法使用箱子裡的報表。'],
      ['不要把密碼當作程式的一部分','資料庫密碼、外部API機密等，若寫進程式碼或映像檔，就可能隨備份、版本紀錄與部署一併散布。把它們保存到專門服務，讓程式用執行角色取得需要的機密，再配合輪替流程。輪替是更新機密值及相關系統的過程，不是隨機改掉一個字串就算完成；應用的快取也要能更新。','資料庫密碼更新後，程式若一直使用記憶體裡的舊值，仍會登入失敗，所以保存、輪替與重新讀取必須一起設計。']
    ],
    '合作帳號可以讀取你分享的S3報表，卻收到與KMS解密有關的拒絕；同時應用程式仍把資料庫密碼寫在設定檔。',
    ['先把兩個問題分開：報表是資料與加密金鑰的授權問題，設定檔則是機密保存與散布問題。','檢查物件使用哪把KMS金鑰，以及目標身分是否在適用的金鑰與IAM政策中獲准使用；不要為了排錯把桶或金鑰全面開放。','把資料庫密碼移到受控的機密管理服務，以應用角色讀取，測試輪替後仍可建立連線，並清除原始碼與部署產物中的舊機密。'],
    '能取回加密資料和能解密，是兩個需要協作的授權；保護機密還必須考慮它曾被複製到哪些地方。',
    'S3物件使用SSE-KMS，讀取者只有s3:GetObject，為何可能仍失敗？',
    ['因為HTTPS只支援未加密物件。','因為還需要適用的KMS金鑰使用權限。','因為每個讀取者都必須取得金鑰管理員權限。'],1,
    ['HTTPS與SSE-KMS可以同時使用，兩者處理不同階段。','正確。物件存取與解密授權都要符合。','需要的是工作所需的金鑰使用權限，不是管理或刪除金鑰的權限。']);

  add('vpc',
    '網路可以先想成「資料要走哪條路」。VPC是你在AWS區域內規畫的一個隔離網路範圍，子網路則是其中切出的一段位址。位址像收件地址，路由表像指路規則：要去這個目的地時，下一站應交給誰。能找到路不等於獲准通行；路由、位址與安全規則要一起正確，連線才會成功。這一課先理解路線，再記住服務名稱。',
    'VPC像社區，子網路像街區，路由表像路口指示牌。指示牌決定往哪走，門禁則決定能否進入。',
    '你能逐跳描述公有與私有子網路的對外路徑，並說明為何把主機放入公有子網路不代表它一定能連上網際網路。',
    [
      ['子網路與路由表如何配合？','每個子網路位於一個AZ，並使用關聯的路由表決定往外送出的封包下一站。路由表有本地網路路徑，也可以加入前往其他網路的規則。所謂公有子網路，通常指它的路由表有前往Internet Gateway的路徑；這是在描述子網路的路由能力，不是在保證每台主機都具備可由外部存取的位址與權限。','同一個子網路裡的兩台EC2，即使共用路由表，也可能因公開位址、安全群組或作業系統設定不同，而有不同連線結果。'],
      ['公有入口與私有出站有何差別？','Internet Gateway讓VPC與網際網路建立合適的路徑。IPv4私有主機若只想主動下載更新，又不希望外界直接發起連線，可透過公有NAT Gateway等適用出站設計。NAT會轉換位址並讓回應回到原來主機；它不是讓外界任意進入私有主機的代理入口。需要外部客人使用的網站入口，通常另由公開的負載平衡器處理。','應用主機可以透過NAT下載更新套件，但客人應連網站的公開入口，而不是期待由NAT直接找到某台私有主機。'],
      ['連不上時，怎麼一步一步查？','先確認主機在哪個子網路、使用什麼位址，接著檢查關聯路由表，再檢查下一站是否存在且配置正確。然後看安全群組、網路ACL與目的地回程。不要只看「已經建了NAT」就認為路通了，因為私有子網路可能還沒有指向它的規則。IPv6與IPv4的位址及出站設計也不能混為一談。','私有路由表缺少對外預設路由時，主機不知道要把外部封包交給誰；安全群組放行再多，也不能替它補上那條路。']
    ],
    '訂餐網站的應用放在私有子網路，需要安裝套件；資料庫也在私有網路，但不應接受網際網路直接連線。',
    ['畫出兩種流量：客人到應用的入站，和應用下載更新的出站。不要把兩者當成同一個需求。','讓公開負載平衡入口接收客人流量，將請求轉給私有應用；應用主動出站則規畫適用的NAT與路由。','讓資料庫只接受應用需要的連線，並檢查子網路與安全規則；不因為應用需要下載套件，就把整個資料層公開。'],
    '你應能沿著箭頭說出每一段資料如何抵達下一站，再檢查那一段是否被授權，而不是靠反覆開放全部連線來嘗試。',
    'EC2所在子網路有往Internet Gateway的路由，是否就保證這台EC2能直接以IPv4對外連線？',
    ['保證，路由會自動替所有主機配公開IP。','保證，只要子網路名稱包含public。','不保證，還需合適的位址、安全規則與完整路徑。'],2,
    ['路由不會自動替所有主機提供公開位址。','名稱只是標籤，實際路由與配置才影響行為。','正確。公有子網路描述路由條件，不等於每台主機都已具備全部連線條件。']);

  add('network-security',
    '網路上能找到地址，不代表應該允許連線。安全群組與網路ACL就像兩層通行檢查，但它們記憶連線的方式不同。私有端點則是另一個問題：程式訪問AWS服務時，是否能走不經一般網際網路出口的路徑。把「走哪條路」和「准不准通行」分開，你就比較不會把建好端點誤以為已經取得資料權限。',
    '安全群組像會記住你進門紀錄的接待員；無狀態ACL像每一趟都重新檢查的關卡。私有端點則像通往合作單位的專用通道。',
    '你能解釋有狀態與無狀態的差別，並知道私有端點不會取代IAM與資源政策。',
    [
      ['安全群組為何不用另開回應流量？','安全群組附加在網路介面等資源，使用允許規則控制流量，而且會追蹤已允許的連線狀態。某台應用主動建立被允許的連線，對方回應會被視為該連線的一部分。這稱為有狀態。安全群組沒有一般的明確拒絕規則；你透過不允許某類新連線來限制它，而不是用規則編號排列允許與拒絕。','資料庫只允許應用安全群組連到指定資料庫埠，能讓新增的應用主機透過群組關係取得相同網路通行範圍。'],
      ['ACL為什麼要考慮回程？','網路ACL作用在子網路邊界，依規則編號順序比對，能允許或拒絕，但不記住之前放行過哪條連線。這稱為無狀態。因此請求出去獲准，不表示回應進來也自動獲准。用戶端常使用暫時通訊埠接收回應，設計ACL時必須包含合適回程範圍，否則表面上服務埠已開，連線仍可能逾時。','應用對外連HTTPS使用目的埠443，但回應回到應用的埠，可能是應用建立連線時選的暫時埠，而不是目的服務的443。'],
      ['Endpoint解決路徑，不直接授權資料','Gateway endpoint可讓VPC中的適用S3或DynamoDB流量透過路由表走服務路徑；Interface endpoint則在子網路中提供私人介面，常搭配PrivateLink。選擇端點時要看服務支援及費用。即使網路路徑已通，身分政策、端點政策、資源政策和加密金鑰權限仍要符合；任何適用的明確拒絕仍可能讓請求失敗。','你建立了S3端點，但應用角色沒有讀取物件權限，這就像走到了辦公室門口，卻仍沒有打開文件櫃的鑰匙。']
    ],
    '私有應用每天大量讀取同區域S3，現在全部經過NAT；團隊希望降低此路徑費用，但不能把桶公開。',
    ['確認這些流量適合S3 gateway endpoint，再把正確路由表與端點關聯，而不是只建立一個沒有被子網路使用的端點。','保持儲存桶私有，檢查應用角色、端點政策與桶政策是否允許指定存取；若用KMS加密，連同金鑰權限一起確認。','測試允許的物件應能讀取，不允許的桶或前綴仍應拒絕；另外確認管理路徑不會被新限制意外切斷。'],
    '私有服務路徑可以減少不必要的網路繞路；真正的安全性仍來自路由與授權的共同設計。',
    '哪一個敘述正確？',
    ['安全群組追蹤連線；ACL無狀態，所以需要考慮回程規則。','安全群組與ACL都會自動替任何回應流量放行。','只要建立端點，應用就自動取得所有物件權限。'],0,
    ['正確。這是兩者最重要的行為差異之一。','ACL不會因之前允許請求就自動允許回應。','端點提供路徑與額外政策控制，不會自動授權資料。']);

  add('s3-security',
    'S3是物件儲存：你把檔案內容連同一個名稱交給它，之後用那個名稱取回。這個名稱叫key，儲存物件的容器叫bucket。它不是一台可以讓你隨意登入的檔案伺服器，因此存取方式、權限與版本都要依S3的模型設計。這一課先處理三個常見疑問：誰能讀檔、刪掉後是否真的消失，以及加密和公開權限有什麼不同。',
    'S3像有編號的倉庫箱子：bucket是倉庫，key是箱子的索引；門禁決定誰能領取，加鎖保護箱內內容，版本則保留同一索引過去的箱子。',
    '你能用正確的S3權限分享資料，並解釋版本控制、刪除標記與加密的不同目的。',
    [
      ['公開、授權與加密要分開判斷','桶政策可以描述哪些身分能對桶或物件做哪些操作；IAM政策則描述某個身分能做什麼。Block Public Access協助避免不小心開放給廣泛公眾。加密則保護保存的資料，並不自動修正公開授權。反過來，桶維持私有，也不表示任何已獲准的身分都符合你希望的最小權限。','一份薪資報表即使已加密，若政策允許不該讀取的人取回並解密，仍然是存取控制問題，不能用「已加密」當作答案。'],
      ['版本控制如何處理同名上傳與刪除？','開啟版本控制後，同一key的新上傳會有不同版本，舊內容不一定被立即覆蓋消失。不指定版本的刪除通常建立刪除標記，讓一般讀取看起來物件不在了，但過去版本可能還保留。永久刪除特定版本則是另一個操作。這有助處理誤覆寫與誤刪，但所有保留版本都要考慮儲存與清理成本。','你把menu.json從昨日菜單換成今日菜單，若發現新檔錯誤，可以找到舊版本取回；只看目前物件列表，未必能看到那些歷史版本。'],
      ['分享檔案不代表要把整個桶公開','如果只有特定使用者需要短時間下載，可以使用符合需求的受控分享方式，例如預先簽署URL；如果是公開網站由CloudFront提供內容，可用OAC讓CloudFront讀取私有S3來源。這些機制讓你把「誰面向公眾提供內容」與「來源桶是否公開」分開。若是法律保留、跨區複寫或不可變要求，還要使用對應功能，不能只靠版本控制推論全部具備。','顧客下載自己的一份收據，不代表他應該能列出整個收據桶；權限應限於需要的物件與有效時間。']
    ],
    '網站的菜單檔被新版本覆寫錯誤，管理者想快速還原；另外有人建議直接把整個桶設公開，以免網站讀圖失敗。',
    ['先確認版本控制與舊版本是否仍在，再取回或還原正確內容；不要把「現在讀不到」直接等同資料永久消失。','對讀圖失敗，分別檢查網站入口到S3的路徑與權限，使用適合的CloudFront來源授權，避免為了排錯全面公開桶。','安排歷史版本生命週期與必要的備份或保留要求，讓版本恢復能力與長期費用都有明確規畫。'],
    '版本、公開性與加密各自回答不同問題。先確定問題是哪一類，再調整對應機制。',
    '已開啟版本控制的桶中，一般刪除一個物件後，最應先檢查什麼？',
    ['立即假定全部版本都永久消失。','查看刪除標記與舊版本，再決定恢復方式。','把桶設成公開，舊版本就會自動恢復。'],1,
    ['一般刪除與永久刪除特定版本不是同一個操作。','正確。要先看實際版本與刪除標記狀態。','公開權限不會替你移除刪除標記或選擇正確版本。']);

  add('security-services',
    '安全工具不是越多名稱就越安全。先問你要解決什麼問題：阻擋惡意網站請求、抵禦大量流量、發現可疑行為、找出軟體漏洞，或確認資料裡有沒有敏感內容。這些工作看起來都叫安全，但觀察的資料和能採取的動作不同。如果題目只要求發現某類威脅，就不能假定工具會自動替你完成封鎖、修補和通知的全部流程。',
    '醫院裡急診、健檢、X光和感染監測都關心健康，但不能拿同一種檢查回答所有疾病問題。',
    '你能依安全問題選擇工具，並把偵測、阻擋、調查與修復安排成完整流程。',
    [
      ['先看流量攻擊發生在哪一層','WAF觀察HTTP等應用層請求，可依規則判斷是否符合惡意內容或過高請求頻率，再採取允許或阻擋等動作。Shield則著重分散式阻斷服務攻擊的防護。兩者可互補，但看到SQL注入這種網站輸入內容問題時，要想到檢查應用請求，而不只是增加主機數量或討論網路連線埠。','攻擊者在搜尋欄放入企圖操控資料庫的內容，是應用請求的問題；大量機器同時灌入流量造成服務無法回應，則有另一層的容量與攻擊防護需求。'],
      ['分清可疑活動、漏洞與敏感資料','GuardDuty分析支援的活動訊號來發現可能威脅；Inspector找出支援工作負載中的弱點；Macie協助在S3發現與分類敏感資料。它們的輸出通常是需要處理的發現結果，不等同應用程式已被安全修復。選型時先說清楚要觀察什麼資料、找出哪一類問題，再決定後續回應。','「某台主機存在已知套件漏洞」與「某個帳號正在進行可疑操作」是不同觀察，不能只看它們都出現警示就當成相同服務。'],
      ['偵測後，誰決定如何處理？','完整安全流程應把發現、通知、驗證、控制影響與修復分開。高信心事件可搭配自動化限制某些資源，但必須清楚授權、保留證據並避免錯誤封鎖正式服務。Config適合追蹤資源設定是否符合規則；CloudTrail則用來調查API活動。不要看到偵測工具就假定它同時是設定管理、日誌庫與全自動防火牆。','發現S3可能含身分證資料後，可能需要通知資料負責人、檢查存取權限與保存要求，而不是直接永久刪除所有檔案。']
    ],
    '一家公司同時遇到登入API遭SQL注入、EC2套件有弱點、S3報表疑似含個人資料。',
    ['把三個問題分成惡意HTTP請求、軟體弱點與敏感資料發現，避免用單一工具名稱涵蓋所有需求。','對應WAF、Inspector與Macie等合適功能，並確認支援的資源與資料範圍。','替各種發現結果安排負責人、通知與修復流程，保留調查所需的日誌，再測試防護是否真的改善問題。'],
    '服務的價值在於它提供哪種觀察與控制。選對工具後，還要設計誰接手處理它發現的事情。',
    '你想知道S3檔案中是否出現敏感個人資料，最直接對應哪種能力？',
    ['只檢查EC2映像套件漏洞。','只增加負載平衡器數量。','使用支援S3敏感資料發現與分類的Macie。'],2,
    ['軟體弱點掃描與物件內容分類不是同一件事。','增加容量不會告訴你檔案裡有哪些敏感內容。','正確。問題是資料內容分類，應選對應能力。']);

  add('ha',
    '高可用不是「永遠不會壞」，而是承認零件會壞，仍安排系統盡量持續提供服務。先從最簡單的網站想起：只有一台電腦時，它停止就沒有其他地方接手；有兩台也不一定足夠，因為使用者資料可能只存在其中一台，或兩台其實依賴同一個會故障的元件。本課會把「多放一台」改成真正能接手的設計。',
    '餐廳有兩位店員，但收銀帳本只有一位店員知道放哪裡，另一位仍無法真正接班；備援要包含資訊、能力和接手路徑。',
    '你能找出單點故障，並說明無狀態應用、共享狀態與健康路由為何需要一起設計。',
    [
      ['先找出只有一份的必要元件','只要某個必要元件失效就讓整個服務停止，它就是可能的單點故障。不要只數應用主機，還要看資料庫、連線出口、登入服務、設定與外部依賴。多份元件若都在同一個故障範圍，也可能一起失效。把故障範圍畫出來，才知道新增副本有沒有真正降低共同失效的機會。','兩台應用共用一台沒有接手方案的資料庫，應用層雖有備援，資料庫仍能讓全部下單流程中斷。'],
      ['無狀態為什麼讓接手更容易？','無狀態不是完全沒有資料，而是不把某位客人的重要操作狀態只留在單台應用主機的記憶體或本機磁碟。把需要共享與保存的狀態放在合適的資料服務，任何健康應用都能讀到必要資訊。這樣負載平衡器改送另一台主機，使用者才不會突然失去購物車。外置狀態本身也要有對應的可用性與存取控制。','客人第一個請求在A主機加入餐點，下一個請求被送到B主機；若購物車只存在A記憶體，B就不知道客人剛選了什麼。'],
      ['備援存在，還要能找到健康的那一份','入口需要知道哪些目標仍能提供有效服務，這就是健康檢查與流量切換的重要性。檢查不能只證明機器開著，也要依服務設計判斷它是否能處理請求。同時要考慮失效後剩餘容量是否足夠；正常時兩台各跑滿一半以上，故障一台後另一台可能承受不住。備援容量和自動擴展是不同但相關的問題。','有第二間廚房卻沒有告知送餐員改送地址，或備用廚房完全做不完剩餘訂單，都不算完整接手。']
    ],
    '應用部署在兩個AZ，但客人被切換到另一台主機後常常需要重新登入，而且資料庫故障仍會停止服務。',
    ['先檢查登入狀態是否只保存在原主機；若是，應把必要狀態移到合適的共享保存機制。','檢查入口是否只把流量送給健康目標，並測試某台應用停止後剩餘主機是否能承接。','另行設計資料庫的跨AZ接手能力和備份，不把兩台應用誤當成資料層也已具備備援。'],
    '真正的可用性來自整條必要路徑。每個元件都要能回答「壞掉後由誰接手，如何找到它，資料還在不在」。',
    '把購物車只存在單台EC2記憶體，最容易造成什麼問題？',
    ['流量切換到另一台EC2時，新的主機可能找不到購物車狀態。','資料會自動同步到全部AZ。','負載平衡器會自動把所有記憶體內容複製過去。'],0,
    ['正確。這是應用主機持有獨有狀態造成的接手問題。','記憶體不會因部署多台主機就自動跨AZ同步。','負載平衡器分配請求，不負責複製應用內部狀態。']);

  add('elb',
    '當網站有好幾台應用主機，客人不應自己猜哪台還活著。負載平衡器提供共同入口，再把請求送給合適的後端目標。選擇哪種負載平衡器，要先看你需要理解到哪一層：只轉送網路連線，還是依網站的主機名稱與網址路徑做決定。負載平衡器也會檢查目標健康，但健康檢查的內容需要你設計。',
    '總機可以只把電話分配到某個分機，也可以先聽懂客人說要訂位還是外送，再轉給不同部門；這兩種分配能力不同。',
    '你能依通訊協定與路由需求選ALB或NLB，並設計能反映服務狀態的健康檢查。',
    [
      ['ALB為什麼能依網址分流？','Application Load Balancer理解HTTP等應用層請求，因此可以依主機名稱或網址路徑把流量送到不同目標群組。目標群組是一組接受同類流量的後端資源。這很適合把網站中的圖片API、訂單API與一般頁面分開擴展。它不是把所有應用程式邏輯都接管，而是在請求進入應用前做合適的路由判斷。','api.example的/orders交給訂單服務，/images交給圖片服務；兩者仍要自己完成查詢、授權與業務處理。'],
      ['什麼時候要看NLB？','Network Load Balancer主要在網路傳輸層轉送支援的連線，適合需要TCP、UDP等協定或特定網路入口特性的工作負載。它不會用與ALB相同的方式理解網站路徑。因此「需要負載平衡」還不足以決定服務，題目中的協定、固定入口位址需求和應用路由要求才是重要條件。','一個自訂TCP服務可能不需要HTTP網址路徑分流；反過來，依/shop與/payments路徑選後端，就需要應用層理解。'],
      ['健康檢查應證明什麼？','健康檢查會週期性測試目標是否符合你設定的成功條件，失敗目標通常不再接收一般流量。但如果檢查頁永遠固定回成功，即使應用已不能提供核心功能，入口仍可能繼續把客人送過去。另一方面，檢查也不宜因不重要依賴短暫失效就把所有主機同時摘除。要依系統核心能力、故障隔離與預期回應一起設計。','點餐服務已無法建立訂單，/health卻仍只回一段固定文字，這樣的檢查只證明某個HTTP處理器還會回應。']
    ],
    '同一個網域有商品瀏覽與付款兩套HTTP服務，團隊希望依路徑分流，並在某台付款主機故障時自動避開。',
    ['確認需求是HTTP路徑判斷，使用能理解這些內容的ALB配置不同規則與目標群組。','替付款目標設計適當健康檢查，讓入口能辨識無法提供服務的主機，而不是只看主機有沒有開機。','驗證主機失效、重新啟動與連線排空時的行為；同時確認應用仍有足夠健康目標與容量。'],
    '路由規則決定請求應去哪一類服務，健康檢查再決定那一類中哪些目標目前可用。',
    '你必須依HTTP的/orders與/catalog路徑選擇後端，最直接對應哪種能力？',
    ['只檢查IP目的位址就足以理解網址路徑。','ALB的應用層路由規則。','增加DNS記錄就能對每個HTTP路徑分流。'],1,
    ['IP目的位址本身不包含HTTP路徑的語意。','正確。ALB可以依HTTP請求內容做相應路由。','DNS解析名稱，不解析每次HTTP請求的路徑。']);

  add('autoscaling',
    'Auto Scaling不是把一台主機變成無限大，而是根據規則增加、減少或替換一群主機。你先告訴它每台主機應如何建立，以及這群主機至少、最多和目前希望有多少台。系統再觀察需求與健康狀態採取動作。重點是新增主機需要時間，而且如果瓶頸在資料庫，增加應用主機可能只會讓資料庫收到更多壓力。',
    '餐廳依排隊人數加開工作站，但新工作站要先備料；如果唯一的烤箱已經滿載，單純增加接單櫃台不會讓餐點更快完成。',
    '你能區分健康替換、容量擴展與備援餘裕，並選擇能反映實際工作量的擴展指標。',
    [
      ['三個容量數字各自代表什麼？','最小容量表示群組通常不能低於多少台，最大容量限制擴展上限，期望容量是群組目前要維持的數量。啟動範本描述新主機應使用的映像、規格與必要設定。當某台不健康時，群組可以替換它以維持期望容量；這和因工作量增加而調高期望容量，是不同的觸發原因。','期望數量是兩台，其中一台停止，群組補回一台，是恢復原容量；午餐流量增加到需要四台，則是擴展需求。'],
      ['選指標時，先想真正的瓶頸','目標追蹤策略會嘗試把某個可用指標維持在設定目標附近。例如CPU適合某些計算型工作；每個目標的請求量可能更貼近網站需求；佇列工作則可觀察每個消費者待處理量與等待時間。指標不恰當時，系統可能在客人已等待很久之後仍覺得不需要擴展，或擴展了卻無法改善問題。','等待外部API回應的工作可能CPU不高，但任務已大量積壓；單看CPU會錯過真正的服務壓力。'],
      ['新增與移除都不是瞬間完成','新主機要啟動、安裝或載入程式，通過健康檢查後才能接請求，所以要考慮暖機時間與可預測尖峰的提前安排。縮容時也要讓進行中工作有機會完成或安全重試。擴展計畫還受到子網路位址、帳號配額、執行個體供應和下游容量影響，不能把最大數量設很高就視為保證。','如果新主機要五分鐘才能接單，對兩分鐘內暴增的活動流量，平時保留餘裕或事先擴容可能比等告警後才建立更合適。']
    ],
    '促銷每天中午開始，新增應用主機需數分鐘；尖峰期間資料庫連線數也逼近上限。',
    ['先確認尖峰可預測，安排事前擴容並保留必要餘裕，不把整個反應時間壓在活動開始後。','使用能反映應用實際壓力的指標，搭配適當暖機與健康檢查，避免剛啟動的主機讓策略誤判。','檢查資料庫連線與查詢負擔；必要時加入合適連線管理、快取或非同步處理，而不是無限制增加應用數量。'],
    '彈性擴展必須和啟動速度、工作特性及下游容量一起規畫，才會讓使用者感受到改善。',
    '應用CPU很低，但待處理工作持續增加，下一步應先做什麼？',
    ['認定工作量一定很少。','直接把最大容量改成很大的數字就算完成。','檢查等待與瓶頸原因，選更能反映工作量的指標並評估下游。'],2,
    ['低CPU也可能代表在等待資料庫、網路或其他依賴。','上限不是實際擴展策略，也不保證供應或改善瓶頸。','正確。指標應對應工作特性與真正限制。']);

  add('sqs',
    '使用者送出工作時，處理它的程式不一定要立刻完成全部事情。可以先把工作訊息放進佇列，再由背景工作者依能力取出處理。SQS提供這種受管佇列，讓發送端不必一直等接收端。但是「訊息送到了」不等於「業務已成功完成」，失敗、重試與重複都需要安排。本課用訂單處理看懂它們各自發生在什麼時候。',
    '外帶窗口先收下點餐單放進待做區，廚房依能力取單；單子還在待做區不代表餐點已交給客人。',
    '你能說明可見性逾時、刪除訊息、死信佇列與冪等處理如何共同形成可靠的背景工作。',
    [
      ['把收單與做完分開','發送端把描述工作的訊息交給SQS，消費者再取出處理。佇列可以暫存尖峰工作，讓接收端以較平穩速度消化。這降低兩端必須同時可用的耦合，但也改變了使用者契約：你可能先回覆「已接受」，之後再提供處理結果。需要立即得到最終結果的流程，不能無條件改成只回一個排隊成功。','寄送訂單確認信可以在下單成功後背景執行，但客人是否已付款成功，必須依實際付款處理結果回報。'],
      ['為何收到訊息後還要刪除？','消費者接收訊息後，SQS會暫時讓其他消費者看不到這則訊息，稱為可見性逾時。這是在給它處理時間，不是在宣告完成。工作成功後，消費者才刪除該次接收對應的訊息；如果它中途失敗或來不及完成，訊息重新可見後可能再被接收。逾時設太短會讓相同工作很快重疊處理，設太長則可能延後故障後的重試。','背景主機取到訂單就立刻當機，因為尚未刪除訊息，後續工作者仍有機會再次收到它，而不是永遠遺失這份工作。'],
      ['重複投遞不是重複扣款的理由','至少一次投遞代表訊息可能不只出現一次。冪等處理是讓相同業務工作重試時，不會再次造成不該重複的副作用，例如以訂單交易ID搭配條件寫入紀錄是否完成。FIFO提供訊息群組內的順序與送入去重能力，也不會替外部付款系統包辦交易一致性。反覆處理失敗的訊息可在門檻後進死信佇列，讓人調查與修復。','重送同一個付款事件時，可以檢查該交易ID是否已成功處理；不能因為又收到一次訊息，就再扣一次款。']
    ],
    '促銷時圖片縮圖工作暴增，單張圖片偶爾因內容錯誤無法處理，其他正常圖片不能因此全部停住。',
    ['把縮圖需求放入佇列，讓背景工作者依能力處理，觀察積壓與等待時間來擴展。','成功建立縮圖才刪除訊息；處理相同圖片版本時使用可辨識工作ID，避免重試造成錯誤的重複結果。','設定合理可見性逾時與重試門檻，將持續失敗的訊息送至死信佇列；修復格式或程式後，再安排重送。'],
    '佇列保存待辦工作，消費者負責業務正確性，死信流程保留無法自動修復的例外；三者一起才有可維運性。',
    '消費者取到訊息後當機，沒有刪除訊息。接下來最可能發生什麼？',
    ['可見性逾時後，訊息可能再次被消費者接收。','訊息立即被視為成功且永不重試。','SQS自動判斷外部資料庫交易是否完成並補做付款。'],0,
    ['正確。因此處理程式必須能安全面對重試。','接收與刪除代表不同階段，接收本身不等於成功。','SQS不會理解與完成任意外部業務交易。']);

  add('events',
    '事件是一件已發生的事，例如訂單建立、圖片上傳或付款失敗。不同系統可能都想知道同一事件，但想做的事不同。SNS適合把發布的訊息通知多個訂閱者；EventBridge適合依事件內容與來源把它路由到相應目標；Step Functions則描述一個流程接下來該做哪一步。先分清通知、路由與流程協調，才不會把所有非同步工作都硬塞進同一條佇列。',
    'SNS像廣播同一則公告，EventBridge像依信件內容分送部門，Step Functions像寫明每一步、例外與下一步的作業流程表。',
    '你能設計同一事件的多方接收、依內容路由，以及含等待與重試的多步流程。',
    [
      ['一個事件要讓三個部門各收到一份','如果把三個消費者放在同一條工作佇列，它們通常是在競爭處理工作，不是每個都各得一份。同一訂單事件若要讓帳務、通知與分析都處理，可用發布訂閱模型扇出，再為每個需要緩衝的訂閱者配置自己的佇列。這讓分析處理很慢時，不必讓帳務跟著等同一個積壓。','訂單成立後要寄信，也要記帳，不能讓兩個工作者搶同一則訊息，否則某次可能只有其中一個做了事。'],
      ['依內容分流，不等於手寫巨大判斷程式','EventBridge接收支援來源的事件，規則根據事件欄位決定送到哪些目標。它適合整合AWS、應用或支援的SaaS事件。設計時要確認事件格式、目標失敗重試與死信處理；路由成功不代表目標業務一定已完成。若需要可重播資料串流或嚴格順序，還要比較相應串流或佇列能力。','訂單事件裡地區是日本就送日本處理流程，類型是取消就送退款流程；這是根據內容安排接收目標。'],
      ['多步驟流程要記住進度與例外','Step Functions用狀態機描述流程目前在哪一步、成功後去哪裡、失敗時重試或走哪個分支。它適合把多個服務操作協調成可觀察的工作流，包含等待與平行步驟。這比讓單一函式一直睡眠、輪詢並手動記住所有狀態更清楚，但仍要讓每個任務具備正確的權限與重試語意。','訂單依序檢查庫存、保留付款、等待出貨確認，再決定完成或補償；流程需要記住進度，不只是把同一通知寄給多人。']
    ],
    '訂單建立後，帳務和通知都需要各處理一次；若金額過高，還要等待人工核准後才出貨。',
    ['將訂單事件扇出到帳務與通知各自的處理路徑，保留各自重試與緩衝能力。','對高金額事件使用內容規則導向需要核准的流程，不要求每個接收者都重複實作同一套路由。','用工作流表達等待核准、通過後出貨與拒絕後取消等分支，並安排每個步驟失敗時的重試或補償。'],
    '選服務前先畫箭頭：一對多通知、依欄位路由、還是有順序與進度的流程；箭頭形狀會幫你看出需求差異。',
    '帳務與通知都必須收到每筆訂單事件，最不應直接採用哪種想法？',
    ['為兩個用途安排各自的訂閱與佇列。','讓兩個用途只在同一條工作佇列競爭，卻期待每個都收到所有事件。','把事件發布給多個符合條件的目標。'],1,
    ['這可以把每個接收者的副本、速度與失敗處理隔開。','正確。競爭處理與每方各收一份，是兩種不同模型。','適當的扇出或多目標路由可以滿足各自接收。']);

  add('rds-ha',
    '關聯式資料庫可以理解成有結構的多張資料表，透過查詢與交易保存一致的業務資料。RDS幫你管理支援的資料庫引擎，但你仍要選部署方式。備份、Multi-AZ和讀取副本常被放在一起討論，卻各自解決不同問題：回到較早資料、在故障時接手，以及增加讀取能力。先辨識題目想改善哪一項，才不會看到「副本」就把它們當成同一種東西。',
    '主帳本旁的值班接手帳本、給查詢人員看的抄本，以及鎖在櫃子裡的歷史影本，目的不同，更新方式也不同。',
    '你能根據故障接手、讀取擴展與歷史還原需求，分別選擇對應的資料庫功能。',
    [
      ['多AZ是為什麼而多？','Multi-AZ部署把資料庫能力跨越AZ故障範圍，提供相應接手機制。但RDS有不同部署類型，不能一概說備援都能讀或都不能讀。傳統Multi-AZ DB instance的單一standby不提供一般讀取服務；Multi-AZ DB cluster則有可讀取的reader。看到題目時先辨識部署類型，再判斷它提供的讀取與故障行為。','題目若描述一個主要DB instance加一個standby，不要把standby當成新增查詢端點，除非題目實際是在談另一種叢集模式。'],
      ['讀取副本如何減輕主庫？','讀取副本通常接收來源變更，用來提供額外讀取能力；複寫可能有延遲，因此剛寫完就立刻從副本讀取，不一定看到相同時間點的資料。應用也要把合適查詢導向讀取路徑，並不是建立副本之後所有查詢都自動分散。它可有其他用途，但不能只因名字有副本就假定等同自動高可用接手。','商品瀏覽與統計報表可以分擔到讀取副本；付款後立即檢查剛更新的交易狀態，則要依一致性要求選擇讀取來源。'],
      ['備份還原為何仍然必要？','資料庫的高可用副本可能會同步收到錯誤更新或刪除，無法單靠「還有一份現況」找回昨日狀態。備份與時間點還原提供歷史恢復能力，還原通常建立另一個資料庫資源，再由你驗證並安排應用切換。要考慮備份保留時間、還原所需時間，以及真正的還原測試，而不是只看控制台顯示備份已啟用。','如果管理程式把所有商品價格改錯，能迅速接手的資料庫也可能保存了相同錯價；這時需要歷史還原，而不是單純切換主機。']
    ],
    '網站主資料庫查詢量過高，同時要求單一AZ故障時可接手，並需要找回誤刪前的訂單。',
    ['將三種要求分開：讀取量、AZ故障與歷史回復。不要只選一個名字看起來最完整的功能。','依部署類型配置適合的Multi-AZ高可用方案，再用適當reader或讀取副本承擔符合一致性要求的查詢。','配置並測試備份與時間點還原流程，驗證資料後再切應用連線；確認應用遇到接手時會重新建立連線。'],
    '讀取擴展、故障接手和資料還原可以一起使用，但不能互相取代；每項都要有對應的應用連線與驗證流程。',
    '資料庫已具備跨AZ接手能力，為什麼仍要保留歷史備份？',
    ['因為備份只用來增加SQL查詢速度。','因為所有Multi-AZ配置都不會保存資料。','因為誤刪或錯誤更新也可能同步到備援，仍需回復較早狀態。'],2,
    ['備份主要提供恢復能力，不是一般查詢加速機制。','Multi-AZ配置會保存資料；問題在於它們保存的可能是同一個已出錯的目前狀態。','正確。保留歷史狀態與維持目前服務是不同需求。']);

  add('aurora',
    'Aurora是AWS提供的關聯式資料庫引擎家族，支援與特定MySQL或PostgreSQL版本相容的使用方式。先不要把它想成「一台更大的RDS主機」，而要分開看運算節點與叢集儲存。writer負責寫入，reader可承擔合適讀取；端點則提供應用連線的名稱。理解這些分工，才能看懂讀取擴展、故障接手與跨區域災備各自需要什麼。',
    '像多個櫃台使用受管理的共同帳務系統：有負責入帳的櫃台，也有提供查詢的櫃台；櫃台數量與帳本保存方式是不同層次。',
    '你能區分writer與reader端點、連線分配與單次查詢分配，以及區域內高可用和跨區域復原。',
    [
      ['先分開運算節點與保存資料的層','運算節點執行SQL與處理連線；叢集儲存負責保存資料並提供相應的多AZ保護。增加reader是增加執行讀取工作的節點，不是讓任意寫入工作自動平均分散到全部節點。你仍需依應用讀寫模式、節點容量與部署方式設計連線。不要只因服務具備分散式儲存，就以為單一應用操作不再有瓶頸。','報表很多時，增加reader並導向讀取路徑可能有幫助；大量寫入交易仍要評估writer能力、交易設計與資料競爭。'],
      ['端點分配的是什麼？','叢集的writer端點讓應用連向目前的寫入角色；reader端點可以在合適reader之間分配新連線。這不等於每一條SQL都會重新挑一台主機。若應用維持少數長連線，工作量仍可能集中；使用者也要理解讀取副本的可見資料時間與應用一致性要求。接手後應用要能重新解析與建立連線。','某個報表程式長時間保留一條連線，即使用reader端點，也不應期待它每次執行查詢都自動換到另一台reader。'],
      ['跨區域複寫不是免設計的災備','Aurora Global Database等跨區域能力可協助資料分布與復原，但仍需確認主次區域角色、複寫延遲、接手程序與支援限制。應用與憑證、網路、設定等也要在復原區域可用。資料庫能在另一區域接手，不代表整個網站的運算與DNS都已切換完成；備份也仍負責不同的歷史還原問題。','資料已在備援Region，但該區域沒有應用程式、金鑰權限或必要網路路徑，使用者仍無法只靠資料副本繼續下單。']
    ],
    '訂餐系統用Aurora，平時報表查詢拖慢交易，並希望主要區域失效時能在另一區域恢復。',
    ['先將適合的報表查詢導向reader路徑，檢查連線池與長連線分布，而不是只增加reader數量。','為writer故障準備應用重連與重試，確認交易重試不會造成重複付款或不一致副作用。','另外建立跨區域復原方案，包含資料複寫、備援應用、權限與流量切換，再用演練測量能否達成業務目標。'],
    'Aurora提供多種建構能力，但你仍要把讀寫分工、連線生命週期與完整系統復原串起來。',
    'Aurora reader端點最應如何理解？',
    ['協助分配新讀取連線，不保證每條SQL都重新平均分配。','會自動讓所有reader同時處理任意寫入。','只要使用它，就不需要考慮應用連線池。'],0,
    ['正確。連線如何建立與維持，會影響實際負載分布。','reader與writer有不同角色，不能這樣推論。','長連線和連線池仍可能造成負載集中。']);

  add('dns',
    '你輸入網站名稱後，瀏覽器需要知道應該連到哪個網路目的地。DNS就是把名稱與連線位置等資訊對應起來的系統。Route 53提供DNS託管與路由相關能力，但它通常不代替網站接收每一個HTTP請求。理解這個差別，才能知道為何改了DNS記錄，某些使用者還會暫時連到舊位置，以及DNS健康切換為什麼不是瞬間搬走所有既有連線。',
    'DNS像電話簿，幫你找到要撥的號碼；找到號碼後，真正通話走的是電話連線，不是一直經過電話簿。',
    '你能說明DNS快取與TTL的作用，並依不同目的選擇加權、延遲或故障切換等路由策略。',
    [
      ['名稱解析與網站代理不同','DNS查詢取得名稱對應的資訊，使用者再依結果建立應用連線。負載平衡器和CDN則可能直接參與應用流量路徑。因此Route 53規則改變的是名稱查詢的回覆，不會逐一檢查每個網站請求的路徑或付款內容。要依HTTP路徑分流時應看應用層入口，不是只增加DNS記錄。','同一網域的/catalog與/orders路徑，通常是在名稱解析完成後才出現在HTTP請求中，DNS本身不會逐條看這些路徑。'],
      ['TTL讓切換為什麼需要時間？','DNS回覆可被解析器或用戶端快取，TTL描述該回覆可被快取的時間。記錄更新後，已取得舊回覆的一方可能在一段時間內仍使用它；應用的既有連線也不會因此自動全部斷開重建。較短TTL可能改善新查詢更快取得新結果的機會，但不是零延遲切換保證，也會改變查詢量與相應考量。','你把網站從A入口改到B入口，有些人還在使用快取的A位址；這不一定是修改失敗，而可能是他們尚未重新查詢。'],
      ['路由策略應對應業務目標','加權路由可分配一定比例的DNS回覆，適合漸進式導流等需求；延遲路由依相應網路延遲考量選擇位置；故障切換路由安排主要與備援記錄，搭配健康狀態判斷。健康檢查要能代表你關心的服務，並區分公開服務與私有資源可觀察方式。各種策略都要配合應用容量和資料狀態，不能只改DNS就完成災備。','把一小部分查詢導向新版本入口可以幫助漸進部署，但新版本的資料相容性和回復方式仍需另外設計。']
    ],
    '公司有主站與待命站，希望只有主站故障後才讓新使用者連到待命站；管理者卻以為DNS切換會移走所有既有連線。',
    ['選擇符合主備語意的故障切換配置，並讓健康檢查觀察足以代表主站服務的條件。','說明DNS主要影響名稱查詢結果，已快取結果和既有連線仍可能繼續使用原路徑。','確保待命站有可服務的應用、資料和容量，再測試從故障被偵測到使用者實際恢復所花時間。'],
    'DNS是切換流程的一部分，而不是完整網站的瞬移按鈕；它的快取與應用連線都會影響實際結果。',
    '你更新DNS後，一些使用者暫時仍連到舊入口，哪個解釋最合理？',
    ['DNS永遠不允許更改記錄。','解析器或用戶端可能仍使用快取結果，既有連線也可能尚未重建。','Route 53正在逐條重寫使用者所有HTTP請求。'],1,
    ['DNS記錄可以更新，問題是更新後各方何時重新取得結果。','正確。TTL、快取與連線生命週期都會影響切換時間。','DNS不是逐條HTTP請求的內容代理。']);

  add('dr',
    '災難復原要先說清楚「災難」是什麼：一台主機停止、一個AZ失效，還是整個Region無法使用？接著問兩個可衡量的問題：最多能停多久，以及最多能接受失去哪一段時間的新資料。前者是RTO，後者是RPO。它們不是AWS服務名稱，而是業務願意承受的後果。選復原策略時，才有依據比較平時費用、準備程度與復原步驟。',
    '餐廳火災後多久要重新營業，是時間目標；最多能接受遺失多少時間的訂單紀錄，是資料損失目標。',
    '你能把業務要求轉成RTO與RPO，再說明備份還原、pilot light、warm standby與多地同時服務的差異。',
    [
      ['復原時間與資料落差怎麼算？','RTO從業務受到中斷到恢復所容許的時間，需要包括偵測、判斷、還原、啟動、切換與驗證，不只是資料庫啟動時間。RPO關心最後可恢復的資料有多接近事故發生時刻，會受備份頻率或複寫延遲影響。先把這兩種目標分開，才不會以為更頻繁備份就一定能讓整個網站更快恢復。','每小時備份一次可能改善不了只有十分鐘的資料損失要求；即使資料副本很新，還原應用花兩小時也可能不符停機目標。'],
      ['備援準備得越完整，通常平時成本越高','備份還原主要在事故後建立所需環境；pilot light保留核心資料等元件，但接流量前仍需啟動或部署其他部分；warm standby維持縮小但完整可運作的系統，事故後主要擴容；多地active/active則在平時就由多區域提供服務。這是準備程度與操作複雜度的差別，不是任何策略名稱本身保證固定秒數。','保留一份食譜和食材清單、保留小型備用廚房、以及兩間廚房平時都營業，能開始接單的準備程度很不同。'],
      ['演練要包含資料以外的依賴','復原區域需要應用映像、設定、機密、金鑰權限、網路、容量與配額。還要避免新舊主站同時接受不一致寫入，並規畫回切。複寫可能同步錯誤刪除，所以不能取代歷史備份。AWS Backup等服務協助管理備份，但團隊仍要測試實際還原結果，才能知道備份能否使用及流程需要多久。','資料庫已在另一Region，卻找不到程式的登入機密或該區域的容量不夠，仍會讓業務無法在預期時間恢復。']
    ],
    '訂餐服務要求區域故障後一小時內恢復，最多接受十五分鐘資料損失，且預算無法支撐兩套同等規模系統。',
    ['先列出一小時復原流程的所有步驟與時間，不只看資料複寫；再確認資料延遲或備份間隔能否滿足十五分鐘。','比較pilot light與warm standby等候選方案，估算事故後還需完成哪些動作以及平時成本。','用實際演練驗證主站停止寫入、備援提升、應用擴容、DNS與客戶端重新連線，並保留回切和歷史還原方案。'],
    'RTO與RPO應以完整演練結果驗收。策略名稱只是安排資源與流程的起點，不能代替測量。',
    '哪個需求是在描述RPO？',
    ['服務最多中斷三十分鐘。','備援環境每月預算上限。','事故後最多能接受遺失最近五分鐘的資料。'],2,
    ['這是在描述可接受的恢復時間，也就是RTO。','這是成本限制，會影響策略選擇，但不是RPO。','正確。RPO描述可接受的資料時間落差。']);

  add('observability',
    '系統壞掉時，「有開監控」還不夠，你要知道每種紀錄能回答什麼問題。指標是隨時間變動的數字，例如錯誤率；日誌是事件細節；追蹤則把一個請求經過的工作串起來。CloudWatch主要協助觀察運作狀態，CloudTrail協助查API活動，Config協助查看資源設定及合規狀態。先把問題說清楚，才能找到有用的證據。',
    '儀表板像車子的速度和油量，日誌像維修紀錄，CloudTrail像誰操作過控制台的紀錄；看到速度變慢，不代表已經知道誰動了哪個零件。',
    '你能依效能、操作稽核與設定變更三類問題選擇證據來源，並把告警接到可執行的處理流程。',
    [
      ['先定義使用者受到的影響','CPU、記憶體和網路量描述資源狀態，但使用者真正關心的是請求是否成功、等待多久、工作是否持續完成。好的監控會包含這些服務結果，再用資源指標協助找原因。某些作業系統內部指標需要安裝代理程式收集，不能以為建立EC2後就會自動得到每一種數字。','CPU不高但付款API一直逾時，可能是等待資料庫或外部付款服務；只看CPU會漏掉使用者已受影響的事實。'],
      ['誰改了什麼，要去哪裡查？','CloudTrail記錄支援的API活動，可用來調查哪個身分在何時進行哪些操作；不同事件類型與資料操作的記錄範圍要依配置確認。Config保存資源設定及變更，並可依規則評估合規。這些和應用錯誤日誌各自提供不同證據，不能看到其中一個就假定另外兩種資料也都完整存在。','想知道誰修改安全群組，可從API活動調查；想比較資源前後設定與是否違反規則，則需要對應的設定紀錄與評估。'],
      ['告警要能讓人採取正確行動','設定告警前先決定門檻代表什麼、持續多久才值得處理，以及通知誰。自動化可以嘗試重新啟動、擴展或執行受控修復，但必須避免因暫時抖動反覆操作或放大故障。日誌與指標也有保存與費用問題，要保留調查需要的資訊，同時避免把密碼、完整憑證或不必要個資寫進日誌。','一個能說明「付款錯誤率持續升高、請檢查下游連線」的告警，比每分鐘只寄一封「某個數字變了」更有處理價值。']
    ],
    '網站突然大量回傳錯誤，同時安全團隊懷疑剛有人改動網路規則，需要判斷是容量問題還是設定問題。',
    ['先用服務指標確認錯誤開始的時間、影響範圍與相應資源狀態，建立共同時間線。','查看應用日誌與相關API活動，確認是否有連線被拒絕或近期安全群組變更。','比較設定歷史與預期規則，再採取可回復的修正；把處理結果回寫事件紀錄，改善下次告警內容。'],
    '可觀測性不是堆滿圖表，而是讓你能從症狀找到證據，再以合適權限採取有根據的行動。',
    '想調查哪個身分修改了安全群組，最直接先查看哪類資料？',
    ['CloudTrail中的相關API活動。','只看EC2 CPU平均值。','只看S3物件大小。'],0,
    ['正確。這是操作稽核問題。','CPU可能幫助判斷負載，但不直接記錄誰修改權限設定。','物件大小與這個網路設定操作沒有直接對應關係。']);

  add('ec2',
    'EC2可以先理解成AWS提供的可租用虛擬電腦。你選作業系統、處理器與記憶體等規格，再在上面執行程式。AWS管理底層基礎設施，但主機裡的應用、許多作業系統工作與權限仍需要你安排。選規格不是單純越大越好，而要看程式究竟在等什麼：計算、記憶體、磁碟、網路或外部服務。',
    '選工作用電腦不只是比價格：影片運算、巨大試算表和大量檔案搬移，可能需要不同零件強項。',
    '你能根據工作負載選擇執行個體方向，並說明映像、啟動範本、網路與管理責任的關係。',
    [
      ['規格應該對應哪種壓力？','不同執行個體家族在CPU、記憶體、儲存與網路特性上有所偏重。計算密集工作可能需要更多計算能力；大量資料在記憶體中處理則可能先受記憶體限制。先量測瓶頸，再選規格與數量。主機很大但程式只使用單一執行緒時，也不一定能有效使用所有核心，應用設計仍會影響效果。','資料庫查詢因磁碟等待很久，單純增加CPU未必改善；需要觀察實際磁碟延遲、吞吐與查詢模式。'],
      ['映像與啟動範本讓重建更一致','映像描述開機時可使用的系統與軟體基礎；啟動範本則包含建立主機所需的映像、規格與相關設定。讓主機可以依版本化設定重新建立，比靠某位工程師記住每個手動步驟更可靠。不要把機密寫進映像或開機腳本，應使用角色與適合的機密服務取得執行時需要的內容。','某台主機壞掉時，若只有那台機器上有未記錄的設定，新增一台相同規格也未必能提供相同服務。'],
      ['主機性能還受位置與依賴影響','需要低延遲節點互連的工作，可能要評估合適的網路能力、放置方式與應用平行處理需求；一般網站則更常需要跨AZ隔離故障。追求接近的節點位置與追求跨故障域不是同一個目標。連線管理、磁碟設定及外部服務限制也會影響性能，不能只把EC2規格表當成端到端效能保證。','把整個高可用網站只放在同一AZ，可能改善某些內部傳輸路徑，卻也讓它更容易一起受到該AZ故障影響。']
    ],
    '一個影像轉換工作CPU長期滿載，另一個應用則記憶體不足而頻繁交換到磁碟；團隊想直接替兩者買同一種大主機。',
    ['分別量測兩個工作負載，確認一個主要受計算限制，另一個主要受記憶體限制。','比較相應家族與規格，測試實際處理時間和費用，而不是只看一個最昂貴型號。','以映像與啟動範本保留可重建配置，再依是否能平行、是否可中斷與可用性需求決定主機數量和採購方式。'],
    '先找限制，再選資源；用可重建設定保存選擇，才能同時改善效能、可靠性與維運。',
    '程式主要在等待外部API回應，CPU使用率很低，直接加倍CPU是否一定有用？',
    ['一定，CPU越多任何請求都越快。','不一定，應先確認外部等待、並行與下游限制。','一定，只要把所有主機放同一個AZ。'],1,
    ['CPU無法消除外部服務的等待時間。','正確。需要根據瓶頸判斷，而不是只增加未受壓力的資源。','位置可能影響部分路徑，但不能保證解決外部API瓶頸，也需考慮故障域。']);

  add('block-storage',
    'EC2需要保存作業系統與檔案時，可以使用不同種類的儲存。區塊儲存把一段容量交給作業系統，像一顆磁碟，再由系統建立檔案系統。EBS提供這種持久磁碟；instance store則是依附實體主機的本地暫存能力。兩者可能都很快，但資料在停止、故障與重建時的存活方式不同。先問資料可不可以重建，再比較性能。',
    'EBS像租給你的獨立硬碟，instance store像工作桌上暫放的草稿區；草稿區可以很方便，但不能把唯一正式帳本只放在那裡。',
    '你能依持久性、延遲、IOPS與吞吐需求選磁碟，並說明AZ限制和快照用途。',
    [
      ['持久磁碟和本機暫存差在哪？','EBS卷是與EC2配合使用的區塊裝置，位於特定AZ；資料是否在執行個體終止後保留，還要看卷的生命週期設定。Instance store則依附主機，遇到相應停止、終止或主機故障事件可能遺失資料。因此重要資料應有適合的持久保存與副本策略，不能因為程式現在讀得到，就假定換機器後也一定還在。','圖片轉換中可以重算的中間檔適合考慮暫存；客人已付款但尚未送出的訂單不能只有一份留在本機暫存。'],
      ['IOPS與吞吐量為何不是同一件事？','IOPS描述每秒能完成多少次讀寫操作；吞吐量描述每秒傳多少資料。大量小型隨機讀寫與少量大型連續傳輸，可能分別受不同限制。還要考慮延遲與EC2本身可提供的儲存連線能力。磁碟宣告的性能不是任何主機、任何程式都能自動達到，需要用真實工作模式量測。','每次讀取幾KB的交易查詢，和一次掃描數GB的分析檔案，看起來都在讀磁碟，性能需求卻可能很不同。'],
      ['快照如何幫你重建與跨AZ？','快照保存卷的某個時間點狀態，可用來建立新卷或支援備份流程。因EBS卷屬於特定AZ，若要在另一AZ重建，通常會由適合的快照建立該AZ的新卷，而不是把原卷直接掛到另一AZ。要讓快照資料可用，還需考慮應用一致性、加密金鑰授權與恢復測試；快照不會自動代替持續運行的多AZ資料庫接手。','你可以由備份建立一顆新磁碟給備援主機，但啟動應用、驗證資料與切換使用者仍是另外的復原步驟。']
    ],
    '批次分析需要高速暫存，結果每天可從S3來源重算；正式資料庫則要求資料在換主機後仍存在。',
    ['把可重算中間資料和唯一重要資料分開，避免對兩者使用相同持久性假設。','對暫存評估適合的instance store等選項並處理遺失重算；對資料庫使用合適持久卷與備份，量測真實IO模式。','演練從快照建立新卷、掛載與恢復應用，確認所需AZ與KMS權限，而不只確認快照列表中有名字。'],
    '先決定資料能不能丟，再決定要多快；持久磁碟、暫存與快照分別承擔不同工作。',

    ['性能不是這個問題的重點，不同工作負載可能有不同結果。','作業系統可在區塊裝置上建立檔案系統。','正確。不能把可遺失的本機暫存當唯一持久資料來源。']);

  add('file-storage',
    '有些應用需要多台主機看到同一套檔案與目錄，例如多台Linux網站讀取共同上傳資料，或Windows辦公應用使用SMB共享。這和每台主機各自有一顆磁碟不同，也和用S3物件API讀檔不同。選共享檔案服務時，先確認應用需要的協定、檔案系統行為與效能，再看容量、可用性和維運需求。',
    '每人自己的抽屜、多人共用的文件櫃，以及依編號領取物件的倉庫，不是同一種使用方式；應用程式也會依賴不同存取行為。',
    '你能依Linux NFS、Windows SMB或HPC平行檔案需求選擇EFS與合適FSx服務，而不是只比較容量大小。',
    [
      ['共享檔案為何不能直接用單機磁碟替代？','共享檔案服務讓多個用戶端依協定讀寫同一個檔案系統，並處理需要的檔案與目錄語意。EBS一般是給主機使用的區塊裝置；即使某些卷支援特定多重掛載，也不代表任何一般檔案系統都能安全讓多台主機同時寫入。應用若期待共享目錄，就應選擇符合這種存取模型的設計。','兩台網站都寫入同一個上傳目錄，不能只把同一顆普通磁碟掛給兩台就假定檔案鎖與一致性自動正確。'],
      ['先用協定與功能縮小選擇','EFS常用於Linux等支援NFS的共享檔案需求，容量可依使用情況增長。FSx for Windows File Server提供Windows SMB與相關整合；FSx for Lustre著重高效能平行檔案工作，常見於HPC或分析場景。FSx還有其他檔案系統選項，選擇時應確認應用相容性，而不是看到FSx就把所有變體當成同一種產品。','既有Windows應用依賴Active Directory和SMB存取權限，就要看能滿足這些功能的服務；不能只因EFS也叫共享檔案就直接替換。'],
      ['共同檔案也需要故障與權限規畫','共享代表影響範圍可能變大，所以要控制網路路徑、用戶端權限與備份。不同儲存類別或部署模式的故障範圍可能不同，應依不可重建資料的要求選擇。效能還受到用戶端數量、檔案大小、存取模式與吞吐配置影響，不能只用儲存容量推算所有性能。','一百台主機同時讀大量小檔案，與少數節點讀大型連續資料，對中繼資料操作與吞吐的壓力不同。']

    '公司要把三種工作搬到AWS：Linux網站共享上傳、Windows部門檔案、以及大量節點平行分析S3資料。',
    ['先列出各自需要的協定與檔案行為：NFS、SMB與目錄權限、平行讀寫性能。','分別評估EFS、FSx for Windows與FSx for Lustre等合適能力，不為了統一名稱強迫所有工作使用同一服務。','對每個方案檢查網路、身分、故障範圍和備份，再用代表性檔案大小與並行量驗證性能。'],
    '共享儲存的選型起點是應用如何使用檔案；協定與語意不符合，容量再大也可能無法直接使用。',
    '既有Windows應用明確需要SMB和Active Directory整合，最先應確認什麼？',
    ['候選服務是否支援這些協定與身分整合，而不是只比較儲存單價。','只選容量最大的任意物件儲存。','把多台主機都指向同一顆普通EBS就不需要其他設計。'],0,
    ['正確。相容性是必要條件，成本要在可行方案之間比較。','物件API與既有SMB檔案存取不是相同使用方式。','多主機安全共享需要相應的檔案系統與協調能力，不能直接這樣推論。']);

  add('lambda',
    'Lambda讓你把一段處理工作的程式交給AWS，在事件發生或被呼叫時執行，不必自己維持一台一直開著的主機。這叫無伺服器運算，不是底下真的沒有伺服器，而是你不直接管理那些主機。你仍要決定函式的記憶體、權限、逾時、相依資源與失敗處理。先從一次執行的輸入、輸出和副作用想起，比先背一長串觸發來源更容易理解。',
    '像把「收到一張圖片就製作縮圖」交給隨叫隨到的工作站，你管理做事的方法與權限，不直接安排每台工作站的作業系統。',
    '你能設計一次函式執行，並說明重試、並行、外部連線與持久狀態為何仍需要管理。',
    [
      ['一次執行該負責什麼？','函式收到輸入，執行邏輯，回傳結果或寫入外部資料服務。執行環境可能被重用，也可能被替換，所以不能把某次留在記憶體或暫存檔的唯一重要資料，當成下一次一定能取回的持久狀態。把需要保存的結果寫到合適服務，把可以重用的連線初始化做得有效率，同時不要依賴環境永遠存在。','函式替訂單產生收據後應把收據與狀態保存到S3或資料庫，而不是只留在那次執行的本機目錄。'],
      ['自動擴展為什麼也會造成壓力？','更多事件可能讓更多函式執行同時發生，這些執行都可能連同一個資料庫或外部API。下游容量不會因Lambda擴展就自動無限增加，所以要安排並行限制、佇列緩衝、連線管理與節流。第一次準備環境或載入程式所需時間也可能影響延遲，應依使用者需求量測，而不是假定每次回應速度完全相同。','大量圖片事件可以快速增加執行數，但若每個函式都建立多條資料庫連線，資料庫可能先被連線數壓垮。'],
      ['重試與網路不是自動省略的工作','不同呼叫來源有不同成功與重試行為，函式可能收到重複事件，因此付款等副作用需要冪等控制。加入VPC是為了存取私有資源，不會自動讓函式獲得公開IP；若需要外部IPv4服務，仍要有適當出站路徑。執行角色決定函式能操作哪些AWS資源，網路已通也不等於已授權。','放在公有子網路的Lambda仍不會因此自動得到公網位址；要呼叫外部API時，必須一起檢查實際路由與出站設計。']
    ],
    '每當S3收到商品圖片，就需要產生縮圖並寫入資料庫，促銷時事件可能突然增加。',
    ['把每次工作限制為某張圖片的可辨識版本，讓重複事件能判斷是否已處理，而不是無條件重複寫入。','確認函式角色只允許讀取來源圖片、寫入縮圖與必要資料表，並安排合理逾時和錯誤處理。','量測資料庫連線與處理能力，必要時用佇列或並行限制吸收尖峰，並觀察失敗事件如何重試與保留。'],
    '無伺服器減少主機維運，但輸入輸出、權限、重試與下游保護仍是架構設計的核心。',
    'Lambda自動擴展後資料庫連線耗盡，最合理的理解是？',
    ['Lambda不可能影響任何外部資源。','應安排並行與連線管理，因為下游容量不會自動無限增加。','只要增加函式記憶體，就一定能擴大資料庫連線上限。'],1,
    ['函式會對下游發出真實請求，當然可能造成壓力。','正確。擴展必須連同依賴容量與保護一起設計。','函式資源配置不會直接改變資料庫的所有限制。']);

  add('containers',
    '容器把程式及它需要的執行環境封裝成可重複啟動的映像，讓同一份應用更容易在不同機器上執行。它不是另一個完整業務系統，也不是把資料永遠放進映像就能保存。當有很多容器時，還需要安排它們在哪裡執行、壞掉如何重啟、流量如何送進去。ECS與EKS提供編排能力，Fargate則提供不用直接管理工作節點的運算方式。',
    '容器映像像標準化餐點工作包，編排系統安排工作包在哪個工作站啟動；Fargate則讓你不用親自管理那些工作站。',
    '你能區分容器映像、編排平台與運算容量，並依團隊需求選擇ECS、EKS、Fargate或Batch。',
    [
      ['映像與正在執行的容器不同','映像是建立容器的配方，容器是實際執行中的一份工作。你可以從同一映像啟動多份容器，但它們不會因此自動共享記憶體或本機檔案。正式應用需要把持久資料放到合適外部服務，機密也不應烘焙在映像內。映像版本、來源與弱點修補都需要管理，否則只是把同一個問題更快速複製到很多地方。','部署新版網站時改用新的映像版本，讓工作逐步替換；客人的訂單仍存在資料庫，而不是跟著舊容器被刪掉。'],
      ['編排與提供主機是兩個選擇','ECS是AWS的容器編排服務；EKS提供受管理的Kubernetes控制平面，適合確實需要Kubernetes生態與操作方式的團隊。Fargate可為支援的ECS或EKS工作提供運算容量，減少直接管理節點的工作；也可依需求使用EC2節點以取得特定主機控制。不要把Fargate當成完全獨立取代所有編排能力的同義字。','選ECS並搭配Fargate，是同時選了工作如何被安排，以及由誰管理底層運算；不是在兩個完全互斥的服務中只能挑一個。'],
      ['長期服務與批次工作如何安排？','網站服務需要持續維持健康工作數量、接收流量與滾動部署；批次工作則常是在資料到齊後執行，完成就結束。AWS Batch協助排程與執行批次計算，應依相依性、容量及可中斷需求配置。選平台時還要評估團隊維運能力，不能只因Kubernetes很知名就引入目前不需要的複雜度。','每天夜間把一批影片轉檔，不一定要把它設成永遠常駐的網站服務；完成後釋放容量更貼近工作生命週期。']
    ],
    '小團隊已有可運作的容器網站，不需要特定Kubernetes功能，希望減少節點補丁與容量管理；另外有每晚執行的報表工作。',
    ['先辨識團隊沒有必要的Kubernetes約束，因此不必為了使用容器就自動選最複雜的控制方式。','評估ECS搭配Fargate等能滿足網站需求的配置，設計負載平衡、健康檢查、執行角色與外部資料保存。','將報表依批次生命週期排程，評估Batch或其他合適方式，讓完成的工作結束，而不是維持全天閒置容量。'],
    '容器解決封裝，編排解決管理多份工作，容量方案決定主機管理責任；先拆開看，選擇就會更清楚。',
    '哪個敘述正確？',

    ['容器可以搭配不同編排方式，不等於必須自行管理Kubernetes。','映像是啟動配方，持久業務資料仍需要適合的保存與同步設計。','正確。它們分別提供編排與運算容量相關能力。']);

</script><script>
/* 後24課的原創入門解說。與各課AWS官方延伸閱讀配合；不是官方教材。 */
window.LESSON_GUIDES_B = (() => {
const guides = {};
const add = (id,intro,analogy,outcome,steps,situation,reasoning,conclusion,check) => {
  const offset=Object.keys(guides).length%3;
  const rotate=values=>values.slice(offset).concat(values.slice(0,offset));
  guides[id]={intro,analogy,outcome,steps:steps.map(([title,explanation,example])=>({title,explanation,example})),workedExample:{situation,reasoning,conclusion},check:{question:check[0],options:rotate(check[1]),answer:(check[2]-offset+3)%3,explanations:rotate(check[3])}};
};
add('api',
'你在手機按下「查看訂單」，手機不會自己登入資料庫搜尋，而是傳一個有規則的請求給後端程式。這個讓程式互相要求事情的介面就叫API。API Gateway是AWS代管的入口：接到請求、判斷能否放行，再把工作交給真正處理訂單的程式。它不是資料庫，也不會自己知道你的商業規則。',
'把API Gateway想成醫院掛號櫃台：櫃台檢查證件、引導到科別、限制一次湧入的人數；醫師才負責診斷。櫃台與醫師是不同角色，入口授權與後端程式權限也要分開設計。',
'能沿著「手機→API入口→程式→資料庫」解釋一次請求，並知道驗證、節流、大檔案上傳各該放在哪裡。',[
 ['看懂一個請求如何被處理','GET /orders/123是「讀取123號訂單」的請求。入口可以把路徑對應到某個Lambda函式；函式再用自己的執行角色讀資料庫，產生回應。用戶是否能呼叫API，與函式能否讀資料庫，分別由不同授權控制。前者通過不代表後者一定成功。','小明登入成功但資料庫拒絕Lambda讀取時，不能只改登入設定；應檢查函式角色及資源權限。'],
 ['先確認身分，再決定能做什麼','驗證回答「你是誰」，授權回答「你能讀哪張訂單」。JWT可以理解成登入系統簽發的有限期憑證，API檢查其簽章和條件後仍需核對訂單擁有者。API key較適合辨識呼叫方與用量，不能單靠知道一串字就認定是合法使用者。','甲使用者把網址123改成124時，後端仍須確認124是否屬於甲，不能因JWT有效就回傳別人的訂單。'],
 ['把入口保護與耗時工作分開','節流是限制一段時間可接受的請求量，防止後端突然被壓垮；收到429表示請求太密集，客戶端應等待並有上限地重試。若工作需要很久，先回工作編號，將任務交到佇列背景處理，之後再查進度，比讓手機持續等一條連線更合適。','影片不必先穿過Lambda再送S3。API核准後給短期預簽上傳網址，手機直接上傳；API只處理小型控制訊息。']
 ],'相簿App需要登入、上傳影片、查詢轉檔進度，團隊希望少管理主機。',[
 '把請求拆開：登入建立使用者身分，API負責檢查登入憑證，影片本體與轉檔工作則是另外兩條資料流。',
 '上傳前核對使用者可使用的物件路徑，產生有限期限的S3上傳網址，避免API入口轉送整個大檔。',
 'S3上傳完成後觸發背景轉檔；API立即回應工作編號，狀態API從資料庫查進度，並確認查詢者擁有該工作。'
 ],'API Gateway管理入口，Lambda處理邏輯，S3放影片，背景流程處理長工作；每項服務只承擔它適合的責任。',
 ['API已確認登入憑證有效，還需要檢查什麼？',['訂單是否屬於該使用者，以及後端是否有存取資料的權限','只要憑證有效就能讀任何訂單','把API key當成所有人的共用密碼即可'],0,['正確。登入身分、資料授權與執行角色是不同層。','有效身分不代表對所有資料都有權。','API key不能取代個別身分與資料授權。']]);

add('dynamodb',
'資料庫的用途是讓程式保存、讀取與修改資料。DynamoDB讓你用「已知的鍵」快速找到項目，不用管理資料庫主機。鍵可以想成櫃子的編號：如果你知道客戶編號，就能直接去找他的購物車；如果每次都要翻遍全部櫃子才找到資料，服務再快也會浪費工作。',
'圖書館書架有分區與排序。partition key像書架分區，sort key像同一分區內的書號。好的編排取決於讀者要怎麼找書；不是先隨便堆滿，再期待搜尋永遠便宜。此類比說明存取模式，並不代表資料真的固定放在單一實體書架。',
'能先寫出應用要問的問題，再決定鍵與索引；也能解釋為何剛寫入的內容在某些讀取路徑可能尚未出現。',[
 ['先把查詢說成一句話','存取模式就是「程式通常怎麼找資料」。例如依使用者找購物車，或依客戶查最近訂單。partition key決定如何分散資料與負載，sort key可在相同partition key下協助排序與範圍查詢。若所有人都用同一個固定鍵，大量工作便可能集中成熱點。','訂單可用customerId做分組、以建立時間加訂單ID排序；但仍要根據單一大客戶的流量檢查是否會形成熱門鍵。'],
 ['理解索引是另一種找法','主鍵找訂單很方便，客服卻可能要用電子郵件找客戶。索引是額外維護的一組查找排列。GSI可改用不同的分割鍵，LSI共用原本的分割鍵而換排序方式。索引帶來儲存及寫入維護成本，不能為了所有可能問題無限制建立。','主表依訂單ID查單筆，另設合適的索引支援依客戶找訂單。讀取索引的程式必須理解它的更新可能稍晚於主表。'],
 ['把一致性當成讀到多新','最終一致讀取可能在成功寫入後短暫讀到舊資料；強一致讀取要求反映先前成功寫入的最新內容。基本表和LSI支援強一致選項，GSI及Streams不支援同樣的強一致讀法。全球資料表還須分辨不同一致性模式，不應只看到全球就假設全部功能相同。','結帳後立即確認付款狀態，可從支援強一致的主表讀取；商品瀏覽列表若能接受短暫延遲，可以用較合適的索引或快取路徑。']
 ],'活動售票流量難預測，使用者主要依自己的ID讀取購物車，付款後需要立即確認訂單。',[
 '購物車查詢鍵已知，符合鍵值存取；評估on-demand容量減少預估與管理工作，但仍監控熱門鍵和服務配額。',
 '把購物車與訂單的查詢列清楚，避免用Scan掃描所有使用者資料；必須新增找法時才規劃對應索引。',
 '確認訂單時從支援的主表路徑讀最新結果；扣庫存或避免重複處理則使用合適的條件寫入或交易，而非只靠先讀再寫。'
 ],'DynamoDB省去主機維護，沒有省去資料模型設計；鍵、索引、一致性與並行更新要依需求一起決定。',
 ['付款完成後從GSI查不到剛寫入的訂單，最合理的判斷是？',['GSI的讀取可能有更新延遲，應依需求改用適當主表查詢','DynamoDB成功寫入一定沒有保存資料','只要增加更多索引就會自動變成強一致'],0,['正確。GSI最終一致，立即確認可設計主表讀取路徑。','成功寫入與索引傳播是不同事情。','增加索引不會改變它的一致性語意。']]);

add('cache-databases',
'你可以把資料庫想成保存正式紀錄的地方。快取則把常用答案暫時放在更快取得的位置。每次有人問同一件事，都重新查表、計算、組合結果，會讓正式資料庫很忙；如果答案短時間內不變，就有機會重用。不過答案更新後，舊快取也可能繼續被讀到。',
'餐廳的正式菜單存在後台，外場拿著一份常用副本，回答客人就不用次次跑後台。這份副本讓服務更快，但菜單改價時要更新或作廢它。快取不是因為它快，就自動成為正確價格的唯一紀錄。',
'能描述cache-aside的一次命中與未命中流程，並根據資料關係、查詢方式與可接受的陳舊程度選資料庫。',[
 ['資料庫先看要怎麼問問題','關聯式資料庫用表格、關係與SQL處理資料，適合訂單與明細等交易關係。DynamoDB適合事先設計好的鍵值存取。Redshift偏向讀很多資料做統計分析。搜尋、文件與圖關係也各有專門工具，因此「資料很多」不是足以選定某個資料庫的條件。','付款需要訂單與明細交易一致，不能只因Redshift善於處理大量資料，就拿它取代線上付款的交易資料庫。'],
 ['走一次cache-aside流程','Cache-aside表示由應用程式管理快取旁路：先查快取，找到就回應；找不到才查資料庫，並把查得的結果放進快取。ElastiCache提供託管記憶體快取，但程式仍需設計鍵、過期與失敗時的行為。資料庫查詢結果不是自動全部變成快取。','商品123的詳情以product:123為鍵。第一次查詢miss後讀資料庫，接下來的相同查詢命中快取，便減少重複資料庫工作。'],
 ['一起設計失效與快取失敗','TTL是快取資料可保留多久的時間設定。更新商品時可刪除或更新對應快取，否則使用者可能看見舊資訊。大量鍵同時到期，會讓大家一起回到資料庫造成尖峰，稱為驚群或快取擊穿類問題。需考慮錯開到期、合併請求與限制下游負載。','促銷開始前，所有熱門商品快取若同秒到期，資料庫可能突然過載；可以預熱重點資料並讓TTL分散，而不是只把快取機器加大。']
 ],'商品介紹大多一天才變幾次，但首頁每秒被大量讀取；購物車價格結算必須準確。',[
 '將常讀的商品描述與圖片資訊放快取，減少大量重複查詢；先量測命中率是否真的降低資料庫負載。',
 '商品資料更新時使舊快取失效，並設定合理TTL，讓內容陳舊程度有界線。不同使用者的資料不能誤用同一鍵。',
 '真正結帳時依交易規則確認權威價格與庫存，不把可能陳舊的頁面快取當成付款依據；同時設計快取整體失效時的降級。'
 ],'快取解決重複讀取的速度與負載問題；正確性、資料更新及下游保護仍是架構責任。',
 ['加入快取後，還需要哪一項設計？',['更新資料時如何使快取失效，以及快取故障時怎麼處理','把所有資料永久留在快取且永不過期','讓快取直接決定所有需要最新交易一致性的結果'],0,['正確。快取必須有失效與故障策略。','永久保留可能讓使用者一直讀到舊值。','需要最新權威結果的交易不能草率依賴陳舊快取。']]);

add('edge',
'距離會影響網路往返時間。假設網站的圖片放在東京，美國使用者每次都從東京下載，可能等待較久。CloudFront可在較靠近使用者的邊緣位置保存可重用內容，減少往返來源。Global Accelerator則改善進入應用的全球網路路徑與入口，它不負責保存圖片副本。',
'CloudFront像在多個城市放熱門商品的取貨點，商品已在附近就不用回中央倉庫拿。Global Accelerator較像統一入口與較合適的運輸路線。兩者都可能改善體驗，但「把貨放近一點」與「把路走得更好」是不同機制。',
'能分清DNS回應名稱、CDN快取內容與全球流量入口三種工作，並知道個人化內容為何不能隨意共用快取。',[
 ['看懂快取命中與回來源','Origin是內容真正來自哪裡，例如S3或一個HTTP服務。CloudFront收到請求後，若有仍可使用的快取副本，就直接回應，稱為hit；沒有時才向origin取資料，稱為miss。因此第一次讀取與重複讀取可能有不同延遲，來源也不會因為用了CDN就完全沒有流量。','網站的logo每個人都看同一份，很適合重用；剛產生且從未有人讀過的報表，仍可能需要回來源取得。'],
 ['快取鍵決定哪些人共用答案','Cache key是判斷兩個請求能否重用同一份內容的依據，可包含路徑、特定查詢參數、標頭或cookie。無關的參數放太多會分散快取，命中率變差；應區分使用者的資料卻沒放進必要識別，可能造成錯誤共用。個人化內容也可以直接不快取。','/profile若顯示每個人的私人資料，不能只以網址路徑共用一份答案；/logo-v3.png則可用版本化檔名搭配長快取時間。'],
 ['依協定與入口要求比較工具','Route 53是DNS服務，主要回答某個名稱要連哪裡；CloudFront主要處理HTTP/S內容傳遞與快取；Global Accelerator提供固定anycast IP，將支援的TCP/UDP連線導向健康端點。選型時先問傳的是什麼、需不需要快取、客戶是否要求固定IP。','全球UDP遊戲的資料不是HTTP圖片檔，而且企業要固定IP白名單，應比較Global Accelerator；圖片下載加速則先看CloudFront。']
 ],'線上課程有全球學生，教材圖片可公開讀取，但每位學生的成績必須保密。',[
 '把共用的圖片和JavaScript視為適合CDN重用的靜態內容，利用版本化名稱讓更新與長快取並存。',
 '成績API需驗證使用者並採正確的快取政策；不能為了提高命中率而把不同學生的回應混在一起。',
 '若來源是私有S3，可用OAC讓CloudFront獲准讀取，減少繞過入口直接取物件的路徑；這與觀看者是否有權讀取內容仍是兩層授權。'
 ],'全球加速不只選一個服務名稱，還要沿資料流安排快取、來源保護與使用者授權。',
 ['全球UDP應用需要固定入口IP，沒有內容快取需求，先評估哪個？',['Global Accelerator','只靠S3生命週期規則','把所有封包當成CloudFront圖片快取'],0,['正確。協定與固定IP需求符合GA的比較方向。','生命週期調整儲存，不處理全球網路入口。','CDN物件快取不是UDP應用的通用入口。']]);

add('hybrid',
'混合雲是公司原有機房與雲端一起工作。兩邊即使都能上網，也不等於能安全連到彼此的私有資料庫。你需要先決定兩個網路怎麼連、哪些網段能互通、名稱如何解析，以及一條線路壞掉怎麼辦。VPN、Direct Connect、peering和Transit Gateway分別解決不同連線規模與路徑問題。',
'把VPC視為公司不同園區：peering像兩園區間專用通道，Transit Gateway像集中轉運站；VPN像在既有公共道路建立受保護運送通道，Direct Connect則是專用線路。路已修好，仍需要正確地址、交通規則與目的地接待權限。',
'能依兩個VPC、數十個VPC或機房連雲端的需求選連線模式，並解釋路由、加密、DNS與備援不能互相取代。',[
 ['先分清網路路徑與加密','Site-to-Site VPN用IPsec隧道保護跨網際網路的連線內容，部署通常較快。Direct Connect提供專用連線，但專用不等於自動端到端加密；若資料政策要求加密，仍須評估適用的加密方案。兩者都需要對應路由，不是建立一個資源後所有私有網段立即互通。','機房連AWS先用VPN快速開始，之後增加DX以改善線路體驗；若DX故障，還要確認VPN真的能承接路由與容量。'],
 ['少量點對點與大量樞紐不同','VPC peering直接連兩個VPC，但沒有轉遞性：A連B、B連C，不表示A可以借B去C。當很多VPC都要彼此或連機房，逐對管理容易變複雜，Transit Gateway提供集中轉送與路由表分段。但集中之後仍要決定誰能到誰，不能自動全開。','三個產品VPC都需連共同機房，可評估TGW；測試環境和正式環境放不同路由分段，讓能共用機房不代表能互相讀資料。'],
 ['連得通IP還不等於應用能用','路由決定封包下一站，安全規則決定是否放行，DNS則把db.corp.example翻成位址。缺少任何一層，應用都可能失敗。備援線路若共用同一機房設備、供電或電信路徑，仍可能同時中斷；需依實際故障範圍測試，而非只數有幾條連線。','若直接使用資料庫IP成功，但使用主機名稱失敗，應先查DNS轉送與回應，而不是一直增加VPN隧道。']
 ],'公司有60個VPC、兩個機房，要求集中連線且測試環境不能直接進正式環境。',[
 '60個VPC逐對peering會形成許多個別路由與維護工作，先評估用TGW作集中連線樞紐。',
 '以路由表分段表達「測試不能到正式」，配合必要的安全規則，不因為集中管理就開放全部網路。',
 '設計機房到AWS的DX/VPN備援及雙向DNS，實測主線路失效後名稱解析、新連線和實際容量，而不只看控制台顯示Connected。'
 ],'混合連線成功的標準是應用在符合隔離和故障條件下能正常使用，不是只有一條線路顯示已連線。',
 ['A與B、B與C有peering，A可否自動經B到C？',['不行，peering不提供這種轉遞路由','一定可以，因為三個都在AWS','只要改資料庫密碼就會自動互通'],0,['正確。需要另外設計合適連線與路由。','相同雲端不代表網路自動互通。','密碼是應用授權，無法新增網路轉遞能力。']]);

add('streaming',
'事件是「某件事剛發生」的紀錄，例如使用者點了商品、機器回報溫度。當這些紀錄不停產生，就形成串流。你可能同時想做即時警報、每小時統計與事後重算。串流系統保留事件一段時間，讓不同消費者按照自己的位置讀取；這與工作做完就刪除的佇列模型有不同目的。',
'把串流想成一卷持續寫入的收據紙帶。警報程式讀到最新位置，報表程式可能慢一些；只要資料還在保留期間內，新的程式也能從較早位置開始讀。紙帶不會因為第一個讀者看過，就立刻對其他讀者消失。',
'能依是否需要保留、重播、自訂處理與受管交付，比較Kinesis Data Streams、Data Firehose、Flink與SQS。',[
 ['先區分分派工作與記錄事件','SQS常用來讓一組工作消費者分工，例如處理一個轉檔任務。Data Streams則讓消費者讀一條持續累積的紀錄，每個消費者可以有自己的進度。重播是把保留的事件再次處理，不代表服務自動替你的外部資料庫避免重複寫入。','同一批點擊事件同時要做欺詐偵測與商品推薦，兩個程式應能各自讀取；不是放進同一條競爭佇列後各分到一半。'],
 ['分區與讀取進度是兩個關鍵','Partition key決定事件如何分配到串流的分片。把同一設備的事件放在相同鍵有助維持相關範圍的順序，但所有設備共用同一鍵也可能造成熱點。Checkpoint是消費者記住自己讀到哪裡；故障後可從適當位置繼續，但仍需處理重複事件。','用deviceId區分感測器事件；若某一設備非常熱門，要另外檢查它是否使單一分區過載，而非只增加其他不忙的容量。'],
 ['交付、運算與相容性分別選','Data Firehose偏向把資料緩衝後交付到S3等支援目的地，省下自建搬運程式。Flink適合視窗統計等有狀態運算。MSK支援Kafka生態，適合既有Kafka相容需求。這些服務有不同的處理與維運模式，不能只因題目說即時就固定選同一個。','每分鐘把裝置資料落到S3可先評估Firehose；若要連續計算最近五分鐘平均值並發警報，還需要適合的串流處理邏輯。']
 ],'設備每秒回報溫度，營運要即時偵測過熱，分析團隊要保留資料後重新計算。',[
 '先確認延遲與保存多久，保留事件的串流能讓警報與分析消費者各自讀取，而不用爭搶同一份工作。',
 '用設備識別設計分區，記錄讀取進度；事件含唯一識別，讓消費者重試時能避免重複產生外部副作用。',
 '警報可用串流處理，長期資料交付到S3；若只需搬運到S3而沒有自訂處理，受管交付比維護整套消費者更簡單。'
 ],'串流的核心是持續記錄、獨立進度與有限期間重播；真正的低延遲、順序與冪等仍要在端到端設計中檢查。',
 ['兩個分析程式都要完整重讀同批事件，重點需求是什麼？',['保留事件並讓消費者維護各自讀取位置','讓兩個程式競爭同一條工作佇列，各讀一半','第一個程式讀完立刻刪除唯一副本'],0,['正確。這是串流保留及獨立消費的典型需求。','競爭分工不能讓每個程式各自收到完整歷史。','刪除唯一紀錄後無法讓第二個程式重讀。']]);

add('analytics',
'交易系統回答「這位客戶的訂單是多少」，分析系統則可能問「去年各地區的總營收是多少」。後者需要讀很多資料做統計，不能只是把線上訂單資料庫無限制放大。資料湖以S3等儲存原始與整理後的資料，Glue描述或轉換資料，Athena與Redshift再依需求執行查詢。',
'想像一個保存各部門文件的倉庫：S3是放文件的地方，Glue Catalog是告訴你各資料集有哪些欄位的目錄，ETL是把不同格式整理成一致表格的工作，查詢引擎則是依問題找出並計算答案的工具。目錄本身不等於整個倉庫的資料。',
'能說出資料儲存、目錄、轉換與查詢四個步驟，並知道分區和欄式格式如何減少不必要讀取。',[
 ['把原始資料與表格定義分開','S3中的CSV或Parquet檔案是真實資料，Glue Data Catalog則保存欄位名稱、型別與位置等中繼資料。Athena利用表格定義理解檔案並執行SQL。建立Catalog表並不代表已複製一份完整資料，也不保證原始檔案的內容品質正確。','一個表指向s3://.../sales/，檔案仍在S3。若把欄位型別定錯，查詢可能失敗；刪除目錄定義也不應直接假設實際檔案已被刪除。'],
 ['讓引擎只讀需要的部分','分區是按日期或地區等方式把資料分開，讓有對應條件的查詢略過無關區段。Parquet等欄式格式讓只查少數欄位的工作不必讀進每筆資料的全部欄位。查詢成本及效能常與掃描多少資料有關，並非只看最後顯示幾列。','要看11月東京營收，條件明確包含日期和地區分區；只SELECT金額與需要欄位，而不是讀全年所有地區後再丟棄大部分資料。'],
 ['依分析型態選查詢方案','Athena適合直接以SQL查S3等支援資料來源，減少維護資料庫伺服器。Glue ETL負責轉換與整理，不是每次互動查詢的替代品。Redshift偏向資料倉儲分析，適合需要組織化分析工作負載的情境。選型要比較併發、規律性、效能與總成本。','偶爾查幾次S3存取紀錄，可先用Athena；大量持續的複雜報表則評估倉儲方案及資料模型，不因都會SQL就視為完全相同。']
 ],'公司每天產生網站點擊檔，要讓分析師每週查某一天、某個市場的轉換率。',[
 '原始檔先進S3，保留可追溯資料；資料整理後另放curated區，避免報表依賴各團隊隨時改動的原始格式。',
 '以Glue維護一致的欄位定義，必要時ETL清理與轉Parquet，並依常用日期與市場設計合理分區。',
 '分析師使用Athena查指定分區與欄位，記錄掃描量和結果正確性；小檔過多或分區方式不合查詢時再調整資料佈局。'
 ],'好的分析架構先讓資料可理解、少讀無關資料，再選合適引擎；不是只把工具接在一起就會自動得到正確報表。',
 ['Athena查詢只顯示10列，是否表示只計算10列的掃描量？',['不一定，掃描量取決於實際讀取的資料與格式等因素','一定只掃描10列，因為畫面只有10列','只要用了Glue Catalog，所有S3查詢都不需讀檔'],0,['正確。輸出列數與底層掃描量不同。','LIMIT與畫面結果不能直接保證少掃描。','Catalog是資料定義，查詢仍須讀取相關資料。']]);

add('migration',
'遷移不只是把資料複製到雲端。你還需要確定程式能使用新環境、最後的更新沒有遺漏、何時切換，以及出錯如何返回。檔案、資料庫與整台伺服器有不同的結構，因此AWS提供不同工具。先說清楚「搬什麼、可停多久、多久會新增資料」，才能找到合適方式。',
'搬公司時，檔案箱、正在使用的帳本和整套機械不能都用同一種搬法。先搬大部分東西，再追上搬家期間新增的內容，最後安排短暫停止寫入與切換；新辦公室能開門，還不代表帳目與設備都能正常工作。',
'能比較DataSync、DMS、伺服器rehost與Storage Gateway，並說出初次複製、增量同步、驗證、切換與回復各自的目的。',[
 ['依資料型態選工具','DataSync處理支援來源與目的地間的檔案或物件傳輸，適合大量檔案搬運與同步。DMS理解支援資料庫的資料搬遷及變更擷取。伺服器rehost則盡量保留既有機器上的工作負載形態。這三個問題不同，不能因工具名稱都帶migration就互換。','搬共享檔案目錄先看DataSync；把正在更新的資料庫搬到RDS先看DMS；需要保留作業系統與應用的整台伺服器才評估MGN相關rehost。'],
 ['降低停機要追上變更','Full load是先載入大量既有資料；CDC是追蹤並傳送後續變更。兩者結合能讓新資料庫逐漸追近原站，但最後仍要設計切換窗口、暫停或控制寫入、確認延遲已追平。異質資料庫還有型別、SQL與結構相容性問題，不會因資料搬到了就自動全部相容。','舊資料庫載入完成後仍繼續接單，DMS持續同步新訂單。切換前必須核對最後更新，不能只以載入百分比100%就讓所有人轉向新站。'],
 ['混合存取與離線搬運另判斷','Storage Gateway提供特定檔案、磁碟或磁帶介面的混合儲存，適合應用仍留機房卻使用雲端儲存的情境；它不是所有遷移工具的共同替代品。離線裝置則要核對當前供應資格與地區，不能假定新客戶一定可訂購某種裝置。傳輸完成也要驗證完整性。','舊備份軟體需要磁帶介面，可以評估Tape Gateway；若目的只是把NFS目錄一次搬上雲端，不必因此建立完整磁帶備份流程。']
 ],'公司資料庫不停接單，只能接受短暫停機，需要遷移到相容的RDS引擎。',[
 '先測試資料型別、應用SQL、權限與連線相容性；如果引擎不同，規劃結構與程式修正，而非只挑複製工具。',
 '進行full load並使用支援的CDC追蹤持續變更，監控同步延遲及錯誤，對比筆數和重要業務總額。',
 '在切換窗口控制舊站寫入，確認資料追平後改應用連線，再驗證新增與查詢；回復計畫必須處理新站已產生的資料，不能只改回DNS。'
 ],'成功遷移包含可用的應用與可信的資料，不只是檔案傳輸成功；工具選擇必須對上要搬的工作負載。',
 ['資料庫full load完成後，原站仍在接單，切換前還要確認什麼？',['後續變更已同步、應用相容且有控制寫入與回復方案','只要百分比100%就直接刪除原站','用檔案複製工具即可保證所有交易一致'],0,['正確。持續變更與切換程序決定最後的資料完整性。','載入完成不代表後續更新都已追平。','一般檔案搬運不等於資料庫交易遷移。']]);

add('s3-cost',
'S3把資料存成物件，例如照片、備份檔與日誌。儲存類別是服務對資料存取與成本的不同安排：有些適合經常讀，有些單位儲存費較低但讀取或還原要付出更多代價。你要問的是資料多久讀一次、能等多久、可不可以重建，而不是只看哪一欄每GB價格最低。',
'常用文件放桌面，偶爾用的放櫃子，長期保留的裝箱進倉庫。倉庫月租可能較便宜，但取回要時間與搬運費。把今天必須立即使用的文件也放最遠倉庫，可能省了租金卻耽誤工作。',
'能依存取頻率、取回時間、資料可重建性與最低計費條件選儲存類別，並理解生命週期如何自動轉換與清理版本。',[
 ['先知道資料的生命故事','一份影片剛上架時經常被看，幾個月後很少有人播放，幾年後可能只為法規保存。這些階段需要的存取速度不同。Standard適合經常使用，IA類適合較少讀取但仍需要快速存取，封存類則可能需要等待還原。實際還原方式與費用依類別和選項而不同。','昨天的網站日誌可能供工程師立即排錯，三年前的稽核日誌可能允許等待取回；它們不應只因檔案格式相同就用完全相同儲存政策。'],
 ['把所有費用加起來比較','除了存多少資料，還可能計算請求、取回、轉換與最低儲存期等成本。小物件很多、頻繁讀取、很快刪除，都可能改變哪個方案便宜。One Zone類別把資料放在單一AZ的故障範圍，需要判斷資料能否重建，不能為省錢忽略唯一副本的風險。','每天會被下載多次的檔案，即使IA儲存單價較低，總費用也可能受取回量影響；需要先估讀取模式，不能只比較月租。'],
 ['用規則處理長期清理','Lifecycle是依物件年齡等條件自動轉換類別或到期清理的規則，不是每秒精確執行的工作排程器。開啟版本控制後，同一個key可能有多個舊版本；只刪目前物件，仍可能留下計費版本。規則要分清current與noncurrent版本。','備份保存一年，舊版本只保存90天時，應分別設計版本規則；否則畫面上的檔案少了，實際儲存的歷史版本仍持續增加。']
 ],'公司有大量日誌，最近30天常查，之後只偶爾稽核，保留7年。',[
 '確認最近日誌的即時查詢需求，以及歷史日誌允許的取回時間；保存年限不等於必須隨時毫秒讀取。',
 '依階段比較Standard、低頻與封存類別的總成本，包含轉換、取回與最低計費條件；不先硬填固定價格。',
 '設定適當Lifecycle處理資料與舊版本，並安排稽核取回演練，確認重要資料能在要求的時間內復原。'
 ],'儲存成本最佳化是把資料放在符合其生命階段的地方，而非把全部資料直接搬到最低單價類別。',
 ['不可重建的唯一資料副本，能否只因便宜就放單AZ類別？',['不能，還要評估AZ故障與資料耐久需求','可以，所有儲存類別的故障範圍都相同','只要檔名加上backup就能消除風險'],0,['正確。可重建性與故障範圍是必要條件。','不同類別的可用性與部署範圍可能不同。','檔名不會產生額外副本或容錯。']]);

add('compute-cost',
'運算費用常和使用的機器規格、執行多久、是否承諾長期使用以及能否接受中斷有關。相同程式不一定非要用同一種計費方式。先把真正需要的容量找出來，再選折扣，否則可能只是用折扣價格長期購買一台仍然太大的機器。',
'租車時，臨時租一天、承諾長期租用、接受可能被提前收回的特價車，是不同契約。折扣可以便宜，但長租用不到的車仍會浪費；有折扣也不代表某一天一定有指定車款留給你。',
'能先做right sizing與排程，再依穩定、突發及可中斷的部分比較On-Demand、Savings Plans、RI與Spot，並把折扣和容量保留分開。',[
 ['先看是否真的需要這麼大','Right sizing是依CPU、記憶體、磁碟、網路與服務品質等實測，調整資源大小及型態。CPU低不一定能立刻縮小，可能是記憶體需求或外部等待造成。開發環境夜間不用仍持續執行，也可能先用排程節省整段時間，而不是先買長約。','一台主機CPU只有5%，卻把記憶體用滿，不能只看CPU就換成最小規格；應取得足夠監控並測試調整後是否符合延遲需求。'],
 ['穩定用量才適合承諾折扣','Savings Plans是承諾一定用量支出以取得適用折扣；RI也有指定範圍與承諾條件。不同方案的服務、執行個體或地區彈性不同。它們不代表所有情況都自動保留啟動容量；折扣、已執行資源與容量保障是三個需分別確認的問題。','全年每天都需要的基礎容量可比較承諾折扣；活動當天才出現的額外流量，則不應只為單次尖峰承諾數年的峰值規模。'],
 ['可中斷工作才善用Spot','Spot使用可被回收的閒置容量，適合可重試、可分段、可保存進度的工作。便宜的前提是應用真的能承受中斷，不是收到通知後一定能把任意長工作完整做完。分散執行個體類型與容量池有助提高取得容量的機會，但不能保證永不中斷。','圖片轉檔可將每張圖作獨立任務，中斷後重新排回佇列；線上唯一一台付款資料庫則不適合只為省錢依賴可隨時回收的容量。']
 ],'網站平日需要固定基礎容量，月底會有尖峰，夜間另有可重新執行的報表工作。',[
 '先量測並縮減閒置與過大規格，分清真正全天需要的基礎用量和只在特定時段需要的容量。',
 '對可預測的基礎部分比較承諾折扣，尖峰用彈性容量補足；同時檢查是否需要另外的容量保障。',
 '把可中斷的夜間報表放到支援重試及進度保存的Spot方案，保留必要的完成期限與失敗備援。'
 ],'先減少不必要用量，再替剩下用量選合適契約；折扣不是替代容量管理與故障設計的捷徑。',
 ['一個只在週末跑、可重試的批次工作，最該先比較哪項？',['Spot與可中斷設計，並核對完成期限','為全年最高尖峰購買固定長期承諾','只因Spot便宜就取消所有重試與進度保存'],0,['正確。可重試特性適合評估Spot，但仍需滿足期限。','短期工作不應直接承諾全年峰值。','Spot節省成本需要中斷處理配合。']]);

add('database-cost',
'資料庫的帳單不只是容量大小。讓資料庫重複讀取不必要資料、掃描所有紀錄、維持用不到的副本，都可能使費用增加。最佳化首先要保留業務正確性與可用性，再檢查程式實際做了多少工作。單純換成較小主機，若使交易失敗，就不算達成成本目標。',
'一家店的成本不只看倉庫租金，也要看每次找貨走多遠、是否重複搬同一批貨、是否雇了閒置人員。索引像有用的目錄，快取像前台常備品；它們有自己的維護成本，需要用實際使用量判斷是否值得。',
'能從查詢模式、容量模式、保留資料與可用性需求分析資料庫總成本，而不是只比較某個服務的最低單價。',[
 ['先找到浪費工作的查詢','一個查詢若只需要一位客戶的訂單，卻掃描整張表再過濾，就會多做工作。關聯式資料庫可檢查查詢計畫與合適索引；DynamoDB則先看鍵設計與Query路徑。索引能幫助特定查詢，也會增加儲存及寫入維護，不是越多越好。','首頁反覆查相同商品資料，先改善重複查詢與快取；若直接加大資料庫，可能只是在花更多錢執行同樣浪費的工作。'],
 ['容量與存取要求一起比較','DynamoDB on-demand與provisioned、關聯資料庫不同機型及彈性方案，各有適用負載。穩定的用量和難預測突發的用量，管理方式可能不同。還要看一致性、交易、索引與備份等功能，不能因同樣一筆請求就假設所有方案成本和語意相同。','每天平穩讀寫的資料表可以估算預置容量；新活動未知流量可評估on-demand，但仍需監控突發模式、熱門鍵和支援限制。'],
 ['分析費用要減少不必要掃描','Athena等分析工作常受讀取資料量影響。只查一天卻讀全年CSV，可能比只讀正確分區的Parquet昂貴。RDS副本則要確認是否真的分擔讀取；為了省錢刪掉唯一的高可用備援，可能違反原本要求。成本最佳化必須受業務限制約束。','一份月報只用日期和金額欄位，可比較分區與欄式格式；不要以LIMIT 10就假設只掃描10筆，也不要把所有正式備份一併刪掉。']
 ],'訂單系統的資料庫帳單持續上升，但團隊不清楚是交易量成長還是查詢浪費。',[
 '把帳單拆為運算、儲存、讀寫、備份、副本與傳輸，並對應到查詢量、延遲和業務成長。',
 '找出高頻慢查詢及未使用索引或副本，先測試改查詢、鍵模型、資料保留與適當快取，保留必要容錯。',
 '在修正後的穩定負載上重新比較容量與計費方案，做前後成本及服務品質驗證，而非只以帳單下降判定成功。'
 ],'最便宜且正確的方案，是在滿足可用性與資料要求後減少無效工作，再匹配合適容量。',
 ['資料庫讀費很高，最好的第一步通常是？',['查看查詢與存取模式，找出不必要掃描和重複工作','立即移除所有備援與備份','只用最低規格，不論交易延遲與錯誤'],0,['正確。先了解成本來源與工作量，再優化。','必要的容錯與保留不能不看需求就刪除。','便宜但不滿足需求不是有效最佳化。']]);

add('network-cost',
'在雲端，資料走哪條路也可能影響費用。相同大小的資料，從同區域S3到應用、跨AZ傳輸、經NAT出網、跨Region複寫或傳到網際網路，可能涉及不同費用。你不必背每個價目數字，但要會畫出路徑，找出會計費的環節，再用當前官方價格估算。',
'送貨費不只看箱子多大，也看是否跨城、是否經收費轉運站、是否重複繞路。NAT像某些出站路徑會經過的轉運點；私有端點是連到特定服務的另一種路徑，是否划算要看其固定費與流量，而不是看到私有就認為一律免費。',
'能畫出一段資料從來源到目的地的完整路徑，辨識NAT、端點、跨區與CDN的成本取捨，並保留必要高可用。',[
 ['將流量分成方向與位置','先標出哪個Region、哪個AZ、誰傳給誰、每天多少GB，以及是否經網際網路。傳輸費常依服務與方向不同，同在AWS也不能一律當成免費。資料庫複本、備份複寫和應用跨AZ讀取，都是容易在架構圖中被忽略的背景流量。','應用每天從另一AZ讀取大型檔案，即使兩邊都在同一VPC，也應核對實際服務路徑與跨AZ計費，而非只看請求次數。'],
 ['把NAT與端點當成不同路徑','私有運算主動存取外部IPv4服務時，常透過NAT；大量S3或DynamoDB存取可以評估gateway endpoint，避免相應NAT路徑。Interface endpoint通常還有小時與資料處理費，因此大量分散端點在低流量環境也可能昂貴。網路可達和IAM授權仍須分開設定。','分析主機每天讀數TB同區S3資料，應比較gateway endpoint；不是直接把主機改成公開，就當作已同時滿足安全與成本需求。'],
 ['減少重複傳輸而非犧牲韌性','讓資料靠近處理它的運算、使用合適壓縮、在CloudFront快取可重用內容，都可能減少重複搬運。可是把多AZ設計改成單AZ，雖然減少某些費用，卻可能違反可用性目標。每個省錢提案都要列出對安全、延遲與故障範圍的影響。','圖片全球重複下載可評估CDN命中；但使用者專屬報表不能為了命中率而共用錯誤快取鍵，否則會增加資料外洩風險。']
 ],'私有分析主機每天經NAT讀取同區域S3的數TB檔案，帳單中的NAT處理費偏高。',[
 '先確認實際讀取的是哪個S3端點、所在Region與路由，避免只憑帳單項目猜測資料路徑。',
 '建立適用的S3 gateway endpoint路由，配合endpoint policy、bucket policy與角色權限，讓該服務流量走合適的私有路徑。',
 '以相同資料量驗證NAT流量下降、讀取成功、權限仍受限；網際網路更新站等其他流量仍需原本的適當出站方案。'
 ],'網路省錢的常見方法是移除不必要繞路與重傳，而不是一律開公網或刪除必要的備援。',
 ['同Region私有EC2大量讀S3，希望減少NAT處理路徑，應先評估？',['S3 gateway endpoint及其路由、政策','把所有bucket公開就不必管權限','刪除另一AZ的正式備援來保證所有傳輸免費'],0,['正確。它可能避開對應S3流量的NAT路徑。','公開資料不是符合安全需求的必要做法。','高可用與傳輸費必須一起評估，不能以錯誤假設取代。']]);

add('finops',
'雲端成本治理不是月底看到帳單才找人負責，而是讓團隊知道誰在用哪些資源、為什麼需要、花費是否合理。AWS Budgets可依設定通知你超過預算或預測門檻；Cost Explorer用來分析趨勢；Compute Optimizer等工具提供部分資源建議。它們協助你判斷，不會自動了解每個產品的商業重要性。',
'家庭記帳先分類房租、交通與食物，再看哪項超支；信用卡通知只是提醒，不等於銀行替你決定哪一餐不該吃。雲端預算通知同樣不保證自動停止所有資源，團隊還需要處理人、回應流程與合理限制。',
'能建立成本歸屬、預算通知、用量分析與持續改善的循環，並分清「監看成本」和「自動停止支出」的差別。',[
 ['先讓費用有主人','標籤可描述資源的產品、環境、成本中心與負責團隊；帳號也可作強隔離與帳務歸屬邊界。若每個人任意拼字，報表就難合併。部分成本分配標籤需要啟用，且不同費用的可分配方式有差異，不能假定加完標籤就會重寫所有歷史帳單。','訂出Project=learning、Environment=test等一致規則，測試主機和正式服務分開歸屬，讓看到異常費用時找得到負責人。'],
 ['預算通知需要後續動作','Budgets依設定追蹤實際或預測成本並通知，但資料與通知可能有延遲；單純建立預算不等於硬性支出上限。若要自動化回應，需明確設計支援的動作與權限，並防止錯誤關閉重要資源。對初學實驗，最實際的是小規模操作、即時檢查及完成後清理。','你設定10美元提醒後，不能放任昂貴資源無限制執行，以為帳單到10美元會全自動關機；應提前規劃誰收到通知以及要做什麼。'],
 ['用建議作起點，再驗證','Cost Explorer協助按服務、帳號或時間看趨勢，Compute Optimizer依支援的歷史資料提供資源建議。建議不一定看得到下次促銷、法規需求或全部應用限制。先理解使用型態，再測試縮規格或關閉資源，並同時監控延遲、錯誤率與恢復能力。','一台平日閒置的備援主機可能有災備用途；不能只因使用率低就直接刪除。需要把RTO要求與待命方式一起檢查。']
 ],'團隊每月帳單增加，但無法分辨正式服務、個人實驗與閒置資源。',[
 '先用帳號和一致標籤建立成本歸屬，把實驗與正式環境分開，並定義資源擁有者和清理期限。',
 '設定實際與預測預算通知，確認通知真的能送到有人處理的地方；為不同產品規劃不同的回應方式。',
 '固定檢視用量與成本異常，從閒置、過大規格、資料保留及不必要傳輸著手，變更後驗證服務品質沒有下降。'
 ],'成本治理是一個有人負責的持續流程：看得見、分得清、能回應，再量測改善成果。',
 ['只設定AWS Budgets通知，就能保證總費用不超過預算嗎？',['不能，通知不等於通用硬性支出上限','能，所有服務會在門檻到達瞬間自動停止','能，標籤會自行刪除超支資源'],0,['正確。需要另設回應流程，且留意資料與通知延遲。','預算通知沒有這種通用即時停機保證。','標籤是歸屬資訊，不會自行刪除資源。']]);

add('iac',
'如果你曾在控制台按很多次，才能建好一套網路與網站，就會發現重新建立相同環境很容易漏一步。Infrastructure as Code把基礎設施設定寫成可保存、比較與審查的文字。CloudFormation讀取範本建立一組資源，稱為stack。範本不是圖解而已，執行後可能真正建立、修改或刪除付費資源。',
'手動裝潢靠工人口述，下一間店可能少插座；把尺寸、材料與施工順序寫成圖紙，便能比較版本與重複施工。但圖紙畫得出來，不代表現場一定有材料，也不保證改牆時不影響既有水管，因此仍要先看變更與現場限制。',
'能理解範本、stack、參數與change set，並知道部署前要檢查資源替換、資料保留與權限，而不是把自動化當成無風險操作。',[
 ['範本描述要建立的資源','CloudFormation範本以JSON或YAML描述資源類型與屬性。Ref和GetAtt等參照可以把一個資源的名稱或屬性接到另一個資源，形成依賴。Parameters讓相同範本接受不同環境值，Outputs提供部署後要使用的資訊，例如網站網址與bucket名稱。','同一份靜態網站範本可替測試與正式環境建立不同資源；不需要手動把測試bucket名稱複製到每一段設定裡。'],
 ['更新前看它要做什麼','Change set先比較目前stack與新範本，顯示預計新增、修改、移除或替換資源。某些屬性變更不能原地修改，可能建立新資源再移轉。檢視change set與實際執行是不同動作，它也不保證後續一定成功，因為配額、權限或執行時條件仍可能失敗。','若資料庫的變更標示replacement，必須先研究資料如何保留與應用怎麼切換，不能看到自動化工具就直接按執行。'],
 ['把資料生命週期另外設計','刪stack通常會處理其管理資源，但DeletionPolicy等保留設定可以改變行為；保留資源可能繼續計費。備份、還原與資料遷移仍需單獨規劃。手動在控制台改設定也可能造成範本與現況不同，稱為drift，因此應建立變更管理與檢查流程。','實驗範本若將S3設為Retain，刪除stack後bucket仍會留下。開啟版本控制時，還需清理各版本與刪除標記，不能只刪畫面上的目前檔案。']
 ],'公司要在另一個Region重建網站，但原本環境是多人手動累積而成。',[
 '先盤點網路、運算、資料、權限及外部依賴，將可管理資源轉成範本，明確保留人工前置條件。',
 '在測試環境建立stack並驗證輸出、權限、網站功能和故障行為；範本能建立資源不等於應用已可用。',
 '更新時先看change set，特別檢查資料資源的替換與刪除；配合版本控制、備份及還原演練，才把流程用於正式環境。'
 ],'IaC讓環境更可重現、可審查；它把變更寫清楚，沒有消除資料與營運責任。',
 ['Change set顯示資料庫將被替換，接著應怎麼做？',['先確認資料保留、還原與切換方案，再決定是否執行','直接執行，因為change set保證所有資料自動保留','只更改範本檔名就不會替換'],0,['正確。替換是必須評估的資料與停機風險。','預覽變更不代表保證成功或自動保留全部資料。','檔名不會改變資源屬性的更新行為。']]);

add('reference-architecture',
'本課要把分散的服務組合成一個能解釋的網站。先想像訂餐流程：使用者載入菜單、登入、按下訂單、付款，再收到通知。這些工作對速度、正確性與失敗重試的要求不同。把全部工作塞進一台主機最容易理解，但其中任一部分變慢或故障，也可能拖住整個流程。',
'一家餐廳有前台、廚房、帳本與外送。前台快速接單，廚房依工作單處理，帳本保存正式訂單，通知員告知客人。增加前台人數不會自動增加廚房速度；廚房重做一張工作單也不能讓客人被重複扣款。',
'能依資料流說明入口、無狀態運算、交易資料、佇列與背景工作，並指出每個元件故障時誰會接手、哪些資料需要保護。',[
 ['先分開瀏覽與交易','菜單圖片與共用JavaScript可放S3並由CloudFront傳遞，降低後端重複工作。登入與下單是動態請求，經適當入口與應用程式處理；訂單與付款結果要寫入權威資料庫。靜態內容快取與交易正確性不是同一個問題，不能全部套相同快取策略。','一張菜單圖片讓一萬人共用沒有問題；同一網址回傳各人的購物車時，就必須有正確使用者隔離與快取策略。'],
 ['讓運算可替換，資料有歸屬','無狀態應用表示重要session與訂單狀態不只放在某台主機記憶體。ALB可把請求送到健康目標，多AZ部署降低單AZ故障影響，ASG協助維持容量。資料庫則需依交易與可用性要求選擇備援、讀取路徑和備份；主機可重建不代表資料也能隨意丟棄。','某台應用主機壞掉時，另一台仍可讀到使用者購物車；若購物車只存在壞掉主機，入口切換成功仍會讓使用者資料消失。'],
 ['背景工作要容忍重複','寄信、發票與圖片轉換等工作可透過佇列與事件處理，讓下單回應不必等待所有後續工作。重試能提高恢復能力，也可能讓同一工作執行多次，因此需要業務識別與冪等。資料庫已建立訂單但事件尚未送出的故障窗，也需以outbox等模式評估。','以orderId判斷某筆發票是否已產生。不能只因SQS訊息看起來只送一次，就認為外部開票或付款交易永遠不會重複。']
 ],'午餐尖峰下單量暴增，一個AZ故障時仍要接單，而且每張訂單不能重複扣款。',[
 '把共用內容交給CDN，動態應用跨AZ並將必要狀態外置，避免單台主機成為唯一入口或狀態持有者。',
 '付款與訂單保存依交易一致性設計；使用業務唯一識別、條件或交易處理防重，並安排資料層高可用與備份。',
 '耗時後處理進佇列，worker按下游能力擴展，失敗重試有上限並收集到DLQ；同時演練應用、AZ和資料庫故障，而不是只畫正常路徑。'
 ],'架構圖應能回答請求怎麼走、資料放哪、失敗怎麼恢復與重試是否安全，服務名稱只是這些決策的實作工具。',
 ['把所有訂單後處理移到SQS後，還需要解決哪件事？',['重複投遞、消費者失敗與業務冪等','可以取消所有資料庫備份','付款與外部交易會自動永不重複'],0,['正確。佇列解耦後仍須處理失敗與重複副作用。','佇列不取代權威資料的備份。','訊息系統不能包辦任意外部交易的防重。']]);

add('review',
'最後複習不是再背一輪服務名稱，而是確認你能從需求推導架構。考題常把兩個都合理的方案放在一起，差別可能是維運負擔、可中斷性、資料模型、讀取一致性或復原時間。若只記「資料庫選RDS」「全球選CloudFront」，遇到不同限制就會混淆。',
'醫師不是看到發燒就固定開同一種藥，而是先問症狀、病史與限制。架構師也先釐清問題：使用者在等什麼、哪些資料不能丟、故障範圍多大、團隊能管理什麼。服務比較表像工具箱，不是看到關鍵字就自動彈出的唯一答案。',
'能用需求、限制、排除與驗證四步說出答案理由，並知道本站正確率不能換算正式考試尺度分。',[
 ['先把題目翻成可檢查條件','把模糊描述轉成條件：不能停機、可等幾小時、只依ID查資料、已有Kafka程式、必須最低維運。先判斷每個選項是否滿足硬條件，再在合格方案中比較費用與複雜度。最低成本不是允許你忽略資料安全或高可用的指令。','題目要求Windows SMB與既有AD，單看「共享檔案」選EFS就可能忽略必要協定；先保留相容性，再比較合適服務。'],
 ['解釋相似服務解決的不同問題','Multi-AZ常用於可用性，讀取副本用於特定讀取擴展情境，但需辨識部署模式；CloudFront快取HTTP內容，GA提供全球網路入口；SQS分派工作，串流偏向保留事件與重播。理解差別後，題幹改了你也能重新判斷。','題目從「網站圖片下載」改成「UDP遊戲且要固定IP」，即使兩者都有全球使用者，也不能繼續只因全球二字選CDN。'],
 ['把錯題當成具體能力缺口','答錯可能是概念不知道、忽略題幹限制，或多選少選一項。每題寫下正解滿足什麼、錯選違反什麼，再遮住解析用自己的話重講。重做同題提高分數有記憶效應，需要用陌生官方練習情境再驗證。正式考試使用尺度分，720不是本站72%正確率。','看到錯題寫「下次選B」沒有幫助；改寫為「這題需要嚴格順序且發送重試會重複，所以考慮群組排序、去重與消費端冪等」。']
 ],'你在本站模擬考拿到82%，但仍無法說明幾道猜對題目的理由。',[
 '把猜對題也列入複習，避免以總分掩蓋未理解的概念；先找最常犯的限制判讀錯誤。',
 '對每組相似服務畫出資料流與故障行為，回答為何不用另一方案，而不是重背選項位置。',
 '重新核對官方考綱與官方練習資源，以陌生問題驗證；正式政策、時間與證件準備也要以報考頁為準。'
 ],'準備完成的證據是能在新情境中說明取捨，不是只記住本站題庫的答案或某個百分比。',
 ['題目要求最低維運，哪種解法順序較合理？',['先排除不滿足必要條件的方案，再比較維運負擔','一律選最熟悉的服務，不讀其他限制','先挑最便宜的選項，再忽略不符合需求的部分'],0,['正確。目標優化必須建立在滿足硬性需求之上。','熟悉度不是符合題意的證據。','最低成本不會取消其他必要條件。']]);

add('ai-documents',
'AI服務在這裡可以理解成已準備好某種辨識能力的工具。你輸入影像或文字，它回傳辨識結果，不必為每個需求都先訓練自己的模型。但影像、文件版面、文字意義與語言翻譯是不同問題。先說清楚輸入是什麼、想得到什麼輸出，會比背很多名字容易。',
'一份外文發票可能要經過幾位專員：掃描員把紙上的內容讀出來，文件專員保留欄位與表格，語言專員翻譯文字，分析員再判斷內容主題。某位專員能處理文字，不代表他同時擅長所有影像與語意工作。',
'能依影像標籤、文件文字與表格、文字語意、翻譯四種輸入輸出需求，比較Rekognition、Textract、Comprehend與Translate。',[
 ['先問影像裡要找什麼','Rekognition偏向影像或影片中的物件、場景等支援分析；Textract則著重文件中的文字與支援的結構化資訊，例如表格與表單。OCR是把畫面上的字轉成可處理文字的概念；需要發票欄位位置與表格結構時，不能只得到一串文字就當成完成。','要知道照片是否包含車輛，可比較Rekognition；要讀掃描報表的欄位與金額，應先看Textract適用功能，而不是期待物件標籤理解帳務表格。'],
 ['讀出字之後，還有不同語言工作','Comprehend處理支援的文字語意分析，例如實體、情緒或主題相關能力；Translate做支援語言之間的機器翻譯。翻譯不等於資料正確性驗證，情緒分析也不能保證理解所有反諷、專業術語或法律意義，結果需要依業務風險安排人工覆核。','客服信件已有可複製文字，要判斷客戶提到的產品與情緒，不需先把文字截圖做OCR；外文信件要轉成中文則是另一個翻譯步驟。'],
 ['將辨識結果當成有不確定性的資料','辨識可能回傳信心分數或支援的結果結構；低信心、特殊版面及不支援語言應有例外流程。輸入若含個資，需要設計存取、保留、加密與人工操作權限。不要只因服務託管，就認為內容一定正確或資料可以無限制公開。','發票金額辨識為1000但信心偏低時，應送人工核對而非立即付款；保留來源頁與辨識版本，方便追查錯誤從哪個步驟產生。']
 ],'公司收到多國掃描發票，要提取供應商與金額，轉成中文說明，再供財務確認。',[
 '輸入是掃描文件，不是已整理文字，先評估Textract對該版面與語言的支援，取得文字及欄位結構。',
 '需要翻譯的描述送Translate，但金額、稅額和供應商識別仍依業務規則驗證，不能以翻譯成功代表帳務正確。',
 '對低信心或不符合規則的結果安排人工覆核，原始文件與結果採最小存取權限及明確保留政策。'
 ],'AI選型先看輸入和輸出，再把辨識、翻譯、資料驗證與人工覆核連成完整流程。',
 ['掃描文件需要保留表格與欄位，先比較哪個服務？',['Textract','只用Translate就能讀出影像表格','用CloudFront快取圖片就會產生欄位'],0,['正確。這是文件文字與結構擷取的比較方向。','翻譯服務不是一般文件影像擷取器。','CDN傳遞影像，不會理解其欄位。']]);

add('ai-speech-models',
'聲音、文字與對話看起來都和語言有關，但輸入輸出不同。Transcribe把語音轉成文字；Polly把文字合成語音；Lex協助建立能辨識意圖與收集必要資訊的對話介面。若需求需要自行準備資料、訓練與部署模型，才進一步評估SageMaker AI等模型開發能力。',
'把流程想成客服中心：速記員把客戶錄音寫成逐字稿，播報員把文字讀出，接待員依對話收集要訂的時間與人數。自建模型團隊則像培訓一位專門處理特殊資料的新專員，需要教材、評估與持續管理，工作量不只是打一通電話。',
'能用輸入輸出分辨語音轉文字、文字轉語音、對話管理與自行訓練模型，並知道AI模型部署後仍需監控品質。',[
 ['聲音與文字的轉換方向要清楚','一段錄音送進Transcribe，得到支援的轉錄文字；一段文字送進Polly，得到合成語音。轉錄不是翻譯，文字轉語音也不是理解客戶意圖。支援語言、串流或批次、說話者與音訊格式等條件要逐項核對，不能因服務都處理聲音就視為相同。','客服錄音要搜尋關鍵字，先轉錄成文字；把文章讀給視障使用者聽，則是文字轉語音。兩者方向剛好相反。'],
 ['對話要有意圖與缺漏資訊','Lex的對話設計可以包含意圖與slots。意圖是使用者想做什麼，例如訂位；slot是完成該意圖必須收集的資料，例如日期、人數。後端仍需驗證餐廳有空位並寫入系統。辨識使用者說要訂位，不等於已成功建立真實訂單。','使用者說「明晚訂四位」，系統仍可能需要詢問時間與聯絡方式，再呼叫後端確認，而不是直接假設任何餐廳都能接受。'],
 ['自訂模型有完整生命週期','當現成服務無法滿足特定資料或準確度需求，可比較SageMaker AI的資料準備、訓練與推論等能力。訓練是學出模型，推論是用模型對新輸入產生結果；模型可能隨資料分布改變而變差，需要評估、版本、監控與回復策略。','工廠特殊瑕疵照片若需自行訓練，不能只開一個推論端點就宣稱模型完成；要有標註資料、測試集與可接受錯誤標準。']
 ],'旅行社想把電話錄音變成逐字稿、提供語音答覆，並引導客人輸入出發日與人數。',[
 '先用Transcribe處理支援的錄音轉文字，對低品質音訊與重要欄位設計確認流程，避免誤聽直接變成錯誤訂單。',
 '對話介面收集出發日、人數等slots，後端驗證行程庫存；Polly可把核對後的文字答覆合成聲音。',
 '只有當專門辨識需求超出現成服務時才評估自訂模型，並計入標註、訓練、推論與品質維護成本。'
 ],'先把整個語音流程拆成轉錄、對話、業務處理與播報，再決定每一步是否需要現成服務或自訂模型。',
 ['希望把文章朗讀成聲音，應先比較什麼？',['Polly的文字轉語音能力','Transcribe，因為它把錄音轉成文字','只建立DynamoDB表就會自動朗讀'],0,['正確。輸入是文字，輸出是語音。','這個服務的主要轉換方向相反。','資料儲存不提供朗讀能力。']]);

add('integration-migration',
'企業可能已經有大量使用特定訊息協定的程式。搬到AWS時，問題不只是「哪個新服務最好」，還包括「能否少改程式、是否維持原本的訊息語意」。Amazon MQ、MSK與AppFlow分別面向訊息代理、Kafka串流生態及支援的SaaS資料整合，不應只因都能搬資料就互換。',
'一家工廠已有固定規格的插頭和輸送帶。換設備時，若插頭協定不合，機器就不能直接接上。受管服務可以替你維護一部分設備，但不代表它能自動翻譯所有插頭、改寫所有工序，或保證原本順序與重試規則完全不變。',
'能把相容性、資料流語意與維運負擔分開比較，知道何時保留既有協定、何時改成雲端原生方式才值得。',[
 ['先辨認既有程式依賴什麼','Amazon MQ提供支援的訊息代理引擎，常用於已有相容訊息API或協定的應用。SQS是另一種受管佇列模型，通常需要以其API整合。若題目強調不大幅修改既有ActiveMQ或RabbitMQ應用，必須先核對MQ的相容能力，而不是僅因SQS較熟悉就直接替換。','訂單系統已使用支援的JMS模式與代理設定，遷移時先測試MQ相容性、連線與故障語意，避免把端點改名就當成程式一定相容。'],
 ['Kafka串流要保留哪些語意','MSK提供受管Kafka能力，適合依賴Kafka協定、工具、topics與consumer groups的工作負載。Topic可以理解為分類的事件紀錄，consumer group協調消費進度。分區、保留期、offset與相容版本仍需設計；託管不代表所有叢集與應用責任都消失。','已有Kafka分析程式要讀歷史事件並沿用工具，可比較MSK；若改用工作佇列，需重新評估重播與消費模型，而不是只測能送一筆訊息。'],
 ['SaaS資料搬運不一定要自建代理','AppFlow支援特定SaaS與AWS間的資料流程，可依支援功能規劃排程、欄位對應與傳輸。它適合「把來源資料帶到目的地」的整合需求，不是替代所有即時訊息代理或任意自訂協定。核對connector、資料量、錯誤處理和增量方式後再決定。','每天從支援的CRM匯入S3供報表分析，可評估AppFlow；不要只為這個需求先管理整套Kafka叢集與自建連接程式。']
 ],'公司有既有RabbitMQ訂單程式、Kafka點擊串流，另需每天搬支援CRM的資料到S3。',[
 '分別盤點三條流程，不以一個服務硬接全部：第一條重視訊息代理相容，第二條重視Kafka生態，第三條重視SaaS資料連接。',
 '對代理與Kafka工作負載做相容性、排序、重試、保留與故障測試，確認轉移後應用行為仍符合原契約。',
 'CRM流程核對AppFlow的支援連接與增量能力，加入資料驗證與失敗重試，避免把資料已傳送當成報表一定正確。'
 ],'保留相容性可能減少遷移改寫，但每項服務仍要核對語意與責任；最低維運不是忽略既有契約。',
 ['既有Kafka消費者需沿用協定與重播模型，應優先比較？',['MSK與其Kafka相容條件','把所有程式直接指向SQS且完全不改','只用AppFlow就能替代任何Kafka consumer group'],0,['正確。既有協定與生態是主要限制。','不同API與模型通常需要整合修改。','SaaS資料流程不是通用Kafka替代品。']]);

add('hybrid-dns-directory',
'人通常使用主機名稱，例如db.corp.example，電腦連線則需要IP位址。DNS負責把名稱換成可連的位址。公司機房與AWS可能各自管理私有名稱，因此網路線路連好後，還得安排查詢該往哪裡送。登入目錄則保存使用者與群組等資訊，它依賴DNS與網路，但不等於DNS本身。',
'DNS像通訊錄查詢櫃台：機房的人要找AWS內部地址，就把問題送到AWS入口；AWS要找機房地址，就從AWS出口把問題轉送出去。Directory Service則像員工身分名冊，告訴支援的系統誰是員工，不能因地址找到了就當成已通過登入。',
'能以「查詢從哪裡來、要去哪裡」分清Resolver inbound/outbound，並區分受管AD、AD Connector與多帳號登入治理。',[
 ['把DNS的查詢方向畫出來','Route 53 Resolver的inbound endpoint接受從外部網路進入AWS的DNS查詢；outbound endpoint把AWS中符合轉送規則的查詢送往外部DNS。方向以AWS/VPC為基準，不是以使用者站的位置隨意命名。查詢有路徑、回程與必要的安全規則才會成功。','機房工程師找AWS私有服務：機房DNS轉送至inbound。AWS應用找機房db.corp.example：套用rule經outbound送往機房DNS。'],
 ['私有區域與轉送規則工作不同','Private hosted zone保存一組私有網域紀錄，並和需要使用它的VPC關聯；forwarding rule則說明某個網域應交給別的DNS伺服器回答。VPN或DX提供網路路徑，不會自動知道所有私有網域該找誰。錯誤的雙向轉送還可能讓查詢繞圈。','機房DNS把corp.example交回AWS，AWS又把同網域全交回機房，就可能形成迴圈；要明確分配誰擁有哪段名稱的權威答案。'],
 ['目錄驗證要看依賴還在哪裡','Managed Microsoft AD提供受管AD相關能力；AD Connector主要代理支援服務對既有AD的驗證，不會自動變成一套不依賴機房的完整目錄副本。Identity Center偏向員工登入多個AWS帳號的集中治理。選擇時要看現有網域、信任、支援服務與中斷情境。','如果登入仍透過Connector回機房，機房或線路故障時新登入可能受影響；不能因Connector部署在雲端就宣稱身分系統已完全脫離機房。']
 ],'AWS應用需用機房資料庫名稱，機房工程師又要用名稱連AWS私有服務。',[
 '列出機房與AWS各自擁有的私有網域，確認真正回答紀錄的DNS伺服器，以及兩邊的網路路由。',
 'AWS查機房網域使用適當outbound與rule，機房查AWS網域使用inbound入口；同時檢查防火牆、端點安全與回程。',
 '測試主線路失效後的名稱解析與目錄登入，避免只驗證IP連得通，卻忽略依賴DNS和AD的應用仍然失敗。'
 ],'混合環境應分別驗證網路、名稱解析和身分驗證；其中一層成功，不會自動使其餘兩層成功。',
 ['AWS應用要查機房管理的corp.example，DNS轉送方向是？',['透過適當outbound endpoint與規則送往機房DNS','一定使用inbound，因為應用要輸入名稱','不需DNS，只要VPN存在名稱就自動互通'],0,['正確。查詢從AWS送出，使用outbound方向。','inbound是外部送入AWS的查詢方向。','網路連線不會自動建立私有名稱的轉送規則。']]);

add('resource-sharing',
'多帳號架構中，共享資源、建立網路連線與授予資料權限是不同動作。AWS RAM讓擁有者分享支援的資源，例如符合條件的子網路；PrivateLink則讓別人的VPC以私有入口使用某個服務。你需要先說清楚要分享的是「基礎資源的使用機會」，還是「一個服務的存取入口」。',
'共享辦公大樓不代表大家能打開彼此保險櫃。中央團隊可提供樓層與走道，租戶管理自己的設備；提供商也可以只開一個服務窗口，讓客戶辦事，而不讓客戶逛完整個後台。這就是共享網路基礎與只暴露特定服務的差別。',
'能比較RAM共享子網路、PrivateLink服務入口、peering及TGW路由互通，並說出擁有者和參與者各負什麼責任。',[
 ['資源共享有支援清單和界線','RAM不是任何AWS資源都能共用的萬用按鈕。每個支援資源有自己的共享對象、權限與限制。分享後，資源擁有者與使用者的責任並不全部合併；IAM與資源本身政策仍可能限制實際操作。先檢查資源類型，再問跨帳號或組織條件。','中央網路團隊分享子網路，產品帳號可在支援條件下放自己的工作負載；這不表示產品團隊取得修改中央VPC所有路由的管理權。'],
 ['共享VPC讓網路集中、應用分治','共享VPC子網路的擁有者管理網路配置，參與帳號管理自己建立的支援資源。這可以減少每個產品帳號重複建網路，但也要建立共同的位址規劃、安全責任與維運流程。共享的前提與可操作範圍要依官方限制核對。','網路團隊統一安排CIDR與對外路徑，產品團隊維護自己的應用主機；若路由有問題，應找正確擁有者處理，而不是假設每個帳號都有權直接改。'],
 ['只要一項服務時，不一定打通全網','PrivateLink以interface endpoint等支援方式提供私有服務入口。提供方常使用NLB支援的endpoint service；消費方在自己的網路使用私有端點。它不是一般全網路由互通，與peering或TGW的目的不同。允許連接、端點安全與應用登入也不是同一層授權。','客戶只需查供應商的風控API，沒必要讓雙方所有子網互通；可以評估PrivateLink，再由API本身驗證客戶與資料權限。']
 ],'公司有中央網路帳號與十個產品帳號，另有外部合作夥伴只需呼叫風控API。',[
 '內部共享子網路需求可評估RAM與共享VPC，維持中央管理網路、各產品管理自身應用的界線。',
 '外部夥伴只需要一項服務，先評估PrivateLink的服務入口，不把整個企業網段都暴露給對方。',
 '分別檢查共享設定、端點連接接受、安全群組與應用授權，確保能連到服務不代表能讀取所有客戶資料。'
 ],'共享架構的目標是精確給出需要的能力，而非把帳號、網路與權限一口氣混在一起。',
 ['合作夥伴只需私有存取一個API，不需全網互通，應先比較？',['PrivateLink服務入口與應用授權','為對方開放所有子網路由與全部資料','使用RAM後就能忽略所有IAM和服務權限'],0,['正確。服務導向入口符合縮小暴露範圍的需求。','比需求更廣的互通會增加暴露與管理負擔。','資源共享不會取消所有授權層。']]);

add('s3-advanced',

 {title:'訊息與事件：解耦方式不一樣',headers:['服務','資料流模型','設計注意'],rows:[['SQS Standard','工作佇列、消費者競爭處理','至少一次、盡力排序；用冪等、防重與 DLQ。'],['SQS FIFO','依 message group 保序、送入去重','去重有時間窗；消費者失敗重試仍需業務冪等。'],['SNS','一則發布到多個訂閱者','持久緩衝通常搭配每個訂閱者自己的 SQS。'],['EventBridge','事件匯流排、內容規則、跨服務整合','適合事件路由；需規畫 retry、DLQ、archive/replay。'],['Kinesis Data Streams','分區有序串流、多消費者、重讀','以 partition key 保持同 shard 順序；規畫容量和熱 key。'],['Step Functions','狀態機、重試、分支、長時間工作流','負責流程協調；不以 Lambda 不斷輪詢來硬湊工作流。']]},

 {title:'災難復原策略',headers:['策略','復原方式','相對成本／時間'],rows:[['Backup and restore','從備份建立資料與運算環境','平時成本較低；通常復原較久，必須測試可還原性。'],['Pilot light','核心資料持續複寫，災難時建立其餘堆疊','比完整待命省資源；接流量前還有部署／啟動工作。'],['Warm standby','縮小但完整且運作中的環境，災難時擴容','較高固定成本，通常更短 RTO。'],['Multi-site active/active','多區域皆持續服務，故障時剩餘區域承接','成本與資料一致性最複雜；需預留承接容量。']]},
 {title:'S3 儲存類別與生命週期',headers:['類別','適合資料','費用／存取注意'],rows:[['S3 Standard','頻繁存取、未知模式、新資料','多 AZ；不為了單價最低就忽略請求與傳輸成本。'],['S3 Intelligent-Tiering','存取模式未知／改變的物件','監控與自動分層；選用封存層會改變取回方式。'],['Standard-IA','較少存取但需毫秒讀取、多 AZ','取回費、最低儲存天數與物件大小計費。'],['One Zone-IA','可重建、較少讀取的次要副本','單一 AZ，不能作不可重建資料的唯一副本。'],['Glacier Instant Retrieval','很少讀取但需要毫秒存取','最低儲存期及取回費；與 Flexible 的還原不同。'],['Glacier Flexible / Deep Archive','長期封存，可等待還原','還原時間依選項與類別不同；不能假定立即可 GET。']]},
 {title:'運算選型與計費',headers:['選項','適合需求','主要取捨'],rows:[['Lambda','事件驅動短任務、變動流量','執行時間、並行、封裝與初始化限制；不是無限長背景主機。'],['ECS on Fargate','容器服務、免管理節點','指定 CPU/記憶體；長期負載要比較成本。'],['ECS / EKS on EC2','容器且需主機控制、GPU、特殊配置','管理節點、補丁與容量；EKS 額外有 Kubernetes 複雜度。'],['On-Demand','短期不可預測且不能中斷','無用量承諾；通常較高單位價格。'],['Savings Plans / RI','穩定可預測基礎用量','承諾期限、適用範圍；折扣不等於所有情況都有容量保留。'],['Spot','可中斷批次、分散式工作、可重試任務','需處理回收；搭配多 instance types 與容量策略。']]},
 {title:'可觀測性與治理',headers:['服務','回答的問題','常見考點'],rows:[['CloudWatch','系統現在運作如何？','Metrics、Logs、Alarms；EC2 記憶體／OS 指標通常需 agent。'],['CloudTrail','誰在什麼時候呼叫哪個 API？','管理事件與資料事件範圍不同，S3 object events 需特別設定。'],['AWS Config','資源設定是否合規、何時改變？','追蹤配置與 rules；不是應用程式 log 分析。'],['GuardDuty','是否有可疑活動與威脅？','偵測並產生 findings；不是直接替你設定封鎖規則。'],['Inspector','工作負載有哪些弱點？','針對支援 EC2、容器映像等弱點掃描。'],['Macie','S3 裡是否有敏感資料？','資料發現與分類；不是防止所有外洩的即時防火牆。']]}
];
window.LABS=[
 {id:'identity',title:'01 · 用 IAM role 取代寫死的金鑰',level:'入門',time:'35 分鐘',goal:'讓 EC2 只讀取指定 S3 prefix，理解 role、instance profile 與最小權限。',cost:'EC2、儲存及請求可能計費。使用測試帳號與最小資源，不假設一定有 Free Tier。',steps:['建立私有測試 bucket，啟用 Block Public Access，上傳 allowed/a.txt 與 denied/b.txt。','建立信任 ec2.amazonaws.com 的 role，僅給 s3:GetObject 到 bucket/allowed/*；若要列清單，另外限縮 s3:ListBucket 的 prefix 條件。','透過 instance profile 將 role 指派 EC2；以 Systems Manager Session Manager 連線，避免為此開放 SSH。Session Manager 需要 agent、對應 role 權限與網路連線。','在主機用 AWS CLI 讀取 allowed/a.txt，應成功；讀取 denied/b.txt，應 AccessDenied。執行 aws sts get-caller-identity，確認是 assumed role。','移除 instance profile 後考慮臨時憑證快取與到期，不能以瞬間是否失敗當唯一驗證。記下為何不該建立 IAM user access key。'],verify:['允許的物件成功讀取，其他 prefix 被拒絕','主機沒有手動存放長期 AWS access keys'],cleanup:'終止 EC2、刪除測試物件與 bucket，再移除 role／instance profile 和測試專用 policies。',source:'https://docs.aws.amazon.com/IAM/latest/UserGuide/id_roles_use_switch-role-ec2.html'},
 {id:'s3',title:'02 · S3 版本、生命週期與誤刪還原',level:'入門',time:'30 分鐘',goal:'親自理解版本控制、delete marker 與 noncurrent version 的成本。',cost:'多個版本、請求與儲存均可能計費。實驗不將資料轉入有最低儲存期的封存類別。',steps:['建立全新私有 bucket，開啟 versioning。上傳 note.txt v1，再以同 key 上傳 v2。','查看 Versions，保存兩個 version ID。下載舊版本，確認內容不同。','刪除物件而不指定 version ID。觀察一般 GET 看不到物件，Versions 仍能看到 delete marker 與舊版本。','刪除 delete marker（只在測試資料），再次 GET 應能讀取目前版本。','設計一條只套用 lab/ prefix 的 lifecycle 規則，在紙上比較 current expiration 與 noncurrent version expiration；理解生命週期不是即時排程工作。'],verify:['能解釋刪除標記與永久刪除特定版本的差異','能列出所有版本與刪除標記'],cleanup:'刪除所有 versions 與 delete markers，確認 bucket 空後刪除 bucket。只刪目前版本會留下計費資料。',source:'https://docs.aws.amazon.com/AmazonS3/latest/userguide/Versioning.html'},
 {id:'network',title:'03 · 畫出並驗證 VPC 封包路徑',level:'核心',time:'50 分鐘',goal:'區分 public route、private route、SG 與 NACL，透過 route table 追蹤封包。',cost:'EC2、公有 IPv4、NAT gateway 等可能計費；不需實際建立 NAT 也能完成路由設計部分。',steps:['建立 VPC 10.20.0.0/16，兩個不同 AZ 各一個 public 與 private subnet，確認 CIDR 不重疊。','掛載 Internet Gateway，僅 public route table 放 0.0.0.0/0 → IGW。將正確子網關聯各自路由表。','畫出 private EC2 訪問網際網路的路徑：EC2 → 私有路由表 → public NAT → IGW；如果採購 NAT，先核對區域支援的部署型態與費率。','建立 SG，只允許應用需要的連線；以 NACL 範例分析為何回程 ephemeral ports 也需允許。不要對正式系統嘗試阻斷。','啟用 VPC Flow Logs 到 CloudWatch Logs 或 S3，觀察 ACCEPT／REJECT；以 Reachability Analyzer 的結果對照配置，區分配置分析與實際封包測試。'],verify:['能解釋公有子網的 EC2 為何仍需公開 IP 或 IPv6 才能直接出網','能從路由、SG、NACL 三層定位不通原因'],cleanup:'刪除實驗 EC2、NAT／EIP、endpoints、Flow Logs 及其 log group，再刪子網、IGW 與 VPC。',source:'https://docs.aws.amazon.com/vpc/latest/userguide/VPC_Scenario2.html'},
 {id:'endpoint',title:'04 · 用 Gateway endpoint 私有讀取 S3',level:'核心',time:'40 分鐘',goal:'不經 NAT 存取 S3，理解 endpoint policy、bucket policy 與 IAM 的交集。',cost:'S3 gateway endpoint 本身不計費；EC2、請求及跨區域資料路徑等另計。',steps:['使用含 IAM role 的私有 EC2 與同區域 S3 bucket，先確保管理連線可使用，避免把自己的維運路徑切斷。','建立 S3 gateway endpoint，關聯 EC2 所在子網路由表，檢查出現 S3 prefix list route。','先使用預設 endpoint policy 驗證可存取測試物件，再將 endpoint policy 縮限到測試 bucket。','比較三個案例：IAM 不允許、endpoint 不允許、bucket explicit deny。記下任何明確 Deny 都可能導致 AccessDenied。','在紙上設計限制 aws:SourceVpce 的 bucket policy，列出必須保留的管理及 AWS 服務存取例外，再決定是否在測試桶實際套用。'],verify:['路由表存在 endpoint 路由','能說明 endpoint 並不替代身份驗證與授權'],cleanup:'還原或刪除實驗 bucket policy、刪除 endpoint、EC2 和 bucket。',source:'https://docs.aws.amazon.com/vpc/latest/privatelink/vpc-endpoints-s3.html'},
 {id:'asg',title:'05 · ALB 與 Auto Scaling 的故障演練',level:'核心',time:'60 分鐘',goal:'在兩個 AZ 提供無狀態網站，以 target health 和 ASG 驗證自我修復。',cost:'ALB、至少兩台 EC2、IPv4 與流量會計費；完成後當日清理。',steps:['建立 launch template，啟動時回傳主機 ID 的簡單 HTTP 頁面；不要在 user data 寫秘密。','建立跨兩 AZ 的 ASG，desired=2、min=2、max=4。建立 target group 及 ALB listener。','配置 ALB SG 接收測試用 HTTP／HTTPS，應用 SG 僅允許 ALB SG；設定健康檢查 path 與 grace period。','連續請求 ALB 觀察不同主機回應。終止其中一台測試主機，觀察健康目標變化與 ASG 補回。','設定 target tracking 的目標值並解釋 cooldown／warmup；不進行無限制壓測。判斷是否需要 session 外置與跨 AZ 資料存取。'],verify:['停掉一台後網站仍能由另一台服務','ASG 能自動補足 desired capacity'],cleanup:'先移除 ASG 或將 desired/min 調為0並刪除，再刪 ALB、target group、launch template 與測試網路。',source:'https://docs.aws.amazon.com/autoscaling/ec2/userguide/attach-load-balancer-asg.html'},
 {id:'queue',title:'06 · SQS 重試、Visibility timeout 與 DLQ',level:'核心',time:'40 分鐘',goal:'看到同一則訊息因未刪除而重新出現，理解至少一次與冪等。',cost:'SQS API 請求可能計費，僅使用數則測試訊息。',steps:['建立 Standard queue 與同類型 DLQ，設定 redrive maxReceiveCount=3，visibility timeout 使用短但可觀察的值。','送入含 orderId 的 JSON 訊息，ReceiveMessage 後不 DeleteMessage。等待可見性逾時，觀察訊息再次出現。','多次接收卻不刪除，驗證訊息在重試門檻後移入 DLQ；實際輪詢與可見性會影響觀察時間。','模擬成功處理：以 receipt handle 刪除訊息。記下 message ID 與每次 receipt handle 的用途差異。','設計一張以 orderId 為 key 的冪等表，討論「先標完成還是先執行付款」的故障窗，認識條件寫入與交易需求。'],verify:['能展示未刪除訊息重現','能找到 DLQ 中失敗訊息並說明修復後 redrive 的時機'],cleanup:'刪除來源 queue 與 DLQ，確認沒有測試 Lambda 或事件來源對應持續輪詢。',source:'https://docs.aws.amazon.com/AWSSimpleQueueService/latest/SQSDeveloperGuide/sqs-visibility-timeout.html'},
 {id:'lambda',title:'07 · Lambda + DynamoDB 條件寫入 API',level:'核心',time:'60 分鐘',goal:'建立具有冪等鍵的訂單 API，將身份權限與使用者驗證分開。',cost:'API Gateway、Lambda、DynamoDB 與 CloudWatch Logs 可能計費；限制請求次數與並行。',steps:['建立 DynamoDB on-demand 測試表，partition key 為 orderId。','建立 Lambda execution role，只給該表需要的 PutItem/GetItem 與自己的 log 權限。','函式解析 orderId，以 attribute_not_exists(orderId) 的條件寫入。首次建立回201，重複鍵回409或相同結果，依 API 契約決定。','建立 API Gateway HTTP API 並加上適當授權；若暫時測試公開端點，不放任何個資並限制節流。透過 Lambda resource policy 允許指定 API 呼叫。','測試缺漏欄位、合法建立、重複建立與查詢；查看 CloudWatch Logs，避免記錄完整秘密。'],verify:['相同 orderId 不會產生兩筆獨立訂單','未授權使用者被拒絕，函式只能操作指定表'],cleanup:'刪除 API、Lambda、table、log group 與測試專用 IAM role。',source:'https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/Expressions.ConditionExpressions.html'},
 {id:'athena',title:'08 · 用 Athena 看見掃描量的差異',level:'進階',time:'45 分鐘',goal:'以小型 CSV 和 Parquet 比較欄式格式與分區過濾，建立成本直覺。',cost:'Athena 依查詢掃描量等模式計費；S3／Glue 另計。先設 workgroup 掃描上限，只用小資料。',steps:['在 S3 建立數個日期 prefix 的小型虛構交易資料，不含個資。建立專用查詢結果 bucket/prefix。','建立 Athena workgroup，設定查詢結果位置與每次查詢資料使用控制。','用 SQL 定義 external table，將日期作 partition key；登錄 partitions。','查詢相同結果，分別不加日期與加入 partition filter，觀察 query stats 的 scanned bytes。','利用 CTAS 產生 Parquet 並只 SELECT 所需欄位，對比 CSV 的掃描量。說明小檔案太多為何也會損害效能。'],verify:['能出示查詢結果一致且掃描量不同的紀錄','能說明 Glue Catalog 的 metadata 與 S3 實際資料的差異'],cleanup:'DROP TABLE 不一定刪除 S3 資料；另外刪來源、CTAS 輸出、查詢結果與 Glue table/database/workgroup。',source:'https://docs.aws.amazon.com/athena/latest/ug/performance-tuning-data-optimization-techniques.html'},
 {id:'dr',title:'09 · 用桌上演練設計災難復原',level:'進階',time:'50 分鐘',goal:'以RTO 1小時、RPO 15分鐘的虛構需求設計可驗證 runbook，不建立昂貴跨區域資源。',cost:'紙上演練無 AWS 資源費；若實際部署跨區域備份、資料傳輸與待命資源會計費。',steps:['列出應用、資料庫、物件、秘密、憑證、DNS 與第三方依賴。定義災難範圍是 AZ 還是整個 Region。','比較 backup/restore、pilot light、warm standby，選一個可滿足目標的候選方案並列假設。','列出每一步預估時間：偵測、核准、還原、部署、資料驗證、DNS 切換、客戶驗證。總和必須包含等待與重試。','列出資料複寫延遲與備份間隔，模擬在最後一次備份後發生故障，計算可能遺失的時間窗。','寫回切與 split-brain 防護流程；檢查備援 Region quotas、IAM、KMS grants 與 IaC 是否可用。安排定期還原測試。'],verify:['RTO/RPO 是測試得到的結果，不是服務名稱的保證','能說明何時停止舊主站寫入、誰有權啟動切換'],cleanup:'保留版本化 runbook 與演練紀錄；若有試建資源，清理兩個區域的備份、快照、DNS 測試記錄與運算。',source:'https://docs.aws.amazon.com/whitepapers/latest/disaster-recovery-workloads-on-aws/disaster-recovery-options-in-the-cloud.html'},
 {id:'capstone',title:'10 · 畢業專題：為這個學習網站設計 AWS 部署',level:'綜合',time:'90 分鐘',goal:'以此靜態網站為真實素材，完成安全、快取、發版與成本評估。',cost:'S3、CloudFront、Route 53、domain、WAF 等各自計費；WAF 不是靜態實驗的必要條件。先用 Pricing Calculator 預估。',steps:['畫出 Route53 → CloudFront → 私有 S3 REST origin。列出 HTTPS、OAC、Block Public Access 與最小 bucket policy。','將 dist/ 的檔案上傳測試 bucket；建立 CloudFront OAC 並將 bucket policy 限制該 distribution。不要用 website endpoint 當 OAC origin。','使用 CloudFront 預設網址測試 index.html、CSS、JS 與 hash routing；本網站 hash 路由不需將每個課程映射成 S3 檔案。','為 HTML 與 assets 設計不同 Cache-Control，評估部署時 invalidation 或檔名版本化。不要公開學習紀錄備份檔。','使用日誌／監控驗證錯誤，測試 S3 物件 URL 直接存取被拒絕、CloudFront URL 成功。寫出回復前版本步驟並估算月流量成本。'],verify:['從 CloudFront 可完整上課與測驗，直接 S3 URL 被拒絕','能說明學習紀錄只存在瀏覽器，換裝置要匯出／匯入'],cleanup:'先停用並刪除測試 distribution（需等待流程），再刪 OAC、測試 bucket 全部版本與物件、DNS 和其他付費資源。',source:'https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/private-content-restricting-access-to-s3.html'}
];
window.STUDY_PLAN=[
 {week:1,title:'建立雲端與網路地圖',focus:'基礎、IAM、VPC 與 S3',tasks:['每天60–90分鐘，先讀基礎課，再畫出Region/AZ/VPC/Subnet關係。','完成IAM role、S3版本控制與VPC封包路徑三個實作。','每天做10題安全練習；將猜中的題目也記下原因。'],checkpoint:'不查筆記，解釋 IAM role、SG/NACL、public/private subnet 與 S3 versioning。'},

 add('secrets-manager',
 '網站連到資料庫時，常需要證明自己有權連線。若把資料庫密碼直接寫在程式裡，每個拿到原始碼的人都可能看見；換密碼時又要找出所有程式一一修改。先把「程式怎麼運作」和「它使用的敏感值」分開，才容易控制誰可以取得密碼。',
 'Secrets Manager是集中保管這些敏感值的服務。敏感值可以是資料庫密碼或外部網站的存取祕密。應用程式執行時，用自己的IAM角色向服務讀取被允許的那一份值，而不是使用某位工程師寫進檔案的長期金鑰。',
 '集中保存能減少密碼散落的地方，並讓讀取權限與使用紀錄有共同管理入口。它不是替應用程式判斷所有資料庫操作是否合法，也不保證放進去的任何密碼都會自行更新。',
 [['先建立一份受控的祕密','把資料庫帳號和密碼保存成一個secret，僅授權需要連線的應用角色讀取。祕密本身有名稱與版本，應用不應因為名字猜得出來就能取得內容。'],['執行時取得而非複製散布','程式啟動或需要時呼叫讀取介面，取得目前版本後建立資料庫連線。為減少延遲與請求費用可以適當快取，但不得把值輸出到公開日誌或錯誤畫面。'],['輪替是整套協調流程','輪替要讓資料庫接受新密碼、保存新版本，並讓應用更新連線。需使用相應支援的整合或自訂流程；只改保管櫃內的文字，不會神奇地改掉外部系統的密碼。']],
 '購物網站有三份應用，都要連到同一個訂單資料庫，安全團隊要求定期換密碼。',
 ['把連線祕密集中保存，只允許網站執行角色讀取。','配置適合資料庫的輪替流程，先在測試環境確認新舊連線切換。','讓應用有快取到期與重新取得祕密的機制，監控輪替後是否連線失敗。'],
 '換密碼不再需要把值手動貼到三份程式碼，但應用仍必須能處理憑證改變。',
 [['Parameter Store','Parameter Store也能保存設定及受加密的敏感值；需要整合輪替和祕密生命週期時，再比較Secrets Manager的能力與費用。']],['iam-role','kms','rds'],'把密碼移到Secrets Manager後，是否可以把它印在日誌裡排查問題？','不可以。保管位置集中不代表取出後就能公開；日誌也要避免洩漏祕密。');
 add('acm',
 '瀏覽器連到網站時，不只需要資料保密，也要確認對面真的是想拜訪的網站。HTTPS中的憑證用來把網域名稱和網站持有的金鑰連結起來。你可以先把它理解成有簽發者背書的網站身分資料，而不是一串讓所有檔案都自動加密的密碼。',
 'ACM是AWS Certificate Manager，協助申請、保存和更新支援情境中的數位憑證，並把憑證接到ALB或CloudFront等服務。瀏覽器和這個入口建立受保護連線後，後續入口到應用或資料庫是否加密仍要另外決定。',
 '手動追蹤憑證到期容易忘記，過期會讓使用者看到安全警告或無法連線。ACM減少部分管理工作，但網域驗證、服務整合、區域及更新條件仍要符合要求。',
 [['證明你能控制網域','申請example.com的憑證時，需完成支援的網域驗證。常見做法是在DNS加入指定記錄，證明你能管理這個名稱；知道網域拼法並不足以取得有效憑證。'],['把憑證裝在真正的入口','在ALB的HTTPS listener或CloudFront分發設定中選用合適憑證。憑證名稱需涵蓋使用者輸入的網域；不能用不相干名稱的憑證期待瀏覽器接受。'],['繼續檢查後半段連線','入口完成TLS不表示後端傳輸也受保護。依需求設定入口到來源使用HTTPS、驗證來源憑證，並確認自動續期所需的驗證與服務關聯仍存在。']],
 '網站改成https://shop.example.com後，使用者仍收到憑證名稱不符警告。',
 ['確認入口實際出示的憑證，而不是只看ACM清單裡有沒有一張憑證。','確認憑證包含shop.example.com，並檢查DNS是否指到正確入口。','修正listener或分發關聯後重新測試，再記錄續期與監控方式。'],
 '憑證解決網站身分與TLS連線的一部分，不會替代資料庫權限或磁碟靜態加密。',
 [['KMS','KMS主要管理保護資料的加密金鑰；ACM主要管理TLS憑證。兩者處理的對象與整合流程不同。']],['https','tls','dns'],'有ACM憑證就代表S3裡所有檔案都被該憑證加密嗎？','不是。TLS憑證支援通訊保護；儲存資料的加密是另外的機制。');
 add('ec2',
 '先想像一個訂餐網站的處理程式：它收到餐點編號，檢查庫存，算出金額，再交回結果。這段程式必須在某台電腦上執行。自己架站時，你要先買電腦、接上電力和網路、安裝作業系統，再讓程式持續運作。EC2把其中「取得一台可用電腦」改成透過AWS租用，不是把你的業務程式自動寫好。',
 'Amazon EC2提供虛擬伺服器，通常把一台稱為instance。虛擬的意思是底層實體設備由AWS管理，你看到的是可選規格、可啟停、可安裝軟體的一台電腦環境。CPU負責執行計算，記憶體暫放執行中的資料，磁碟保存作業系統和檔案；這些不是同一種資源，因此效能不足時要先找瓶頸，而不是只把所有規格一起加大。',
 'EC2適合需要控制作業系統、安裝特定軟體、保留既有主機工作方式的情境。代價是你需要維護作業系統更新、應用程式、容量及故障處理。AWS提供一台電腦，不表示網站會自動跨機房備援，也不代表放在那台電腦上的資料都有備份。',
 [['從範本取得一台電腦','建立EC2時通常選AMI，這是作業系統和基本軟體的範本，再選CPU與記憶體等規格。還要選擇它位於哪個Region、哪個AZ及哪個子網路。這些決定資料在哪裡、可走哪些網路路徑，並非裝完程式才要補想的小設定。'],['讓程式接得到請求','你必須安裝或部署網站程式，讓它監聽適當的通訊埠，並設定路由和安全群組。使用者不能連線時，原因可能是程式沒啟動、沒有公開入口、路由不通或防火牆沒允許；不能只看EC2狀態是running就認定網站正常。'],['把重要資料和故障處理分開規劃','EC2可以搭配EBS保存持久磁碟，或使用S3和資料庫保存不同類型資料。某台應用故障時，可以讓另一台接手；但資料是否仍在、是否被錯刪、是否需要回到昨天，都要靠適當的儲存、複寫和備份設計另外回答。']],
 '你有一套原本在公司Linux電腦上長期執行的訂單系統，需要安裝指定套件，團隊希望先搬到AWS再逐步改造。',
 ['選擇相容的AMI及足夠但不過度的運算規格，在隔離的測試環境安裝既有程式。','為程式配置執行角色、所需網路路徑與受限制的入口，不把管理員金鑰寫入主機映像。','把訂單放在合適的持久資料儲存，測試主機重啟、應用故障及資料還原的不同情境。','若要求一台主機失效仍可接單，再部署多台、安排負載平衡及容量管理；這不是租第一台EC2時自動完成的功能。'],
 '你得到的是可掌控的租用電腦。它能執行程式，但安全、程式部署、資料保存及可用性都仍要透過設計完成。停止計費的項目也需分開看，停止運算不一定停止磁碟與其他附屬資源的費用。',
 [['S3','S3主要保存檔案資料，不是讓你登入安裝一般作業系統的電腦。把圖片放在S3，不代表訂單計算程式也會在那裡執行。'],['Lambda','常見Lambda事件函式讓你交付一段遇事才執行的程式，不直接管理長期主機。EC2則給你較完整的主機控制，也帶來較多主機維護工作。']],['server','compute','ami','ebs'],'EC2已顯示running，為什麼使用者還可能打不開網站？','running只代表虛擬電腦已運作。應用是否啟動、監聽位置、路由、安全群組及公開入口仍可能出錯，需要沿請求路徑逐段檢查。');
 add('ami',
 '如果網站需要三台相同主機，逐台手動安裝作業系統和套件容易出現差異：一台少了更新，另一台設定不一樣。先把可重複使用的起始環境做成範本，能減少每次從空白電腦重新操作的工作。這份範本和正在提供服務的電腦是兩件事。',
 'AMI是Amazon Machine Image，是建立EC2時使用的機器映像。它描述適合的作業系統及相關磁碟內容等啟動資訊。你可以使用合適的官方或供應商映像，也能製作自己的版本，再從同一份範本建立多台獨立主機。',
 '範本讓擴充容量或重建故障主機比較一致，但不是把所有執行中狀態和外部資料庫一起封進去。把密碼或長期金鑰放入範本，還可能讓每台新主機都複製同一個安全問題。',
 [['建立可重建的起點','把共同需要的軟體和設定安排在映像或啟動流程中，記錄版本。新機器啟動後仍可能需要取得環境專用設定、註冊服務或下載新的應用版本。'],['版本要明確控制','更新軟體後通常建立新的映像版本，再讓新建立的主機使用它。已經執行中的主機不會因為你建立另一個AMI，就自動把磁碟內容換成新版。'],['把機密與業務資料外置','使用角色在執行時取得授權，讓敏感設定從受控服務讀取。訂單等持續變化的資料應有自己的保存與備份設計，不把AMI當成所有資料同步機制。']],
 'Auto Scaling需要在流量升高時補出兩台相同網站主機。',
 ['製作或選擇已驗證的AMI，確認與主機架構和部署區域相容。','在啟動範本中指定映像版本及其他必要設定，測試新主機能自行啟動應用。','更新時以新映像逐步替換主機，觀察健康檢查，而不是直接假設所有舊主機都變了。'],
 'AMI提供一致起點，真正服務是否正常仍要靠部署流程、健康檢查及資料連線驗證。',
 [['容器映像','容器映像主要封裝應用和相依套件；AMI是EC2機器環境的啟動範本，兩者管理的層次不同。']],['ec2','asg','image'],'更新AMI後，已開機的EC2會自動變成新版嗎？','不會。新AMI主要影響後續從它建立的主機，既有主機需要另外更新或替換。');
 add('asg',
 '只有一台網站主機時，故障就可能沒人處理請求；一直手動看流量、再按按鈕加主機，也容易太慢。你可以先定義這一組主機至少要幾台、平常希望幾台、最多允許幾台，再讓管理機制持續維持這個目標。',
 'Auto Scaling群組把一組EC2當作同一個運算池，依啟動範本建立主機、維持所需數量，並可配合規則增減容量。它管理「有幾台可用的運算主機」，不是把每個客人的請求分配出去的入口，也不是應用資料的自動備份工具。',
 '這能降低補機與調整容量的人工工作。前提是新主機能自動啟動應用，而且應用不把唯一訂單或登入狀態只留在某一台即將被替換的機器內。',
 [['先設定容量範圍','Minimum是允許的最少台數，desired是目前希望維持的台數，maximum限制最多台數。設定desired為二，不代表網站一定能承受任何流量；兩台是否足夠仍需量測。'],['依訊號擴展而非猜測','可根據CPU、請求負載或其他合適指標調整。新機器有啟動及預熱時間，指標選得不對或下游已經塞住時，增加主機未必會改善使用者等待。'],['縮容也要能安全離開','主機被移除前，應避免新工作再進入並讓既有工作適當結束。把檔案、訂單與需要共用的狀態存到合適外部服務，才不會每次縮容都遺失重要資料。']],
 '網站要求至少兩台應用，活動開始時負載可能增加。',
 ['建立能自行部署應用的啟動範本，先測試新機器不用人登入也能健康。','跨不同AZ配置群組，設定合理最小、所需與最大數量。','把健康應用接到ALB，再測試故障補機與流量下降後的縮容行為。'],
 '補台數和分送流量分工清楚，才算完整擴展；資料庫連線和配額仍可能限制整體容量。',
 [['ALB','ALB把請求送到健康目標；ASG維持與調整主機數量。多一個ALB不會自動多出能工作的應用主機。']],['ec2','ami','health-check'],'ASG自動加了五台，但資料庫已達連線上限，網站一定會變快嗎？','不一定。更多應用還可能增加資料庫壓力，必須一起找出下游瓶頸並限制負載。');
 add('alb',
 '網站有多份相同應用後，客人不應自己猜今天要連哪一台。需要一個共同入口接收請求，再選一個健康的應用交給它處理。若還想依網址把圖片與訂單送到不同程式，入口就必須理解HTTP請求裡的相關資訊。',
 'ALB是Application Load Balancer，適合HTTP及HTTPS應用。你為它設定接收連線的listener、比對請求的規則，以及可以接收工作的目標群組。它可以把不同主機名稱或網址路徑導向不同目標，但不會替目標寫好訂單計算程式。',
 '使用共同入口可讓應用替換、擴展與健康檢查較容易協調。ALB本身不保存你的業務資料，也不能讓一個只存在單台機器裡的購物車，自動在所有目標之間共享。',
 [['先決定公開入口如何接單','Listener描述接收哪種協定與通訊埠。HTTPS入口還需要合適憑證，安全群組與路由也必須允許預期流量進入。'],['再決定請求要送給誰','例如把/orders路徑送到訂單目標群組，把/images送到圖片應用。規則要搭配預設行為，否則未符合特定路徑的請求可能走到不適合的服務。'],['用健康結果控制目標','ALB會依配置檢查目標，協助避開不健康者。目標全不健康時有服務特定行為，不能把健康檢查當作永遠保證錯誤請求不會被傳送的安全機制。']],
 '一個網域同時提供商品瀏覽與訂單API，兩個團隊各自部署。',
 ['建立單一HTTPS入口，憑證涵蓋這個網域。','將兩組應用分別註冊到目標群組，以路徑規則分流。','測試錯誤路徑、某個目標故障及新目標加入時，請求是否得到合理結果。'],
 'ALB處理HTTP入口與分流，容量、資料正確性和應用故障復原仍需要其他設計。',
 [['NLB','NLB主要在TCP、UDP或TLS等連線層面分流。依HTTP路徑分送工作是ALB的典型選型訊號，不能把兩者當作只有速度不同。']],['http','https','health-check'],'把/orders導向訂單服務，需要ALB讀懂訂單資料庫中的內容嗎？','不需要。它可依HTTP網址路徑比對規則；真正查詢或寫入訂單仍由後端程式執行。');
 add('nlb',
 '並非所有網路服務都是瀏覽器網站。遊戲、設備或既有系統可能使用TCP或UDP連線，只需要把連線送到健康的後端，而不需要入口閱讀HTTP網址。這時應先從通訊協定和入口位址要求判斷，不要看到負載平衡就直接選網站用的分流器。',
 'NLB是Network Load Balancer，主要處理傳輸層的TCP、UDP或TLS等需求。它提供一個連線入口，再把流量交給後端目標。固定入口IP、來源位址與PrivateLink整合等要求，常讓它成為需要評估的方案。',
 '選型價值來自符合工作負載的連線行為，不是「NLB永遠比ALB好」。若需要按HTTP的主機名稱、路徑等條件安排不同應用，仍要比較ALB或其他適當的入口設計。',
 [['先說清楚連線種類','TCP偏向可靠的連線傳輸，UDP有不同的資料傳送方式。確認服務使用的協定及埠號，才能選對listener與目標配置，不應只根據應用名稱猜測。'],['把目標與可達路徑準備好','後端必須真的接收對應流量，網路、安全規則及健康檢查需相容。入口存在不表示從入口到應用的每一段已自動打通。'],['再檢查固定IP與安全要求','若客戶防火牆需要允許清單，需依NLB實際位址模式規劃。TLS終止位置與後半段是否加密也要決定，不能因為入口有TLS選項就忽略後端。']],
 '企業設備只能透過指定IP連到一個TCP服務，程式並不使用HTTP路徑。',
 ['確認設備的協定、埠號及是否必須保留來源資訊。','評估NLB符合位址與連線需求後，接入健康目標。','測試目標失效、連線重建及網路防火牆限制，而不是拿HTTP路徑規則作驗收。'],
 '好的入口是滿足協定與故障行為，不是把所有應用都套用同一個負載平衡器。',
 [['ALB','ALB理解HTTP請求並提供路徑等規則；NLB的主要分工不是閱讀這些應用層欄位。']],['ip','alb','health-check'],'客人要求依/images與/orders分流，單憑固定IP需求就能忽略HTTP路由嗎？','不能。所有必要條件都要一起滿足，必要時重新安排入口層次，而非只抓住其中一個關鍵字。');
 add('health-check',
 '一台主機還有電、網路也通，不代表網站程式真的能接單。反過來，某個非必要外部功能壞了，也不一定需要停止整個網站。健康檢查的起點是定義「對這種流量而言，現在可以工作」到底表示什麼。',
 '健康檢查是由負載平衡器或其他監控機制定期做一個約定好的測試，再依連續成功或失敗結果改變判定。HTTP檢查可以呼叫指定路徑；檢查方式、逾時和門檻都會影響何時停止或恢復送流量。',
 '它能協助快速發現故障並減少把新請求送給壞目標，但檢查內容太淺會漏掉問題，內容太重或把共用依賴全算進去，又可能一起判掉所有本來仍能做事的目標。',
 [['選能代表工作的測試','只回固定成功可能表示不了程式的真正狀態。可以檢查必要初始化是否完成及基本處理能力，但不必每次都執行昂貴交易或修改正式資料。'],['容許暫時波動','單次請求失敗可能只是網路或瞬間負載。依適當的連續失敗與恢復門檻判定，並給剛啟動的應用合理預熱時間，避免不停加入又移除。'],['把檢查失敗當成線索','健康檢查失敗可能是路徑、埠號、回應碼、程式或安全規則問題。先看目標健康原因與日誌，不要只把門檻改得極寬，讓故障變成表面健康。']],
 '網站顯示資料庫連線失敗，但/health仍永遠回200，負載平衡器繼續送客人過去。',
 ['定義訂單服務開始接流量前必須具備的能力。','修改檢查或應用就緒流程，讓必要初始化失敗能被發現。','測試單一主機與共用依賴故障，避免讓所有目標因不必要依賴一起退出。'],
 '檢查設計是業務可服務性的近似判斷，不是讀到200就能證明整個系統絕不失敗。',
 [['監控告警','告警通知人或觸發處置；健康檢查結果常直接影響是否接流量。兩者可以合作，但不是同一項動作。']],['alb','server','availability'],'把/health固定改成永遠成功，可以真正修好故障嗎？','不可以。它只讓檢查看不到問題；使用者的真實請求仍可能失敗。');
 add('lambda',
 '先把「程式」和「一直開著的電腦」分開想。假設客人上傳照片後，你只需要花幾秒把照片縮小：真正要完成的是那幾秒的影像處理，不一定需要你親自準備一台全年開機、等待照片的主機。常見的Lambda事件函式就是讓你先交付這段處理程式，再指定什麼事情發生時呼叫它。AWS底下仍使用電腦，只是你不直接替這段工作管理那台電腦。',
 '這裡先學SAA常見的Lambda事件函式：一次呼叫帶入一份事件資料，函式執行你的程式，然後回傳結果或產生指定作用。你可以把函式理解成一段完成特定工作的程式，把事件理解成告訴它「發生什麼事、要處理哪筆資料」的訊息。Lambda另有不同運算形式，其他形式的行為與限制應另外核對官方文件，不要將它們全部視為同一種呼叫方式。',
 '事件函式適合API處理、圖片轉換、自動化或從佇列取出工作等事件驅動需求。優點是不用替每個工作手動維持主機數量；代價是你仍要理解啟動、並行、執行限制、重試和下游容量。無伺服器不是無限容量，也不是任意程式放進去就必然比較便宜。',
 [['先寫清楚一次呼叫要完成什麼','事件可以描述一張新照片、一筆訂單或一個API要求。函式讀取事件、檢查輸入，再執行真正業務邏輯。處理程式是你寫的；設定觸發器不會自動產生正確的縮圖或付款規則。要把一次工作的邊界說清楚，才知道成功、失敗及重試各代表什麼。'],['接上事件來源與最小權限','例如S3保存新照片後發出事件，Lambda取得檔案位置並讀取內容，再把縮圖寫到另一個位置。需要讓事件來源有權呼叫函式，也需要給函式執行角色讀原圖和寫縮圖的權限。能被呼叫與能操作資料，是兩個不同的授權問題。'],['為重複、暫存與並行做設計','一次事件可能因失敗而重試，某些投遞方式也可能重複，所以處理同一張照片或同一筆付款要能避免錯誤副作用。函式內的記憶體或暫存檔不能作為唯一業務資料；需要保存的結果放到S3或資料庫。流量增加時也要保護資料庫等下游，不能只期待更多並行永遠有益。']],
 '網站每天有不固定數量的會員照片上傳，要求自動產生縮圖並保留原圖。',
 ['原圖先上傳到S3指定位置，讓事件帶出儲存桶與物件名稱，不把整張大型照片硬塞進事件文字。','事件函式依角色權限讀原圖，執行影像程式，再寫入不同的縮圖前綴或儲存桶，避免輸出又反覆觸發自己。','使用原圖識別與處理版本辨認重複事件，重試時維持相同結果，並把無法處理的工作記錄供調查。','觀察處理時間、錯誤與並行，設定合理限制；照片長期留在S3，不依賴某次函式執行環境一直存在。'],
 'Lambda負責在適當時間執行你的處理工作，S3負責保存圖片。兩者合作可以免去你管理常駐縮圖主機，卻沒有取消程式正確性、資料權限和失敗處理的責任。',
 [['EC2','EC2讓你掌控一台主機環境，適合需要作業系統控制等情境；事件函式則以一次次工作呼叫為核心，不讓你依賴固定主機一直存在。'],['S3','S3保存原圖與結果，並不替你執行任意影像處理程式。Lambda可以被S3事件觸發，但執行和保存依然是不同工作。']],['server','request','s3','iam-role'],'照片縮圖需要長期保存，能只留在Lambda某次執行的記憶體裡嗎？','不能。執行環境不是唯一的持久資料保存處，應把結果寫到S3等合適儲存，並處理失敗與重試。');
 add('serverless',
 '當你只想讓程式完成工作，卻必須先挑主機、安裝系統、處理更新及補足容量，這些管理工作會占掉許多心力。無伺服器模式把更多底層設備管理交給服務供應商，讓你用較接近「完成工作」的介面使用資源。',
 'Serverless不是世界上不再有伺服器，而是你使用服務時，不必直接配置和維護底層那一台主機。不同服務把不同責任交出去：Lambda事件函式以呼叫執行程式，DynamoDB提供受管資料存取，兩者都仍有實際設備、功能邊界與配額。',
 '這種模式可減少部分維運並配合變動需求，但不等於不用設計權限、資料模型、成本或故障行為。服務替你管理機器，不會自動知道一筆訂單是否應該退款。',
 [['先看交出去的是哪一層','對EC2，你通常仍要管理客體作業系統；對事件函式，你主要提供程式與執行設定。先說清楚責任界線，才能比較管理工作是否真的減少。'],['計費與容量仍需理解','常見按用量收費能避免保留某些閒置容量，但請求、執行、儲存和其他服務可能各自計費。穩定高負載不一定比所有其他方式便宜，要依真實用量估算。'],['業務資料與失敗處理不會消失','無伺服器程式仍可能失敗、被重試或遇到下游限制。重要資料要有持久保存位置，重要副作用要避免重複；監控與錯誤調查也仍需要。']],
 '小型會員系統平常少人使用，活動期間才有大量查詢。',
 ['比較是否可用API入口、事件函式和受管資料庫完成需要的功能。','列出不再需要管理的主機工作，也列出仍需自己負責的權限與資料正確性。','以尖峰與離峰的預估請求量計算成本，並測試服務配額及下游承載能力。'],
 '無伺服器是管理責任與使用方式的改變，不是免費、無限制或零故障的承諾。',
 [['容器','容器描述程式如何被封裝；是否要自己管理底層主機，則由執行平台決定。容器也可能以較少主機管理的方式執行。']],['server','lambda','dynamodb'],'採用Serverless後，還要設計錯誤重試嗎？','要。你不管理主機，不代表應用與外部服務不會失敗，重試也可能造成重複副作用。');
 add('container',
 '同一個程式在工程師的電腦能跑，搬到另一台卻失敗，常因套件版本、執行環境或檔案不同。容器化先把程式和它需要的相依內容整理成較一致的封裝，再交給相容的執行環境啟動。',
 '容器是一個執行中的隔離工作單位；用來建立它的範本稱為容器映像。映像可以包含程式、執行套件與啟動設定，多個容器可從同一映像啟動。它不是完整取代所有底層作業系統與硬體的魔法盒子。',
 '一致封裝有助部署、搬移和更新，但容器仍需運算資源、網路、權限和資料保存。只會啟動一個容器，不代表你已決定故障後誰補回、流量怎麼進來或重要檔案存在哪裡。',
 [['先建立可重複的映像','用明確的建置步驟保存程式及需要的套件，指定啟動時要執行什麼。不要把開發電腦偶然存在的檔案或長期密碼當成部署前提。'],['啟動時提供環境設定','同一個映像可在測試與正式環境使用不同受控設定。祕密在執行時依權限取得，網路埠和需要的資源也要清楚配置。'],['把執行與資料生命週期分開','容器可被替換或重新啟動，重要資料不能只依賴某份短暫容器內的檔案。安排合適的持久儲存，再由ECS或EKS等工具維持數量與處理部署。']],
 '團隊想讓網站在測試和正式環境使用相同軟體版本。',
 ['建置並測試一份標記清楚版本的容器映像。','將映像保存到受控的登錄服務，再由部署環境拉取相同版本。','把資料庫位置與祕密獨立設定，測試容器被替換後訂單仍存在。'],
 '容器幫你一致地交付應用，但平台管理與資料設計仍要分別解決。',
 [['EC2','EC2是一台可管理的虛擬主機；容器是應用執行與封裝單位。一台EC2可以執行容器，兩者不是互斥產品。']],['image','compute','orchestration'],'容器被替換後，先前寫在容器內的唯一訂單檔一定還在嗎？','不能這樣假設。需要長期保存的資料應放到合適的外部或持久儲存，並設計備份。');
 add('ecs',
 '把程式裝進容器後，還有一串日常問題：要開幾份？哪一份故障了？新版如何逐步上線？流量要送到哪裡？如果全部靠人手啟動和記錄位置，容器數量一多就容易失控。',
 'Amazon ECS協助排程和管理容器工作。Task definition是執行規格，描述映像、資源與相關設定；task是實際執行的工作單位。Service則可維持指定數量的長期服務工作，並協調部署及負載平衡等整合。',
 'ECS減少自己製作容器管理系統的負擔，但不會替你選好每項容量、網路與權限。底層可以有不同運算方式，使用EC2時通常還需管理節點；使用Fargate時則交出更多節點管理。',
 [['先定義一份工作如何啟動','指定容器映像、CPU與記憶體、應用需要的設定與存取角色。區分拉取映像等平台動作使用的角色，以及程式執行時操作AWS資源的角色。'],['選擇適合的維持方式','一次性批次工作可以是獨立task；需要一直對客人服務的網站則可由service維持所需數量。宣告三份工作，不表示應用資料就自動共用。'],['用健康與部署流程維持服務','將合適目標接到負載平衡器，測試新工作啟動、舊工作排空及故障替換。底層節點不夠、映像拉不到或資料庫授權錯誤，都可能讓目標數量無法達成。']],
 '訂單網站需要一直維持三份容器，而且更新時不能先全部關閉。',
 ['建立已測試的映像與task definition版本。','使用ECS service設定維持數量及部署條件，安排入口健康檢查。','逐步更新後觀察新工作能否成功接單，並保留回復版本與外部持久資料。'],
 'ECS管理容器的生命週期，程式正確性、外部資料與容量規畫仍是整個架構的一部分。',
 [['Fargate','ECS是容器管理服務；Fargate是執行容器的運算方式。可以用ECS搭配Fargate，不能把兩者當成只能選一個。']],['container','image','fargate'],'ECS service要求三份工作，是否表示三份容器會自動共享同一個本機資料夾？','不是。工作數量管理和共享檔案是不同問題，需要另外選擇儲存與掛載設計。');
 add('eks',
 '多個容器一起組成網站時，需要有人安排它們在哪裡啟動、彼此怎麼找到對方、故障後補幾份。Kubernetes是一套處理這類協調工作的系統與生態；先理解它是在管理容器，不要把名稱當成一種可以取代業務程式的魔法工具。',
 'EKS是AWS提供的受管Kubernetes服務。AWS承擔控制平面的相關管理；控制平面像指揮中心，保存你希望的狀態並協調工作。實際執行應用的運算、應用設定及許多安全責任仍須依所選方式處理。',
 '公司已使用Kubernetes工具時，EKS可減少自行維護控制平面的工作。但若團隊根本不需要這套生態，額外概念與費用也可能增加複雜度，不應只因流行就選它。',
 [['先說出希望的狀態','應用通常以宣告方式描述需要哪些容器及數量。系統努力讓實際狀態接近宣告，但映像不存在、資源不足或權限錯誤仍會阻止工作啟動。'],['區分指揮中心與工作場地','受管控制平面不是替全部應用提供無限制資源。選用的節點或其他運算方式，仍需符合CPU、記憶體、網路與儲存需求。'],['管理整套應用生命週期','容器映像更新、套件相容、安全權限和叢集附加元件都需安排。要測試更新、擴展與復原，而不是看到控制平面受管就不再監控。']],
 '團隊已有Kubernetes部署規格及監控工具，希望遷移到AWS。',
 ['盤點使用的Kubernetes功能及相依套件。','選擇合適EKS版本和運算方式，測試網路與資料掛載。','逐步部署應用，演練節點失效及版本升級，不只驗證容器第一次能開機。'],
 'EKS保留熟悉的容器管理生態，同時把部分底層維護交給AWS；剩餘責任需要明確列出。',
 [['ECS','ECS是另一套容器管理服務，並不要求採用Kubernetes的相同工具與物件模型。先比較團隊需求和維運負擔。']],['container','orchestration','compute'],'EKS受管的是控制平面，是否代表應用本身的權限和更新都不用管理？','不是。平台承擔部分管理工作，應用安全、依賴與部署仍需團隊負責。');
 add('fargate',
 '你已把網站裝成容器，但如果每次還得先租整台電腦、安裝容器執行環境、追蹤哪些機器有剩餘空間，就仍有不少主機工作。Fargate讓你以容器工作所需資源來申請執行位置，而不必親自管理那一組EC2節點。',
 'Fargate是一種容器運算方式，通常配合ECS或支援的EKS情境使用。你指定工作需要多少CPU、記憶體及相關設定，平台安排底層執行資源。它不是另一套取代ECS排程規格的獨立容器管理語言。',
 '不直接管理節點可以降低補丁和容量裝箱的負擔，但可用規格、執行特性與計費方式仍有條件。需要特殊硬體、主機控制或特定作業系統能力時，要先確認支援。',
 [['交付工作規格','先準備容器映像，指定資源需求、啟動設定與角色。申請的CPU和記憶體會影響是否足夠及費用，不能把不確定需求一律選最大。'],['配置工作自己的連線','容器仍需要網路位置、安全群組與前往資料庫等服務的路徑。免管主機不表示所有私有資源都自動可達。'],['將資料與容量目標外置','服務維持幾份工作由ECS或相關平台設定；重要資料放到合適持久服務。工作被替換時，不應連帶失去唯一的訂單檔案。']],
 '小團隊要長期提供三份Web容器，不希望管理容器節點。',
 ['評估Fargate規格支援應用所需資源與功能。','由ECS service維持工作數量，設定入口和執行角色。','量測流量、啟動與費用，測試替換工作和下游故障。'],
 'Fargate減少節點管理，不會消除容器應用的設定、資料與成本設計。',
 [['EC2上的容器','自行管理EC2節點通常有更多主機控制，也需要處理主機更新、容量與故障。選擇要看需求，不是只比較服務名稱。']],['container','ecs','ec2'],'選Fargate後，容器連資料庫的權限會自動建立嗎？','不會。免管節點與資料授權是不同問題，仍要設定角色、網路及資料庫存取。');
 add('api',
 '手機App不會直接伸手操作網站電腦裡的每個檔案。它通常送出一個有約定格式的要求，例如「查詢訂單123」，再接收有約定格式的結果。雙方需要先知道能要求什麼、資料怎麼寫、錯誤怎麼表示，才能互相合作。',
 'API是程式提供給其他程式使用的操作介面。它可以是網路服務入口，也可以是其他形式；網站情境常見HTTP API。呼叫者照約定使用入口，不必知道內部究竟查了哪張資料表或用了幾台主機。',
 '明確介面讓手機、網站及後端能分開演進，也讓權限、輸入檢查及錯誤處理有清楚位置。但有API不代表資料可以公開，也不代表呼叫一定成功或即時完成。',
 [['先定義要求與結果','例如GET /orders/123表示取得某筆訂單，回傳狀態與明細。若找不到或沒有權限，應有可理解的錯誤，不讓呼叫者把所有失敗都當成空訂單。'],['驗證誰能做什麼','登入證明使用者身分，業務授權還要確認這筆訂單是否屬於他。知道網址或訂單編號並不等於可以查看任何人的內容。'],['約定重試與變更方式','查詢與付款的重試風險不同，付款需避免重複副作用。修改欄位或回應格式前也要考慮舊版呼叫者，不能只讓最新手機版本工作。']],
 '同一套訂單資料要提供給網站及手機App。',
 ['定義查詢與建立訂單的入口、輸入欄位及回應。','由後端驗證請求並操作資料，客戶端不持有資料庫管理密碼。','測試未登入、查別人訂單、輸入錯誤與重試等情境。'],
 'API是一份可操作的溝通契約，內部實作仍必須正確處理資料和權限。',
 [['API Gateway','API是介面概念；API Gateway是可管理部分網路API入口的服務，兩者不是同一層名稱。']],['request','response','http'],'使用者知道/orders/123的網址，就一定有權看訂單123嗎？','不一定。入口必須驗證身分與該筆資料的操作權限，不能把知道網址當成授權。');
 add('api-gateway',
 '一套API除了真正處理訂單，還要接收網路連線、安排網址、驗證部分憑證、限制過量要求，並把要求交給正確後端。若每個小服務都自行重做這些入口工作，管理會逐漸分散。',
 'API Gateway提供受管API入口。你設定路由及整合目標，讓請求送到Lambda或其他支援後端；依API類型可使用不同驗證、節流和其他功能。後端仍需要自己實作訂單、庫存或會員邏輯。',
 '它可集中管理介面入口並減少自行維護接待層的工作，但必須選擇符合需求的API類型、協定與功能。不能因為前面有閘道，就假設後端不再需要資料授權或輸入驗證。',
 [['接收一條已定義的路由','把例如GET /orders/{id}對應到後端。路徑參數只是輸入資料，還需檢查格式及使用者是否有權讀取那筆訂單。'],['安排驗證與流量控制','可使用合適的授權整合及節流，降低未授權或過量請求進入後端的機會。功能與設定依API類型不同，不能把另一類API的能力直接套過來。'],['把要求交給真正處理者','整合把事件或請求轉交後端，再把結果回給客戶端。設定錯誤、後端逾時、權限不足和程式例外，都需要從入口到後端逐段追查。']],
 '手機查訂單的HTTP API由Lambda執行，團隊想集中控制入口。',
 ['建立對應API類型與路由，接到查詢函式。','設定使用者驗證、呼叫函式的權限及合理流量限制。','檢查正常、未授權及後端失敗的回應是否一致可理解。'],
 '閘道把接待與轉送標準化，真正的業務判斷仍在後端。',
 [['ALB','ALB也能作HTTP應用入口，但管理模型和API相關功能不同。要比較實際路由、驗證、整合及成本條件。']],['api','lambda','http'],'API Gateway已驗證登入，後端還需要確認使用者只能查看自己的訂單嗎？','需要。登入與每筆資料的業務授權是兩個層次，不能只做其中一個。');
 add('s3',
 '先想像你的網站有商品照片、說明文件和每天產生的報表。這些檔案需要保存，讓程式或使用者之後取回；保存檔案和執行訂單計算是不同工作。自己的電腦可以用硬碟放檔案，網站也需要保存位置。S3讓你透過網路使用一個由AWS管理的檔案資料保存服務，不必先買足未來幾年的硬碟或親自替每顆硬碟處理故障。',
 'S3是Amazon Simple Storage Service，主要提供物件儲存。先不用怕「物件」這個詞：可以把一份照片內容，加上用來辨認它的名稱及一些描述資訊，看成一個物件。物件放在儲存桶bucket裡；物件的名稱叫key，例如images/cat.jpg。斜線讓名稱看起來像資料夾路徑，但一般S3物件操作不是在一顆傳統磁碟上逐格修改檔案內容，而是透過服務介面取得、寫入或刪除整個物件等操作。',
 'S3常用於圖片、影片、備份、網站靜態檔案與分析資料。它解決的是保存及取回這類資料，不是讓你登入安裝一般作業系統，也不是直接幫你執行任意程式。不同儲存類別有不同可用性、存取方式及費用條件，不能把所有類別都當成一樣快、一樣便宜或一樣能承受故障。',
 [['先建立有規則的保存容器','選擇適合的Region建立儲存桶，規劃物件如何命名與誰可以存取。網站圖片和私人薪資資料不該因方便就共用寬鬆權限。Bucket是管理邊界的一部分，建立它不表示內容會自動公開；應依真正需求授權讀取或寫入。'],['走一次上傳與讀取流程','應用把照片內容和key送到S3，服務保存後回覆結果。之後程式以bucket和key要求取回內容，例如取得images/cat.jpg。請求還要經過適用的權限檢查；若使用額外金鑰保護資料，可能也涉及金鑰授權。知道檔名或網址，不代表一定能讀取私人檔案。'],['決定版本、保存時間及公開入口','版本控制可保留同一個key的歷史寫入，生命週期可安排舊資料轉類別或清理，但都需要理解其費用及刪除行為。若要公開提供網站，可以讓CloudFront作入口、S3維持私人，僅允許該入口讀取；不要為了讓網頁能顯示就隨意公開整個儲存桶。']],
 '你要讓購物網站保存商品照片，世界各地客人都能看，員工上傳新版時也希望能找回誤覆寫的舊圖。',
 ['建立專用儲存桶並安排images/等命名方式，只有上傳程式有必要的寫入權限。','將照片上傳成物件；啟用並理解版本控制，讓同一key的新舊內容可以分辨與還原。','用CloudFront等適合入口對外提供內容，讓私人儲存桶只接受被允許的來源讀取。','觀察儲存、請求、資料傳輸及舊版本費用，安排真正符合保存政策的清理，不把更多副本誤認為免費。'],
 'S3是檔案資料的保存位置；顧客瀏覽照片的入口、縮圖處理程式、訂單資料庫與網站主機各自做不同工作。把這些角色分清楚，你才能看懂後續架構圖為什麼同時出現S3、EC2、Lambda或CloudFront。',
 [['EC2','EC2是可以安裝和執行程式的租用電腦。S3則提供物件保存介面；有圖片放在S3，不表示任意網站後端程式也會在S3執行。'],['EBS','EBS像附給EC2使用的區塊磁碟；S3透過物件介面存取資料，不應不修改程式就當成所有一般磁碟的替代品。'],['資料庫','資料庫可依其資料模型查找、修改與交易處理；S3保存檔案物件，並不直接取代訂單的所有資料庫行為。']],['storage','bucket','object','ec2'],'把計算訂單總額的程式檔上傳到S3後，它就會自動替客人執行計算嗎？','不會。S3保存檔案，程式需要由EC2、Lambda等適合的運算環境執行；保存和執行是兩個分工。');
 add('bucket',
 '要保存大量照片時，你不只需要每張照片的名字，還要有一個共同的保存與管理範圍：哪些人能上傳、在哪個區域保存、要不要保留歷史版本。S3的儲存桶就是用來安排這些物件與管理規則的重要容器。',
 'Bucket不是正在執行程式的機器，也不是一顆可直接掛到電腦上的磁碟。它裝載S3物件，並可有存取政策、版本控制與生命週期等配置；實際功能及限制依bucket類型而不同。',
 '先設計容器邊界，可以避免私人文件和公開圖片混用過於寬鬆的權限。名字或分類方便人整理，真正能否讀寫仍由IAM、bucket policy等適用授權共同決定。',
 [['決定保存位置和用途','建立時選擇適合的區域和類型，依應用及資料分類安排範圍。不要認為同名資料夾就自動具備不同權限，也不要為了好記名稱而忽略真正使用需求。'],['把物件放進容器','每份內容有自己的key，例如reports/day1.csv。讀取時要同時知道bucket和key，不能只拿一個檔名就斷定它指向哪個儲存位置。'],['在容器層設定管理規則','可規劃版本、保存期、公開存取封鎖及相應存取政策。規則是否套用全部物件或指定前綴，應以正反案例測試，避免一次開放不該公開的資料。']],
 '公司希望商品圖片可由網站讀取，薪資報表只有財務程式可讀。',
 ['依風險和維運需求劃分適當儲存桶或其他控制邊界。','分別設定寫入和讀取角色，不因圖片要展示就公開薪資內容。','測試合法來源能取回指定物件，非授權來源會被拒絕。'],
 '儲存桶提供組織與控制的範圍，安全仍要落實到真正的政策與存取路徑。',
 [['物件','Bucket是容器，object是裡面的一份內容及其名稱等資訊。刪除一個物件與刪除整個bucket不是同一件事。']],['s3','object','policy'],'一個bucket裡有private/資料夾，光靠這個名字就能保證它是私人的嗎？','不能。名稱不是授權機制，仍要配置並驗證真正的存取政策。');
 add('object',
 '你把一張照片交給儲存服務時，服務需要知道照片的位元內容，以及之後要用什麼名稱找到它。S3用物件作為基本保存單位；不要把這個詞理解成程式設計中必須先學會的一整套物件導向概念。',
 'S3物件包含資料本體、名稱key及相關中繼資料。中繼資料是描述這份資料的資訊，例如內容類型；key則是在bucket內辨認物件的名稱。images/cat.jpg可以是一個key，斜線形成可閱讀的前綴組織方式。',
 '明白物件單位，才知道上傳、覆寫、版本與存取權限作用在哪裡。不能因為管理介面畫出資料夾，就假設它具有所有傳統檔案系統的目錄與磁碟操作語意。',
 [['內容與名稱一起送出','程式上傳照片時指定bucket和key，S3保存內容。之後取回同一份資料時，也需要正確位置；名稱大小寫與前綴都是辨識的一部分。'],['描述內容不等於內容本身','Content-Type等描述會影響客戶端如何處理資料，但改名稱或描述不會神奇地把圖片轉成另一種格式。格式轉換通常要由程式讀取、處理後另行寫入。'],['理解同名寫入與版本','再次寫入相同key會涉及目前版本的替換或產生新版本，依版本控制設定而定。檔案歷史不是只靠在畫面看到同一個名稱就能判斷。']],
 '網站需要把原圖和縮圖分開保存。',
 ['原圖使用original/cat.jpg等key上傳。','處理程式讀取原圖內容，產生縮圖後寫到thumb/cat.jpg。','配置權限與事件條件，避免縮圖輸出又被當成原圖反覆處理。'],
 '名稱安排能幫助組織與流程，但內容轉換和存取保護仍需明確設計。',
 [['Bucket','Bucket是裝載和管理物件的容器；key只在某個bucket範圍內辨認一個物件，兩者需要一起考慮。']],['s3','bucket','lambda'],'把照片的key改成photo.pdf，照片內容就真的變成PDF嗎？','不會。key只是名稱；改格式需要實際解讀和轉換資料內容。');
 add('versioning',
 '有人把新版檔案覆寫到原本名稱，之後才發現內容錯了。如果系統永遠只保留最後一次寫入，你可能沒有辦法找回上一份正確內容。S3版本控制讓同一個物件名稱可以對應不同歷史版本。',
 '開啟版本控制後，同key的寫入會保留可辨識的版本。讀取可以取得目前版本，也可依version ID指定歷史內容。刪除時可能出現刪除標記，讓一般讀取看不到物件，但過去版本仍然存在；永久刪指定版本則是另一種操作。',
 '這能協助處理誤覆寫與部分誤刪，但保存更多版本也會使用更多儲存。版本控制不能取代所有備份隔離與權限設計，更不能讓你忽略誰有權永久刪除歷史內容。',
 [['先確認目前的設定','版本控制有不同狀態，不能看檔名相同就猜測一定保留所有歷史。啟用前已有資料和啟用後的新寫入，也需要按實際版本資訊辨認。'],['看懂一般刪除的結果','不指定版本的刪除，在啟用版本控制的情境會建立刪除標記。標記讓目前內容看起來被刪了，不等於舊版本已全部清空。'],['規畫舊版本保存期','生命週期可另行處理非目前版本，避免歷史副本無限制累積。清空測試bucket前，要確認所有版本和刪除標記，而不是只刪畫面預設清單裡的物件。']],
 '員工把錯誤的價目表覆寫到price.csv，網站已顯示錯價。',
 ['查看這個key的版本清單，找到正確內容的version ID。','先驗證舊版資料，再依合適方式恢復成應提供的目前內容。','檢查快取與網站發版流程，並限制可以永久刪除歷史版本的權限。'],
 '找得回檔案與使用者立即看到修正版，是不同環節，都要驗證。',
 [['Object Lock','版本控制保存多個版本；Object Lock可限制特定版本在保留條件下被刪除。只有版本存在不代表它永遠不能被刪。']],['s3','object','lifecycle'],'啟用版本控制後，刪除畫面預設看見的物件就一定停止所有儲存費嗎？','不一定。舊版本與刪除標記仍可能存在，必須按保存政策檢查完整版本清單。');
 add('lifecycle',
 '新上傳的報表每天讀很多次，半年後卻幾乎沒人開啟；若所有資料永遠使用同一保存方式，費用和管理工作可能不合需求。生命週期規則讓資料隨時間和條件採取事先安排的管理動作。',
 'S3生命週期可依符合範圍的物件年齡等條件，安排轉換儲存類別或到期清理。它是服務執行的管理規則，不是你能精確指定某秒鐘立刻刪除所有資料的應用排程器。',
 '資料變舊後可降低部分保存成本，保留期結束也可自動清理。但轉換、取回、最低保存期和物件大小計費條件都可能改變總成本，因此不能只比較每GB標價。',
 [['先區分不同資料用途','對常讀圖片、合規文件與可重建暫存檔，保存要求可能完全不同。使用適當前綴、標籤或其他範圍條件，避免一條規則誤傷整個bucket。'],['確認轉換後如何讀取','某些類別仍可直接低延遲取回，封存類別可能需要還原等待。若業務要求立即可讀，就不能只因封存較便宜而轉過去。'],['分清目前與歷史版本','開啟版本控制後，現在版本到期與舊版本清理有不同配置。只處理目前版本，可能留下大量歷史內容繼續占用儲存。']],
 '分析報表保留一年，前一個月常讀，之後很少讀但仍有稽核需求。',
 ['確認稽核能接受的取回等待時間與法定保存限制。','以測試範圍規畫合適轉類別和到期規則，估算完整費用。','觀察執行及版本清理結果，保留必要資料而非單純追求刪得越多越好。'],
 '生命週期是把資料保留政策轉成可管理規則，不是替你決定法律與業務要求。',
 [['備份策略','生命週期管理現有物件的狀態；備份策略還要決定獨立副本、復原方式和演練，不能只靠到期刪除規則。']],['s3','versioning','object-lock'],'資料三十天後較少讀，是否一定應轉入等待還原的封存類別？','不是。仍需確認讀取時限、最低保存期、取回費用及實際存取模式。');
 add('object-lock',
 '稽核文件保存後，有時要求連管理員都不能隨意提前刪除。一般授權限制可以被有權的人修改，因此某些法規或防勒索情境需要更明確的不可變保留機制：特定歷史內容在條件滿足前不能被刪掉。',
 'S3 Object Lock作用在物件版本，可設定保留期限或法律保留。它不表示檔名下不能再有新版本，而是讓受保護的那個版本受到相應刪除限制。理解版本層級，才不會把新增新版和破壞舊版混為一談。',
 '不可變保存能降低誤刪或惡意刪除的風險，但選錯保留模式或期限可能讓資料在不需要時仍不能清除並持續計費。必須先確認業務及合規要求，而不是在正式資料上隨意試最強模式。',
 [['先辨認保護的版本','Object Lock需要配合版本控制理解。確認你要保留哪一份版本，讀取目前檔名的結果與某個舊版是否仍存在，是兩個不同問題。'],['分清不同保留模式','Governance與Compliance的可繞過程度不同，相關權限與條件也不同。不能假設任何管理員都能解除，也不能把兩種模式當成名稱不同而行為相同。'],['安排法律保留與到期管理','法律保留與按日期計算的保留期有不同解除方式。生命週期即使想清理物件，也仍須受適用保留限制；這會影響儲存與清理計畫。']],
 '公司要求合約原文在指定期間內不得被提前刪除。',
 ['由法務與管理者確認保留模式、期限與解除授權。','先在可控制的測試範圍驗證新增版本、刪除及到期行為。','在正式資料套用正確配置，監控保存成本並保留還原流程。'],
 '不可變保留保護特定內容不被提前破壞，但仍需正確權限、資料分類與備份策略配合。',
 [['版本控制','版本控制讓歷史內容存在；Object Lock進一步限制其刪除。保有歷史和禁止提前刪除是不同能力。']],['s3','versioning','policy'],'Object Lock保護一個舊版本，是否代表同key永遠不能再新增其他版本？','不是。應分清保護特定版本與禁止所有新寫入，兩者並非同一件事。');
 add('ebs',
 '一台電腦除了執行程式的CPU，還需要保存作業系統、程式檔案與資料的磁碟。EC2是租來的電腦，EBS則是可供它使用的一種持久磁碟服務。持久表示資料不只存在執行中的記憶體，但仍必須理解刪除設定與故障範圍。',
 'EBS提供區塊儲存，作業系統把它當成可讀寫的磁碟。你可在上面建立檔案系統，或由資料庫讀寫其資料檔。磁碟本身位於一個AZ，不能直接把同一顆EBS隨意接到另一個AZ的主機。',
 '需要一般磁碟語意、開機磁碟或應用資料檔時，EBS常是合適選項。費用和效能不只看容量，還可能涉及磁碟類型、IOPS及吞吐配置；備份也應另外安排。',
 [['選擇符合存取的磁碟','大量小筆隨機讀寫和順序讀大型檔案，關心的效能指標不同。先量測操作次數、資料量和延遲，再決定磁碟類型與設定。'],['理解掛載與資料保存','磁碟要在合適AZ與主機使用，作業系統還需辨認或掛載它。EC2停止、重啟或終止時，磁碟保留與否依生命週期及刪除設定不同，不能一概而論。'],['用快照處理備份與跨AZ重建','快照保存可供重建的資料狀態，能在適合位置建立新磁碟。它不是同一顆磁碟瞬間跨AZ漂移，也不保證尚未寫入磁碟的應用資料已完整保存。']],
 '單台EC2上的應用把資料存在EBS，希望AZ失效後能在別處復原。',
 ['確認資料持久性、終止時刪除設定及所需復原目標。','安排快照或適當備份，測試應用一致性。','在另一AZ建立新磁碟和運算環境，實際測量還原與重啟時間。'],
 '持久磁碟能保存資料，不等於整套應用已高可用或具備跨區即時切換。',
 [['S3','S3以物件介面保存檔案；EBS提供給主機的區塊磁碟。兩者存取方式不同，不能無修改互換。']],['ec2','az','iops','snapshot'],'把EC2放到另一個AZ，就能直接把原AZ的同一顆EBS接過去嗎？','不能這樣假設。EBS是AZ範圍資源，跨AZ通常需由快照等方式建立另一顆磁碟。');
 add('snapshot',
 '磁碟裡的檔案一直在改變，發生誤刪後，你可能想回到改錯以前的狀態。快照用來保存某個時間點的資料狀態，供之後建立或還原資源使用，不是讓另一台應用同時即時處理所有新寫入。',
 '在EBS情境，snapshot是磁碟的備份表示，可用來建立新的EBS磁碟。後續快照具增量機制，不表示你還原時必須手動拼接每一個歷史檔案；服務管理必要資料的關聯。不同AWS服務的快照具體行為仍需分開理解。',
 '快照可協助備份、複製及遷移，但拍下磁碟狀態不一定等於應用交易已完整一致。仍在記憶體或快取中的資料，可能需要應用協調才能正確寫入與恢復。',
 [['先決定要保存什麼狀態','確認單顆磁碟或多磁碟應用的範圍，必要時配合暫停寫入、資料庫備份工具或其他一致性流程。不能只看快照完成就忽略應用驗證。'],['記錄可追溯的備份資訊','以標籤、日期及用途管理快照，限制分享和刪除權限。涉及加密時還要確保還原者有合適的金鑰授權，不然有副本也可能讀不出來。'],['透過重建驗證復原能力','由快照建立新磁碟，掛到測試主機後檢查檔案和應用能否正常使用。需要多久恢復，應以這套過程量測，而不是只用建立快照的速度推估。']],
 '資料庫主機更新前要保留可回復的磁碟狀態。',
 ['先按照資料庫需求讓資料達到可恢復的一致狀態。','建立並記錄快照及加密條件，再執行更新。','定期從快照還原到隔離環境，確認資料及應用正常。'],
 '快照的價值在於能用它恢復所需狀態，不只是清單裡出現一個成功備份的名稱。',
 [['複寫','複寫持續傳送變更，可能也傳遞錯刪；快照保留較早時間點，但還原需要步驟和時間。']],['ebs','backup','replication'],'快照建立成功，就能保證資料庫每筆未完成交易都可以直接使用嗎？','不能。磁碟狀態與應用一致性不同，需按資料庫機制備份並測試還原。');
 add('efs',
 '網站有多台Linux主機時，若每台只看到自己的本機檔案，上傳到第一台的內容可能在第二台找不到。當應用真正需要多台電腦共用同一套檔案與目錄操作時，就要評估共享檔案系統，而不是只把每台磁碟加大。',
 'EFS提供受管的網路檔案系統，支援的Linux運算資源可透過NFS協定存取。對程式而言，它像一個掛載後可操作的共享資料夾；底層仍有網路路徑、權限、效能模式及部署類型等條件。',
 '它能減少自行架設檔案伺服器的管理工作，但多台共同使用也意味著共享資料的競爭、權限及故障影響需要設計。Regional與One Zone選項的故障範圍不同，不能因同叫EFS就一概而論。',
 [['先確認應用需要檔案語意','若應用會列目錄、開檔、修改內容並期待共享檔案行為，EFS可能適合。單純保存可下載圖片時，物件儲存也許更直接，無需強迫所有資料走共享掛載。'],['讓主機能掛上檔案系統','需配置合適的mount target、網路與安全規則，作業系統也要使用支援的掛載方式。看得到EFS名稱，不表示每個子網都已可連線。'],['管理權限與效能','檔案及目錄權限、存取點或其他控制要符合應用身分。大量小檔或高吞吐工作需觀察實際效能，不要把共享目錄當成沒有任何容量或成本限制的本機硬碟。']],
 '兩台Linux網站主機必須讀寫同一份既有應用檔案。',
 ['確認程式確實依賴共享檔案操作而非單純物件下載。','選擇符合可用性需求的EFS配置，安排各AZ的連線。','測試兩台的存取權限、同時寫入及某台被替換後資料仍可使用。'],
 'EFS解決共享檔案的存取需求，應用仍需處理正確性、權限與同時操作。',
 [['EBS','EBS提供主機使用的區塊磁碟；EFS提供共享網路檔案語意。並非把一顆一般EBS接給很多台就等於EFS。']],['nfs','ec2','storage'],'多台Linux要共用檔案，是否只需讓每台都有更大的本機磁碟？','不是。容量變大沒有解決共享視圖，需要適合的共享儲存與網路存取。');
 add('fsx',
 '不同既有應用對檔案系統的要求可能不同：Windows程式可能依賴SMB和網域登入，科學運算可能需要大量平行讀寫。若只看到「共用檔案」四個字就選同一服務，可能連協定都不相容。',
 'Amazon FSx是一組受管檔案系統產品，不是一種所有行為都相同的磁碟。常見產品包括Windows File Server、Lustre、ONTAP及OpenZFS等，各有不同協定、資料能力、效能與部署選項。',
 '受管服務可減少自己部署部分檔案伺服器的工作，也能滿足特定既有應用需求。選擇仍需具體到產品與配置；某個FSx產品的高可用或整合特性，不能直接套到其他產品。',
 [['從應用相容性開始','先問應用使用SMB、NFS或其他介面，是否需要Active Directory或特定檔案功能。可建立共享資料夾不代表能完整支援原本程式所需的行為。'],['再看工作負載的效能','大量小檔、順序大型檔與平行科學運算關心的瓶頸不同。選擇容量和效能模式前，要了解資料量、同時使用者及存取方式。'],['檢查部署與復原配置','單AZ、多AZ、備份、資料匯入匯出等支援情況依產品不同。需驗證故障後應用如何重新連線，以及備份是否可在目標環境使用。']],
 '公司Windows應用要求SMB共享並整合既有目錄身分。',
 ['盤點協定、權限與網域依賴，不直接改用Linux NFS。','評估FSx for Windows File Server及合適的可用性配置。','測試應用讀寫、權限、斷線後重新連線與檔案還原。'],
 '選型答案不是「FSx」一個總稱，而是符合需求的具體檔案系統及部署模式。',
 [['EFS','EFS常用於支援Linux的NFS共享；Windows SMB等需求應比較相應產品，而非只看是否受管。']],['storage','smb','nfs'],'FSx某個產品支援的協定，是否代表所有FSx產品都相同？','不代表。FSx是產品家族，需核對實際選用的檔案系統與配置。');
 add('rds',
 '訂餐網站不只保存照片，還要記住會員、訂單、餐點明細及付款狀態，並能問「這位會員昨天有哪些訂單」。關聯式資料庫用彼此有關係的資料表安排這些紀錄，並提供查詢與交易能力，不是只把每筆內容存成一個下載檔案。',
 'RDS提供受管關聯式資料庫。你選擇支援的資料庫引擎與部署方式，由AWS承擔部分底層管理；應用透過資料庫連線和SQL等對應介面讀寫資料。受管範圍較多，不等於沒有需要選擇的容量和權限。',
 '它適合需要關聯、交易或相容既有資料庫的應用。客戶仍要設計資料表、查詢、應用帳號、網路存取、備份策略和足夠容量，也要理解所選模式如何故障切換。',
 [['先選相容的資料庫','確認應用使用的引擎、語法及功能，而不是只因都能執行SQL就假設完全相同。遷移前需測試程式與資料轉換。'],['區分讀取擴展和故障接手','讀取副本常用來分擔查詢；Multi-AZ的目標包含故障接手，但不同模式的可讀能力不同。先說明需求，再選對部署。'],['驗證資料可還原','自動備份、時間點復原與快照有不同使用方式及保留範圍。成功建立資料庫後，還要測試誤刪資料與主節點故障各如何處理。']],
 '既有MySQL訂單系統希望減少管理資料庫主機的工作。',
 ['先確認版本和功能相容，測試查詢與交易。','選擇合適容量、私有網路和應用帳號權限。','依停機與資料損失容忍度安排部署及備份，定期測試還原。'],
 'RDS接手部分平台管理，沒有替你設計訂單模型，也不會讓低效率查詢自動消失。',
 [['S3','S3保存物件檔案，RDS提供資料庫引擎及交易查詢。都能保存資料，但使用方式和保證不相同。']],['sql','backup','multi-az'],'選RDS後，還需要限制應用帳號只能操作必要資料嗎？','需要。受管的是部分平台責任，不是把所有應用授權都變成安全的預設答案。');
 add('sql',
 '當會員資料和訂單資料分開保存時，你會需要按條件找出資料，甚至把兩邊關聯起來。SQL讓你用描述條件和操作的語句，向支援的資料庫說出要找什麼、增加什麼或修改什麼，而不必手動逐個翻檔案。',
 'SQL是一類資料定義、查詢及修改語言，常用在關聯式資料庫。資料表像有欄位規格的紀錄集合，每列是一筆資料；JOIN可依關聯條件把不同表的資料結合。不同引擎的語法與功能仍可能不同。',
 '它適合需要明確關聯與多種條件查詢的情境，但會寫一條SQL不表示它必然有效率或安全。索引、資料量、交易規則和使用者權限都會影響執行。',
 [['先理解資料模型','會員表可保存會員編號與姓名，訂單表保存訂單編號及會員編號。把欄位關係安排清楚，才能正確找到某個人擁有的訂單。'],['描述查詢需要的結果','SELECT選欄位，WHERE限制條件，JOIN依關係連接資料。應只取需要的內容，並確認條件不會誤選大量或不屬於該使用者的紀錄。'],['修改要顧及一致性和安全','付款與庫存等操作可能需要交易，避免只改一半。使用參數化查詢處理使用者輸入，不能把任意輸入直接拼成可執行命令。']],
 '網站要顯示會員A最近十筆已付款訂單。',
 ['用會員身分找到對應識別碼，先確保登入者有權查看。','依會員編號、付款狀態和時間條件查詢需要的欄位。','檢查結果正確性及查詢計畫，資料增加時評估索引和成本。'],
 'SQL是向資料庫表達需求的方法，資料庫引擎與資料設計決定如何完成它。',
 [['DynamoDB鍵值存取','DynamoDB通常先依已設計好的鍵存取資料，不應把任意多表JOIN程式直接搬過去而不改模型。']],['rds','dynamodb','partition-key'],'兩種資料庫都提到SQL，就能保證原程式不修改直接搬過去嗎？','不能。引擎語法、資料型別、交易與功能差異都需驗證。');
 add('read-replica',
 '同一個資料庫既要處理下單寫入，又要供大量報表查詢。若查詢占了太多資源，可以把資料複製到另一個資料庫，讓部分讀取到那邊進行，減輕主要資料庫的工作。這和保證故障時立即自動接手，不是完全相同的目的。',
 '讀取副本保存主要資料庫複寫而來的資料，可供支援的讀取工作使用。常見RDS副本以非同步方式追上主要節點，所以剛完成寫入時，副本可能還沒看到最新內容；具體行為依引擎與配置而定。',
 '把合適的查詢移出去能增加讀取能力，但應用通常需選擇正確的連線入口。若所有查詢仍連主要資料庫，只建立副本而不修改使用路徑，不會自然分擔負載。',
 [['挑選可以接受延遲的讀取','歷史報表可能容許稍晚更新；付款後立即確認剛新增訂單則可能要求更即時的結果。先依業務決定哪些要求可送到副本。'],['觀察複寫落差','資料變更多或副本處理不足時，落差可能增加。監控延遲和錯誤，不能用「副本」兩字就保證隨時完全相同。'],['另外安排故障用途','有些副本可被升級用於復原，但提升、入口變更和應用重新連線都需要流程。不能把所有讀取副本都視為已完成自動容錯的部署。']],
 '每天的銷售報表讓下單資料庫變慢。',
 ['確認報表可以接受的資料新鮮度。','建立適合讀取副本，把報表連線移到副本而非主節點。','監控延遲，並保留需要最新交易結果的主要讀取路徑。'],
 '讀取擴展和高可用需分開驗收，副本不是所有需求的同一個答案。',
 [['Multi-AZ','傳統RDS Multi-AZ單一standby不供一般讀取；Multi-AZ DB cluster則有可讀備援。要辨識實際模式。']],['rds','replication','consistency'],'剛寫入後從非同步副本找不到資料，就一定代表寫入遺失嗎？','不一定。可能只是副本尚未追上，要確認寫入結果與正確讀取路徑。');
 add('multi-az',
 '把兩份重要工作都放在同一個故障地點，該地點停電時可能一起停止。多AZ部署的起點是跨越這個共同故障範圍，在同一Region不同可用區安排資源，使單一AZ失效不必然讓整個服務一起消失。',
 'Multi-AZ是一種部署概念，並非所有服務行為都相同。在RDS，傳統Multi-AZ DB instance有一個不供讀取的standby；Multi-AZ DB cluster有兩個可協助接手、也可讀取的備援實例。看到名稱後仍要確認具體模式。',
 '分散部署能改善可用性，但成本、資料複寫、入口切換與應用重連都要考慮。它不等於跨Region災難復原，也不保證錯刪資料不會一起傳到另一份。',
 [['先定義故障範圍','要求承受單台主機、單一AZ或整個Region故障，所需設計不同。不能只堆更多同AZ資源，就聲稱能承受AZ故障。'],['確認各元件能否接手','應用、資料庫與入口都要有合適能力。資料庫具備備援不表示應用只放一台也能繼續接單；依賴鏈需一起檢查。'],['測試切換和資料保護','故障後可能有偵測與重連時間，需讓應用處理暫時錯誤。另行安排備份和還原，因為複寫也可能傳遞壞資料。']],
 '公司要求訂單系統在一個AZ出問題後仍能恢復服務。',
 ['將可替換的應用分散到不同AZ並安排健康入口。','選擇符合需要的資料庫多AZ模式，確認可讀與接手行為。','演練應用重新連線、剩餘容量與資料還原，而非只看配置勾選完成。'],
 '多AZ降低某些共同故障風險，真正復原表現仍需實測。',
 [['備份','備份提供可回到較早狀態的副本，通常要經還原；多AZ主要處理持續服務和故障接手，不能互相完全取代。']],['az','availability','backup'],'RDS的Multi-AZ一律不能讀取備援嗎？','不是。傳統單一standby與Multi-AZ DB cluster的讀取能力不同，必須看模式。');
 add('aurora',
 '一般訂單系統需要能做交易的關聯式資料庫，又可能想把讀取分散並縮短故障接手時間。Aurora把資料庫運算節點與共享的分散式儲存架構一起設計，讓你用支援的MySQL或PostgreSQL相容方式操作資料。',
 'Aurora不是任意資料庫都可無修改搬入的通用名稱。叢集中有處理寫入的writer，其他reader可分擔讀取並作故障候選；應用通常使用對應端點，而不是把每個節點的位址寫死在程式裡。',
 '這種設計提供擴展和復原選項，但查詢、連線、容量、權限及成本仍需管理。相容不等於與原引擎的每個功能及操作細節完全一致，遷移需要驗證。',
 [['先理解運算與資料的分工','資料庫節點執行SQL與交易，底層儲存保存資料。多個reader不表示每個都是互不相關、完全獨立的資料倉庫。'],['用對寫入和讀取入口','Writer端點用於需要寫入的連線，reader端點可把連線分配給合適讀取節點。它主要分配連線，不能期待逐條SQL都被平均切分。'],['安排接手與應用重連','Writer故障時可依配置進行接手，但現有連線可能中斷。應用要能重新連線，並對重試的重要交易處理冪等與正確性。']],
 '購物網站希望訂單寫入與熱門商品查詢分流。',
 ['確認應用和選用Aurora引擎相容。','將可接受相應一致性行為的讀取送到讀取入口，交易寫入使用正確入口。','監控連線與查詢，演練writer切換及資料還原。'],
 'Aurora提供資料庫架構能力，應用仍需正確選連線路徑並處理失敗。',
 [['RDS傳統Multi-AZ','Aurora的叢集及共享儲存模型，不能直接當成傳統RDS一主一standby的另一種名稱。']],['rds','writer','reader','sql'],'只有一條長期讀取連線使用reader endpoint，是否保證每條SQL平均分到所有reader？','不保證。端點主要在建立連線時分配，應用連線方式會影響實際負載。');
 add('dynamodb',
 '有些應用最常做的事很單純：已知道訂單編號，要快速找到那筆訂單，或知道會員編號要取回購物車。若先把這些找資料方式設計清楚，就不一定需要每次任意連接很多資料表。DynamoDB主要針對這類鍵值和文件存取提供受管資料庫。',
 '你可以把每筆item看成一份有屬性的紀錄，主鍵用來辨認它。Partition key參與資料分布，某些表還使用sort key安排同一分組裡的查詢。這不是隨便放入資料後就自動具備所有想得到的搜尋方式。',
 '服務減少主機維護並提供大規模存取能力，但鍵、索引、容量模式和一致性選擇仍會影響效能與費用。不能把需要任意SQL JOIN的程式原封不動搬過來，期待查詢模型完全相同。',
 [['先列出要怎麼查','例如以orderId找訂單、以customerId列最近訂單。依這些存取方式設計鍵與索引，不把全表掃描當成每次使用者查詢的預設方案。'],['避免工作集中在少數鍵','資料分散不等於流量一定平均。熱門鍵被大量讀寫時，仍可能形成瓶頸，要按工作負載選擇合適設計。'],['用條件保護並行更新','兩個要求同時修改庫存，不能只各自先讀再寫而不考慮競爭。條件寫入或交易可協助表達必要規則，重試也需辨識業務識別碼。']],
 '網站用會員編號取得購物車，確認訂單時避免重複建立。',
 ['設計直接查到購物車的鍵，不逐次掃描所有會員。','依流量評估容量模式，觀察熱門鍵與限制。','以訂單識別碼及條件規則控制重複建立，選擇合適一致性讀取路徑。'],
 'DynamoDB的易管理不代表資料模型不重要，反而需要先想清楚常見查詢。',
 [['RDS','RDS常用關聯表格與SQL查詢；DynamoDB通常以事先設計的鍵與索引存取。不同需求可能選不同資料庫。']],['partition-key','consistency','idempotency'],'想新增一種依任意欄位搜尋的功能，是否完全不必改DynamoDB資料模型？','不能這樣保證。需要重新評估鍵、索引與查詢成本，不應直接改成頻繁全表掃描。');
 add('partition-key',
 '資料量和請求很多時，服務不希望所有工作都擠在同一個儲存位置。分割區索引鍵用來協助決定資料分布及主要存取方式。可以把它想成整理規則，但好的整理方式也必須適合使用者實際來取資料的頻率。',
 '在DynamoDB，partition key是主鍵的一部分，服務依它安排資料位置。表可以只有這個鍵，也可以搭配sort key；後者讓同分組的多筆項目還能按另一個值識別及查詢。',
 '鍵的設計會影響你能否直接找到資料，以及請求是否過度集中。很多不同值有助某些分布，但若所有客人同時讀同一筆熱門資料，仍不代表流量平均；不能只數鍵的種類就宣告設計完成。',
 [['先把查詢句子寫出來','例如已知會員編號，找他的最近訂單。鍵應讓常見查詢有明確路徑；不能因某欄位看起來漂亮就選它，之後每次又掃描整張表。'],['檢查熱門分組','把所有事件都用today當partition key，可能讓今日全部工作集中。選鍵時要看寫入頻率、讀取分布及是否有非常大的單一分組。'],['同時考慮排序與索引','若需要同會員依時間篩選，可評估sort key等設計；新的查詢模式可能需要索引或不同資料安排，不是任意加一個欄位就自動高效可查。']],
 '裝置每秒回傳很多事件，團隊考慮以日期當唯一分組。',
 ['列出事件寫入量與主要查詢方式。','檢查同一天是否會形成過度集中工作，評估更分散且可查詢的鍵。','用真實分布測試負載，而不是只用少量平均資料驗證。'],
 '鍵同時是資料定位與工作分布的設計，必須和查詢一起思考。',
 [['一般欄位','一般屬性可以描述資料，但不一定直接提供所需的高效率查詢路徑；主鍵與索引有不同角色。']],['dynamodb','throughput','sql'],'有一百萬個不同會員編號，就能保證永遠不會有熱門鍵瓶頸嗎？','不能。若大部分流量集中同一會員或同一資料，仍需處理工作分布不均。');
 add('consistency',
 '你把收件地址改成新地址，接著立刻重新整理，卻可能在某種系統看到舊地址。這不是只問檔案有沒有備份，而是在問寫入完成後，哪些讀取會在什麼時候看見這次變更。這類保證稱為資料一致性。',
 '一致性有不同模型。強一致讀取在支援的條件下，期待讀到該路徑已成功完成的最新寫入；最終一致則容許部分讀取短暫看到舊副本。具體保證必須連同資料庫、索引、區域與讀取方式來理解。',
 '商品瀏覽可能容許短暫舊介紹，付款確認卻可能不能接受。選較強保證可能涉及費用、延遲、可用支援範圍等取捨，因此不是一律最強或一律最便宜就能回答所有需求。',
 [['先定義可接受的舊資料','說明使用者剛修改後是否一定要立刻看見結果，以及哪些資料會影響付款或權限。沒有這個需求，就很難判斷何種讀取路徑適合。'],['確認實際支援的範圍','同一服務的主表、索引與跨區域功能可能有不同選項。不能因主表支援某種讀取，就以為所有索引或所有複寫模式也同樣支援。'],['與交易和備份分開看','讀到最新值不代表多個操作已成為一筆完整交易，也不代表可以找回昨天資料。並行更新、交易邊界及歷史復原需要其他能力配合。']],
 '付款成功後，網站要顯示剛成立的訂單。',
 ['確認成功回應表示哪一步寫入已完成。','選擇支援所需新鮮度的資料讀取路徑。','處理重試與並行更新，避免把讀取保證當成所有正確性問題的答案。'],
 '一致性要從使用者可見結果出發，再對應服務實際提供的保證。',
 [['耐久性','耐久性關心資料是否長期不遺失；一致性關心何時看見變更，兩者不是相同指標。']],['dynamodb','replication','eventual-consistency'],'讀取是強一致，就代表有昨天的備份可還原嗎？','不代表。最新讀取保證與歷史資料保存、還原是不同問題。');
 add('eventual-consistency',
 '系統可能保存多份資料副本，以改善容量或故障處理。當一份內容剛更新，變更傳到其他副本需要時間；這段時間內，讀取不同副本可能看到不同新舊狀態。最終一致允許這種暫時落差，但不是允許資料永遠任意錯誤。',
 '在這個模型下，如果沒有後續更新，副本最終會收斂到相應的新狀態。實際可觀察行為依服務和讀取路徑而定。它不是「每次讀到舊資料都可以不管」，應用仍需對使用者需要的資料新鮮度負責。',
 '容許落差可換取某些效能與成本特性，適合部分瀏覽、搜尋或統計。但涉及剛完成交易立即確認時，需要評估是否改用其他支援路徑或調整互動流程。',
 [['辨認讀取來自哪裡','主資料、索引、快取或讀取副本可能有不同傳播路徑。先確定你讀的是哪一份，再判斷舊結果是正常傳播落差還是真正失敗。'],['不要把立即查不到當成失敗證明','若建立訂單已成功，下一次從最終一致路徑查不到，不應直接再建立另一筆相同付款。需要業務識別碼及可理解的等待或重查流程。'],['找出不能接受落差的部分','可將一般商品介紹走容許落差的路徑，把交易確認改走支援較強保證的讀取。不同需求不必使用完全同一種讀法。']],
 '訂單寫入成功後，次要索引查詢短暫還沒有那筆資料。',
 ['確認寫入是否真的成功及索引的一致性語意。','避免因查不到就重複建立訂單，保留相同業務識別碼。','依需求從合適主資料路徑確認，或向使用者表示狀態更新中。'],
 '最終一致需要被納入流程，而不是當成資料正確性可以放棄的理由。',
 [['強一致','強一致是特定讀取保證，支援範圍與成本需核對；不能靠增加等待猜測，就把最終一致服務改稱強一致。']],['consistency','replication','idempotency'],'索引暫時查不到剛建立的訂單，最危險的直覺處理是什麼？','不確認原寫入狀態就建立並付款第二筆；這可能讓正常傳播延遲變成重複交易。');
 add('cache',
 '很多人同時看同一份商品介紹時，後端每次都重新讀取和組合相同答案，會浪費時間與資料庫資源。快取把常用答案的副本放在較快或較近的位置，讓之後相同需求有機會直接重用。',
 '快取是一種使用副本的做法，不是一個永遠正確且永不消失的原始資料庫。找到可用副本稱為命中，找不到稱為未命中；未命中通常要回到原來源取得資料，再依規則更新副本。',
 '它常能降低延遲與重複讀取負載，但也會帶來舊資料、失效與權限隔離問題。若不同使用者本來應看到不同內容，卻共用同一個快取鍵，就可能把私人內容送錯人。',
 [['先決定哪些答案可重用','較少變動的公開商品資訊通常容易評估；付款、權限或高度個人化資料要更謹慎。不是所有回應都因為很熱門就適合無條件快取。'],['設計鍵與過期方式','鍵要包含會改變答案的重要條件，過期或失效則決定副本能用多久。資料更新後如何清掉舊答案，也應是寫入流程的一部分。'],['保護快取失效後的來源','若大量副本同時過期，請求可能一起湧回資料庫。要考慮錯開到期、限制下游負載及降級，不能假設快取永遠都在。']],
 '首頁每秒大量讀取同一份商品介紹，但內容一天只改幾次。',
 ['快取可重用的公開介紹，量測命中率。','更新商品時使舊副本失效或設定合理期限。','測試整個快取失效時資料庫是否仍能承受流量。'],
 '快取用速度與副本管理換取效率，正確性和故障保護仍要另外設計。',
 [['備份','備份為資料復原保存歷史，快取通常為速度保留可重建副本；不能把唯一重要資料只留在快取。']],['latency','ttl','elasticache'],'加了快取後，資料更新還需要處理舊副本嗎？','需要。否則使用者可能持續取得舊答案，速度變快不表示內容變正確。');
 add('ttl',
 '一份副本如果可以永遠不更新，就可能一直提供昨天的資料。TTL通常用一個時間值表達資料可被保留或視為有效多久，但不同服務使用這個名稱時，實際發生的動作不完全相同。',
 '在快取情境，TTL影響副本何時需要重新取得或檢查；在DNS，影響查詢結果可被暫存的時間；DynamoDB的TTL則用於符合時間條件的項目到期清理，並非到期瞬間一定刪除。',
 '設定時間是在資料新鮮度、來源負載、成本與清理行為之間取捨。把時間設很短可能增加回源工作；設很長可能讓更改較晚被看見。不能只看到TTL三個字就認定它保證立即更新或刪除。',
 [['先問這個服務怎麼解讀時間','確認欄位格式、使用哪個時間，以及到期代表失去快取效力還是開始具備刪除資格。服務文件中的具體語意比縮寫本身更重要。'],['依業務容忍度選擇','公開文章可以接受幾分鐘舊內容，權限取消卻可能不能。高風險操作不應只靠一個可能陳舊的快取值作唯一判斷。'],['考慮同時到期的尖峰','很多副本在同一秒失效，會讓來源突然忙碌。分散期限與妥善回源可降低風險，也要觀察真正命中率與更新表現。']],
 '網站改價後，使用者仍看到舊商品頁面。',
 ['找出瀏覽器、CloudFront或應用哪一層有副本。','核對該層TTL及失效規則，必要時執行適當更新。','讓結帳仍確認權威價格，不以頁面快取單獨決定交易。'],
 'TTL是管理副本與到期行為的工具，不是對所有服務相同的即時排程保證。',
 [['事件通知','事件通知可以啟動更新工作，但可能有重試與延遲；TTL是另一種期限機制，兩者可配合而非完全互換。']],['cache','dns','dynamodb'],'DynamoDB資料過了TTL時間，就能保證那一秒已看不到該筆資料嗎？','不能。需理解其非即時清理行為，應用若要立即排除過期資料仍要依需求處理。');
 add('elasticache',
 '資料庫一再回答相同問題時，可以把常用結果放到記憶體為主的快速資料服務，減少重複查詢。記憶體存取通常很快，但你仍要決定何時寫入、何時作廢，以及副本消失後從哪裡重建。',
 'ElastiCache提供受管的記憶體資料儲存與快取能力，使用方式及持久性依引擎和配置不同。它不是在資料庫旁邊一開啟，就自動把所有SQL變成高命中率快取的開關；程式或架構要安排存取流程。',
 '常見用途包括熱門查詢結果、工作暫存狀態或其他低延遲資料存取。若要存不可遺失的唯一業務紀錄，必須仔細核對持久性、復原和故障語意，而不是只因速度快就直接替代權威資料庫。',
 [['建立明確的讀取路徑','常見旁路快取做法先查快取，未命中再讀資料庫並回填。每一步的錯誤處理與期限都要設計，不能把空結果和服務故障混為一談。'],['更新資料時處理舊值','商品修改後可刪掉或更新對應快取，並設定合理TTL。鍵的安排要區分使用者與查詢條件，避免資料混用。'],['設計失效與容量行為','快取也可能失效、資料被移除或空間不足。監控命中率、延遲與容量，測試失效時是否造成所有請求一起打爆原資料庫。']],
 '商品詳情查詢太多，使RDS變慢。',
 ['確認哪些內容可接受短暫副本與重用。','在應用安排快取命中、未命中及更新流程。','壓測快取整體失效，限制資料庫負載並觀察成本。'],
 'ElastiCache提供快速存取工具，正確的資料生命週期才能把速度變成可靠體驗。',
 [['CloudFront','CloudFront常在網路邊緣快取HTTP內容；ElastiCache常由應用直接使用。它們位於不同位置，操作模型也不同。']],['cache','ttl','rds'],'ElastiCache有資料時，是否代表原資料庫一定不再需要？','不是。若資料只是可重建快取，權威紀錄仍需有可靠保存位置。');
 add('sqs',
 '客人下單時，網站可能還要寄信、產生發票或處理圖片。如果每一步都讓客人一直等，而且背景程式一慢就拖住整個網站，流量尖峰時很容易一起失敗。佇列先保存待辦工作，讓接單與實際處理可以用不同速度進行。',
 'SQS是受管訊息佇列。送出者把描述工作的訊息放進去，接收者之後取出並處理。訊息通常包含工作所需識別或資料位置，而不是代替執行程式；SQS不會只因收到一則寄信訊息，就自行替你寫好寄信內容。',
 '緩衝工作能減少瞬間流量直接打到下游，也讓接收者失效時有重試空間。但佇列積壓、重複投遞、過期與失敗訊息都需要監控，不能把「已送入」和「業務已完成」當成相同結果。',
 [['把工作說清楚再送入','例如訊息帶orderId及需要寄信的事件，讓處理者知道要查哪筆資料。若網站先回覆已接受，要讓使用者理解這不一定是全部背景步驟已完成。'],['接收後處理再刪除','接收者取得訊息後，先完成工作，再依目前收據識別刪除。只是接收不代表永久移除；未正確刪除可能在可見性逾時後重新出現。'],['讓重試不造成重複副作用','Standard佇列可能重複投遞，處理者應以業務識別碼做冪等。長期失敗可配合死信佇列調查，積壓則需看下游速度而不只是一直增加接收者。']],
 '促銷時網站每秒接到很多需要寄確認信的訂單。',
 ['先可靠記錄訂單，再把寄信工作放到SQS。','背景程式依可承受速度取出，寄送成功後刪除訊息。','記錄已寄送的業務識別，避免重試重寄，並監控積壓及失敗。'],
 'SQS把時間和速度解耦，工作正確完成仍需靠接收程式與資料紀錄。',
 [['SNS','SNS常把一則事件分送給不同訂閱者；同一條SQS的多個接收者通常是在分攤同一份工作。']],['async','visibility-timeout','idempotency'],'訊息已成功進入SQS，就能直接對客人保證確認信已寄出嗎？','不能。這只證明工作已被接受，實際寄送與成功記錄仍由後續處理完成。');
 add('visibility-timeout',
 '一個接收者把工作取出後，可能需要一段時間才完成。如果其他接收者立刻也看見同一份工作，就容易重複處理；但若第一個接收者突然故障，也不能讓工作永遠卡在它手上。可見性逾時在這兩種需求之間安排暫時隱藏。',
 'SQS訊息被接收後，會在指定期間內對其他接收者暫時不可見。若成功處理並刪除，就結束這份佇列工作；若沒有刪除而時間到，訊息可以再次被接收。隱藏不是把訊息永久刪掉。',
 '時間太短，第一個處理者還沒結束，其他人就可能開始同一份工作；時間過長，故障後可能等更久才重試。應按實際處理時間、重試方式與整合服務建議設定，而不是固定越大越安全。',
 [['預估正常及較慢的處理時間','量測工作需要多久，考慮網路及下游波動。超過可見性不代表原處理程式被自動停止，它可能還在繼續執行，所以仍需避免重複副作用。'],['必要時更新可見性','對支援的處理方式，可在工作持續時調整可見性，但要有逾時和失敗策略。不能因某個程式卡住，就無限制讓所有工作永遠不可見。'],['成功後用正確收據刪除','接收回來的receipt handle用於對應這次接收操作。不要把業務訂單編號、訊息ID及收據混為一談；它們各有不同用途。']],
 '圖片轉換通常三十秒完成，但某些大型圖片需要更久。',
 ['量測處理時間分布，設定足以涵蓋合理工作的可見性。','設計適當延長或失敗重試，不讓同一圖片無限卡住。','用冪等方式寫結果，完成後再刪除訊息。'],
 '可見性提供暫時占用的時間窗，不是業務正確性或只執行一次的完整保證。',
 [['訊息保留期','保留期決定佇列能保存訊息多久；可見性決定接收後多久暫時隱藏，兩個時間處理不同問題。']],['sqs','idempotency','dlq'],'可見性到期後，原來的處理程式一定已被終止嗎？','不一定。它可能還在執行，因此重複接收仍需靠業務冪等等設計保護。');
 add('dlq',
 '有些工作不是多試一次就會成功，例如訊息缺少必要欄位或引用的資料已不存在。如果這些工作一直和正常工作混在一起重試，既浪費容量，也讓真正錯誤更難調查。死信佇列提供一個分開保存失敗工作的地方。',
 '在SQS等支援情境，DLQ是另一條佇列，依配置接收超過重試條件等失敗訊息。它不會自動讀懂錯誤原因或修好內容，而是讓團隊有機會觀察、分類、修復，再決定是否重新送回處理。',
 '把失敗隔離可讓主流程繼續，也避免永遠無聲丟失問題。代價是你要監控這個區域、安排保存時間與處理責任；如果從來沒人看，DLQ只是把問題移到另一個看不見的角落。',
 [['決定何時隔離','依工作特性設定重試門檻。暫時性網路錯誤可能適合重試，永久格式錯誤則需修正；門檻過低可能把短暫波動過早判為失敗。'],['保留調查線索','保存足夠的業務識別、錯誤紀錄及版本資訊，但避免把不必要祕密放進訊息或日誌。要能分辨是程式錯、資料錯還是下游故障。'],['修好後再安排重送','重新送入前先驗證根因已解除，並限制重送速度。若先前其實已完成部分副作用，仍需冪等或補償，不能把所有DLQ訊息盲目再跑一次。']],
 '一批訂單訊息因新版格式不相容反覆失敗。',
 ['透過DLQ告警發現並抽樣檢查錯誤原因。','修正接收程式或資料格式，在隔離測試確認。','有控制地重送，監控結果並避免重複付款或重複寄送。'],
 'DLQ把失敗變成可管理的待處理項目，並不會自動讓業務恢復正確。',
 [['備份','DLQ保存失敗訊息供調查，備份為資料復原設計；不能用DLQ代替所有業務資料備份。']],['sqs','idempotency','cloudwatch'],'訊息進DLQ後，是不是就不用再理它？','不是。仍要監控、調查及決定修復或處置，否則工作只是被延後而沒有完成。');
 add('idempotency',
 '付款請求送出後，客戶端沒收到回應，不知道是伺服器沒做，還是做完卻在回程斷線。直接再送一次可能變成扣兩次款。冪等要處理的是：同一筆業務要求被重複提出時，不要產生超過一次應有的副作用。',
 '冪等不是保證程式只執行一次，而是讓重複執行或重複要求仍得到符合契約的結果。通常需要一個能辨認同一業務動作的識別碼，並以可靠紀錄、條件操作或交易，協調是否已處理與如何回應。',
 '網路重試、佇列投遞及故障恢復都可能造成重複。只看訊息ID或認為FIFO會包辦外部付款，往往不足以保護整筆交易；要以真正的業務邊界設計。',
 [['定義同一件事的身分','同一訂單的同一付款嘗試應重用合適識別，不把每次重試都當成全新付款。不同合法付款則不能誤共用同一識別而被當作重複。'],['協調紀錄與副作用','先標完成再付款，可能標了卻沒付；先付款再記錄，也可能付完來不及記。需要按付款服務能力和資料庫交易等條件安排流程，而不是只加一個布林欄位。'],['為重複要求回覆可理解結果','已成功的要求可回原結果，進行中或失敗情況也需有明確契約。紀錄保留多久要涵蓋合理重試範圍，不能隨便清掉後又允許同一動作重做。']],
 '客人按付款後網路斷線，App自動重試。',
 ['App為同一付款意圖帶相同業務識別碼。','後端用支援的條件或交易機制確認並協調處理。','重試時辨認先前狀態，返回結果或安全地續作，避免第二次扣款。'],
 '正確性來自整個業務流程，而不只是把重試次數設為零。',
 [['佇列去重','佇列去重可抑制部分重複送入，但外部付款與資料庫副作用仍需自己的正確性設計。']],['sqs','dynamodb','api'],'冪等的意思是程式絕不會被呼叫兩次嗎？','不是。可能呼叫多次，但應避免同一業務動作造成重複且不該有的副作用。');
 add('fifo',
 '同一張訂單若先收到取消、後收到建立，處理結果可能錯亂。有些工作需要維持相關事件的先後順序，但不代表全世界所有訂單都必須排成一條完全不能平行的長隊。先找出誰和誰需要比較順序，才有辦法設計。',
 'FIFO代表先進先出。在SQS FIFO中，同message group內提供順序處理相關保證，並有送入去重機制。不同群組可平行，去重也有適用條件及時間窗，不能延伸成所有外部交易永遠只發生一次。',
 '這適合需要相關訊息順序的工作。若把所有工作都放到同一群組，可能失去平行能力；若每個相關事件都給不同群組，又可能沒有得到原本需要的順序。',
 [['先定義順序範圍','例如同一orderId的建立、付款和取消有先後關係。不同訂單通常可同時處理，因此可用合適分組保留必要順序，而不必全站共用同一串。'],['處理發送端重試','去重識別和內容去重等設定需符合實際要求。保留相同業務意圖的識別，不在每次重試任意換新值，否則服務無法知道你想抑制什麼。'],['接收端仍需可靠完成','接收後失敗可能重試，外部服務也可能完成但回應遺失。付款等副作用仍要冪等，失敗隔離與重送也要評估是否影響順序。']],
 '同訂單的事件必須依序處理，但不同客人的訂單可平行。',
 ['以訂單識別安排MessageGroupId等合適分組。','依發送規則配置去重與重試識別。','測試接收故障、重送及外部交易的重複保護。'],
 '順序、送入去重與業務冪等是合作的不同能力。',
 [['Standard SQS','Standard適合一般工作緩衝，不能把其盡力排序當成相同的FIFO群組順序保證。']],['sqs','idempotency','dlq'],'不同訂單都一定要放同一message group，才能使用FIFO嗎？','不一定。群組應依需要維持順序的業務範圍設計，合適分組能保留平行能力。');
 add('sns',
 '訂單成立後，帳務、通知和分析三個系統可能都需要知道。如果只是三個程式競爭同一條工作佇列，通常是分攤工作，不是每個系統都拿到一份。發布訂閱模型讓發送者只公告一次，再由不同訂閱者各自處理。',
 'SNS讓發布者送訊息到topic，再向符合條件的訂閱目標分送。Topic可以先理解成公告主題，不是業務資料庫。訂閱目標的種類與投遞行為依服務配置不同，常見做法是每個用途搭配自己的SQS。',
 '發送者不必逐一知道所有後續應用，新增訂閱也較容易。但訊息投遞、權限、重試和接收者速度仍需考慮；不能把發布成功當成每個下游業務都已完成。',
 [['建立清楚的事件契約','訊息應描述已發生的事或需要通知的內容，例如OrderCreated及訂單識別。各訂閱者知道如何解讀，版本變更也要協調。'],['讓每個用途獨立接收','帳務、通知與分析可各有自己的訂閱或佇列，必要時用篩選條件。某個慢消費者的積壓就不必直接代表所有其他用途都停下。'],['配置授權及失敗處理','目標要允許指定來源投遞；加密和跨帳號還可能有額外權限。監控失敗、重試和死信處理，接收程式也應避免重複副作用。']],
 '一筆新訂單同時需要寄信與累積銷售分析。',
 ['訂單服務向對應SNS topic發布事件。','通知與分析各訂閱自己的SQS，依自己的速度處理。','限制topic和queue權限，監控各分支失敗並設計冪等。'],
 'SNS讓一份事件擴散給多個用途，每個用途是否完成仍有自己的狀態。',
 [['SQS','一條SQS通常讓接收者分攤同一批工作；SNS可把一則發布扇出到多個訂閱者。']],['fanout','sqs','idempotency'],'三個程式共讀一條SQS，就等於SNS把每則訊息各送一份給三個用途嗎？','不是。要每個用途都有副本，需適當發布訂閱及獨立接收分支。');
 add('fanout',
 '一個事件常有很多不同後續用途：出貨需要訂單、財務要記帳、通知要寄信。扇出是把這一份事件送到多個獨立分支，各分支不必搶同一張唯一工作單，也不用由發送者逐個同步等待完成。',
 '它是一種分送模式，不限定只能由某個產品完成。典型AWS設計是SNS topic訂閱多個SQS queues，各隊列給一個用途。每個用途取得的是自己的工作副本，可以有自己的速度、重試和失敗管理。',
 '分支隔離有助擴充功能，分析變慢也不必讓寄信一起積壓。但會增加訊息副本、權限、監控及資料一致性協調；不同分支完成時間不一定相同。',
 [['先區分分攤與複製','多個接收者共讀一條佇列是分攤工作；多條訂閱佇列各拿到一份，才符合每個用途都要處理的扇出需求。'],['讓分支有自己的生命週期','每個用途可以設定處理容量、重試及死信策略。要避免某個分支回頭阻塞主訂單流程，也要知道哪個下游尚未完成。'],['思考重複與資料範圍','各分支仍可能重試，重要副作用要冪等。只傳送需要的資料或識別，避免為方便把敏感個資複製到不需要的分析系統。']],
 '新增訂單後，帳務、簡訊和報表都要收到通知。',
 ['定義一份可供三方理解的訂單事件。','用適當topic與三個獨立接收分支分送。','分別監控完成與失敗，讓某個分支修復後可安全續作。'],
 '扇出解決每個用途都需要一份事件，不代表多個業務結果瞬間同時完成。',
 [['同步逐一呼叫','主程式直接等待每個下游，會讓延遲和故障耦合；扇出讓它們較能獨立處理，但需要追蹤非同步結果。']],['sns','sqs','async'],'分析分支出問題時，為什麼獨立queue比所有用途共用一條更容易管理？','它有獨立積壓與重試狀態，不必讓其他用途競爭或一起承受同一條工作流程。');
 add('eventbridge',
 '應用、AWS服務和外部軟體都可能發出事件，例如訂單成立、檔案完成或排程時間到了。不同事件要送到不同地方，若所有路由規則都寫在一支巨大的自訂程式裡，會越來越難維護。',
 'EventBridge提供受管事件匯流排與相關整合能力。事件可看成描述事情已發生的資料；規則依事件內容選擇目標。它幫你安排分送路徑，不會自動實作每個目標收到之後的業務工作。',
 '內容路由與跨服務整合能減少自訂接線，但仍要設計事件格式、權限、失敗和重播需求。它不等於所有訊息都嚴格全域保序的串流，也不能取代所有工作佇列需求。',
 [['先定義事件內容','例如source表示來源，detail-type表示事件種類，detail保存業務資料。名稱與欄位要有穩定契約，否則規則可能因格式改變而不再符合。'],['用規則比對適當目標','訂單建立送往工作流程，庫存警告送往通知。比對規則不是查詢任意資料庫；需要的判斷資料必須在事件或後續處理中安排。'],['驗證未命中與投遞失敗','沒有規則符合和目標執行失敗是不同問題。依支援能力安排重試、DLQ或封存重播，並讓下游能處理重複事件。']],
 '公司要把多個系統的OrderCreated事件送到訂單協調流程。',
 ['協調事件欄位與版本，避免每個系統各寫不同格式。','建立內容規則與目標授權，測試合法和不符條件事件。','監控投遞及處理結果，演練失敗與安全重播。'],
 '事件路由讓系統更容易連接，完整可靠性仍來自事件契約與下游設計。',
 [['Kinesis','Kinesis偏向保留、分區讀取和重讀串流；EventBridge常用於內容規則及服務事件整合，消費模型不同。']],['async','sns','step-functions'],'規則已成功符合，就能保證下游訂單一定處理成功嗎？','不能。符合、投遞及下游業務完成是不同階段，都需要適當觀察與失敗處理。');
 add('step-functions',
 '一筆訂單可能要先確認庫存，再付款，成功才出貨，失敗則取消或退款。如果把所有等待、分支與重試都塞進一支程式，流程難讀，程式中斷後也不易知道走到哪一步。',
 'Step Functions讓你用狀態機描述工作流程。狀態機就是目前在哪一步、收到什麼結果後到哪一步的明確規則。工作可交給Lambda或其他支援服務，流程本身協調先後、等待與錯誤分支。',
 '可視化與受管協調有助追蹤長流程，但它不會保證外部付款和資料庫修改自動成為一筆不可分割交易。Standard與Express等模式的執行特性、限制和費用也需按需求比較。',
 [['拆出有明確結果的步驟','每一步要知道輸入、成功輸出及錯誤，例如付款成功後取得付款識別。不要只用模糊的「處理訂單」遮住所有業務狀態。'],['定義等待、分支與重試','只有可安全重試的錯誤才適當重試，其他情況應走修復或補償路徑。等待外部結果不需要用一段程式不停空轉輪詢。'],['處理已完成的副作用','庫存已保留但付款失敗，可能要釋放庫存；付款已成功但出貨失敗，也需要明確後續動作。流程重跑時仍需冪等。']],
 '客人付款前要保留庫存，付款失敗應把庫存還回。',
 ['把保留、付款及確認訂單分成可追蹤步驟。','定義付款失敗的釋放庫存分支，暫時錯誤則按規則重試。','演練每一步中斷及重跑，檢查不會重複扣款或永久占用庫存。'],
 '工作流程把協調規則說清楚，資料正確性和補償仍需按業務設計。',
 [['SQS','SQS保存待辦訊息供稍後處理；Step Functions描述多步協調流程。兩者可以一起使用而非互相完全取代。']],['lambda','async','idempotency'],'Step Functions中設定Retry後，付款步驟就不需要冪等了嗎？','仍需要。重新呼叫可能遇到先前已完成但回應遺失的情況，流程協調不能包辦外部副作用。');
 add('kinesis',
 '大量裝置持續送出測量值時，不同應用可能都想讀同一段歷史：監控程式看即時狀態，分析程式稍後重新計算。若一個接收者拿走後資料就像工作單一樣被刪掉，其他用途就難以各自重讀。',
 'Kinesis Data Streams保存連續進來的事件串流，消費者依自己的進度讀取。資料依partition key等機制分布，順序保證要看分區範圍，不是把整條大串流想成所有事件都全球單一排序。',
 '它適合高頻事件、多個獨立消費者和重讀歷史的需求。仍需規畫保留期、容量、熱鍵、消費速度及錯誤重試；資料超過保留範圍後，不應假設隨時仍能重新取得。',
 [['先選分區依據','同一裝置需要保序的事件，可評估用裝置識別作分區鍵，但也要檢查熱門裝置是否造成負載集中。鍵的選擇同時影響順序與容量。'],['讓每個消費者記錄進度','處理到哪個位置需要可恢復的紀錄，故障後可能重讀一段。消費者應能處理重複並監控自己落後多少，而不是只看發送成功。'],['把即時與長期保存分工','串流保留支援有限範圍的重讀，長期歷史可另行交付到S3等保存位置。分析需求與復原範圍應在資料離開保留期前安排好。']],
 '感測器事件同時供警報與每日統計使用。',
 ['依事件來源及順序需求設計partition key。','讓兩個消費者各自讀取及保存處理進度。','監控容量和延遲，並把需要長期保存的原始事件另存。'],
 '串流讓多個用途依進度讀同一批事件，但不免除分區與消費者管理。',
 [['SQS','SQS常用於分攤待辦工作；Kinesis常用於保留可由多個消費者各自讀取及重讀的事件串流。']],['partition-key','throughput','idempotency'],'不同消費者讀Kinesis時，一個讀過就會讓其他人失去這筆事件嗎？','不是。它們有各自進度，可在保留範圍內讀取；這和共同競爭一條工作佇列的模型不同。');
 add('firehose',
 '應用不斷產生日誌或事件，最終想把資料集中保存到S3等目的地。若自行寫程式，就要處理接收、累積成批、傳送、失敗重試及目的地整合。Firehose把這類持續交付資料的部分工作做成受管服務。',
 'Amazon Data Firehose會依設定接收資料、緩衝並交付到支援目的地。緩衝可以理解成先累積一批再運送，而不是每來一個事件就保證立刻出現在最終查詢資料裡；具體延遲和功能依配置而定。',
 '它能減少自己管理資料傳送程式的負擔，適合持續落地與部分分析整合。仍要選對來源、目的地、格式、權限及失敗保存方式；成功接收不代表每筆資料已被後續報表立即讀到。',
 [['先確定交付契約','說清楚來源送什麼格式、目的地要保存在哪個位置，以及可接受的資料延遲。後續分析程式需要能辨認欄位和資料分區，而不只是看到很多檔案。'],['理解緩衝與轉換','批次交付可降低某些處理負擔，支援的轉換也需正確設定。若需要每筆事件立即觸發決策，不能忽略累積與交付時間直接當成相同用途。'],['安排失敗與授權','來源、轉換與目的地各可能有權限或格式錯誤。監控交付失敗並保留調查或重處理途徑，避免只看入口收到資料就宣布整條管線正常。']],
 '網站要把點擊事件持續保存到S3，隔一段時間做分析。',
 ['定義事件格式及目標儲存位置。','配置Firehose交付與相關角色，確認延遲符合分析需求。','測試格式錯誤和目的地不可用，觀察失敗保存及恢復。'],
 '它是資料交付管線的一部分，資料治理與分析正確性仍需其他設計。',
 [['Kinesis Data Streams','Data Streams著重保留串流並讓消費者按進度讀取；Firehose著重將資料交付目的地，消費模式不同。']],['kinesis','s3','async'],'資料剛送進Firehose，就一定能在S3查到對應檔案嗎？','不一定。需考慮緩衝、交付與後續處理時間，不能把接收成功當成立即落地。');
 add('data-lake',
 '公司可能同時有網站日誌、訂單匯出檔、照片及裝置事件。不同團隊想用不同方法分析它們，若每種需求都先搬到一套固定表格，可能重複保存又限制之後用途。資料湖先提供集中保存和治理多種資料的架構。',
 '資料湖不是一個神奇地自動理解所有檔案的資料庫，也不是單一AWS產品。常見做法是以S3保存原始及整理後資料，搭配資料目錄、轉換、查詢及權限工具，讓不同用途按需要使用。',
 '保留原始資料有利重新分析，但若沒有命名、格式、來源與品質管理，集中之後只會更難找到正確版本。資料放得下不代表分析結果可信，也不表示所有人都應可讀取全部內容。',
 [['分開原始與整理後區域','原始資料可保留來源內容，整理區則保存清理和標準化結果。明確標示資料日期與處理版本，避免把未驗證原料誤當成正式報表依據。'],['建立可理解的目錄','記錄欄位意義、格式、位置、更新頻率與負責人。Glue Catalog等工具保存部分中繼資訊，但不會自動知道每個金額欄位的業務意義。'],['把查詢與治理接起來','Athena等工具可讀取相應資料；權限、加密、敏感資訊及保存期仍須管理。使用分區、欄式格式等安排，可以影響查詢速度及掃描費用。']],
 '營運想把各系統日誌與交易匯出集中做每日分析。',
 ['先盤點資料來源、敏感程度及可接受更新延遲。','保存原始內容，建立受控整理流程和資料目錄。','讓查詢工具使用合適整理資料，驗證結果並限制存取。'],
 '資料湖把保存、整理與分析解耦，成功關鍵是資料能被正確理解和使用。',
 [['資料倉儲','資料倉儲常為結構化分析模型安排資料；資料湖可保留多樣原始與整理資料。兩者可合作，不必把其中一個當成全部需求的替代品。']],['s3','glue','athena'],'把全部檔案丟到同一個bucket，就自動成為好用的資料湖嗎？','不是。還需要來源、品質、格式、目錄、權限和保存政策等治理。');
 add('glue',
 '不同系統輸出的資料格式常不一樣：有的日期是文字，有的金額單位不同，有的欄位缺漏。如果分析工具不知道資料放哪裡、每欄是什麼，查詢就可能失敗或得到錯誤結果。需要先整理資料，並維持可供查詢的描述資訊。',
 'AWS Glue提供資料整合、轉換及目錄等能力。資料目錄可以記錄表格欄位和資料位置，轉換工作則可讀取原始資料、清理或改格式再寫出。目錄裡的描述不是S3檔案本體，建立一個表名也不代表資料自動被清洗。',
 '受管整合能減少自己維護某些資料處理環境的工作，但轉換規則、資料品質、執行成本與存取權限仍需設計。工具推測出的結構，也不等於經過業務確認的正確資料意義。',
 [['先辨認原料的問題','列出來源格式、欄位、時區、重複紀錄與缺漏情形。若只把CSV改成另一種檔案，而忽略金額單位，查詢仍可能算錯。'],['分清轉換與目錄','轉換工作改變或產生資料內容；Catalog描述欄位及位置供工具使用。修改目錄型別不會自動把原始檔案內的錯誤值修好。'],['驗證與安排重跑','轉換流程要能處理失敗及重跑，避免重複加總或覆寫錯誤分區。監控處理量和費用，並保留足夠來源資訊方便追查。']],
 '每日交易CSV要清理後轉成Parquet供Athena分析。',
 ['確認欄位型別、日期與金額規則。','執行Glue轉換並保存整理後資料，再維持正確目錄描述。','比對筆數與總額，測試同一天重跑不會重複計算。'],
 'Glue協助把原料變成可分析資料，正確規則與驗證仍由團隊定義。',
 [['Athena','Athena主要執行查詢；Glue可處理資料整合與目錄。能查詢不代表資料已被正確轉換。']],['etl','data-lake','parquet'],'修改Glue Catalog欄位名稱，就一定會改掉S3檔案裡的實際內容嗎？','不會。目錄描述與資料本體是不同層次，需要轉換工作才會真正改變資料內容。');
 add('etl',
 '分析需要的資料往往不是原封不動就能使用。你可能要從多個系統取出紀錄、把日期和單位統一、排除無效列，最後放到可供報表使用的位置。ETL就是把這些動作分成清楚階段來思考。',
 'ETL是Extract、Transform、Load：擷取、轉換及載入。它是一種資料處理流程概念，不是某一台主機或某個服務的品牌。轉換可包含清理、合併、計算或改格式；每個規則都應有明確業務意義。',
 '明確流程有助重複執行、追查錯誤及建立品質檢查。若來源新增欄位、規則改版或工作重跑，沒有設計好就可能產生重複或不一致資料，而不是簡單多執行一次就修復。',
 [['擷取時記住來源範圍','要知道取的是哪一天、哪個版本及是否包含晚到資料。只保存最後結果而沒有來源資訊，出錯時很難知道是哪個系統或批次造成。'],['轉換時驗證資料意義','例如把各國金額換成同單位、統一日期時區，而不只是改檔案副檔名。缺值如何處理、重複紀錄如何識別，也需明確規則。'],['載入時處理重跑與公布','新結果應在完整驗證後供報表使用，避免使用者讀到只寫一半的批次。重跑同一資料範圍時，要避免重複加入原本已載入的紀錄。']],
 '三家分店每天匯出銷售檔，總部要做一份統計。',
 ['擷取每家分店該日資料並記錄來源。','統一欄位、時區和幣別，檢查重複與缺漏。','載入整理區，核對總額後讓報表查詢新版本。'],
 'ETL把資料移動與改造變成可管理流程，內容是否正確仍取決於規則。',
 [['ELT','ELT先載入再在目的地轉換；順序與運算位置不同，應依工具及治理需求選擇，不是只換字母名稱。']],['glue','data-lake','sql'],'把CSV直接複製到新位置，是否一定已完成所需的資料清理？','不是。資料有移動，不表示欄位、品質及業務規則已被正確轉換。');
 add('parquet',
 '一份交易資料有日期、會員、商品、地址和金額，但某份報表只需要日期與金額。如果保存方式讓讀取工具每次都搬整列所有欄位，就可能讀了很多不需要的內容。欄式格式把同欄位資料組織在一起，讓適合的分析工具能省略部分讀取。',
 'Parquet是一種欄式資料檔案格式，常和壓縮一起用於分析。它仍是資料檔案，不是自動接收訂單交易的完整資料庫。效益來自工具能依格式讀取所需欄位與相關資料區塊，而不是副檔名本身比較神奇。',
 '當查詢經常只讀部分欄位、掃描大量紀錄時，適當欄式格式可降低讀取量及費用。若每個檔案極小、分區混亂或查詢仍讀全部內容，效果也可能打折。',
 [['真的轉換檔案內容','把CSV改名成.parquet不會改變資料布局，需要由支援工具讀取原格式並輸出合法Parquet。還要維持欄位型別與資料意義正確。'],['配合查詢與資料組織','只選需要欄位，並用合適分區限制查詢範圍。格式與分區是合作關係，不能期待只改格式就自動忽略所有不相關日期。'],['管理檔案大小與版本','太多小檔會帶來額外管理和讀取負擔；結構變更也要讓查詢工具正確認識。轉換後應比較結果、筆數及掃描量，不只比較檔案大小。']],
 '分析師只想統計上週每日銷售金額。',
 ['以受控流程把交易資料轉成型別正確的Parquet。','按日期安排適當分區，維持資料目錄。','查詢只讀日期與金額並限制時間，對比原CSV的結果與掃描量。'],
 'Parquet是適合部分分析模式的資料布局，不能取代所有交易或資料治理需求。',
 [['CSV','CSV常按列以文字保存，簡單易交換；Parquet有不同結構與型別能力，需相應讀寫工具。']],['etl','athena','data-lake'],'把檔名從sales.csv改成sales.parquet，就能得到欄式讀取效益嗎？','不能。需要真正用支援工具轉換內容，並讓查詢工具按正確格式讀取。');
 add('athena',
 '資料已經存成檔案，分析師只是偶爾要問「昨天總共賣多少」，不一定想先建立並維護一組長期查詢主機。Athena提供受管查詢能力，讓你針對支援的資料來源，以SQL描述需要的分析結果。',
 '常見Athena用法是查詢S3中的資料檔案，搭配資料目錄了解欄位和位置。它不是把所有S3內容自動搬成另一個可逐筆下單的交易資料庫；能否正確查詢仍取決於格式、結構和權限。',
 '按需查詢很方便，常見計費模式會受掃描量影響。格式、壓縮、分區與選取欄位會改變實際工作；只在結果加LIMIT，不一定讓來源掃描量跟著大幅減少。',
 [['先讓工具知道資料在哪','建立或維護正確表格描述，確認來源格式、欄位型別及分區。若描述和資料不符，可能失敗或產生不正確結果。'],['限制真正需要的讀取','查上週資料時使用合適日期條件，選取需要的欄位。Parquet等格式可與此配合，但條件必須真正對應資料布局。'],['管理結果與費用','查詢結果也有保存位置和權限。可用workgroup等方式管理設定及使用，監控掃描量與錯誤，避免一個隨手全掃描造成不必要費用。']],
 '公司在S3按日期保存交易資料，想做每週銷售統計。',
 ['確認目錄和分區描述正確，資料已經過品質檢查。','用SQL限制該週並只取需要欄位。','檢查結果、掃描量及輸出權限，將常見查詢整理成受控方式。'],
 'Athena減少管理查詢主機的工作，但高效分析仍從資料布局與正確SQL開始。',
 [['RDS','RDS常承擔應用交易資料庫；Athena常用於分析支援來源。不要因都能寫SQL就把交易用途直接互換。']],['s3','sql','parquet'],'查詢只顯示十筆結果，是否保證只掃描十筆來源資料？','不保證。輸出筆數限制和實際讀取來源的工作量不是同一回事。');
 add('redshift',
 '營運報表可能一次讀多年交易，再按地區、月份和商品彙總。這和線上付款每次只改少量紀錄、要求立即回應的工作不同。資料倉儲針對大量分析查詢安排保存和運算，幫助把不同來源整理成可供報表使用的模型。',
 'Amazon Redshift是資料倉儲服務，支援大量分析與彙總。你仍需設計資料載入、模型、查詢及權限，並依提供的部署與運算模式管理容量和費用；不是所有資料很多的系統都該直接搬過來。',
 '它適合需要反覆複雜分析的工作負載。若問題是高頻、小筆、強交易語意的訂單更新，應先看適合交易處理的資料庫，而不是只用資料總量判斷。',
 [['先區分分析與交易需求','分析常掃很多列做聚合；交易常關心特定訂單能否正確寫入。兩種工作即使都使用SQL，對延遲、模型和執行方式的要求仍不同。'],['安排可追溯的資料載入','資料可能從營運系統或S3等進來，需要清理、去重及定義更新方式。報表新鮮度由整條管線決定，不是只看查詢服務速度。'],['量測查詢與使用成本','觀察常見查詢、資料布局及並行需求，避免為不必要工作保留過量容量。使用者和報表權限也應限制，分析副本並不自動失去敏感性。']],
 '公司需要把多個部門多年資料整合，提供常態交叉分析。',
 ['定義分析問題、更新頻率與可接受延遲。','建立資料整理和載入流程，驗證指標的業務意義。','量測Redshift查詢與容量，安排權限和成本管理。'],
 '資料倉儲為分析服務，和原本交易系統可以分工而不是彼此完全替代。',
 [['Athena','Athena常適合直接對支援資料來源按需查詢；Redshift偏向資料倉儲工作。應比較持續使用、複雜度及總成本。']],['sql','etl','data-lake'],'訂單資料量很大，就應直接把即時付款資料庫換成Redshift嗎？','不能只根據資料量。要先辨認交易和分析需求，選擇符合操作語意與延遲的系統。');
 add('cloudfront',
 '網站原始圖片放在某個地區，遠方客人每次都跨很遠網路取回，等待可能較久，原始服務也會承受許多重複要求。內容傳遞服務把合適的副本放到靠近使用者的位置，讓常用內容不必次次走回原點。',
 'CloudFront提供全球內容傳遞入口。來源可以是S3或其他支援服務；使用者向分發網域提出請求，服務依設定判斷能否使用快取，未命中時才向來源取得內容。它是入口與副本層，不是所有資料的唯一原始倉庫。',
 '快取可降低部分延遲和來源負載，也可整合HTTPS與防護。但私人內容、快取鍵、期限和來源存取都需正確安排，否則可能提供舊內容，甚至把不同使用者的結果混用。',
 [['先指定來源與公開入口','決定分發要讀哪個來源，使用者應連哪個網域。若來源是私人S3，可使用合適OAC和bucket policy，不必為展示網站就把整桶公開。'],['定義什麼回應可以重用','Cache key決定哪些請求會共用一份副本，TTL等設定影響副本可用多久。涉及登入、Cookie或個人資料時，不能隨意用相同公共快取策略。'],['安排更新與錯誤排查','檔名版本化和合適Cache-Control可協助發版；必要時使用invalidation。看到舊資料時，也要檢查瀏覽器和來源，不能只猜某台邊緣設備壞掉。']],
 '這個學習網站由私人S3提供檔案，希望各地讀者能透過HTTPS使用。',
 ['設定CloudFront來源及適合的來源存取授權。','讓HTML與靜態資產有合理快取方式，保持相對路徑可用。','測試正常瀏覽、來源拒絕、更新後內容及直接S3存取限制。'],
 'CloudFront改善傳遞方式，來源保存、權限及版本管理仍需一起設計。',
 [['Global Accelerator','Global Accelerator改善全球連線入口與路由，不以相同方式快取網站物件內容。']],['cache','s3','oac','https'],'CloudFront命中快取時，是否代表S3原檔可以隨便刪掉而不影響之後使用？','不能。副本會過期或未命中，來源仍需正確保存及可被授權讀取。');
 add('oac',
 '你希望客人從CloudFront看圖片，卻不希望任何人繞過入口直接讀S3。若只是把S3設成公開，所有知道網址的人可能都能嘗試直接取檔。需要讓來源能辨認「這次要求真的來自被允許的入口」，再配合資源政策控制。',
 'OAC是Origin Access Control，讓CloudFront以受驗證方式向支援來源提出要求。對一般S3 bucket來源，常用簽署請求並在bucket policy只允許指定distribution的讀取。OAC不是使用者登入系統，也不會自動給任何CloudFront分發全部資料權限。',
 '它有助保持來源私人並減少繞過入口的路徑，但必須選對來源類型、授權範圍和加密金鑰條件。S3網站端點與一般S3物件存取來源不同，不能直接套相同OAC配置。',
 [['先保持S3不是公共入口','規畫Block Public Access及最小bucket policy，避免另一條公開政策讓控制失去意義。正常管理和其他必要AWS服務的路徑也要考慮。'],['讓來源信任指定分發','把OAC接到合適來源，政策依CloudFront服務主體及指定SourceArn等條件限制。建立OAC物件本身，不等於bucket已經允許它讀取。'],['核對加密與真正讀取結果','若使用SSE-KMS等配置，還需適當金鑰授權。驗收時測試從CloudFront可讀，而直接S3匿名讀取被拒絕，並觀察來源錯誤。']],
 '商品圖片應只透過指定CloudFront入口提供。',
 ['使用一般S3 bucket來源並維持私人存取。','配置OAC及限定該分發的bucket policy，必要時補金鑰權限。','測試入口成功、繞過失敗及更新後仍可正常讀取。'],
 '來源保護是一整條信任與權限鏈，不是只打開某個勾選就完成。',
 [['簽署URL','使用者取得簽署URL是另一種受控存取方式；OAC主要處理CloudFront到來源的信任，兩者解決不同路段問題。']],['cloudfront','s3','policy','sse-kms'],'把OAC建好但bucket policy沒有允許讀取，網站一定能成功拿到圖片嗎？','不會。來源仍要有符合條件的授權，使用加密金鑰時也需核對金鑰權限。');
 add('waf',
 '網站入口每天收到的HTTP請求，不一定都來自正常操作；可能有人嘗試提交惡意內容，或以大量要求消耗資源。網路防火牆知道連線位址和埠號，卻不一定理解網址、標頭或表單裡的內容，因此需要更靠近應用請求的檢查。',
 'AWS WAF是Web Application Firewall，依配置規則檢查支援服務上的HTTP請求，並採取允許、封鎖、計數或其他支援動作。它可以使用受管或自訂規則，但不是替你重寫安全程式碼或識別每筆資料權限的萬能工具。',
 '規則能減少部分惡意流量進入應用，但也可能誤擋合法使用者。攻擊防護要配合輸入驗證、參數化查詢、身分授權和監控，不能因加上WAF就忽略後端漏洞。',
 [['把防護接到真正的入口','選擇支援的資源與正確關聯範圍，讓請求確實經過檢查。若另有未保護的公開來源，攻擊者仍可能走那條路繞過。'],['先理解規則會比對什麼','規則可關注HTTP內容或速率等條件。啟用前應用計數或測試觀察正常流量，避免把含特殊字元的合法表單全部當成攻擊。'],['用日誌與應用設計驗證','觀察阻擋原因和使用者回報，適當調整範圍。被允許的請求仍需在應用檢查資料操作權限，不能把WAF結果當成使用者有權查看任何訂單。']],
 '公開API遭大量可疑表單與高頻請求，合法客人也必須繼續使用。',
 ['在支援入口關聯合適Web ACL及規則。','先觀察計數、誤擋與來源路徑，再按需求調整動作。','同時修正後端輸入處理與授權，持續監控防護效果。'],
 'WAF是應用防護的一層，真正安全需要入口、來源與程式共同配合。',
 [['Security Group','Security Group主要限制網路連線；WAF理解部分HTTP請求內容。兩者所在層次與規則能力不同。']],['http','sg','cloudfront'],'WAF允許某個請求，就代表這個使用者有權讀任何人的訂單嗎？','不是。應用仍必須驗證身分及每筆資料的操作權限，WAF不代替業務授權。');
 return terms;

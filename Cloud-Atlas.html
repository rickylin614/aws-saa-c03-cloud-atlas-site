 ['versioning','版本控制','Versioning~versioning~版本控制','S3對相同物件名稱的不同寫入保留多個版本，幫助找回覆寫前或誤刪前的內容。','像文件保留每次存檔的版本，而不是只留最後一份。','note.txt覆寫後，仍可用version ID讀取舊版。','版本資料也佔儲存；刪目前物件不一定清除所有舊版本。','https://docs.aws.amazon.com/AmazonS3/latest/userguide/Versioning.html'],
 ['lifecycle','生命週期','Lifecycle~生命週期','依物件年齡等條件，自動轉換儲存類別或到期清除的規則。','像倉庫規定舊貨移到便宜庫位，到期後銷毀。','報表保存30天後轉較少存取類別。','生命週期不等於立刻執行的排程；轉換及最低儲存期可能影響成本。','https://docs.aws.amazon.com/AmazonS3/latest/userguide/object-lifecycle-mgmt.html'],
 ['object-lock','Object Lock','S3 Object Lock~Object Lock','為S3物件版本設定保留期間或法律保留，防止在對應條件下遭覆寫或刪除。','像把特定文件版本封存到到期前不能丟棄的檔案櫃。','合規要求的稽核紀錄使用不可變保留。','Governance與Compliance模式的權限及可解除程度不同。','https://docs.aws.amazon.com/AmazonS3/latest/userguide/object-lock.html'],
 ['ebs','Amazon EBS','Amazon EBS~EBS','給EC2使用的持久區塊儲存，像可掛載的硬碟，常放作業系統或資料庫檔案。','像租用主機的可保存硬碟。','EC2重新啟動後，EBS資料仍可存在。','EBS磁碟位於單一AZ；跨AZ使用要透過快照等方式建立。','https://docs.aws.amazon.com/ebs/latest/userguide/what-is-ebs.html'],
 ['snapshot','快照','Snapshot~快照','把某個時間點的磁碟等資料狀態保存下來，供建立新磁碟或復原使用。','像替資料狀態拍一張可還原的照片。','用EBS snapshot在另一個AZ建立磁碟。','快照不是運作中的即時副本；應用一致性也需考量。','https://docs.aws.amazon.com/ebs/latest/userguide/ebs-snapshots.html'],
 ['efs','Amazon EFS','Amazon EFS~EFS','讓多個支援的Linux運算資源透過網路共用檔案的服務。','像多個工作站共用同一個網路資料夾。','多台Web主機讀寫同一份共享內容。','EBS通常作區塊磁碟；EFS提供共享檔案語意。','https://docs.aws.amazon.com/efs/latest/ug/whatisefs.html'],
 ['fsx','Amazon FSx','Amazon FSx~FSx','一組受管檔案系統服務，提供Windows、Lustre、ONTAP、OpenZFS等不同特性。','像依用途挑選不同規格的共享檔案櫃。','Windows SMB應用可評估FSx for Windows File Server。','不同FSx產品的協定、可用性及效能不同，不能只看FSx總名稱。','https://docs.aws.amazon.com/fsx/latest/WindowsGuide/what-is.html'],
 ['rds','Amazon RDS','Amazon RDS~RDS','受管關聯式資料庫服務，幫你處理部分主機與資料庫管理工作，讓應用透過SQL讀寫資料。','像租用有專人管理的表格式帳本系統。','用MySQL相容資料庫記錄會員與訂單。','受管不等於不用設定權限、備份、容量或網路。','https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/Welcome.html'],
 ['sql','SQL','Structured Query Language~SQL','用來定義、查詢與修改關聯式資料表的一類語言。','像對帳本說「找出昨天付款的所有訂單」。','SELECT查詢資料，JOIN連結會員與訂單資料表。','會SQL不表示所有資料庫都支援相同語法及功能。','https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/Welcome.html'],
 ['read-replica','讀取副本','Read replica~read replica~讀取副本','由主要資料庫複寫資料，用來分擔讀取或作特定復原用途的副本。','像把帳本抄一份給查詢櫃台，讓主櫃台專心寫入。','報表查詢送到RDS read replica，降低主要資料庫讀取負載。','一般非同步複本可能落後；不是所有Multi-AZ standby都能讀。','https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/USER_ReadRepl.html'],
 ['multi-az','Multi-AZ','Multi-AZ~多 AZ~多AZ','把服務相關資源分散到同Region不同AZ的部署方式，降低單一AZ故障的影響。','同城多家分店互相備援。','RDS傳統Multi-AZ DB instance由備援節點在故障時接手。','RDS不同Multi-AZ模式讀取能力不同；Multi-AZ不是跨Region。','https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/Concepts.MultiAZ.html'],
 ['aurora','Amazon Aurora','Amazon Aurora~Aurora','AWS提供的MySQL或PostgreSQL相容關聯式資料庫，採叢集與共享分散式儲存設計。','像多個辦事窗口共用一套受管理的帳本底層。','Writer處理寫入，readers可分擔讀取並作容錯候選。','Aurora reader endpoint主要以連線分配，不是逐條SQL保證平均。','https://docs.aws.amazon.com/AmazonRDS/latest/AuroraUserGuide/CHAP_AuroraOverview.html'],
 ['dynamodb','Amazon DynamoDB','Amazon DynamoDB~DynamoDB','受管的key-value及文件資料庫，應用通常依預先設計好的key存取資料。','像以訂單編號直接領取訂單袋，不先翻遍所有資料表。','用orderId查某一筆訂單。','不應把需要任意SQL JOIN的應用直接搬過來而不重設資料模型。','https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/Introduction.html'],
 ['partition-key','分割區索引鍵','Partition key~partition key~分割區索引鍵','DynamoDB等服務用來決定資料分布與主要存取方式的鍵值。設計不均可能讓少數位置過忙。','像依訂單號把包裹分到不同櫃位；不能全部擠到同一櫃。','使用分散度足夠的customerId或組合鍵。','鍵很多不代表流量平均；單一熱門key仍可能成為瓶頸。','https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/HowItWorks.Partitions.html'],
 ['consistency','一致性','Consistency~一致性','描述寫入資料後，不同讀取者何時會看到這次變更的保證。','像多本帳本更新後，多久大家看到相同數字。','強一致讀取希望讀到已成功完成的最新寫入。','一致性不是資料有沒有備份，也不是保證所有跨服務交易成功。','https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/HowItWorks.ReadConsistency.html'],
 ['eventual-consistency','最終一致','Eventual consistency~最終一致','寫入後部分副本可能短暫回傳舊值；若沒有後續變更，副本最終會同步到新狀態。','像公告先貼到總部，其他分店稍後更新。','能接受短暫舊資料的商品瀏覽讀取可使用相應模式。','不表示資料會任意永久錯誤；也不表示所有服務都只有此模式。','https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/HowItWorks.ReadConsistency.html'],
 ['cache','快取','Cache~cache~快取','把常用資料的副本放在較容易或較快取得的位置，減少重複向原來源讀取。','像櫃台先放幾張常用表單，不必每次去總倉領。','CloudFront快取圖片；ElastiCache快取查詢結果。','快取可能過期或遺失，必須設計未命中時回原來源。','https://docs.aws.amazon.com/AmazonElastiCache/latest/dg/WhatIs.html'],
 ['ttl','TTL','Time to live~TTL','資料或紀錄可被當成有效副本使用多久的時間值。不同服務的TTL具體行為不同。','像表單上寫「此版本有效到幾點」。','CloudFront的TTL影響快取多久後需重新檢查來源。','DNS TTL、快取TTL與DynamoDB TTL不是同一套即時刪除機制。','https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/Expiration.html'],
 ['elasticache','Amazon ElastiCache','Amazon ElastiCache~ElastiCache','提供受管記憶體資料儲存與快取，常用於降低資料庫重複讀取或保存快速存取的暫存狀態。','像把熱門商品放在櫃台前的快速取貨區。','把熱門商品查詢結果快取，避免每次讀RDS。','不能假設快取永不遺失；需依使用情況設計持久性及回源。','https://docs.aws.amazon.com/AmazonElastiCache/latest/dg/WhatIs.html'],
 ['sqs','Amazon SQS','Amazon SQS~SQS','把待處理工作存進佇列，由消費者稍後取出處理的受管訊息服務。','像外帶訂單排隊架，廚房依自己速度取單。','網站先把寄信工作放入SQS，背景程式再寄送。','標準SQS可能重複投遞；成功處理後需正確刪除訊息。','https://docs.aws.amazon.com/AWSSimpleQueueService/latest/SQSDeveloperGuide/welcome.html'],
 ['visibility-timeout','可見性逾時','Visibility timeout~visibility timeout~可見性逾時','SQS訊息被接收後，暫時不讓其他接收者看見的時間；超時且未刪除時可再次被接收。','廚師取走訂單後暫時掛上「處理中」，時間到未完成就重新排隊。','處理需要30秒，逾時值要涵蓋合理執行與重試需求。','不是訊息保留期，也不是延遲多久才第一次顯示。','https://docs.aws.amazon.com/AWSSimpleQueueService/latest/SQSDeveloperGuide/sqs-visibility-timeout.html'],
 ['dlq','死信佇列','Dead-letter queue~Dead letter queue~死信佇列~DLQ','把超過重試條件等失敗訊息移到另一條佇列，供調查與修復後重新處理。','像把反覆出問題的訂單放到人工處理區。','格式錯誤的訂單重試多次後進入DLQ。','進DLQ不會自動修復資料，也不代表可以永遠不處理。','https://docs.aws.amazon.com/AWSSimpleQueueService/latest/SQSDeveloperGuide/sqs-dead-letter-queues.html'],
 ['idempotency','冪等','Idempotency~冪等','同一筆業務要求重複執行時，仍只產生一次應有的結果或副作用。','同一張取餐券掃兩次，仍只領到一份餐。','用orderId與條件寫入避免重試造成重複訂單。','佇列去重不能自動包辦外部付款等所有副作用。','https://docs.aws.amazon.com/lambda/latest/dg/best-practices.html'],
 ['fifo','FIFO','First-in-first-out~FIFO','先進先出的順序概念；SQS FIFO在同message group內提供順序與送入去重功能。','同一客戶的單據依序處理，不讓取消訂單先於建立訂單執行。','同訂單的事件使用相同MessageGroupId。','不同group可以平行；FIFO不代表任何外部交易都不需冪等。','https://docs.aws.amazon.com/AWSSimpleQueueService/latest/SQSDeveloperGuide/sqs-fifo-queues.html'],
 ['sns','Amazon SNS','Amazon SNS~SNS','發布者把一則訊息送到topic，再由服務分送給多個符合條件的訂閱者。','像廣播台：公告一次，讓不同部門各收到一份。','訂單成立同時通知帳務、簡訊與分析系統。','SQS消費者通常競爭同一份工作；SNS適合把副本扇出。','https://docs.aws.amazon.com/sns/latest/dg/welcome.html'],
 ['fanout','扇出','Fan-out~Fanout~扇出','一份事件分送成多個獨立處理分支，使不同用途各取得一份。','一張訂單影印三份，交給帳務、出貨與通知部門。','SNS topic訂閱三個SQS queues。','不是多個消費者共用一條queue就會每人都拿到同一訊息。','https://docs.aws.amazon.com/sns/latest/dg/sns-sqs-as-subscriber.html'],
 ['eventbridge','Amazon EventBridge','Amazon EventBridge~EventBridge','接收事件並依內容規則路由到目標服務的受管事件匯流排服務。','像依事件種類分送的郵件分揀中心。','把OrderCreated事件送往訂單工作流程。','EventBridge不取代所有高吞吐有序串流需求。','https://docs.aws.amazon.com/eventbridge/latest/userguide/eb-what-is.html'],
 ['step-functions','AWS Step Functions','AWS Step Functions~Step Functions','以狀態機描述多步工作流程，可安排分支、等待與錯誤重試。','像一張會執行的流程表，指示先付款、再出貨、失敗時怎麼辦。','付款成功才呼叫出貨服務，失敗走補償分支。','不是用來保存大量業務檔案的儲存服務。','https://docs.aws.amazon.com/step-functions/latest/dg/welcome.html'],
 ['kinesis','Kinesis Data Streams','Kinesis Data Streams~Kinesis','保存持續進來的事件串流，讓一個或多個消費者依進度讀取及重讀。','像一條保留歷史的輸送帶，不同工作站能各自讀取。','收集裝置事件供即時監控與後續分析。','工作佇列與可重讀串流的消費模型不同。','https://docs.aws.amazon.com/streams/latest/dev/introduction.html'],
 ['firehose','Amazon Data Firehose','Amazon Data Firehose~Data Firehose~Firehose','把串流資料緩衝後交付到S3等支援目的地的受管資料傳送服務。','像集貨車先裝一批貨再送到倉庫。','把應用事件持續落地到S3資料湖。','有緩衝交付時間；不是每個事件都立即出現在目的地。','https://docs.aws.amazon.com/firehose/latest/dev/what-is-this-service.html'],
 ['data-lake','資料湖','Data lake~data lake~資料湖','把多種原始或整理後資料集中保存，供不同分析工具按需要使用的儲存與治理架構。','像先保留各種原料的中央倉庫，再依分析需求加工。','S3保存CSV、JSON及Parquet供Athena查詢。','資料湖不是把所有檔案亂放；仍需格式、目錄與權限治理。','https://docs.aws.amazon.com/whitepapers/latest/building-data-lakes/building-data-lake-aws.html'],
 ['glue','AWS Glue','AWS Glue~Glue','協助資料整合、轉換與資料目錄管理的受管服務。','像資料加工廠加上一份原料登記冊。','把CSV轉Parquet，並在Catalog登記資料表。','Glue Catalog保存中繼資料，不等於把S3資料本體搬進Catalog。','https://docs.aws.amazon.com/glue/latest/dg/what-is-glue.html'],
 ['etl','ETL','Extract Transform Load~ETL','擷取資料、依規則轉換，再載入目的地的資料處理流程。','先收原料、清洗加工，再放到可使用的貨架。','清理事件欄位後轉成Parquet存回S3。','ETL是流程概念；Glue是可執行部分ETL工作的服務。','https://docs.aws.amazon.com/glue/latest/dg/what-is-glue.html'],
 ['parquet','Parquet','Parquet','以欄位為主保存資料的檔案格式，適合分析查詢只讀部分欄位並搭配壓縮。','像把帳本依欄分類保存，不必為一個欄位搬整本帳。','Athena只查金額欄時，可少掃描不需要的欄位資料。','格式適合分析不表示適合取代所有逐筆交易資料庫。','https://docs.aws.amazon.com/athena/latest/ug/columnar-storage.html'],
 ['athena','Amazon Athena','Amazon Athena~Athena','用SQL分析S3等支援來源資料的受管查詢服務，通常不需自己管理查詢主機。','像臨時請分析員直接閱讀倉庫裡的資料檔。','查詢S3上按日期分區的交易記錄。','常見計費受掃描量影響；LIMIT不一定減少掃描檔案的量。','https://docs.aws.amazon.com/athena/latest/ug/what-is.html'],
 ['redshift','Amazon Redshift','Amazon Redshift~Redshift','為大型分析與彙總設計的資料倉儲服務。','像專門做跨部門報表的分析中心。','彙總多年銷售資料與複雜分析查詢。','OLAP分析與高頻小筆OLTP交易需求不同。','https://docs.aws.amazon.com/redshift/latest/mgmt/welcome.html'],
 ['cloudfront','Amazon CloudFront','Amazon CloudFront~CloudFront','在全球節點傳遞網站內容的服務，可快取內容並把未命中請求送回來源。','像把熱門商品放到各地近端取貨站。','使用者從鄰近節點取得網站圖片。','CloudFront不是資料的原始倉庫；來源仍可能是S3或ALB。','https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/Introduction.html'],
 ['oac','Origin Access Control','Origin Access Control~OAC','讓CloudFront以受驗證的方式向支援來源送請求的存取控制機制。S3來源常用它保持bucket私有。','像讓只有指定物流公司能進入倉庫取貨。','Bucket policy只允許指定distribution透過OAC讀檔。','S3 website endpoint不能直接使用一般S3 bucket OAC設定。','https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/private-content-restricting-access-to-s3.html'],
 ['waf','AWS WAF','AWS WAF~WAF','檢查HTTP請求並依規則允許、封鎖或採取相應處理的Web防護服務。','像能檢查申請表內容的門口稽核員。','封鎖符合SQL injection規則的請求。','WAF關心應用HTTP請求；Security Group以網路連線規則為主。','https://docs.aws.amazon.com/waf/latest/developerguide/what-is-aws-waf.html'],
 ['shield','AWS Shield','AWS Shield~Shield','協助保護AWS工作負載免受分散式阻斷服務攻擊的服務系列。','像保護店門不被大量惡意人潮堵住。','依工作負載評估Shield Standard或Advanced的防護能力。','DDoS流量防護不等於能檢查所有SQL injection內容。','https://docs.aws.amazon.com/waf/latest/developerguide/shield-chapter.html'],
 ['route53','Amazon Route 53','Amazon Route 53~Route 53','提供DNS、網域相關功能與健康路由能力的服務。','像可依規則回答分店地址的電話簿。','主站不健康時，讓後續DNS查詢得到備援入口。','DNS切換受到快取與TTL影響，不是立即改掉所有既有連線。','https://docs.aws.amazon.com/Route53/latest/DeveloperGuide/Welcome.html'],

 ['policy-condition','Condition','Condition','IAM政策中讓規則只在特定情況下適用的條件欄位。','像「只限上班時間」或「只能從指定入口進入」。','依aws:SourceVpce限制只接受指定VPC端點的S3請求。','條件key是否存在與支援情境會影響結果，不能只憑欄位名稱猜測。','https://docs.aws.amazon.com/IAM/latest/UserGuide/reference_policies_elements_condition.html'],
 ['writer','Writer（寫入端）','Writer~writer~寫入端','資料庫叢集中接受寫入的主要端點或節點角色。','像有權修改正式帳本的主櫃台。','Aurora writer處理新增訂單與更新付款狀態。','Writer不是表示應用永遠只會寫不會讀；端點與節點的具體行為依服務而定。','https://docs.aws.amazon.com/AmazonRDS/latest/AuroraUserGuide/Aurora.Overview.Endpoints.html'],
 ['reader','Reader（讀取端）','Reader~reader~讀取端','資料庫中供應用讀取資料的端點或節點角色，常用來分擔查詢。','像只能查閱副本、不能修改正式帳本的查詢櫃台。','報表連到Aurora reader endpoint。','Reader可能有複寫延遲；不能把所有reader當成任意時刻都和writer完全相同。','https://docs.aws.amazon.com/AmazonRDS/latest/AuroraUserGuide/Aurora.Overview.Endpoints.html'],
 ['iops','IOPS','IOPS','每秒能完成多少次儲存讀寫操作的量度，常用於大量小筆隨機磁碟存取。','像櫃台每秒能辦幾次小筆取件。','資料庫大量隨機讀寫時，需要看IOPS是否足夠。','吞吐量看每秒傳多少資料；操作大小不同時，相同IOPS的吞吐量也可能不同。','https://docs.aws.amazon.com/ebs/latest/userguide/ebs-volume-types.html'],
 ['smb','SMB','Server Message Block~SMB','常見於Windows檔案分享的網路協定，讓電腦透過網路讀寫共享檔案。','像Windows工作站共用一個檔案櫃的溝通規則。','FSx for Windows File Server提供SMB共享。','Linux共享檔案常見NFS；不要把所有共享儲存都視為相同協定。','https://docs.aws.amazon.com/fsx/latest/WindowsGuide/what-is.html'],
 ['nfs','NFS','Network File System~NFS','讓電腦透過網路像使用檔案系統一樣存取共享檔案的協定，常見於Linux環境。','多台Linux工作站用相同規則操作中央資料夾。','EC2透過NFS掛載EFS。','能用HTTP取得S3物件，不等於S3本身就提供一般NFS檔案系統。','https://docs.aws.amazon.com/efs/latest/ug/whatisefs.html'],
 ['image','容器映像','Container image~映像~容器映像','保存程式、套件及啟動設定的封裝範本，容器會由這份範本啟動。','像包含工具與原料規格的密封工作包；啟動容器才真正開始工作。','把映像推到ECR，再由ECS啟動多份容器。','映像不是正在執行的容器；AMI則是EC2虛擬機器的範本。','https://docs.aws.amazon.com/AmazonECS/latest/developerguide/task_definitions.html'],
 ['orchestration','容器編排','Orchestration~編排~容器編排','安排容器在哪裡執行、需要幾份、如何連線及故障後如何補回的管理工作。','像排班主管決定每個工作站的人數、位置與替補。','ECS維持所需task數量並將健康容器接入ALB。','單一容器能啟動，不代表已具備整套擴展、網路與容錯安排。','https://docs.aws.amazon.com/AmazonECS/latest/developerguide/Welcome.html']
 );
 return rows.map(([id,term,aliases,plain,analogy,example,confusedWith,source])=>({id,term,aliases:aliases.split('~'),plain,analogy,example,confusedWith,source}));

</script><script>
/* Before service names, explain the everyday computing concepts they assume. */
(() => {
 const lessons={},entries=[];
 function add(id,term,aliases,startingPoint,meaning,analogy,why,how,situation,steps,result,comparison,prerequisites,question,answer,source){
  lessons[id]={startingPoint,meaning,why,how:how.map(([title,body])=>({title,body})),walkthrough:{situation,steps,result},compare:[{with:comparison[0],explanation:comparison[1]}],prerequisites,check:{question,answer},sources:[{title:'AWS 官方延伸閱讀',url:source}]};
  entries.push({id,term,aliases,plain:meaning,analogy,example:situation+' '+result,confusedWith:comparison[1],source});
 }
 add('aws','AWS（亞馬遜雲端服務）',['AWS','Amazon Web Services','亞馬遜雲端服務'],
 '你想開一個訂餐網站。除了做畫面，還需要某處持續執行接單程式、保存圖片與訂單，並讓客人的手機能連進來。自己購買所有設備是一種做法，向專門供應商租用則是另一種。',
 'AWS是Amazon提供的一組雲端服務，讓你透過網路申請運算、資料儲存、網路及其他功能。它不是單一程式，也不是只要開帳號就會自動完成網站的工具。EC2、S3、Lambda是其中不同用途的服務名稱：前者讓你使用虛擬電腦，S3保存物件資料，Lambda則有依事件執行程式的方式。',
 '像一個大型營業設施供應商：你可以租廚房、倉庫或配送工具，但仍要決定菜單、誰能進出以及出錯時怎麼處理。',
 '租用服務讓你不必先買齊硬體，也能依需要調整資源。不過費用、安全設定、資料保存與應用是否正確，仍要由你依服務分工規劃。不是每個功能都免費，也不是使用雲端就自動不會故障。',
 [['先提出具體需要','先問要執行程式、保存檔案，還是處理特定事件。這些需求對應不同服務，不能只因名稱熟悉就把所有東西放進同一種工具。'],['建立資源並設定權限','在自己的AWS帳號中選服務、位置和設定。建立出來的主機或儲存桶稱為資源；誰能讀寫、能否從網路連入，都要另外設定。'],['使用、監控與清理','服務建立後才開始放入程式或資料，並觀察是否正常與產生多少費用。不再使用時依資源種類清理，不能假設關閉瀏覽器就會停止所有資源。']],
 '把一間小店的菜單照片放上網，並處理顧客查詢。',['照片要長期保存，可評估S3。','接單程式需要被執行，可比較EC2與Lambda等運算方式。','為每個資源設好權限、備份及預算，再測試客人真正的使用流程。'],'你把網站的工作拆成可理解的部分，再選AWS服務，而不是背完產品名稱才知道要做什麼。',
 ['cloud','雲端是一種按需取得資源的方式；AWS是提供這些資源的供應商之一。雲端、AWS和EC2不是三個相同意思的名稱。'],['cloud','program','storage'],
 'AWS帳號建立後，訂餐網站是不是就已經完成？','不是。帳號只是使用服務的入口，你仍要設計功能、選資源、放程式與資料，並設定安全及維運方式。','https://aws.amazon.com/what-is-aws/');

 add('program','程式',['程式','Program','程式碼','Code'],
 '電腦不會只因為你放入菜單照片，就知道該怎麼計算價格、檢查庫存或建立訂單。你必須把要做的規則寫成電腦能執行的指示。',
 '程式是一組讓電腦依規則處理資料的指示；程式碼是人用程式語言寫下的內容。保存程式碼與執行程式是兩件事：一個檔案可以安靜地放在儲存空間裡，直到某個執行環境讀取它，才真的開始計算和處理要求。',
 '食譜寫在紙上不會自己變出料理。程式碼像食譜，執行程式像廚師真的依步驟備料、烹煮與出餐。',
 '網站的業務規則需要程式完成，例如只有付款成功才確認訂單。選EC2或Lambda是在決定程式在哪裡、以何種管理方式執行，不是在替你自動產生正確的業務規則。',
 [['先接收輸入','輸入是這次要處理的資料，例如餐點編號和數量。程式應檢查內容是否完整、格式是否正確，不能把使用者傳來的價格直接當作可信結果。'],['依規則處理','程式可能查資料、做計算或呼叫其他服務。這些動作需要運算能力，也可能需要讀取資料的權限；有程式碼不表示它就自動具備權限。'],['回傳或保存結果','結果可以回傳給使用者，也可以寫入資料庫。只在畫面顯示成功不等於資料已保存，因此程式應依實際保存結果決定回覆。']],
 '顧客訂兩份每份120元的餐點。',['程式收到餐點編號與數量2。','從可信菜單取得單價120，計算總價240。','保存訂單並回傳訂單編號；保存失敗時不能假裝完成。'],'你需要程式把資料和規則變成實際動作；只租一台EC2或上傳到S3都不會自動替你完成這些邏輯。',
 ['storage','儲存是把內容留住；執行程式是處理內容。S3可以保存一份程式檔案，但不能因此推論S3會替你執行裡面的付款規則。'],['compute','storage'],
 '把一個處理訂單的程式檔案放到S3，是否代表它已開始接單？','不代表。你還需要可執行它的環境，以及觸發或呼叫它的入口；保存檔案本身只是儲存動作。','https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/concepts.html');

 add('function','函式',['函式','Function','程式函式'],
 '一個程式可能有很多工作。如果計算金額、檢查庫存和製作縮圖全混在一起，就很難知道每段在做什麼，也很難重複使用某一段功能。',
 '函式是一段有名稱、專門完成某項工作的程式。你呼叫它時，交給它需要的輸入；它執行規則後，可能回傳結果或產生其他效果。這裡說的是程式中的工作單位，不需要先學數學函數才能理解。Lambda的事件函式會以特定入口開始執行你提供的程式。',
 '像有名字的工作站：「計算總價」站收到單價與數量，算完後交回金額。工作站的操作規則與安排它何時工作的機制，是兩個層次。',
 '把工作切成清楚的小段，有助測試、理解及重用。但函式不是完全獨立於其他條件：它若要讀檔、查資料庫或寄信，仍需要對應資料、連線與權限。',
 [['定義這段工作需要什麼','例如計算總價需要單價和數量，製作縮圖需要原圖片的位置。先說清楚輸入，才能判斷呼叫者有沒有提供足夠資訊。'],['被呼叫後才執行','定義函式不代表它會永遠自己運作。某段程式、使用者要求或事件必須觸發呼叫，執行環境才開始處理。'],['交回結果並處理失敗','計算可以回傳金額；製作縮圖可以把新檔案保存到S3。若輸入不合法或保存失敗，要有明確的錯誤與重試處理方式。']],
 '你建立一個把上傳照片縮小的函式。',['收到包含S3物件位置的事件。','讀出原照片，依程式規則產生較小尺寸。','把縮圖寫回指定位置，記錄成功或失敗。'],'函式描述要做什麼；Lambda等服務安排在哪裡、何時執行，以及如何供應需要的運算資源。',
 ['lambda','函式是程式中的一段工作；Lambda是能協助執行程式的AWS服務。並不是所有函式都一定要放在Lambda裡。'],['program','event'],
 '函式與Lambda是完全相同的東西嗎？','不是。你可以在EC2上的程式裡使用函式，也可以把適合的函式交給Lambda執行。前者是程式結構，後者是服務。','https://docs.aws.amazon.com/lambda/latest/dg/gettingstarted-concepts.html');

 add('virtual-machine','虛擬電腦',['Virtual machine','虛擬電腦','虛擬機器','虛擬機','VM'],
 '一台實體電腦有處理器、記憶體、磁碟與網路。大型供應商會用技術把實體設備的能力分配給多個彼此隔離的使用環境，不必每個顧客都獨占整台實體主機。',
 '虛擬電腦是由軟體與基礎設施提供、看起來可像一般電腦一樣使用的運算環境。它有分配到的處理能力與記憶體，可以啟動作業系統和執行程式。EC2的常見使用方式，就是讓你在雲端啟動這類虛擬伺服器；AWS也有特定專用或裸機選項，不能把所有配置都說成完全相同。',
 '像一棟大樓分成多間有各自門鎖的工作室。你使用分配給自己的空間，而不是因為租了一間就能控制整棟樓的每個設備。',
 '你可以較快取得合適大小的電腦環境，並依工作需要調整配置。不過虛擬不代表不會故障，也不代表檔案永遠保存；仍要了解磁碟、備份與故障隔離。',
 [['選一種資源配置','配置決定可用的CPU、記憶體及其他能力。需要大量計算與需要暫存大量資料的工作，可能適合不同配置。'],['從範本啟動系統','用包含作業系統等內容的範本建立環境，再安裝或部署你的程式。範本與正在執行的電腦不同，前者是建立用的材料。'],['安排網路與資料保存','電腦建立後，需要設定誰能連入以及資料保存在哪裡。程式停止、電腦被刪除、磁碟被刪除，對資料的影響可能不同。']],
 '你要提供持續運作的小型網站。',['選一種足以處理流量的EC2配置。','啟動作業系統與網站程式，設定必要網路入口。','將重要資料放在合適的持久儲存並備份，而不是只留在可丟棄的暫存位置。'],'你得到一個可執行程式的環境，但仍需部署程式、控制存取及設計資料與故障處理。',
 ['s3','虛擬電腦像可工作的地方；S3像保存物件的地方。前者提供執行環境，後者不會直接變成可讓你登入安裝作業系統的電腦。'],['server','os','cpu','memory'],
 '虛擬電腦不在自己桌上，是否表示背後完全沒有實體機器？','不是。它仍由實體基礎設施供應資源，只是你透過虛擬環境使用分配到的能力。','https://aws.amazon.com/what-is/virtual-machine/');

 add('cpu','CPU（處理器）',['CPU','中央處理器','處理器','vCPU'],
 '程式裡的「加總金額」「壓縮圖片」都需要真的被電腦執行。這些工作不能只靠把程式檔案放進磁碟就完成，必須有處理指令的能力。',
 'CPU是電腦執行指令與計算的核心資源。雲端配置常用vCPU等單位描述可分配的處理能力；這不應簡化成任何情況下都等同一個完整實體核心。判斷效能時，還要看程式能否平行工作、處理器架構，以及工作是不是其實在等網路或資料。',
 '像廚房負責切、炒與組合餐點的工作人力。增加人手可能增加處理量，但若唯一爐台太慢或原料還沒送到，更多人不會自動解決問題。',
 '選擇EC2等運算資源時，CPU影響能在時間內完成多少處理工作。不過先觀察瓶頸很重要；不要看見網站慢，就認定只能增加CPU。',
 [['程式送出指令','執行程式時，電腦依指令進行計算與資料處理。圖片轉碼等工作通常比單純等待使用者輸入更需要處理能力。'],['工作可能同時或輪流進行','多個工作能否善用更多CPU，取決於程式設計和彼此依賴。必須依序完成的步驟，不會只因資源變多就完全等比例加速。'],['用觀察判斷是否不足','比較CPU使用、執行時間及等待資料的情況。如果CPU並不忙，卻一直等資料庫回應，應先檢查下游而不是只升級處理器。']],
 '圖片轉換服務在尖峰時處理不完。',['量測每張圖片的處理時間與CPU負載。','確認程式能將不同圖片分給多個工作處理。','增加合適運算資源並重新量測，檢查是否轉而受儲存或網路限制。'],'CPU是效能的一部分；只有知道工作如何使用它，才能判斷增加處理能力是否有效。',
 ['memory','CPU負責執行工作，記憶體保存執行中常用的資料。缺少其中一種資源，都可能讓程式跑不好。'],['program','compute'],
 '資料庫回應很慢但CPU大多空閒，增加CPU一定能解決嗎？','不一定。程式可能主要在等資料，應先找出真正的等待來源，再決定調整哪種資源。','https://docs.aws.amazon.com/ec2/latest/instancetypes/instance-types.html');

 add('memory','記憶體',['Memory','記憶體'],
 '電腦執行程式時，需要隨手可取的工作資料，例如正在處理的圖片、查詢結果和計算中的數字。每次都從較慢的儲存讀取，往往不適合即時工作。',
 '記憶體是程式執行時放置工作資料的空間，常見的一般記憶體內容不應當作關機或故障後仍可靠保留的正式資料。它與CPU合作：CPU處理指令，記憶體提供處理中使用的資料。記憶體不足時，程式可能變慢、無法分配空間，或被執行環境終止。',
 '像廚師面前的工作檯。工作檯越大，可以攤開處理的材料越多，但打烊整理後仍需把重要帳本放回可靠保存的地方。',
 '估算EC2、容器或Lambda事件函式所需資源時，要考慮執行中的資料量，而不只看程式檔案多大。較小的程式也可能一次讀入很大的檔案。',
 [['載入這次要用的資料','例如讀取一張圖片後，在工作空間中解碼與修改。展開後的工作資料可能比原始壓縮檔案大很多。'],['在工作空間裡處理','程式可能建立新的中間結果。多個要求同時處理時，使用量也可能增加，因此需要觀察尖峰而非只看平均。'],['把重要結果另外保存','完成訂單、產生檔案或計算出需要保留的結果後，寫到適合的儲存服務。不能只因程式此刻記得結果，就當作已經可靠保存。']],
 '程式處理小照片正常，但處理大照片時停止。',['先查看失敗紀錄及記憶體使用量。','評估是否一次讀入過多資料，或能分批處理。','調整資源與程式方式，再測試大型檔案和同時處理的情況。'],'你從工作中的資料量理解需求，而不是把「檔案已存在」與「程式有空間處理它」混為一談。',
 ['disk','磁碟等儲存用來保存資料；記憶體主要是執行中的工作空間。把重要訂單只留在記憶體，不等於完成持久保存。'],['program','cpu','storage'],
 '網站說付款成功，但只把訂單留在記憶體，可靠嗎？','不可靠。程式重啟或環境故障可能讓工作資料消失，必須依需求將已確認訂單保存到合適的持久儲存。','https://docs.aws.amazon.com/ec2/latest/instancetypes/instance-types.html');

 add('os','作業系統',['Operating system','作業系統','OS'],
 '電腦上可能同時有網站程式、管理工具與其他工作。它們都需要使用CPU、記憶體、檔案和網路，必須有人協調使用方式並提供共同的操作規則。',
 '作業系統是管理電腦資源、讓應用程式得以執行的基礎軟體，例如Linux或Windows。你在一般EC2環境中選擇系統、安裝程式和維護更新，都是主機管理的一部分。使用較高層的託管服務時，這些工作可能有更多交給供應商處理，但應用與資料的責任不會因此全部消失。',
 '像工作室的管理制度與基礎設備：安排每個工作怎麼使用空間、怎麼存取物品、哪些人能操作哪些功能。',
 '了解作業系統有助比較EC2與Lambda的管理分工。能自由安裝與設定通常也代表要承擔更多維護；少管理底層則需要配合服務提供的執行方式。',
 [['從含系統的範本開始','EC2常透過AMI建立環境，AMI包含啟動所需的系統等內容。選擇範本時，應確認應用是否支援該作業系統與架構。'],['啟動並執行應用','系統安排程式使用資源、讀寫檔案及連線。除了AWS層級權限，主機內的帳號與檔案權限也會影響應用能做什麼。'],['持續維護系統','系統需要安全更新、設定管理與監控。你可以用工具協助自動化，但不能把EC2開機成功當作後續維運已全部結束。']],
 '既有商用應用需要特定Windows環境。',['先確認軟體的系統與授權需求。','選符合需求的EC2配置與範本，設定登入與網路。','安排更新、備份及回復測試，而不只是把安裝檔放上去。'],'系統相容性可能決定可用的服務方式，不能只按最低單價選擇無法執行應用的環境。',
 ['program','應用程式完成業務工作，作業系統提供它使用電腦資源的基礎。更新應用與更新作業系統通常是不同工作。'],['virtual-machine','program'],
 '選用EC2後，作業系統更新是否一定全由AWS處理？','一般EC2使用情境中，客戶仍負責所使用作業系統與應用的適當維護；應依服務責任分工設計。','https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/AMIs.html');

 add('database','資料庫',['Database','資料庫'],
 '訂單不只是存成一張圖片。你可能要依訂單編號查狀態、依顧客查歷史，或確保付款與庫存更新符合規則。直接把所有內容塞進任意檔案，會讓查詢和多人更新變得困難。',
 '資料庫是有組織地保存、查詢和更新資料的系統。它不只是保存檔案的位置，還提供特定的資料模型與操作方式。不同資料庫擅長的問題不同：關聯式資料庫常處理表格關係與交易；DynamoDB等服務適合依事先設計的鍵存取。沒有任何一種工具會自動適合所有查詢。',
 '像有分類、索引和登記規則的帳務室，不是只有把紙張堆進倉庫。重要的是找得到、改得正確，並能處理多人同時操作。',
 '選資料庫前，先說清楚資料如何被讀寫、是否需要多筆更新共同成功，以及能接受多少讀取延遲。不能只因為資料很多，就認定任何大型分析服務都適合下單交易。',
 [['定義資料與查詢','先列出訂單有哪些欄位，以及常用找法。查詢模式會影響表格、鍵與索引的設計，而不是建立服務後才隨便決定。'],['依規則讀取與修改','程式透過資料庫支援的操作查詢或更新。付款這類工作還要考慮重複要求、同時更新與交易規則，不能僅靠畫面上的提示判斷成功。'],['安排保存與故障恢復','資料庫也需要備份、權限、監控與可用性設計。使用託管服務能減少某些主機工作，並不代表業務資料永不會被誤刪。']],
 '顧客付款後立刻查詢訂單狀態。',['程式依訂單編號找到對應資料。','依付款結果與業務規則更新訂單。','確認需要的最新狀態讀取路徑，並為誤刪與故障安排復原方式。'],'你同時設計如何找資料、如何正確修改，以及出錯時如何找回，而不是只選一個保存位置。',
 ['s3','S3保存物件很適合圖片或備份檔；資料庫提供特定查詢與更新模型。把訂單檔放在S3，不等於自動取得關聯式交易能力。'],['storage','program','consistency'],
 '存圖片與管理多人同時更新的訂單，為什麼可能選不同服務？','兩者的存取與更新規則不同。選型要看查詢、交易和一致性需求，不是只看資料能不能被保存。','https://aws.amazon.com/what-is/database/');

 add('event','事件',['Event','事件','觸發事件'],
 '你希望照片一上傳就製作縮圖，但不想要有人盯著畫面按執行。系統需要一種方式，告訴另一段程式「剛才發生了某件值得處理的事」。',
 '事件是描述某件事已發生的資料訊息，例如某個S3物件剛被建立。它通常包含事件類型、時間和相關資料位置等資訊。事件本身不是處理工作的程式，也不一定包含全部原始資料；接收的程式可能要再依事件提供的位置讀取檔案。',
 '像餐廳收到「新訂單已建立」的通知。通知讓廚房知道要開始工作，但通知不是料理本身，裡面也可能只有訂單編號。',
 '事件讓不同部分在適當時機合作，例如上傳、付款或排程時間到達後啟動工作。設計時要留意可能重複、失敗和延後抵達，不能把一則通知等同整件事情已經完成。',
 [['某件事情先發生','例如使用者把圖片寫入S3。依服務與設定，系統產生描述這次變更的事件，交給後續處理機制。'],['事件被送到處理者','你設定合適的觸發或路由，讓Lambda等接收者取得事件資訊。這條路徑仍需要對應權限和服務設定。'],['處理結果要獨立確認','函式讀取圖片並保存縮圖，才是背景工作真正的結果。事件收到後也可能處理失敗，因此要有重試、記錄及避免重複副作用的方式。']],
 '顧客上傳大頭照後，系統自動產生小圖。',['S3保存原始照片並產生符合設定的通知。','Lambda事件函式取得照片位置，再讀取原始資料。','產生並保存縮圖，處理失敗時依規劃重試與追蹤。'],'事件把「何時該開始」與「實際要做什麼」連起來，但不取代程式本身和完成結果的驗證。',
 ['request','請求通常是在要求某方做事；事件通常是在描述某件事已發生。它們可能相互產生，但不是任何場合都完全可互換。'],['request','function','async'],
 '收到照片上傳事件，是否代表縮圖已完成？','不是。它只表示有需要處理的變更，縮圖程式仍要成功執行並保存結果。','https://docs.aws.amazon.com/lambda/latest/dg/lambda-invocation.html');

 add('network','網路',['Network','網路','網路連線'],
 '手機、網站程式和資料庫常在不同地方。即使每一台電腦都正常，也必須能把資料送到正確的接收者，整個網站才能完成一次查詢。',
 '網路是讓裝置與程式彼此交換資料的連接和規則。實際連線會涉及資料送往哪裡、走哪條路，以及哪些流量被允許。這就是為什麼「主機已開機」不代表「任何人都能連上」，而「連得上」也不表示已取得讀取資料的權限。',
 '像城市道路和入口管制：地址說明目的地，路線決定怎麼走，門禁則限制能否通過。道路存在不等於你有權進入目的地的辦公室。',
 'AWS架構中的VPC、子網路、路由表與安全群組，分別協助安排網路範圍、位置、路徑和允許流量。先把一次資料傳送的來回路徑畫出來，才容易排查不通的原因。',
 [['先找到目的地','應用可能先用DNS把網域名稱解析成需要的地址。名稱解析成功只是找路的準備，不保證服務本身已可使用。'],['依路由與防護送出','資料依配置的路徑傳送，並接受適用安全規則檢查。前往網際網路與前往私有資源的路徑可能不同。'],['接收者還要處理與回覆','目的服務需正在接收要求，回程也需能通行；若要操作資料，還得通過身份與資源授權。網路與應用要分層排查。']],
 '網站程式啟動了，使用者卻打不開。',['確認名稱解析到哪個目的地。','檢查入口、路由與允許流量的規則。','再檢查程式是否真的接收要求，以及回應能否返回。'],'你不再把所有不通都解讀成「伺服器壞了」，而是沿著一條完整路徑找出問題所在。',
 ['iam','網路規則控制連線能否通過；IAM等授權控制能做哪些操作。允許網路流量，不會自動讓程式有權讀S3物件。'],['ip','dns','request'],
 '兩個資源網路互通，就表示可以任意讀取彼此資料嗎？','不表示。連通與授權不同，資料操作仍需符合服務的身份、資源與其他適用政策。','https://aws.amazon.com/what-is/computer-networking/');

 add('disk','磁碟與儲存裝置',['Disk','磁碟','硬碟','儲存裝置'],
 '電腦正在工作的資料可以放在記憶體，但很多內容需要在程式停止後保留，例如作業系統、程式檔和某些正式資料。這時就需要理解儲存裝置及其保存特性。',
 '磁碟是日常對資料儲存裝置的稱呼之一，實際媒介可能是不同技術。對使用者而言，重點是它如何提供讀寫、速度與容量，以及在主機停止、刪除或故障時資料會怎樣。雲端的EBS和instance store等儲存方式，不能因為都能放資料就視為完全相同。',
 '像保存材料與文件的櫃子。不同櫃子的容量、取件速度、位置和是否會在退租時一起清走，可能有很大差別。',
 '選儲存時不只比較幾GB，還要看存取模式、讀寫效能、故障範圍及生命週期。重要資料通常需要額外備份，不能只依賴某個裝置一直正常。',
 [['先提供可使用的空間','例如將EBS磁碟提供給合適的EC2執行個體使用。你還可能需要在作業系統中安排檔案系統，讓應用能按路徑存取。'],['應用讀寫工作內容','同樣容量的儲存，也可能有不同的每秒操作次數與資料傳輸量需求。大量小筆讀寫與連續搬大檔，關心的效能指標不完全相同。'],['明確決定資料何時保留','主機停止不一定等同刪除磁碟，而某些暫存資料也不適合長期保存。檢查服務特性與刪除設定，再安排備份與還原測試。']],
 '網站主機要更換，但訂單資料不能丟失。',['確認訂單究竟保存在哪裡，而不是只看主機是否還存在。','檢查該儲存的生命週期、備份和移轉方式。','在切換前測試新環境能讀取必要資料，並保留回復方案。'],'你把運算主機與資料保存分開考慮，才不會在處理主機生命週期時意外刪掉重要內容。',
 ['memory','記憶體是執行中的工作空間；儲存裝置有其他保存特性。但不是所有稱為磁碟的東西都能在任何故障或刪除後保證資料存在。'],['storage','memory','ebs'],
 '只看磁碟容量相同，就能判定兩種儲存可直接互換嗎？','不能。還要看存取方式、效能、可用區範圍、主機生命週期與資料保留設定。','https://docs.aws.amazon.com/ebs/latest/userguide/what-is-ebs.html');

 add('filesystem','檔案系統',['File system','Filesystem','檔案系統','檔案路徑'],
 '你平常用資料夾與檔名找文件，背後需要一套方式記住檔案在哪裡、內容如何讀寫，以及誰能使用它。這不只是把一批位元組放在某個空間而已。',
 '檔案系統用檔案、資料夾、路徑及相關規則組織資料，讓應用能用熟悉的方式操作內容。它可以位於主機使用的磁碟上，也可以由網路共享服務提供。不同儲存服務的操作方式不同，不能只因畫面看起來像資料夾，就認定具有相同的檔案系統行為。',
 '像有分類、目錄、位置與使用規則的檔案櫃。櫃子的實體容量是一件事，如何排列、查找與限制取用則是另一件事。',
 '有些既有應用需要直接開啟某個路徑、持續修改檔案或由多台電腦共享。因此選EBS、EFS、FSx或S3時，要先理解應用期待哪種操作方式，而不是只比較儲存單價。',
 [['應用使用路徑找內容','例如程式開啟某個設定檔，作業系統依檔案系統提供的規則定位它。檔案有自己的權限與使用方式，並不是任意程式都能改寫。'],['決定是單機還是共享','一台主機自己的檔案空間，與多台主機透過網路存取同一份共享內容，是不同需求。共享還要考慮協定、同時修改與故障。'],['確認與應用相容','如果程式期待NFS或SMB等存取方式，就應找符合需求的服務。S3物件的名稱可以含斜線，但不能僅憑這點當成一般共享檔案系統。']],
 '兩台Linux網站主機需要讀寫同一份上傳內容。',['列出應用是否真的要求共享檔案路徑。','若需求符合，評估EFS等共享檔案服務及網路權限。','測試同時操作、效能與備份；若改用S3，則需相應調整應用的存取方式。'],'先理解程式對檔案操作的期待，才能判斷可否更換儲存服務。',
 ['object','S3物件有key等識別方式；檔案系統提供另一套檔案操作語意。畫面上都可整理內容，不表示底層能力相同。'],['storage','disk','network'],
 'S3主控台顯示資料夾，就代表它與EFS有相同使用方式嗎？','不是。介面上的整理方式不能取代對實際讀寫協定、檔案操作及應用相容性的確認。','https://docs.aws.amazon.com/efs/latest/ug/whatisefs.html');

 add('data-center','資料中心',['Data center','資料中心','機房'],
 '雲端裡的程式和資料不是漂浮在空氣中。背後仍有裝置、供電、散熱與連線，需要放在適當設施裡持續運作。',
 '資料中心是容納與支援運算、儲存及網路設備的設施。對架構設計來說，重要的不只是有多少台機器，而是哪些機器可能被同一件故障一起影響。AWS的AZ可由一個或多個資料中心組成，因此不能把AZ簡化成某一個單獨機櫃。',
 '像餐廳廚房所在的大樓：增加大樓裡的爐台能增加產能，但若整棟停電，這些爐台可能同時不能工作。',
 '理解實體故障範圍，有助知道為什麼要跨AZ部署、為什麼多台機器仍可能一起停止。雲端供應商承擔設施工作，但你仍要選擇符合需求的部署方式。',
 [['設備需要共同設施','主機要有電力、散熱與連線才能提供服務。某些共同設施失效，可能同時影響一組資源，而不是只壞其中一台。'],['按故障邊界分散配置','AWS用Region和AZ等概念協助安排隔離。若只在同一個故障範圍增加更多主機，仍可能無法滿足單一AZ失效後繼續服務的需求。'],['檢查應用與資料都能接手','運算分散只是部分工作，資料庫、入口與其他依賴也要配合。不能只看到兩台主機就判定整個系統已高可用。']],
 '網站有兩台主機，但都在同一AZ。',['先問必須承受的是單一主機故障，還是整個AZ不可用。','若需要承受AZ故障，規劃跨AZ的運算和資料層。','測試入口是否能避開失效目標，以及剩餘資源是否能承擔流量。'],'你根據可能一起故障的範圍設計，而不是只數機器台數。',
 ['region','Region是較大的地理區域；AZ是Region內的隔離位置，可能含多個資料中心。這些層次不能用「一台電腦」互相代換。'],['server','az','availability'],
 '兩台主機是否一定比一台更能承受AZ故障？','不一定。若兩台都在同一AZ，仍可能受同一AZ事件影響。必須看分布位置與所有依賴的設計。','https://docs.aws.amazon.com/global-infrastructure/latest/regions/aws-availability-zones.html');

 add('credentials','憑證與存取憑證',['Credentials','存取憑證','身分憑證','登入憑證'],
 '程式向AWS要求讀取一個檔案時，服務需要知道要求是誰提出的。只說「我是報表程式」不夠，必須用可驗證的方式代表自己的身分。',
 '這裡的存取憑證，是用來向服務證明呼叫身分的資料或機制。它不等於你已被允許做所有事情：確認身分之後，服務還要檢查權限。AWS程式常透過角色取得有到期時間的臨時存取憑證，避免把長期秘密寫進程式碼。',
 '像證明員工身分的工作證。工作證讓櫃台辨認你，但能不能進財務室，仍由另一套授權規則決定。',
 '把認證與授權分開理解，能減少錯誤設定。憑證外洩可能讓別人冒用身分，因此應限制權限、保護秘密，並優先使用符合情境的臨時憑證方式。',
 [['取得可代表身分的資料','人員登入與程式存取AWS可能使用不同方式。工作負載通常應使用適當角色，而不是拿某位員工的長期金鑰當成所有程式共用的密碼。'],['由服務確認身分與操作權限','服務確認要求的來源身分後，再檢查適用政策是否允許這個動作與資源。網路能連通，也不會讓這段授權程序消失。'],['管理有效期間與事故處理','臨時憑證有期限，需要由合適機制取得與更新。長期秘密若已暴露，不能只把檔案刪掉就當作安全；必須依程序撤銷或輪替並調查使用情況。']],
 'EC2上的報表程式要讀S3，程式碼不應保存人的金鑰。',['建立只允許讀取指定報表的IAM角色。','讓工作負載透過合適機制取得角色的臨時憑證。','測試可讀指定資料且無法執行不必要操作，並觀察稽核紀錄。'],'程式能證明身分，也只取得完成工作的必要權限，而不是散布廣泛的長期秘密。',
 ['policy','憑證協助證明你是誰，政策決定你能做什麼。TLS憑證則與加密連線中的身分驗證等用途有關，不能把所有中文「憑證」都當成同一種資料。'],['iam-role','policy','least-privilege'],
 '有合法存取憑證，就一定能讀取任意S3檔案嗎？','不是。身分可被驗證後，仍要通過適用的資料與金鑰授權；明確拒絕等限制也可能使要求失敗。','https://docs.aws.amazon.com/IAM/latest/UserGuide/security-creds.html');
 add('transaction','交易（資料操作）',['Transaction','資料庫交易','資料交易','交易'],
 '轉帳時要把甲的金額扣掉，再把乙的金額加上。如果只成功一半，帳就不對了。類似問題也會出現在建立訂單與扣除庫存的組合操作中。',
 '資料處理中的交易，是把需要共同成功或共同失敗的一組操作視為一個單位。這裡的交易不只指購物付款，而是在描述資料修改的規則。系統提供的交易能力、範圍與隔離方式各有條件，不能假設跨所有AWS服務的工作都能自動包成同一個交易。',
 '像一張必須所有欄位核准後才能生效的轉帳單，不能只扣了出款方就宣布整張完成。',
 '交易協助避免部分完成造成資料不一致，但不會替你決定正確的業務規則，也不會自動解決所有外部服務的失敗與重試。設計者仍需確認哪些操作屬於同一組。',
 [['列出必須共同成立的修改','先說清楚需要同時保存哪些資料，例如建立訂單與減少特定庫存。如果只是各自送出兩個寫入要求，中間任何一次失敗都可能留下半套結果。'],['用支援的交易機制執行','在服務支援的範圍內，請求共同提交這些操作，並處理條件不符或衝突等失敗。使用前要核對服務限制，而不是把所有外部動作當成同一資料庫操作。'],['處理交易以外的副作用','寄信、第三方扣款等可能在另一個系統。即使資料庫交易成功，這些工作仍需各自的重試、去重或補償設計，避免重複收費或錯誤通知。']],
 '顧客只應在庫存足夠時建立確認訂單。',['先定義庫存條件與訂單要保存的內容。','使用符合需求的條件與交易能力，讓必要資料修改共同成立。','若遇到衝突或服務失敗，依規則回應或重試，不把部分結果當成完成。'],'你把正確性需求寫成可以檢查的條件，而不是只依「程式有跑完」判定資料一定正確。',
 ['backup','交易處理一組修改如何生效；備份用來在資料遺失或誤刪後找回較早的狀態。兩者解決不同的問題，不能互相取代。'],['database','consistency','program'],
 '交易能否自動讓資料庫更新和任何外部扣款都共同成功？','不能這樣假設。必須確認支援範圍，並另外安排外部服務的重試、冪等或補償方式。','https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/transactions.html');

 add('authentication','認證（確認身分）',['Authentication','身分驗證','身份驗證','認證'],
 '當有人說自己是某位使用者時，系統需要先確認這個說法，否則任何人都能只填同一個名字就冒用身分。',
 '認證是在確認提出要求的身分是否可被信任，例如檢查登入方式或驗證要求中的憑證。它回答「你是誰」，不直接回答「你能做哪些事」。應用使用者登入與工作負載向AWS提出操作要求，可以有不同的認證方式，不能把人的密碼直接當成所有程式的通用秘密。',
 '像櫃台先檢查工作證是否有效，再辨認你代表哪位員工。證件是真的，不代表可以直接進入所有房間。',
 '把認證與授權分開，能理解為什麼登入成功後仍可能無權讀某個檔案。也能知道憑證外洩與權限過大的風險不同，需要分別處理。',
 [['先選適合的身分方式','人員、網站使用者與程式工作負載的需求不同。應使用符合情境的登入或臨時憑證機制，而不是把同一份長期秘密分送到每一處。'],['確認要求代表誰','系統驗證相關資料後，辨認適用的使用者、角色或其他主體。這不是只相信傳來的顯示名稱，也不等於只看網路來源。'],['再進入權限判斷','身分確認之後，依政策決定是否允許特定操作。驗證失敗與授權不足的排查方向可能不同，不能只不斷增加網路規則。']],
 '程式可以取得合法角色憑證，但讀S3仍被拒絕。',['確認使用的是預期角色與仍有效的憑證。','再檢查該身分是否獲准讀取指定資源。','查看適用的資源與金鑰政策，區分驗證與授權問題。'],'成功證明身分只是第一步；能否完成操作仍取決於相關權限。',
 ['authorization','認證確認身分，授權決定可執行的動作。兩者有關聯，但不是同一個步驟。'],['credentials','iam','principal'],
 '登入成功就表示能刪除所有資源嗎？','不是。登入成功確認了身分，刪除操作仍需要符合該資源與身分的授權規則。','https://docs.aws.amazon.com/IAM/latest/UserGuide/intro-structure.html');

 add('authorization','授權（允許操作）',['Authorization','授權'],
 '公司知道你是哪位員工後，仍需決定你能不能開財務室、查薪資或刪除檔案。把身分認出來與允許具體工作，是兩件不同的事。',
 '授權是依規則判斷某個身分能否對某個資源執行指定動作。最基本的句子是「誰，可以在什麼對象上做什麼」。在AWS中，IAM政策、資源政策及其他適用限制可能共同影響結果，不是只看登入成功或最近新增的一份允許規則。',
 '像門禁規則寫明這張工作證只能開哪幾扇門，不能只因為是公司員工就直接取得總鑰匙。',
 '精確授權可以限制事故範圍。報表程式只需要讀取，就不應順便能刪除資料；同時也要測試不該被允許的操作是否真的失敗。',
 [['描述真正需要的操作','先列出程式需要讀、寫或管理什麼，再將動作和資源範圍縮到必要程度。過大的萬用權限雖可能暫時解決錯誤，卻放大後續風險。'],['檢查所有適用限制','同一要求可能受到多種政策影響。明確拒絕等限制不會因另一處新增允許就自然消失，因此應沿實際身分與資源查原因。'],['用正反案例驗證','必要操作應成功，其他不必要動作應被拒絕。不要只用管理員帳號測試成功，就認定應用自己的角色設定一定正確。']],
 '報表程式只能讀取reports中的物件。',['讓程式使用自己的IAM角色。','授權指定讀取動作與對應S3資源範圍。','分別測試讀報表成功、讀其他資料或刪除物件失敗。'],'你把「程式能做事」與「程式只能做必要的事」一起驗證，而不是只追求不再報錯。',
 ['authentication','認證回答你是誰，授權回答你可以做什麼。網路可達也不會跳過資料操作的授權檢查。'],['policy','principal','least-privilege'],
 '把網路入口打開，就會自動獲得S3讀取權限嗎？','不會。網路連線與資料授權不同，仍必須滿足適用的IAM及資源政策等條件。','https://docs.aws.amazon.com/IAM/latest/UserGuide/access_policies.html');

 add('encryption','加密',['Encryption','加密','解密'],
 '資料可能被存在裝置上，也可能在網路途中傳送。你希望沒有權限的人即使接觸到受保護的內容，也不能直接把它當成可讀原文。',
 '加密是依演算法與金鑰把資料轉成另一種表示，讓合適的持有者能以對應方式解密。這與設定誰能讀檔是互補的工作：服務可能代有權限者解密，因此資料已加密不代表所有不當存取都會自動被阻止。傳輸加密與儲存加密保護的階段也不同。',
 '像文件放入需要適當鑰匙才能開啟的保護盒。但誰能取得鑰匙、誰被允許請管理員代開，仍要另訂規則。',
 '理解加密的分工，才能知道為什麼S3資料權限和KMS金鑰權限都可能影響讀取，也能避免以為磁碟加密就等同瀏覽器連線已使用HTTPS。',
 [['先確定保護哪個階段','資料靜態保存在儲存服務，與在使用者和網站間傳輸，是不同階段。設計時需分別確認儲存保護與TLS等連線保護。'],['管理金鑰及可用權限','使用服務整合的加密時，仍要確認誰能透過服務使用對應金鑰。錯誤刪除或停用必要金鑰，也可能讓合法應用暫時無法讀取。'],['把存取控制一起設計','加密不是替代授權、備份或正確應用邏輯。有權讀取且能解密的人仍可能取得原文，因此必須限制身分、用途與操作範圍。']],
 '報表使用SSE-KMS加密，應用讀取卻失敗。',['檢查應用是否獲准取得指定S3物件。','檢查其是否符合所需KMS授權與金鑰政策。','另外確認傳輸路徑及其他條件，不為了讀通就公開資料或任意擴權。'],'你同時檢查資料操作和金鑰使用，而不是看到「已加密」就停止思考存取方式。',
 ['authorization','授權決定誰能做什麼；加密保護資料的表示。加密資料仍需要正確授權，且不同階段的加密不能互相代替。'],['kms','tls','storage'],
 '資料已做儲存加密，使用者到網站的連線就一定安全加密嗎？','不是。那是不同階段，仍需確認HTTPS及TLS等傳輸保護設定。','https://docs.aws.amazon.com/kms/latest/developerguide/concepts.html');

 add('runtime','執行環境',['Runtime','執行環境','執行階段'],
 '一份程式碼不能在任意地方都直接運作。它可能需要特定程式語言的支援、套件及可以取得資料的方式，像食譜還需要合適設備才能被實作。',
 '執行環境是程式實際運作時所依賴的軟體與資源條件。在Lambda事件函式的常見使用方式中，你選擇受支援的執行階段並提供程式入口與相依內容；在EC2上，則可以自行安裝需要的軟體。執行環境與儲存程式碼的位置，不是同一個概念。',
 '像一個能真正做菜的工作站：食譜只是指示，還要有爐台、工具、材料與合適的操作方式。',
 '知道環境需要什麼，才能判斷服務是否適合既有程式，也能排查「程式在自己電腦能跑，放到服務後卻失敗」的問題。',
 [['確認語言與依賴','程式可能需要指定語言版本或外部套件。封裝與部署時要把適用內容準備好，不能只上傳某個入口檔就假設一切都已存在。'],['指定開始執行的位置','例如事件函式的處理入口需要能接收本次事件。入口名稱、參數與程式封裝若不符要求，還沒執行業務邏輯就可能失敗。'],['確認資源與外部存取','執行還需要足夠記憶體、允許的執行時間、網路與身份權限。環境能啟動，不等於所有下游資料都能讀取。']],
 '你把製作縮圖的程式放進Lambda事件函式。',['選擇適合的執行階段，準備程式和圖片處理套件。','設定正確入口，送入小型測試事件確認能開始工作。','再測試讀S3、處理大型圖片與保存結果，觀察資源與權限問題。'],'部署檔案、能啟動程式和能完成整件工作，是需要依序驗證的不同階段。',
 ['program','程式碼描述工作規則，執行環境提供實際運作條件。相同程式是否能搬到另一服務，要檢查環境相容性而不是只看檔名相同。'],['program','function','os'],
 '程式在本機能執行，是否表示放到任何雲端服務都一定能跑？','不是。需要確認語言、套件、入口、資源與外部存取條件是否相容。','https://docs.aws.amazon.com/lambda/latest/dg/lambda-runtimes.html');

 add('metadata','中繼資料',['Metadata','中繼資料','物件中繼資料'],
 '一張照片本身是影像內容，但系統還可能需要知道它的格式、大小或其他描述。這些描述可以幫助程式決定如何處理內容。',
 '中繼資料是描述資料的資料。對S3物件而言，物件內容與相關描述是不同部分；在分析工具中，中繼資料也可能指資料表欄位與檔案組織方式。理解它時要先問「這是在描述哪一份資料」，不能認為所有叫中繼資料的東西都保存了完整原始內容。',
 '像圖書卡上的書名、作者與分類：卡片協助找書和理解書的類型，但不是整本書的文字。',
 '區分內容與描述，能知道為什麼建立資料目錄不會自動搬走S3檔案，也能避免只檢查描述就認定原始資料已完整保存。',
 [['先確認實際內容在哪裡','例如照片資料存在S3物件中，分析資料可能分散在多個檔案。不要只看管理介面有一列名稱，就忽略實際內容。'],['再看哪些資訊在描述內容','格式、欄位、名稱與其他屬性可供程式或工具理解資料。不同服務提供與允許修改的描述項目可能不同。'],['內容變更時檢查描述是否仍正確','如果資料格式改變卻保留舊的表結構描述，查詢可能失敗或解讀錯誤。內容與描述都應按用途檢查。']],
 '你用Glue Catalog描述S3中的交易檔案。',['原始檔仍保存於S3。','目錄記錄工具需要的欄位與位置資訊。','Athena依描述查詢資料；更改資料格式時也要維護適用描述。'],'資料目錄與實際資料各有用途，存在一份表結構並不表示所有原始檔已被複製進目錄。',
 ['object','S3物件包含實際內容及相關資訊；描述內容的中繼資料不能一概當作內容本身。'],['object','glue','storage'],
 '建立資料目錄後，可以直接刪除所有原始S3檔案而不影響查詢嗎？','不能這樣做。目錄通常描述資料的位置與結構，查詢仍需讀取實際內容。','https://docs.aws.amazon.com/AmazonS3/latest/userguide/UsingMetadata.html');
 add('port','通訊埠',['Port','通訊埠','連接埠'],

 add('concurrency','並行處理',['Concurrency','並行','並行處理'],
 '如果十位客人幾乎同時上傳照片，系統可能同時處理多份工作，而不是一份做完才開始下一份。這時就需要考慮同時進行多少工作才合適。',

 [['先了解每個工作會用什麼','一張照片轉換可能消耗CPU與記憶體，一筆訂單可能建立資料庫連線。工作特性不同，同時增加的成本與風險也不同。'],['設定與量測同時工作量','觀察流量、執行時間和錯誤，必要時限制同時處理數。若短時間工作太多，可以搭配佇列緩衝，而不是讓所有工作立刻湧進下游。'],['驗證順序與正確性','同時處理的工作不一定依序完成。若多個工作修改同一資料，需要適當條件、交易或其他控制，避免互相覆蓋結果。']],

 add('message-queue','訊息佇列',['Message queue','Queue','訊息佇列','佇列'],

 [['先辨認失敗種類','短暫連線失敗可能值得再試；格式錯誤或確定沒有權限，通常不會只因重送就自動變好。先分類原因，才能選擇合適處理方式。'],['控制次數與等待','在合適間隔再次嘗試，並設定合理上限。等待與節奏能減少同一時間大量重送造成的壓力，實際策略依服務與業務需求設計。'],['避免同一工作被當成多份','用能辨認同一工作的方法，讓重複送達不會造成錯誤副作用。最後仍失敗時，保存足夠資訊供檢查或補救。']],

 ['idempotency','重試是在再做一次；冪等是在重複處理同一工作時仍維持正確效果。能重送不代表已經不會重複產生副作用。'],['request','idempotency','async'],
 '請求超時時，是否一定可以毫無檢查地重新付款？','不可以。前次工作可能已完成，應依介面與業務規則處理不確定結果，避免重複收費。','https://docs.aws.amazon.com/lambda/latest/dg/invocation-retries.html');

 ['function','函式描述要做的工作；觸發器安排在什麼情況下開始。只設好觸發器，不會自動寫出正確的縮圖程式。'],['event','function','authorization'],
 '觸發器已啟動函式，為什麼函式仍可能讀不到S3？','能被呼叫與能操作資料是兩種授權問題，函式執行身分仍需符合S3及相關金鑰權限。','https://docs.aws.amazon.com/lambda/latest/dg/lambda-invocation.html');

 add('server',
 '手機通常不會保存整家商店的全部訂單。當你想查訂單，必須有另一方接收問題、執行查詢，並把結果交回來。先分清提出問題與處理問題的兩邊。',
 '「伺服器」首先是在描述工作角色，不是特殊外觀。家用電腦只要執行接收要求的程式，也能擔任伺服器；正式網站則還要考慮供電、網路與故障處理。',
 '把共同的程式與資料放在受控位置，可以讓許多人的手機取得同一份正式結果，不必每台裝置各自猜測訂單狀態。',[
 ['先有持續等待的程式','機器開著不等於網站已運作。必須啟動能接收網路要求的程式，讓它在指定入口等待；收到內容後才知道要查菜單還是新增訂單。'],
 ['執行工作，再取得需要的資料','伺服器上的程式會檢查輸入是否合法，必要時向資料庫查詢或寫入。資料庫可能在另一台機器，因此一台伺服器也可能向其他服務提出要求。'],
 ['把結果交回去','處理完畢後，程式回傳資料或錯誤訊息。手機負責顯示畫面；畫面顯示失敗時，要區分是網路不通、程式出錯，還是資料尚未存在。']
 ],'假設兩位客人同時查詢同一份訂單。',['兩支手機各自送出含訂單編號的請求，伺服器要先確認誰有權查看。','程式讀取正式訂單紀錄，產生每位客人被允許看到的內容。','回應各自送回原手機；不把甲客人的個資混進乙客人的結果。'],'你可以重開處理程式，但不能因此遺失正式訂單；運算與資料保存要分開規劃。','storage','租一台EC2是取得可執行程式的電腦；把圖片放S3則是租資料保存空間，兩者做的工作不同。',['client','request'],'只有一台開著的電腦，就等於網站已能接單嗎？','不等於。還需要接收請求的程式、可達的網路、正確權限，以及保存正式資料的方法。');

 '雲端讓建立、增加與釋放容量更容易，適合需求會改變的系統；它不保證任何設計都便宜，也不會替你決定資料可以給誰看。',[

 ],'假設店裡平日只有少量流量，週末活動卻增加十倍。',['先量測平時需要多少運算，保留滿足正常服務的容量。','活動期間增加可處理請求的資源，同時確認資料庫也能承受。','活動結束後縮回容量，並檢查仍保留的磁碟、備份與網路費用。'],'雲端提供調整資源的工具；讓系統會調整、資料受保護和帳單可控，仍是設計工作。','server','雲端是取得資源的方式，伺服器是其中一種工作角色。使用雲端不代表所有應用都沒有伺服器。',['server','storage'],'把網站搬到雲端，資料權限就由AWS全部替你決定嗎？','不會。供應商管理部分基礎設施，你仍要決定使用者、資料權限、程式行為與備份。');

 '請求是一則有目的的訊息，可能要求取得資料，也可能要求執行動作。它通常帶有目的地、操作種類、必要內容，以及讓服務確認身分的資訊。',

 ['接收方判斷能不能做','程式先檢查格式與身分，再判斷權限和業務條件。例如客人能看自己的訂單，不代表能看其他人的訂單。網路送得到不等於獲准操作。'],
 ['分清接受與完成','同步操作可能在工作結束後回覆；非同步操作可能只回覆已接受，之後才處理。使用者要依契約查詢結果，不能把收到訊息直接理解成已完成付款。']
 ],'假設網路逾時後，手機不知道剛才的付款要求有沒有成功。',['先辨認逾時只表示沒有按時收到回應，不足以證明服務沒有處理。','重送時帶相同的業務識別碼，讓服務能辨認這是同一次付款。','由服務回傳或查詢該識別碼的正式結果，避免盲目再扣一筆款。'],'理解請求與回應的分離，才能正確處理逾時、重試與重複工作。','response','回應是接收方交回的結果；請求是發起方送出的要求。兩者可能在不同時間完成。',['client','server'],'付款請求逾時，能直接認定沒有扣款嗎？','不能。伺服器可能已完成工作但回應沒有送達；應利用識別碼查詢結果並採取冪等設計。');
 add('client',
 '同一個網站可以被手機、電腦瀏覽器或另一套程式使用。它們共同的角色是發起要求，並接收服務提供的結果；不需要都是由人直接按按鈕。',
 '用戶端是相對於某個服務而言的角色。手機查網站時是用戶端；網站伺服器再向資料庫查資料時，網站程式又成為資料庫的用戶端。',
 '分清角色有助於追蹤資料流，也能看出哪些輸入不可信。你不能只依賴用戶端畫面的檢查，因為別人可以改用自己的程式發送要求。',[
 ['準備請求內容','用戶端組合操作需要的資料，例如訂單編號和登入資訊，再送往服務公布的入口。服務的使用規則要一致，否則不同裝置會得到不同解讀。'],
 ['等待或追蹤結果','有些要求立即回覆完整結果，有些先回覆工作編號。用戶端要能顯示等待、失敗與重試，不能在送出後就無條件顯示成功。'],
 ['不要把安全只放在畫面','瀏覽器可以先檢查格式改善體驗，但伺服器仍需再次驗證。價格、權限與庫存不能只相信手機傳來的數值。']
 ],'假設購物App送出餐點價格，但有人把程式內的價格改低。',['App仍能發送格式正確的請求，因此不能只憑請求存在就接受。','伺服器根據商品編號讀取正式價格，再依促銷規則計算。','把確認後的金額寫入訂單，回傳給App顯示，而非直接採用客戶端的金額。'],'用戶端負責互動與發起要求；正式業務判斷仍由受控的服務端執行。','server','同一台電腦可以同時扮演兩種角色，分類要看這一次互動由誰發起，而非看設備外形。',['request','response'],'另一台伺服器可以是用戶端嗎？','可以。當它主動呼叫其他服務時，就是那次互動中的用戶端。');
 add('region',
 '雲端的機器仍放在真實地點。若主要客人在日本，把所有服務放在很遠的地理位置，網路往返可能更久；法規也可能限制資料能放在哪個地點。',
 '選擇Region是在決定資源的地理範圍，而不是替程式挑一個資料夾。不同Region中的服務資源通常要分別建立、授權及安排資料傳送。',
 'Region讓你依使用者距離、資料駐留、服務供應與災難範圍選位置。先知道要防的是單台機器故障、某個可用區故障，還是整個區域不可用。',[
 ['先選地理位置','建立大多數區域性資源前，要先指定Region。S3桶與EC2主機等資源的位置會影響連線路徑及費用，不會因帳號相同就自然靠在一起。'],
 ['再選區域內的隔離位置','同Region裡有不同AZ，可用來分散設施故障。兩台主機若都在同AZ，仍可能受同一個AZ事件影響。'],
 ['跨區域必須設計資料與切換','在第二個Region建立應用，不會自動取得第一個Region的最新資料。需要複寫或備份、可用權限、容量，以及把使用者導過去的方法。']
 ],'假設公司說必須防止某一個AZ失效，但目前沒有跨國服務需求。',['先在合適的Region建立系統，確認該區域提供需要的服務。','將可接手的應用與資料配置分散到不同AZ，測試其中一處停止時的行為。','只有當整個Region的災難也在需求內，才進一步比較跨Region復原策略與成本。'],'多AZ與多Region處理不同的故障範圍，不能只因數量都是兩份就視為相同。','az','Region是較大的地理範圍；AZ是其中的隔離設施群。邊緣節點則主要協助接收或傳遞流量。',['cloud','az'],'東京Region內的兩個AZ，算跨Region嗎？','不算。它們仍在同一Region，只是跨越了該Region內不同AZ的故障邊界。');
 add('az',
 '如果兩份網站程式放在同一個故障範圍，複製兩份也可能一起停。要降低一場設施事故同時影響所有副本的機會，必須先理解隔離邊界。',
 '一個AZ可以包含一個或多個資料中心，不能簡化成一台主機或一個機櫃。不同AZ的隔離設計，是多AZ架構能降低相關故障風險的基礎。',
 '應用、資料與流量入口都要配合分散。光是在第二個AZ放一台機器，若使用者仍只會連第一台，第一台失效後網站仍可能停止。',[
 ['資源會落在某個位置','例如子網路只屬於一個AZ，EC2建立在子網路中，也就具有該AZ位置。VPC可以涵蓋同Region內多個AZ，但單一子網路不能跨AZ。'],
 ['建立真正可接手的副本','另一份應用需要相同程式、適當設定及可取得的資料。若登入狀態只留在第一台主機記憶體，切到第二台時仍可能中斷操作。'],
 ['確認入口與資料層','負載平衡器可將請求送往健康目標；資料庫則要採適合的跨AZ配置。每個依賴都可能成為只有一份的弱點，必須一併檢查。']
 ],'假設兩台主機分別位在AZ A與AZ B，但資料只存在A的本機硬碟。',['A故障時，B上的程式雖然仍在執行，卻可能讀不到訂單。','將不可遺失的資料改放有適當可用性設計的資料服務，避免只依賴A。','再實際停止A的測試應用，檢查入口切換及下單流程是否仍完整。'],'跨AZ不是把圖畫成兩格，而是讓另一份完整服務鏈能接手。','region','多AZ降低AZ事件影響，但不自動提供跨Region的災難復原，也不取代歷史備份。',['region','subnet'],'應用跨兩個AZ，但資料只在一台主機上，是否已完整高可用？','沒有。資料層仍是單點，另一個AZ的程式可能因無法取得資料而失去服務能力。');
 add('edge-location',
 '假設照片存在遠方的主要儲存位置，每位客人每次看照片都走完整遠距路徑，會增加等待，也讓來源重複傳送相同內容。可以先在較接近客人的據點保存可重用副本。',
 '邊緣節點是內容傳遞或流量入口的位置概念。你通常透過CloudFront等服務使用它，不是在這裡自由建立與Region完全相同的一整套資源。',
 '常用內容靠近使用者後，可能縮短傳輸路徑並減少來源負擔；但資料必須能安全快取，而且更新與過期方式要先想清楚。',[
 ['第一次可能仍需讀來源','節點收到圖片請求時，若沒有可使用的副本，就向原始來源取得。不能假設第一次讀取一定只在附近完成。'],
 ['可重用的內容留下來','符合快取規則的結果可保留一段時間。下一位使用者要求相同內容時，服務可能直接回傳這份副本，而不再重跑完整來源路徑。'],
 ['更新與個人資料分開處理','圖片換版可使用新檔名，或依需要清除快取。私人訂單若錯誤共用快取，可能讓其他人看到不該看的內容，因此不能只追求命中率。']
 ],'假設東京與海外客人都讀同一批公開課程圖片。',['把原始圖片保存在指定來源，再讓CloudFront作為對外入口。','讓可快取圖片以合適期限保留，測量快取命中與來源請求的差異。','更新圖片時改用版本化名稱，避免使用者一直取得舊圖。'],'邊緣加速依內容和路徑而定，不代表任何動態操作都會被自動快取或加速。','region','Local Zone是另一種部署位置能力；它不是CloudFront邊緣快取節點的同義詞。',['region','cloudfront'],'邊緣節點有圖片副本，就表示能在那裡建立任意EC2嗎？','不是。內容傳遞節點與可部署運算資源的位置能力需要分別理解。');
 add('availability',
 '你打開網站時，資料也許還完整躺在硬碟裡，但程式壞了、入口不通或資料庫無法連線，都可能讓你無法完成下單。可用性看的是整個功能此刻能不能被使用。',
 '可用性常以一段觀察時間內正常提供服務的比例描述。設計時要先定義什麼叫成功，不能只看機器是否開著，而忽略實際業務流程是否能完成。',
 '降低停機要同時考慮故障機會、偵測速度和恢復時間。備援、健康檢查與切換能幫助，但每個相依服務仍可能影響完整結果。',[
 ['先定義可用的功能','對訂餐網站而言，首頁可開卻不能付款，不能直接說下單功能可用。監控要對準使用者真正需要的結果，而不只是某個固定頁面回傳成功。'],
 ['找出只有一份的依賴','只有一台應用、一個未備援資料庫或一條網路路徑，都可能成為單點。增加應用副本不會自動修好資料層的單點。'],
 ['縮短發現與接手的時間','自動檢查與切換可以減少人工等待，但必須測試。切換後資料、容量及使用者連線是否正常，才是復原是否成功的依據。']
 ],'假設資料庫維護時應用仍在線，但所有訂單查詢都失敗。',['從使用者角度記錄查詢失敗，而不是只看主機存活指標。','檢查資料庫是否有適當接手配置，應用是否能重新建立連線。','演練維護或故障，測量從開始失敗到恢復查詢的時間。'],'可用性要沿著完整服務鏈評估，單一元件正常不能代表整套服務正常。','durability','備份可能讓資料找得回來，卻需要還原時間；耐久性高也不保證當下可以讀取。',['server','ha'],'資料沒遺失，但網站一小時無法登入，影響的是什麼？','至少影響可用性。資料是否永久遺失是另一個耐久性或復原問題。');
 add('durability',
 '硬碟可能損壞，機器可能無法修復。若重要照片只有一份，設備損壞就可能永遠找不回。耐久性關心的是資料是否仍能被保存下來，而不是畫面載入得多快。',
 '資料服務可以用多份冗餘資料及故障修復降低永久遺失風險，但必須看具體儲存類別與配置。不能把某個服務的一項耐久性設計，套用到所有形式的單一副本。',
 '先判斷資料是否可重建、允許遺失多少，以及必須保留多久。不可重建的付款紀錄，與隨時可再下載的暫存檔，應採不同保存策略。',[
 ['用副本承受設備故障','當其中一份設備資料不可讀，其他保留的資料可協助修復。這是服務層對硬體故障的保護，不等於知道哪些刪除是你的操作失誤。'],
 ['把誤刪與歷史還原另外設計','若有權限的人刪掉正確物件，服務可能忠實執行刪除。版本控制、備份或保留鎖定等功能處理的是另一類風險。'],
 ['不要混用永久保存與即時存取','資料還在卻暫時無法讀取，可能是可用性問題。長期封存的資料即使保存良好，也可能需要先完成取回或還原流程。']
 ],'假設使用者把唯一一份家庭照片交給你的應用保存。',['先選擇符合不可重建資料需求的保存方式，而非只追求最低單價。','限制刪除權限，並比較版本與備份可保護哪些誤操作。','測試能否從受保護副本還原照片，且記錄還原所需時間。'],'耐久性、刪除保護與復原程序是互補的，不能只勾選其中一項就停止思考。','availability','可用性問現在能不能用；耐久性問資料會不會永久消失，兩種目標可能需要不同工具。',['storage','backup'],'服務有資料冗餘，是否就不必防止誤刪？','仍要防誤刪。系統可能把合法刪除同步到副本，需要版本、保留或備份等另外的保護。');
 add('latency',
 '當你按下按鈕，最在意的往往是等多久才看到結果。即使網站一秒能處理很多客人，你這一次操作仍可能因遠距連線、等待資料或排隊而很慢。',
 '延遲可以量不同範圍：一次網路往返、一個資料庫查詢，或從按鈕到完整畫面的時間。比較數字前，要確認兩者是不是在量相同的起點和終點。',
 '找出等待發生在哪裡，比直接加大主機更有效。CPU不忙時，瓶頸可能是遠端資料、磁碟或某個必須依序完成的流程。',[
 ['拆出請求經過的步驟','一次操作可能先查DNS、建立連線、驗證身分，再查資料。每段等待加起來才是使用者看到的時間，不能只改善其中最不重要的一段。'],
 ['量測平常與尖峰','平均很快仍可能有人等很久。觀察較慢那群請求的分布，並比較尖峰時排隊和下游負載，避免用單一平均值掩蓋體驗。'],
 ['依原因選改善方法','靠近使用者、重用可快取結果、減少不必要查詢，都可能降低延遲；若必須取得最新交易結果，不能為速度任意改讀過期快取。']
 ],'假設開商品頁要兩秒，但主機CPU只有少量使用。',['追蹤一次請求各段時間，發現大量時間花在跨區域查詢。','先評估讓資料與應用靠近，或快取可接受短暫陳舊的商品介紹。','重新量測完整頁面時間，確認改善沒有讓價格等重要資料變錯。'],'延遲改善要根據量測並保留正確性，不能把「換更大機器」當成固定答案。','throughput','吞吐量是每秒能處理多少工作，不是某一筆工作需要等待多久。',['request','response'],'網站每秒處理很多請求，是否代表每一筆都很快？','不一定。高吞吐量可以與單筆高延遲同時存在，必須分開量測。');
 add('throughput',
 '搬家時，一台車可以一次載很多箱，但路上仍要花一小時。傳很多資料也有類似差別：每秒能搬多少是吞吐量，一次工作等多久是延遲。',
 '吞吐量必須帶單位，例如每秒MB、每秒請求或每分鐘完成的訂單。不同工作大小差很多時，只比較請求數可能無法反映實際負載。',
 '大量備份、批次運算與尖峰接單，都需要足夠處理能力。整條路徑通常受最慢的一段限制，增加來源主機未必能提高最終完成量。',[
 ['先決定要算什麼工作','每筆檔案只有幾KB與每筆幾GB，所需傳輸量完全不同。估算時要同時考慮工作數量、平均大小，以及必須完成的時間窗口。'],
 ['找出限制容量的那一段','網路頻寬、磁碟讀寫、資料庫或外部服務都可能限制速率。若目的地只能接收固定量，讓更多來源同時送資料可能只會增加排隊。'],
 ['增加平行工作但保護下游','可把獨立工作分配給多個處理者，或選適合的儲存與網路配置。同時要限制並行，避免壓垮資料庫或把錯誤重試放大。']
 ],'假設一晚必須把大量檔案傳完，但目前到天亮仍有積壓。',['計算總資料量除以可用時間，得到所需平均傳輸速率。','量測來源讀取、網路及目的地寫入，確認限制在哪一段。','依瓶頸調整並行或容量，再觀察實際完成量，而不是只看來源CPU變高。'],'工作完成量要看整條路徑，不是看啟動了多少台機器或多少個執行緒。','latency','降低單筆延遲不一定提高大量資料的總吞吐，兩者改善方法可能不同。',['latency','request'],'來源加倍，但目的地寫入已滿，總完成量會保證加倍嗎？','不會。目的地仍是瓶頸，多出的工作可能只是排隊或失敗。');
 add('scalability',
 '一台主機能服務少量訪客，並不代表訪客增加百倍時也能正常運作。擴展性是在問：需求增加後，能否透過增加或調整資源繼續完成工作。',
 '擴展可以是把單台機器變大，也可以增加多台機器。後者需要工作能被分配，並且資料、登入狀態與相依服務不會只綁在某一台上。',
 '先知道系統最受限制的部分，才能擴得有效。前端多十台而資料庫仍只能處理原本的量，就只是把壓力更快送到資料庫。',[
 ['辨識可以獨立處理的工作','讀取不同商品或處理獨立影像，通常比修改同一筆熱門庫存更容易分散。共同修改同一筆資料時，還需要控制衝突與一致性。'],
 ['讓新增資源能取得相同上下文','新增應用需要相同版本、設定與可存取資料。若購物車只存在舊主機記憶體，新主機可能無法接續使用者操作。'],
 ['同時檢查配額與下游','增加主機前需確認位址、服務配額與資料庫連線等限制。擴展不是無限供應，也不代表新增資源能在瞬間準備完成。']
 ],'假設促銷期間把應用由兩台增加到十台，卻出現更多資料庫連線錯誤。',['先確認應用層確實需要更多容量，而非程式本身有無限重試。','計算每台新增主機可能打開多少連線，與資料庫可承受的量比較。','調整連線管理、快取或工作削峰，再逐步增加應用容量。'],'可擴展架構必須讓工作與依賴能一起承受成長，而非只提供加主機按鈕。','elasticity','擴展性表示能隨需求成長；彈性還強調需求下降後能收回資源。',['server','throughput'],'把應用增加十台，為何仍可能沒有更快？','因為資料庫、共享資料或其他下游可能才是限制，新增應用無法消除那個瓶頸。');
 add('elasticity',
 '如果網站只有週末忙，卻整週都保留週末容量，平日會有大量資源閒置。彈性希望資源能依工作量增加，也能在需求下降時減少。',
 '彈性不是猜一個永遠固定的台數，而是形成量測、調整與再量測的循環。系統還要知道何時可以安全移除處理者，不能把正在完成的付款直接中斷。',
 '這能降低長期閒置，但調整仍有時間與成本。太敏感會反覆增加和減少，太遲鈍則可能在尖峰時排隊，兩者都需要觀察實際業務。',[
 ['選有意義的負載訊號','CPU、請求量或佇列積壓可能是不同工作適合的指標。若工作主要在等外部服務，單看CPU低就縮容，可能錯過大量尚未完成的工作。'],
 ['擴容要等待準備完成','新主機需要啟動、載入程式並通過健康檢查，才應接收流量。可預測的活動可提前準備，不能等所有客人排隊才開始採購容量。'],
 ['縮容先停止接新工作','移除主機前，應讓入口停止送新工作，並依需求完成或重新安排既有工作。資料和登入狀態應避免只留在被移除的主機。']
 ],'假設晚間促銷結束後，流量由尖峰回到平常。',['確認請求與積壓都下降，而不只是某一瞬間CPU變低。','先從入口移除部分處理者，讓正在執行的請求有機會完成。','回收多餘容量，持續監控回應時間，並保留足夠基本容量。'],'彈性結合增加與收回，安全縮容與擴容同樣重要。','scalability','擴展性不保證自動縮回，也不表示任何服務都會依你的業務指標自行調整。',['scalability','health-check'],'活動結束就立即關掉所有新主機，為什麼可能出問題？','因為它們可能仍在處理工作或保存必要狀態，需先排空、完成或安全重派。');
 add('ha',
 '網站有備用機器，不等於故障時客人就一定會用到它。高可用要把副本、故障偵測、流量轉送與資料接手安排成一個完整流程。',
 '它追求的是減少服務中斷，而不是保證永遠沒有錯誤。具體要做到多高，必須依業務可接受中斷時間、系統依賴與成本來決定。',
 '人工半夜接電話再重新安裝，往往太慢。預先準備可接手的服務與自動化，能減少等待，但也會增加資源費及測試工作。',[
 ['先跨越需要防範的故障範圍','只防單台主機故障，可以安排多台；要防AZ事件，副本就需在不同AZ。若整個Region失效也在需求內，還要另一層復原設計。'],
 ['檢查服務是否真的健康','機器開著卻無法完成必要資料查詢，不一定是健康目標。檢查方式要貼近服務能力，並避免把短暫下游故障無限放大。'],
 ['讓切換後的鏈條仍完整','接手應用必須能取得正確資料、秘密和網路連線，且剩餘容量要能承擔流量。入口切過去但資料讀不到，仍不算恢復。']
 ],'假設其中一個AZ的應用全部失效。',['入口偵測該AZ的目標不健康，不再把正常新流量送往那些目標。','另一個AZ的應用接收請求，並使用仍可取得的資料服務。','監控錯誤率及負載，確認備援容量足夠，並在事後修復或補回容量。'],'高可用要驗證故障後的完整功能，不是只數圖上有幾個副本。','backup','備份著重找回資料，高可用著重讓服務持續或盡快恢復；誤刪仍可能需要歷史還原。',['availability','az'],'有第二台主機但沒有流量切換機制，就一定高可用嗎？','不是。使用者仍可能一直連失效主機，備援必須真正接入服務鏈並能取得資料。');
 add('fault-tolerance',
 '分散系統一定可能遇到部分元件故障。容錯先問的是：如果某個零件壞了，其餘部分能否繼續提供所需功能，而不是整套一起停止。',
 '容錯必須指定能容忍哪種故障與多少故障。能承受一台應用停止，不表示同時失去資料庫、網路及整個Region時也能照常運作。',
 '容錯可降低故障影響，但通常需要備援、資料協調及額外容量。對所有元件都追求最高規格，可能超出業務需要，也會增加複雜度。',[
 ['界定哪些東西可以失敗','列出應用、儲存、網路與外部服務，逐一問失效後會中斷什麼。把沒有替代路徑的元件標成單點，再決定哪些必須改善。'],
 ['安排替代與隔離','不同工作可以放在獨立佇列或處理者，避免一個下游卡住全部功能。可重試工作需設計重複保護，不能靠無限重試掩蓋問題。'],
 ['演練而不是只相信圖','在測試環境停止指定元件，觀察使用者是否仍能完成重要操作。還要檢查錯誤是否被保存、容量是否不足，以及復原後怎麼補回資料。']
 ],'假設寄通知服務故障，但客人仍必須能下單。',['把寄信與確認訂單的工作分離，先可靠保存訂單及待寄事件。','通知處理者故障時讓工作排隊，限制重試並保留無法處理的訊息。','通知服務恢復後再處理積壓，避免同一事件重複寄出大量相同信件。'],'可容忍的局部故障不該直接擴散成全部服務停止，但仍需處理積壓與重複。','ha','高可用與容錯相關，但描述時都要說清楚故障範圍與恢復行為，不宜把名稱當成絕對保證。',['ha','async'],'系統能容忍通知服務故障，代表能容忍所有服務故障嗎？','不能。容錯能力針對指定故障，需要另外分析資料庫、入口與其他依賴。');
 add('backup',
 '把同一份資料即時放到兩個地方，可以防某些設備故障；但若程式把內容錯改，錯誤也可能立即傳到兩邊。你還需要能回到較早狀態的資料副本。',
 '備份保存的是可用於還原的資料狀態。它可能是完整副本、快照或服務提供的復原資料；真正重要的是你能否用它找回需要的內容。',
 '備份設計要先回答能接受遺失多少最新變更、允許停多久、需要保留多久。備份成功訊息不等於已證明應用可以順利復原。',[
 ['安排時間與保留','每天一次的備份，在最差情況可能缺少距上次備份後的變更。保留期則決定多久以前的版本仍可能找回，應與業務需求對應。'],
 ['隔離備份的刪除風險','若同一個管理錯誤能刪掉正式資料和全部備份，保護會不足。依需求安排權限隔離、跨位置副本或保留鎖定，並核實服務支援。'],
 ['實際執行還原測試','從選定備份建立可用資料，接回測試應用，驗證完整性、權限及所需時間。復原可能還依賴機密、設定與程式版本，不能只看資料檔案。']
 ],'假設今天下午發現上午有人誤刪一批訂單。',['先停止會繼續破壞資料的操作，確認要回復的時間點與資料範圍。','把適當備份還原到安全位置，比對缺少的訂單與最新合法資料。','按程序回復服務並驗證，而不是直接覆蓋正式資料後才發現遺失更多新訂單。'],'備份需要可執行的還原程序；它不能直接取代即時接手的備援。','replication','複寫通常持續傳送新變更，備份則提供可回到某個歷史狀態的能力，兩者常需同時存在。',['storage','rpo'],'備份檔案存在，就保證一小時內恢復網站嗎？','不保證。需要測試還原、重建應用與切換等完整程序，才能驗證復原時間。');
 add('replication',
 '一份資料放在一台設備上，設備失效可能讓服務停止。複寫把資料的變動送到另一份資料，讓其他位置也能擁有某種程度接近原始資料的內容。',
 '複寫可以同步或非同步。同步通常要等指定副本確認後再視為完成；非同步先完成主要寫入，之後才傳到其他副本，因此可能暫時有差距。',
 '副本可用於接手、讀取或跨區域存取，但用途依服務配置而異。不能看見「有副本」就推論它可讀、會自動接手，或完全沒有延遲。',[
 ['確認哪一份接受寫入','有些設計只讓主要節點修改資料，其他副本接收變更；有些服務支援多位置寫入。寫入規則會影響衝突處理及應用設計。'],
 ['觀察變更傳播速度','若寫入完成後立刻改讀非同步副本，可能尚未看到新內容。需要最新結果的流程，應使用支援其一致性需求的讀取路徑。'],
 ['分開處理錯誤與設備故障','複寫會把合法變更傳過去，也可能把合法但錯誤的刪除傳過去。要找回誤刪前資料，仍需歷史版本、備份或支援的時間點復原。']
 ],'假設報表從讀取副本查資料，卻晚幾秒才看到新訂單。',['先確認副本是非同步複寫，並觀察延遲是否在可接受範圍。','報表若能容忍短暫落差，可以繼續利用副本分散讀取負載。','付款後立即確認訂單等流程，改用符合最新讀取需求的路徑，不靠反覆等待碰運氣。'],'複寫方式、一致性與副本用途要一起看，不能把所有副本當成相同功能。','backup','備份提供歷史復原點；複寫關心把變更送到另一份資料，通常不會自動保留所有較早狀態。',['backup','consistency'],'非同步副本讀不到剛寫入的訂單，一定是資料永久遺失嗎？','不一定，可能只是變更尚未傳到副本；應核對讀取路徑與複寫延遲。');
 add('rto',
 '老闆說網站不能停太久，這句話還不能拿來選服務。「太久」需要變成可以測量的目標，例如災難後最多一小時必須恢復接單。這就是復原時間目標。',
 'RTO從業務角度描述可接受的中斷時間，不是一個開關。你必須把偵測、決策、資料還原、啟動應用、驗證和流量切換都算進去。',
 '目標越短，通常越需要預先準備的資源與自動化。若每一步都等事故後才開始做，就很難承諾很短的復原時間。',[
 ['先定義何時算恢復','主機啟動完成不一定等於使用者能下單。要指定重要功能的成功標準，例如登入、查訂單與付款都能完成。'],
 ['把程序拆成可量測步驟','記錄從發現故障到驗證完成的實際時間。等待人員核准、服務建立及DNS快取更新，可能比真正還原資料花更多時間。'],
 ['透過演練驗證目標','紙上加總只是估計。定期從備份或備援環境執行復原，找出權限、容量、設定缺漏，再更新程序與目標。']
 ],'假設要求RTO一小時，但光從備份還原資料就需要五十分鐘。',['把其餘步驟也列出，發現啟動與驗證還需要半小時，完整流程超過目標。','比較預先準備縮小待命環境、加快還原或調整業務需求等選擇。','再次演練完整復原，確認不是只把某一段速度改善就宣稱達標。'],'RTO必須是完整流程可驗證的結果，不能從服務名稱直接推定。','rpo','RPO問可以遺失多少時間的最新變更；RTO問服務可以停多久，兩者不是同一個時間。',['backup','availability'],'RTO十五分鐘，是允許遺失十五分鐘資料嗎？','不是。那是RPO在描述的事情；RTO是從中斷到恢復重要服務的時間目標。');
 add('rpo',
 '假設你每天午夜影印訂單簿，隔天下午原本的帳本損壞。即使影本能還原，你仍可能少掉午夜之後的新訂單。RPO是在規定最多可接受少掉多少時間的變更。',
 '它描述希望復原到多接近故障時刻的資料狀態。目標十五分鐘，表示設計必須能在災難後取得距故障不超過十五分鐘的可用資料狀態。',
 '較短RPO通常需要更頻繁備份、持續復原紀錄或複寫，但還要考慮故障是否也會影響這些資料。不能只設定排程就保證永遠符合。',[
 ['從業務資料損失開始問','金流交易、可重建的分析快取與測試資料，對最新資料損失的容忍程度可能不同。先分資料類型，不要為所有資料盲目採同一高成本策略。'],
 ['對應保存或傳播頻率','備份間隔、複寫延遲與傳輸失敗，都可能擴大落差。若目標很短，必須監控實際落差，而不是只知道備份工作有啟動。'],
 ['測試真正可以還原的時間點','有檔案不表示可用，紀錄不完整也可能無法復原。演練時要確認能回到哪個時間，並對缺少的變更進行業務比對。']
 ],'假設RPO十五分鐘，但系統只在每天午夜做一份備份。',['選擇下午發生災難的情境，估算會缺少午夜後多少資料。','發現每日備份不足以滿足十五分鐘目標，需評估其他保存與復原方式。','建立監控與演練，確認即使其中一個排程失敗，仍能知道目標是否受到威脅。'],'RPO約束的是資料落差，不是重建機器的速度；需要與RTO一起討論。','rto','可以幾秒啟動主機，不表示資料一定接近故障時刻；資料新舊和服務恢復速度要分開驗證。',['backup','replication'],'每晚備份一次，能保證十五分鐘RPO嗎？','不能。距上次備份後可能已有數小時變更，必須選擇更符合目標的保護與監控方式。');
 add('ip',
 '送資料要知道收件位置。網域名稱適合人記憶，但網路設備還要使用位址判斷資料該送往哪個介面；IP位址就是這種定位資料。',
 'IPv4常寫成四段數字。私有位址可在隔離網路中重複使用，不代表網際網路上的任意人都能直接找到它；公開位址則有不同的可達性用途。',
 '理解位址可避免把「有地址」誤以為「大家都能連上」。連線仍受路由與安全規則影響。',[
 ['先看位址在哪個網路','10.0.1.10可以是VPC中的主機位址。另一個隔離VPC也可能使用相同位址，因此不能只憑數字相同就認為是同一台主機。'],
 ['再看目的地怎麼走','主機送資料時，路由規則決定下一站。即使知道對方IP，缺少可達路徑或回程路由，仍無法完成來回通訊。'],
 ['最後檢查允許的連線','安全群組或網路ACL可能阻擋連線。IP不是使用者身分，也不是資料操作權限；網路通了仍可能沒有讀取資料的授權。']
 ],'假設私有EC2有IP，卻無法從家中電腦直接連線。',['確認該位址是不是只在私有網路中使用。','檢查是否有合適的私有連線或受控管理入口，而非把規則全部公開。','再檢查路由與安全規則，區分無路可走和被規則拒絕。'],'位址、路徑與允許規則要一起成立，才能讓連線完成。','dns','DNS幫人由名稱找到位址；它不會替你新增路由或開放防火牆。',['vpc','route-table'],'只知道對方IP，就一定能連到它嗎？','不能。還需要可達的路徑、回程與允許連線的安全規則。');
 add('dns',
 '人容易記住網站名稱，卻不容易記住網路位址。你輸入網站名稱後，瀏覽器需要先知道該向哪個入口建立連線，DNS協助完成這個查找。',
 'DNS回覆的是名稱對應的紀錄，不是網站畫面本身。常見紀錄可提供位址，也可把名稱指向另一個名稱；後續網站請求才沿網路送往入口。',
 '名稱把使用者與底層位址分開，讓服務可在保留網址時調整入口，但快取也意味著改動不一定立刻被所有人看到。',[
 ['先查名稱紀錄','用戶端向解析服務詢問名稱，取得可使用的回答。公開名稱與企業內部名稱可能由不同的DNS設定回答。'],
 ['保存一段時間的回答','TTL表示回答可被快取多久。改動紀錄後，已快取舊回答的裝置仍可能先使用舊結果，直到其快取失效。'],
 ['再建立真正的服務連線','找到入口後，瀏覽器才建立HTTP或HTTPS連線。網站連不上時，需要分清名稱解析失敗與入口服務本身失敗。']
 ],'假設網站移到新入口，但部分客人仍到舊位置。',['檢查正式DNS紀錄是否已正確修改。','比較不同位置取得的回答與快取期限，確認是否仍保留舊紀錄。','在切換期間保留必要相容性，避免以為改完一筆紀錄就能立即移除舊服務。'],'DNS提供查找與路由決策資訊，但多數情況不代理每一個網站封包。','ip','IP用來定位網路介面；DNS是由名稱查找相關紀錄的系統，不能混成同一件事。',['client','ip'],'DNS查到位址，但網頁仍失敗，DNS就一定錯嗎？','不是。名稱可能已正確，後續網路、憑證、應用或資料服務仍可能有問題。');
 add('http',
 '兩個程式要交換資料，需要約定如何說明要做什麼，以及如何回答成功或失敗。HTTP就是瀏覽器與網站經常使用的請求和回應規則。',
 '請求可以帶操作種類、路徑、標頭與內容。回應則帶結果狀態及資料；這些格式讓不同程式可以合作，而不必知道對方內部用哪種程式語言。',
 '看懂HTTP有助於區分網路、登入權限和應用錯誤，也能理解為何讀取頁面與送出新訂單不是同一種操作。',[
 ['描述想做的動作','GET通常用於取得資源，POST常用於送出內容或要求處理。實際意義由服務的使用契約定義，不能只靠網址名稱猜測。'],
 ['接收方執行檢查','網站會檢查輸入與授權，必要時讀寫資料。收到HTTP請求不代表應信任它，伺服器仍要核對身分及業務條件。'],
 ['讀取回應而非只看連得上','成功、拒絕與服務錯誤會有不同回應。用戶端要處理失敗與逾時，不能把連線建立成功當成訂單已成功保存。']
 ],'假設手機送出下單資料，網站回覆拒絕。',['先檢查是否送到正確路徑，以及必要欄位是否完整。','讀取回應內容，判斷是登入權限、資料格式還是業務條件問題。','依規則修正或提示使用者，不要不分原因地不停重送相同訂單。'],'HTTP解決交換訊息的格式，資料正確性與安全仍需由系統設計。','https','HTTP本身不表示傳輸已加密；HTTPS是在其通訊上使用TLS保護。',['request','response'],'HTTP回傳成功，就代表程式的所有業務邏輯一定正確嗎？','不是。通訊成功與業務設計正確是不同層次，仍要驗證保存及授權等行為。');
 add('https',
 '登入資料若在網路途中以可直接閱讀的方式傳送，沿路的觀察者可能看到內容。網站需要保護瀏覽器到服務入口之間的通訊。',
 'HTTPS仍使用HTTP表達請求和回應，只是透過TLS建立受保護的傳輸連線。它同時涉及加密與確認連線對象，不是網址多一個字母的裝飾。',
 '使用者送密碼、個資或訂單時，傳輸保護非常重要；但它不能保證網站內容本身可信，也不會替你修好資料庫權限。',[
 ['先確認網站身分','瀏覽器檢查憑證是否與網域及信任要求一致。遇到憑證警告應找出原因，而不是教使用者固定略過警告。'],
 ['建立加密的傳輸連線','連線建立後，請求與回應在傳輸中受到保護。若網站後面還有另一段連線，也要獨立確認那一段是否加密。'],
 ['把保存與操作安全另外設計','資料到達服務並解密後，程式仍可能錯誤記錄密碼或讓別人讀取。保存加密、最小權限與輸入檢查不能省略。']
 ],'假設使用者到ALB是HTTPS，但ALB到應用只使用未加密HTTP。',['畫出兩段連線，避免把入口的HTTPS視為整條路徑都加密。','依資料敏感度與安全需求設定後端傳輸保護，並核對憑證。','同時檢查資料保存、日誌及權限，確認沒有在其他位置暴露敏感內容。'],'加密要沿實際路徑逐段檢查，不能只看瀏覽器顯示鎖頭。','tls','TLS提供傳輸保護機制，HTTPS是HTTP使用這種保護時的通訊方式。',['http','tls'],'網站使用HTTPS，就不必對S3資料設定存取權限嗎？','仍然需要。HTTPS只保護傳輸，不能決定誰有資格讀取保存中的資料。');
 add('tls',
 '想像你透過陌生道路寄重要訊息：不只希望別人看不懂，也希望確認收到訊息的人真是預期的對象。TLS處理的就是連線層的這類保護。',
 '一般網站TLS通常由伺服器出示憑證，讓用戶端驗證服務身分；並非每一種TLS連線都會要求雙方各自出示客戶端憑證。',
 '它保護傳輸中的機密性與完整性，但權限判斷仍在應用或服務層完成。加密後的錯誤請求仍然可能是錯誤請求。',[
 ['核對憑證與名稱','憑證與受信任機制協助用戶端確認服務。網域不符、期限或信任鏈問題，都可能讓連線被拒絕。'],
 ['協商連線保護','雙方在建立連線時協商支援的安全參數，之後保護傳輸內容。不能只設定某個埠號，就認為程式已正確使用TLS。'],
 ['管理憑證的生命週期','憑證需要正確配置與更新。AWS ACM可協助支援服務管理憑證，但你仍要把正確憑證關聯到實際入口。']
 ],'假設改成新網域後，瀏覽器開始顯示憑證名稱不符。',['先比較使用者輸入的名稱與入口提供的憑證涵蓋名稱。','核對負載平衡器或內容傳遞服務的憑證設定，而不是先關閉驗證。','修正後測試正常連線，也確認後端連線是否符合設計的加密需求。'],'TLS出錯要修復身分與連線設定，不應把略過安全檢查當成正式解法。','https','HTTPS是一個使用TLS保護的HTTP應用方式；其他協定也可能使用TLS。',['http','https'],'TLS是否一定要求每位網站訪客提供客戶端憑證？','不一定。一般網站多半驗證伺服器憑證，雙向憑證驗證是另需配置的情境。');
 add('vpc',
 '你不會希望網站訪客能直接連到所有內部機器。建立應用時，需要先劃定一個由你設定地址、道路與入口的網路範圍，VPC提供這個邏輯空間。',
 'VPC不是某台伺服器，也不是自動安全的魔法盒。它提供隔離與網路配置能力；資源放在哪裡、哪些路徑可通以及哪些連線被允許，都需設計。',
 '它能把對外入口、內部應用和資料層分工，讓不必直接對外的資源保留在受控路徑中。',[
 ['先選位址範圍','建立VPC時規劃可使用的網段，並考慮未來是否要接公司機房或其他VPC。範圍重疊可能讓互連與路由變得困難。'],
 ['再劃分子網路與位置','子網路把位址範圍切成部分，每個子網路只在一個AZ。跨AZ應用需要在不同AZ建立相應子網路，而非把同一子網路複製名稱。'],
 ['最後安排道路與門禁','路由表決定下一站，Internet Gateway或端點提供特定連線能力，安全群組與ACL限制允許流量。這些功能互補，沒有一個能取代全部。']
 ],'假設建立一個網站及保存正式訂單的資料庫。',['讓對外入口接收訪客，而不要把資料庫直接當成公開服務。','應用透過受控內部路徑連資料庫，資料庫只允許需要的來源。','使用多AZ部署時檢查每個AZ的子網路、路由及可用依賴。'],'VPC設計是把位置、路徑與權限界線畫清楚，不是建立一台大電腦。','subnet','VPC是較大的網路範圍，子網路是其中位於單一AZ的一段位址範圍。',['ip','subnet'],'資源放進VPC，就自動不可能被外界存取嗎？','不會。公開位址、路由及允許規則仍可能讓它對外可達，需要逐項設計。');
 add('subnet',
 '一個網路通常要分成不同用途或位置。子網路是一段可分配給資源使用的位址範圍；在AWS中，每個子網路也綁定到一個AZ。',
 '例如/24描述一段IPv4範圍，但其中不見得每個位址都能交給你的主機，服務會保留部分位址。規劃容量時要以AWS規則計算。',
 '子網路把位置與路由安排連起來，可以讓對外入口和內部資料層採不同路徑，而不只是替機器分組貼標籤。',[
 ['先分配不重疊的範圍','同一VPC中的子網路位址不能任意重疊。規劃時要為主機、容器、負載平衡及服務網路介面保留足夠空間。'],
 ['確認所屬AZ','一個子網路只在一個AZ。要在另一個AZ部署副本，需要另一個子網路，並配置那裡所需的路由與安全依賴。'],
 ['根據實際路由判定用途','名稱叫public不會讓它公開。應查看路由表是否有直接通往Internet Gateway的路徑，以及資源是否有合適位址和規則。']
 ],'假設應用主機一直新增失敗，卻還有帳號主機配額。',['檢查要放置資源的子網路是否仍有足夠可用位址。','確認新增資源是否需要多個網路介面，避免只估算主機台數。','調整容量規劃及部署位置，並保留未來擴展空間，而非只增加帳號配額。'],'子網路容量與AZ位置都是實際限制，不能只把它看成畫圖用的框。','vpc','VPC可涵蓋同Region的多個AZ，單一子網路不能因此變成跨AZ。',['vpc','cidr'],'一個子網路可同時放在兩個AZ嗎？','不可以。需要在不同AZ分別建立子網路，才能部署跨AZ資源。');
 add('public-subnet',
 '若要讓網站入口直接接收網際網路流量，所在網路必須具有適當對外道路。公有子網路是在談路由能力，不是說其中所有資料都公開。',
 'IPv4主機要直接連網，通常還需公開位址與允許的安全規則。只把主機放進有對外路由的子網路，不會自動替它取得所有條件。',
 '把必須對外的入口放在這裡，其他內部處理仍可保持私有，能讓公開面較清楚，而非把每台後端都暴露。',[
 ['路由表要通往IGW','查看子網路關聯的路由表，確認適用目的地的路由指向Internet Gateway。VPC中只有掛閘道但未配置路由，仍不代表路徑完整。'],
 ['資源要有合適位址','以一般IPv4主機為例，直接網際網路通訊還涉及公開位址。私有位址本身不會變成全球可路由的對外地址。'],
 ['只開必要連線','安全群組應允許網站需要的入口，而不是任意開放管理埠。公開入口也仍需應用驗證、TLS與適合的監控。']
 ],'假設公開ALB接收訪客，再把流量轉給私有應用。',['在合適的公有子網路建立對外ALB，核對其路由。','讓應用只接受ALB來源的必要連線，不為了ALB而把全部主機公開。','測試訪客能到網站入口，但不能直接跳過入口連內部資料庫。'],'公有子網路是網路道路的一部分，公開哪些服務仍取決於多個條件。','private-subnet','私有子網路沒有直接指向IGW的路徑，但仍可能經NAT或端點主動連到需要的服務。',['subnet','igw'],'公有子網路中的每台EC2，都自動能直接接受外網連線嗎？','不一定。還需要合適的公開位址、路由與安全規則，且應只開必要的服務。');
 add('private-subnet',
 '資料庫通常只需要被應用讀寫，不需要接受全世界訪客直接連線。私有子網路讓這些資源不具有直接通往Internet Gateway的路由。',
 '「私有」不表示不能與任何東西通訊。它可以透過內部網路、VPN、受控NAT或服務端點取得必要能力，重點是明確安排路徑。',
 '這有助於減少直接對外的入口，但不是取代權限與安全規則；若內部來源被入侵，仍須限制能做的事。',[
 ['把非入口資源留在內部','應用可透過公開負載平衡器接收工作，而資料庫只接受應用連線。訪客不需要知道資料庫的私有位址。'],
 ['區分主動出站與被動入站','私有主機若需要下載更新，可評估NAT出站；這和讓陌生人任意建立入站連線不同，不能把兩者需求混在一起。'],
 ['連AWS服務可走私有端點','讀S3等服務不一定需要先出網。依支援服務選擇端點、路由與政策，並記得網路可達不會自動授權讀檔。']
 ],'假設私有EC2要讀S3商品圖，但不需一般網際網路。',['確認主機已有讀取指定物件的角色權限。','建立符合服務與區域需求的S3端點及路由，核對端點和桶政策。','測試可讀指定圖檔，其他不應存取的資料仍被拒絕。'],'私有設計不是阻斷所有工作，而是為每種必要連線提供受控路徑。','public-subnet','子網路名稱並不決定私有或公有，要查看實際路由；公開IP也不能代替缺少的對外路由。',['subnet','nat'],'私有EC2不能直接上網，就一定無法讀S3嗎？','不一定。可以評估適用的VPC端點，不必為S3流量一律建立NAT路徑。');
 add('cidr',
 '建立網路前，要說清楚哪些位址屬於它。逐一列出數千個位址很不方便，CIDR用一個起點和前綴長度描述整段範圍。',
 'IPv4斜線後的數字表示位址中固定的前面位元數，數字越大，可變部分越少，範圍通常越小。它不是直接表示可放幾台機器。',
 '位址範圍同時用於分配、路由與安全規則。把範圍開得太廣可能造成不必要暴露，範圍太小則可能限制未來擴展。',[
 ['比較範圍大小','10.0.0.0/16包含的IPv4範圍比10.0.1.0/24大。計算資源容量時，還要扣除服務保留及已有介面使用的位址。'],
 ['避免需要互通的網路重疊','若兩個VPC都使用相同範圍，互連時會難以判斷相同目的位址究竟指哪邊。需提前考慮公司機房和其他網路。'],
 ['把預設路由當成廣泛目的地','0.0.0.0/0涵蓋所有IPv4目的地，常用作沒有更明確路由時的方向；它不是只表示某一個網站，也不會本身授權連線。']
 ],'假設公司機房與新VPC都打算使用10.0.0.0/16。',['在連線前先比對所有網段，找出重疊。','重新規劃可互通的位址空間，避免等服務上線後才搬動大量資源。','把規劃結果同步到子網路、路由與安全規則，確認回程也一致。'],'CIDR是描述範圍的語言；範圍本身不代表機器存在，也不表示能自由互通。','ip','IP是一個位址，CIDR可以表示一整段位址；同一表示法也會出現在不同功能的規則中。',['ip','vpc'],'/24的範圍比/16大嗎？','在IPv4中通常相反。固定的前綴更長，可變位址部分更少，所以/24範圍較小。');
 add('route-table',
 '資料知道目的位址後，還要知道下一步走哪個出口。路由表就像轉送規則清單，讓網路依目的地範圍選擇下一站。',
 '它不會判斷你是否有權讀取某個檔案，也不是登入機制。路由主要回答往哪裡走，安全規則與服務授權則回答可不可以通過和操作。',
 '連線問題常出在路徑少一段、走錯出口或回程沒有對應規則；只增加安全群組Allow通常無法修復缺少的道路。',[
 ['先找符合目的地的路由','多條規則都符合時，較具體的目的地範圍通常優先。例如特定服務範圍的路由可以比一般預設出網路由更明確。'],
 ['確認路由表關聯對象','修改了路由表，不代表使用中的子網路有關聯它。排查時要從實際主機所在子網路追到真正適用的路由。'],
 ['把來回路徑一起畫出來','去程能到目的地仍不夠，回應也要回得來。跨VPC、VPN與公司網路時，要檢查兩邊路由及是否支援轉送。']
 ],'假設私有EC2有NAT，卻仍下載不了外部套件。',['先看EC2子網路實際關聯的路由表，確認預設路由目標。','再看NAT所在位置及其通往IGW的路徑是否完整。','最後核對安全規則和目的服務，避免只看VPC裡「存在NAT」就認為已接通。'],'路由要逐跳追蹤，元件存在和主機實際使用它是兩回事。','sg','安全群組不會替你選下一站，路由表也不會自動開放被安全規則擋住的連線。',['cidr','subnet'],'改了沒有被子網路使用的路由表，會修好該子網路的路徑嗎？','通常不會。必須確認實際關聯及有效路由，而不是只修改名字相似的表。');
 add('igw',
 'VPC是隔離網路，並不因為建好就自動具備網際網路路徑。Internet Gateway提供VPC與網際網路之間的對外連線能力，但還需要其他條件配合。',
 '它不是一台讓你安裝網站的電腦。對一般IPv4直接出入網，主機位址、子網路路由與安全規則都必須正確，不能只掛閘道。',
 '有了明確入口與出口，你能只讓需要公開的服務對外，其他資源仍走內部或受控出站路徑。',[
 ['將閘道關聯到VPC','閘道提供這個VPC對外的能力；不等於VPC中所有子網路立即都把外部流量送往它。'],
 ['在適用路由表安排路徑','公有子網路常有通往IGW的預設路由。沒有這條路由時，主機不會因為閘道存在就自動找到對外道路。'],
 ['確認主機與安全條件','主機需要合適可達位址，安全群組與ACL也要允許必要流量。外界能連到主機後，應用仍需要自己的驗證與授權。']
 ],'假設你掛了IGW，但主機仍只有私有IPv4且沒有其他出網安排。',['先區分是否真的需要主機被外部直接存取，避免為下載更新就把它公開。','若應保持私有，評估NAT或需要的服務端點；若應公開，核對全部直接通訊條件。','測試需要的方向與服務，並確認沒有不必要的管理入口暴露。'],'IGW是路徑元件，不能取代位址、路由或防護規則的設計。','nat','NAT常用來讓私有IPv4主機主動出網；IGW並不是替所有私有主機自動提供相同功能。',['vpc','public-subnet'],'只把IGW掛上VPC，所有資源就都能上網嗎？','不是。每個資源還要有適用的路由、位址與允許規則。');
 add('nat',
 '內部主機可能需要到外部下載更新，但你不想讓外界任意直接連入它。這是「主動對外」的需求，和公開網站接收訪客不同。',
 'NAT會記住內部主機發起連線的對應關係，讓外部回應能送回正確來源。公有NAT Gateway是AWS提供的受管做法之一，仍需配置適當路由。',
 '它能保留主機的私有位置並提供必要出站，但有費用與部署選項需要考慮；大量AWS服務流量也可能有更直接的端點路徑。',[
 ['私有主機先發起連線','主機把外部目的地的資料送往NAT，而不是等待陌生外部使用者直接連進來。回應依既有連線關係返回，不表示可任意新建入站。'],
 ['對外路徑仍需完整','公有NAT的網際網路路徑需要配合IGW等配置；私有子網路的路由也必須指向正確NAT。只建立元件不會替所有主機改路由。'],
 ['評估故障範圍與計費','依實際部署模式與區域評估可用性、跨位置路徑和流量處理成本。存取S3或DynamoDB等服務可比較支援的端點方案。']
 ],'假設私有主機每天大量經NAT讀取同區域S3檔案。',['先確認真正需要的是S3存取，而非任意網際網路連線。','比較S3 gateway endpoint的路由與政策需求，讓適用流量走該路徑。','重新觀察NAT流量與帳單，同時保留主機真正需要的其他出站能力。'],'NAT解決特定網路出站問題，不會授予S3讀取權，也不是網站入口。','alb','ALB接受並分配訪客請求，NAT主要處理私有來源發起的外部連線，兩者方向與用途不同。',['private-subnet','route-table'],'想公開網站給客人使用，應只建立NAT嗎？','不適合。NAT不是訪客入口，應另選適合協定與架構的公開入口。');
 add('sg',
 '主機連上網路後，仍需決定哪些來源可使用哪些服務。例如資料庫應只接受應用查詢，不必接受所有人的任意連線。安全群組描述這些允許規則。',
 '規則常涉及來源、協定和連接埠。連接埠可先理解成機器內不同服務的入口編號；有路能到主機，不代表每個入口都應開放。',
 '將規則貼近服務分工，可以減少一處出錯後能接觸的範圍；但它不會取代資料庫帳密或AWS資料操作權限。',[
 ['只允許真正需要的來源','應用需要接受ALB轉送，就限制必要流量來自ALB的安全群組；資料庫則只接受應用群組，而不直接放全網。'],
 ['理解有狀態回程','允許一個連線後，該連線的回應通常會自動獲准。這不表示外部任意新連線也被允許，要分清回應與新請求。'],
 ['沒有明確Deny規則','安全群組描述Allow；未符合允許的流量不會被放行。若要子網路層的編號式允許與拒絕，需另外理解NACL。']
 ],'假設應用能連資料庫，但不希望其他測試主機也能連。',['查看資料庫關聯的所有安全群組，避免另一個群組開了更廣泛來源。','讓必要資料庫埠只允許正式應用群組，確認去程與有效路由。','測試應用成功、非授權測試主機失敗，同時保留資料庫自身的驗證。'],'安全群組控制網路流量，最小來源與必要入口比一律開放更可管理。','nacl','NACL位於子網路邊界且無狀態；安全群組的回程行為不能直接套用到它。',['eni','stateful'],'讓安全群組允許連S3，就等於有權讀S3物件嗎？','不是。網路可達與服務授權是不同層次，仍需適用的IAM和資源政策。');
 add('nacl',
 '除了每個資源的門禁，有時還需要在整個子網路邊界處理流量。NACL是一組依編號檢查的允許與拒絕規則，不會記住剛才已放行的連線。',
 '它對去程和回程分別評估，因此用它限制流量時，必須理解回應使用的位址、協定與埠範圍，不能只開一個方向。',
 'NACL適合需要子網路層界線或明確拒絕的情境，但規則順序與回程常使配置更複雜；它不是替代所有安全群組的捷徑。',[
 ['由較小編號開始比較','命中適用規則後決定允許或拒絕，順序會影響結果。新加的Allow若排在已命中的Deny後面，不能期待它覆蓋前者。'],
 ['入站與出站各自檢查','請求獲准進入，不代表回應自動能離開。實際連線常涉及用戶端臨時埠，需依工作負載確認回程條件。'],
 ['配合其他層定位問題','流量必須同時符合有效路由、安全群組與NACL等配置。某層Allow不會取消另一層的拒絕，應逐層確認。']
 ],'假設開了網站入站規則後，使用者仍收不到完整回應。',['確認請求是否確實到達，以及來源和目的地是否符合預期。','檢查NACL出站回應規則，特別是回應到用戶端的埠範圍。','再核對安全群組和路由，避免把所有失敗都歸因於應用程式。'],'無狀態規則需要把一次通訊的兩個方向都設計完整。','sg','安全群組會辨認獲准連線的回應；NACL沒有這種記憶，不能照抄規則就保證可用。',['subnet','stateless'],'NACL允許入站請求，就會自動放行回應嗎？','不會。它無狀態，回程仍需符合對應方向的規則。');
 add('stateful',
 '同一條連線會先有請求，再有回應。有狀態防護能記住哪些連線已被允許，因此不必把每次回應都當成完全陌生的新連線。',
 '這裡的狀態是網路連線資訊，不是商品、購物車或訂單內容。網路規則有狀態，不能推論應用就一定把使用者資料存在本機。',
 '辨認回應讓安全規則較容易維持，但仍要限制哪些新連線可以開始，不能把「有狀態」理解成允許所有雙向流量。',[
 ['先評估新連線','當主機或外部來源開始一條連線時，仍需符合相關允許規則。若新連線未被允許，不會只因服務有狀態就被放行。'],
 ['記住被允許的關係','安全群組等機制可識別該連線的對應回應，因此回應處理不同於任意新連線。這種記憶不等於給對方永久自由連入。'],
 ['其他網路層仍然生效','安全群組允許回程，不表示NACL或路由已正確。連線必須經過整條路徑，其他層仍可能阻擋。']
 ],'假設EC2主動連線下載套件，安全群組允許該出站。',['辨認外部送回的是這條獲准連線的回應，而非任意新入站。','確認NACL也允許相應回程，路由能把回應送回EC2。','完成後，不應因此新增一條讓全網任意連入管理服務的寬鬆規則。'],'有狀態協助辨認合法回應，不是取消所有其他限制。','stateless','同一詞在應用程式與網路中的語境不同，閱讀題目時先確認它描述哪一層。',['sg','request'],'有狀態安全群組是否代表應用一定保存登入session？','不是。這裡描述連線追蹤，與應用如何保存使用者狀態是不同問題。');
 add('stateless',
 '這個詞需要先問語境。應用無狀態是在說處理下一次要求，不必依賴某一台主機私藏的使用者資料；網路無狀態則是不追蹤連線。',
 '應用仍可以保存訂單，只是把必要資料放到可由不同處理者取得的位置。無狀態不是沒有資料，也不是任何時候都可以忽略流程進度。',
 '把應用與單台主機狀態解耦，能讓新增或替換主機比較容易；但共享資料本身仍要有適當可用性、一致性與權限。',[
 ['辨認只在本機的必要資訊','如果購物車只在某台主機記憶體，使用者被分到另一台時可能看不到。先列出每次請求必須取得的資料。'],
 ['讓其他處理者可接續','可把合適狀態放在共享資料服務，或透過安全的請求資訊表達。不能為了無狀態就把敏感內容任意交給客戶端。'],
 ['網路語境另行解讀','NACL無狀態表示回程也需明確允許，與購物車放哪裡無關。同樣的英文詞不能不看上下文就選固定答案。']
 ],'假設ASG縮容移除一台應用後，部分使用者的購物車消失。',['確認購物車是否只保存在被移除主機的本機記憶體。','將需要接續的資料改為由健康處理者可取得的受控共享保存。','重新測試跨主機與縮容，不只測試正常時固定連同一台的情況。'],'應用無狀態的目標是降低對特定主機的依賴，不是讓業務資料不保存。','stateful','網路有狀態與應用有狀態也不能混同，要先辨認題目描述的是連線還是業務資料。',['server','storage'],'無狀態應用可以有訂單資料庫嗎？','可以。它可將正式資料保存在外部資料服務，而不是只能依賴某一台主機的本機狀態。');
 add('eni',
 '虛擬機器也需要網路連線的介面。ENI可以先理解成AWS網路中的虛擬網卡，讓資源具有私有位址及相關網路設定。',
 '它是連線能力與配置的承載者，不會自行執行你的網站程式。某些受管服務也會在你的子網路建立網路介面，因此位址需求不只來自EC2台數。',
 '知道介面存在於哪個子網路、使用什麼位址與群組，有助於定位真正的安全規則和網路路徑。',[
 ['介面占用網路位置','ENI屬於特定網路位置，使用子網路中的位址。服務大量建立介面時，可能遇到子網路位址容量限制。'],
 ['介面關聯安全設定','安全群組等配置會影響流量能否通過。主機上程式正常，仍可能因介面的群組或所在路由安排而無法連線。'],
 ['服務端點也可能用介面','Interface endpoint會建立帶私有位址的介面，作為服務入口；gateway endpoint則採另一種路由方式，不能全部視為相同。']
 ],'假設建立更多服務任務時失敗，但主機看起來還有CPU。',['檢查子網路可用位址，以及服務是否需要新增網路介面。','確認資源的實際介面、安全群組與AZ位置，而不是只看邏輯服務名稱。','依容量規劃調整部署或位址空間，並重新驗證可達性。'],'ENI把資源接到網路，對應的是位址與流量設定，不是額外的應用處理能力。','server','網卡不能代替運算主機；有介面也不代表有執行你的應用程式。',['subnet','sg'],'新增服務失敗，除了CPU不足還可能與什麼網路資源有關？','可能是子網路可用IP或網路介面需求，需要依服務實際配置檢查。');
 add('endpoint',
 '私有主機有時只想讀取AWS中的檔案或秘密，卻不需要連任意外部網站。如果所有流量都先送到一般出網路徑，可能增加費用與管理需求。',
 'VPC Endpoint是連到支援服務的特定入口能力。不同類型以不同方式接入，不能只記「端點」兩個字就假設它們都有相同網卡、政策或計費方式。',
 '選對端點可讓必要服務存取保持受控，也能減少某些流量經NAT；是否划算仍要依服務、位置和用量比較。',[
 ['先辨認要存取哪個服務','S3與DynamoDB可評估gateway endpoint；許多其他支援服務則使用interface endpoint。不要在還沒確認服務支援前就照抄別人的配置。'],
 ['依類型安排網路','Gateway類型使用適用路由表；interface類型使用子網路內帶私有位址的介面，還需要注意安全群組與名稱解析。'],
 ['另外核對資料授權','端點提供路徑，不會自動給程式讀寫權限。IAM、資源政策和適用的端點政策仍可能限制同一個請求，加密資料還可能涉及金鑰授權。']
 ],'假設私有報表程式只讀一個S3桶。',['先讓執行角色只具備指定資料的必要讀取權限。','建立適用端點並關聯正確路由表，按需求縮限端點或桶政策。','驗證允許的報表能讀，不相關桶或動作仍被拒絕，確認路徑與權限都符合需求。'],'私有連線和資料授權要分別設計，通路存在不表示門已對所有人打開。','nat','NAT提供較一般的主動出網能力，端點針對特定支援服務；不能用端點取代所有網際網路需求。',['private-subnet','iam-role'],'建立端點後沒有IAM讀取權，程式就會自動讀到檔案嗎？','不會。端點不會自行授權，仍需有效的服務操作與資源存取權限。');
 add('gateway-endpoint',
 '想讓私有主機讀S3，並不一定要先讓它走一般網際網路出口。Gateway endpoint讓適用服務流量利用路由安排走對應的AWS服務路徑。',
 '它不是在子網路中放一台小伺服器，也不像interface endpoint那樣建立端點網卡。理解差別，才能正確排查與估算成本。',
 '對符合需求的S3或DynamoDB存取，它可避免該流量走NAT處理路徑；但仍要確認區域、來源位置與服務支援情境。',[
 ['把服務目的地加入路由','建立端點時選擇適用路由表，相關服務目的地會有對應路由。主機所在子網路若沒有用那張路由表，不能只看端點已存在。'],
 ['檢查端點允許範圍','端點政策可以限制經過的操作與資源，但不是主體授權的替代。原本沒有讀取權的角色，不會因政策未限制就獲得權限。'],
 ['小心來源條件與維運','桶政策可依端點來源縮限存取，但錯誤限制可能擋住管理者或其他AWS服務。套用前先畫出所有合法存取來源並保留維運方案。']
 ],'假設大量同區域S3讀取正在經過NAT。',['確認資料讀取服務與來源符合gateway endpoint的支援範圍。','關聯實際使用的路由表，檢查服務路由和現有政策。','觀察請求成功與NAT流量變化，同時測試其他不應開放的資料仍被限制。'],'路由、端點政策與桶授權各自負責不同條件，少一項都可能導致失敗。','interface-endpoint','Gateway endpoint本身不收端點小時及資料處理費，不可把這個結論直接套到interface endpoint。',['endpoint','route-table'],'Gateway endpoint是否一定在每個子網路建立一張端點網卡？','不是。它主要透過路由表安排適用服務流量，和interface endpoint的方式不同。');
 add('interface-endpoint',
 '某些AWS服務希望用私有位址連線，但它們不是S3或DynamoDB的gateway endpoint情境。Interface endpoint在你的網路內提供可連向支援服務的私有入口。',
 '它的網路介面會占用所選子網路位址，並可關聯安全群組。應用向這個入口連線，背後由服務提供對應能力，而不是你在網卡裡安裝了服務。',
 '它適合受控私有存取，但通常需要比較每個位置的常駐費和流量費；很多端點不一定比另一種完整設計更便宜。',[
 ['選擇服務與部署位置','確認服務支援，再選擇需要的子網路與AZ。只在一個位置建立入口，可能不符合你希望承受的故障範圍。'],
 ['讓名稱解析與流量到達入口','依服務及私有DNS配置，程式可能仍使用熟悉的服務名稱，但解析到私有入口。安全群組需允許應用到端點所需的連線。'],
 ['服務權限仍需成立','端點網路連得上，不表示能讀取所有機密或資料。還要檢查執行角色、資源政策以及服務支援的端點政策。']
 ],'假設私有EC2需讀取Secrets Manager中的指定密碼。',['建立支援的interface endpoint並核對私有DNS，避免名稱仍走不預期路徑。','讓端點安全群組接受該EC2的必要連線，檢查子網路與路由。','給EC2角色指定secret的讀取權限，必要時另外核對KMS，並測試其他secret仍不可讀。'],'端點把服務接進私有網路，但不代替身分與資料授權。','gateway-endpoint','Gateway類型的路由與免費特性不能一概套用到使用網路介面的interface類型。',['eni','endpoint'],'Interface endpoint網路連線成功，讀secret卻AccessDenied，該先想什麼？','除了網路，還要查角色、secret資源政策、端點限制和適用的KMS權限。');
 add('privatelink',
 '公司甲需要使用公司乙的一個服務，不代表甲應能連到乙整個網路的所有主機。PrivateLink讓消費者透過私有入口使用指定服務，縮小互連範圍。',
 '消費者可在自己的網路建立支援的入口；服務提供者仍管理後端服務。它著重服務存取，不是把兩邊所有位址與路由合併成同一張網路。',
 '這適合跨帳號、企業內部或合作服務的受控提供方式，但服務端接受連線與應用內授權仍要分別設計。',[
 ['提供者先準備服務入口','自建端點服務需符合支援的架構與條件，例如使用合適的負載平衡入口。不是任意一台主機按一下就變成所有協定都支援的共享服務。'],
 ['消費者建立自己的端點','消費者在所需位置建立私有入口，配置安全群組與名稱。連線建立後，流量用這個服務通道，而不是獲准自由探索提供者全部資源。'],
 ['把接受連線與操作授權分開','提供者可以限制誰能連到服務，但登入後能看哪些資料仍屬應用規則。允許建立端點不能等同允許存取所有客戶資料。']
 ],'假設另一個AWS帳號只需要查你的庫存API。',['確認要共享的是特定服務，而非雙方任意網路互通。','按支援架構提供端點服務並限制消費帳號，消費者建立私有入口。','在API內驗證身分及資料權限，測試它不能藉此連到其他內部系統。'],'PrivateLink能縮小連線面，但不能省掉應用授權或服務支援條件。','peering','Peering著重VPC網路互連；PrivateLink著重使用指定服務，選擇要從需求的範圍開始。',['endpoint','interface-endpoint'],'需要使用對方一個API，就一定要打通兩邊全部VPC路由嗎？','不一定。若服務與架構支援，可用PrivateLink提供特定私有服務入口。');
 add('iam',
 '有人能登入AWS管理頁面，不表示帳號裡每一段程式都應有同樣能力。IAM先問誰提出要求，再判斷這個身分能否對指定資料或服務執行那個動作。',
 '身分可以是人員，也可以是程式暫時使用的角色。權限規則需要對應實際動作與資源，不能只用「內部人員」這種模糊描述代替。',
 '把權限縮到工作需要，可降低帳密外洩或程式出錯的影響範圍；允許網路連線不會自動解決這一層授權。',[
 ['先確認實際使用身分','查看程式拿到哪種憑證及所代表的角色，避免以為管理員自己能讀，程式就一定也能讀。不同執行環境可能使用不同角色。'],
 ['寫出誰做什麼到哪裡','例如報表程式只讀某桶的報表物件，不允許刪除或修改。政策中的動作和資源要匹配，條件可以再縮小來源或情境。'],
 ['排查所有適用限制','有效授權可能同時受身分政策、資源政策和組織上限等影響。明確拒絕不能靠另外新增廣泛Allow直接消除。']
 ],'假設網站程式只能顯示商品圖片，不應讀薪資檔。',['建立代表網站執行環境的角色，不借用開發者個人長期金鑰。','只授予商品圖片範圍的必要讀取操作，核對資料端政策。','同時測試合法讀取成功、薪資讀取與圖片刪除失敗。'],'授權成功的驗收包含「應該能做」和「不應該能做」兩種測試。','sg','安全群組控制網路連線，IAM控制AWS操作授權，兩者不是可以互相取代的防護。',['principal','policy'],'開發者能讀S3，但程式不能讀，就一定是S3故障嗎？','不一定。先確認程式實際使用的身分與有效權限，而不是套用開發者自己的登入權限。');
 add('iam-user',
 'AWS帳號可以建立長期身分，替它配置登入或程式存取憑證，這類身分稱為IAM使用者。它與你網站上的一般消費者會員不是同一套概念。',
 '使用者可被附加權限，但建立完成本身不代表能執行所有操作。若發出長期存取金鑰，就必須處理保存、停用和外洩風險。',
 '了解它有助於讀懂既有系統；新的人員或工作負載存取設計，通常應優先評估集中登入、角色及短期憑證，而非到處複製永久金鑰。',[
 ['區分登入與程式憑證','管理頁面登入和程式呼叫AWS可使用不同憑證。不要把使用者密碼直接當成API呼叫需要的存取金鑰，也不要把任何憑證公開。'],
 ['授權仍要明確配置','身分存在只是代表有一個可被識別的對象，還需適用政策允許需要的動作。MFA也不會自動變成某種資源讀取權。'],
 ['避免長期金鑰散布','把金鑰寫入程式、映像或公開儲存庫，會讓每份副本都成為風險。適用環境應改用能自動提供暫時憑證的角色方式。']
 ],'假設舊報表工具在設定檔放著某員工的IAM user金鑰。',['確認該金鑰代表誰、具備什麼權限，以及有哪些程式正在使用。','評估可否改用執行角色或其他短期憑證流程，並把權限限縮到必要報表。','完成替換後按程序停用不再需要的金鑰，確保沒有留下仍可被濫用的副本。'],'IAM使用者不是所有情境的預設答案，憑證生命週期是設計的一部分。','iam-role','角色讓受信任主體暫時使用指定權限，和發給某個長期使用者的金鑰不同。',['iam','iam-role'],'網站消費者註冊，是否應每人建立一個IAM使用者？','通常不是。一般應用會員登入應評估Cognito或合適的身分系統，而非把每位客人都變AWS帳號操作人員。');
 add('iam-role',
 '程式可能只在某台EC2上暫時執行，沒有理由永久拿著某位員工的全部權限。角色讓受信任的執行者取得完成特定工作的限時權限。',
 '要分清兩個問題：信任政策決定誰可以取得這個角色；角色的權限政策決定取得後能做什麼。只有其中一邊成立，仍可能無法完成工作。',
 '使用角色可避免把長期金鑰寫進程式，並讓同一工作在替換主機後仍透過受控方式取得憑證。',[
 ['先建立適合的信任','例如允許指定AWS服務或來源角色取得角色。信任範圍要明確，不應因方便就接受不必要的其他帳號或主體。'],
 ['再授予必要操作','假設圖片處理只讀輸入、寫輸出，就限制相應資源和動作。角色名稱叫只讀，不會讓廣泛附加政策自動變成只讀。'],
 ['執行時取得暫時憑證','環境透過適用機制提供有期限的憑證，程式以其呼叫服務。正常使用應交由支援的憑證提供機制更新，避免手動複製到各台主機。']
 ],'假設EC2要讀一個S3桶內的報表。',['配置允許EC2服務使用的角色，透過適當instance profile指派給主機。','讓角色只讀指定報表範圍，若有金鑰加密也核對解密授權。','在主機確認實際角色身分，測試報表可讀而不相關資料被拒絕。'],'角色把誰可使用和使用後能做什麼分開控制，兩項都要驗證。','iam-user','取得暫時憑證不表示權限較少，是否最小權限仍由你給角色的政策決定。',['iam','sts'],'角色有信任政策，就自動有S3讀取權嗎？','沒有。信任處理誰能取得角色，讀取S3仍需要角色與資源端適用的操作授權。');
 add('policy',
 '「這個程式只能讀報表」需要變成AWS能判斷的規則。IAM政策把身分可執行的動作、作用資源與條件寫成明確文件。',
 '常見欄位中，Effect表示允許或拒絕，Action表示動作，Resource表示對象，Condition增加適用條件。資源政策還可能用Principal描述獲授權主體。',
 '政策的位置與用途很重要。身分權限、角色信任及組織上限雖都像規則文件，卻不是在回答完全相同的問題。',[
 ['把業務需求拆成動作','顯示報表可能只需取得指定物件，不必刪除桶或修改其他檔案。先找實際API動作，再選對應的資源範圍。'],
 ['避免不必要的萬用範圍','對所有服務、所有資源給全部動作雖容易測通，卻擴大事故範圍。可利用資源名稱、前綴或適用條件縮限。'],
 ['看完整有效政策','某份Allow不代表最後一定成功，仍可能受到明確Deny、權限邊界或SCP等限制。排查要針對實際請求，不是只看單一文件。']
 ],'假設報表員能讀reports路徑，卻不應讀private路徑。',['找出讀取物件需要的動作，以及兩個路徑各自對應的資源描述。','只讓必要身分對reports範圍執行需要的操作，核對其他政策沒有額外放寬。','測試reports成功、private失敗；若失敗原因不明，檢查實際身分與明確拒絕。'],'政策是可執行的授權規則，名稱或註解不能替代實際內容。','trust-policy','角色信任政策主要決定誰能取得角色，不是角色對所有資料能做什麼的完整清單。',['iam','principal'],'一份Allow政策就能覆蓋相同請求的明確Deny嗎？','不能。適用的明確拒絕會阻止請求，需找到真正拒絕來源並確認是否應調整。');
 add('principal',
 '授權前必須先知道「誰來要求」。這個誰不一定是人，也可能是角色、AWS帳號或某個AWS服務；Principal就是描述這個提出要求的主體。',
 '它是身分資訊，不是操作內容，也不是目的資源。將三者拆開，你才能說清楚「哪個主體，對哪個資源，執行什麼動作」。',
 '資源政策若把主體寫得太廣，可能讓原本不預期的人使用資源；若寫錯身分形式，合法程式也可能無法使用。',[
 ['辨認真正在執行的身分','人員登入、程式使用角色、跨帳號切換角色後，實際身分可能不同。不要只看原本由誰啟動工作。'],
 ['在支援的位置指定主體','例如S3桶政策可指定誰可使用桶，角色信任政策可指定誰可取得角色。身分政策本身則已附著在特定身分上，結構用途不同。'],
 ['再限制動作與條件','知道主體後，還要決定允許它做什麼、在哪裡做，以及是否限制來源或其他情境。主體被列入政策並不代表全部操作都被允許。']
 ],'假設只允許某個CloudFront分發讀取私有S3來源。',['在桶政策辨認CloudFront服務主體，而不是任意所有網路訪客。','依設計用對應分發的來源條件限縮，僅給必要物件讀取操作。','測試CloudFront可取得內容，直接不合條件的S3存取仍被拒絕。'],'主體、動作、資源與條件共同構成授權，不能只檢查其中一個欄位。','arn','ARN可用來識別某些主體或資源，但只是描述格式；它本身不代表授權已成立。',['iam','policy'],'Principal是讀取動作的名稱嗎？','不是。Principal描述誰提出要求；Action才描述要執行的動作。');
 add('arn',
 '只寫「報表桶」可能不夠精確：它在哪個服務、哪個帳號、哪種資源？ARN是AWS用來描述資源身分的文字格式，像把不完整店名寫成可辨認的完整地址。',
 '不同服務的ARN格式不完全相同，有些欄位可能不使用。複製範例時要依實際服務核對，不能假設所有ARN都有完全一樣的區域與帳號部分。',
 '政策需要準確指定作用對象，才能限制範圍。拿到ARN只代表知道如何稱呼那個對象，不表示已經能讀取、修改或登入它。',[
 ['先辨認服務與資源種類','S3桶與桶內物件是不同對象，政策動作也可能需要不同的資源描述。把桶的識別直接套到所有物件操作，可能無法符合規則。'],
 ['核對實際名稱與範圍','帳號、Region和資源路徑等資訊應從真實資源或官方格式確認。多一層前綴或錯字，都可能讓規則沒涵蓋真正請求。'],
 ['把萬用字元看成範圍擴張','萬用描述有時必要，但可能讓更多資源進入授權範圍。應先知道要涵蓋哪些物件，再決定可接受的模式。']
 ],'假設角色允許讀報表，但實際請求仍不符合資源範圍。',['確認請求操作的是桶本身還是其中的某個物件。','比對政策資源描述與實際物件前綴，核對是否少寫必要路徑。','用應允許與應拒絕的物件各測一次，避免為了修一個錯字就改成全部資源。'],'識別精確是最小權限的基礎；ARN不是密碼，也不能替代權限。','policy-resource','Resource欄位常使用ARN表達對象，但欄位用途和識別格式仍是兩個概念。',['policy','iam'],'知道某個資源的ARN，就有權刪除它嗎？','沒有。仍需身分、動作、資源與適用政策共同允許該刪除操作。');
 add('sts',
 '程式或訪客只工作一段時間，沒有必要永久拿著一組能一直使用的金鑰。STS提供限時憑證，讓合格主體在一段時間內代表指定身分執行操作。',
 '這類憑證通常包含存取金鑰、秘密值及工作階段token，三者要按機制正確使用。它們仍是敏感資料，不能因為會到期就公開。',
 '短期憑證能減少長期秘密的散布，但不會自行讓權限變小。授予的角色若過於寬鬆，暫時拿到它的人在有效期內仍有很大能力。',[
 ['先確認取得資格','服務必須依角色信任、來源授權或其他支援的身分機制確認，並非任何人知道角色名稱就能向STS取得權限。'],
 ['使用有限期限憑證','程式用取得的憑證呼叫AWS，實際操作仍受角色和其他適用政策限制。過期後不能把原憑證當作永久可用資料。'],
 ['交由適用機制更新','支援的執行環境和SDK可協助取得與更新憑證。手動複製某次結果到所有主機，反而容易造成到期、保存與外洩問題。']
 ],'假設部署程式要暫時使用正式帳號中的受限角色。',['先讓來源身分和目標信任符合跨帳號切換的要求。','透過支援流程取得暫時憑證，在有效期內執行角色允許的部署工作。','記錄實際角色操作，讓憑證更新及失效依流程進行，不保存成永久設定。'],'短期是憑證生命週期的特性；最小權限仍取決於具體政策。','iam-user','IAM user可能有長期存取金鑰；STS提供的限時憑證需要額外理解期限與工作階段資訊。',['iam-role','assume-role'],'STS憑證會到期，所以可以放進公開程式庫嗎？','不可以。有效期間仍可能被濫用，所有秘密憑證都應妥善保護。');
 add('assume-role',
 '你原本的身分可能沒有正式環境操作權，但工作需要短暫取得另一組受控權限。AssumeRole是在符合條件時暫時改以某個角色身分工作的操作。',
 '它不是把原使用者永久變成目標帳號管理員。成功取得的是一個角色工作階段及其暫時憑證，之後每個操作仍依該身分和適用限制判斷。',
 '它能讓跨帳號或特定職務存取有明確信任邊界，避免把正式帳號密碼交給所有部署者。',[
 ['來源要獲准提出切換','在常見跨帳號情境，來源身分需要相應的AssumeRole授權。只在目標建立角色，不能保證任何來源都能取得。'],
 ['目標角色要信任來源','信任政策描述接受哪些主體及條件。外部合作情境還需依實際需求規劃額外限制，不能只靠模糊的角色名稱。'],
 ['取得後仍看操作權限','角色信任成立不代表能修改資源，角色本身仍要有需要的權限。操作時應確認真正在使用的是目標角色，而非仍拿原本憑證。']
 ],'假設開發帳號要發布到正式帳號，但不共用root或員工密碼。',['在正式帳號建立受限部署角色，信任指定來源並配置必要部署權限。','讓開發帳號的指定部署身分獲准切換該角色。','程式使用取得的暫時憑證工作，驗證不能執行部署以外的不必要操作。'],'信任、切換授權和切換後操作權限是相互相關但不同的問題。','trust-policy','信任政策回答目標接受誰；AssumeRole是實際取得限時角色身分的操作。',['iam-role','sts'],'成功AssumeRole後，是否一定能讀正式帳號所有S3？','不一定。仍取決於角色權限、資源政策、加密金鑰及其他適用限制。');
 add('least-privilege',
 '讓程式拿管理員權限，通常比較容易先跑通，但也讓小錯誤能刪掉不相關資料。最小權限是先知道工作需要什麼，再只給完成那些工作的能力。',
 '最小不等於完全不能工作，也不只限制服務名稱。還可以限制動作、資源範圍、使用情境與時間，並隨實際需求持續調整。',
 '它能縮小憑證外洩或程式失控時的影響。這是降低損害範圍，不是聲稱程式永遠不會有漏洞。',[
 ['先列必要操作與對象','圖片處理程式可能讀輸入圖片、寫輸出圖片，不需要管理桶政策或讀薪資檔。以實際流程對應需要的API動作。'],
 ['用角色與條件縮小能力','將權限給正確執行角色，必要時限定資源前綴、來源或其他支援條件。不要因為某條條件難設定就擴成所有資源。'],
 ['做正反測試並持續回收','合法工作應成功，不相關操作應失敗。工作改版後檢查已不需要的能力，避免權限只增加不減少。']
 ],'假設程式只需顯示使用者上傳照片的縮圖。',['確認輸入、輸出資料範圍及實際需要的讀寫操作。','給執行角色相應權限，不提供刪除其他資料或管理帳號的能力。','測試正常產生縮圖，也測試讀取其他用戶資料或修改桶政策被拒絕。'],'最小權限來自具體需求和驗證，而非替角色取一個「安全」的名字。','policy','政策是表達權限的工具，最小權限是你安排那些規則的設計原則。',['iam','policy'],'所有操作先給管理員，再一直不回收，算最小權限嗎？','不算。必須依必要工作限制範圍，並驗證不相關操作被拒絕。');
 add('mfa',
 '密碼可能被猜到、重複使用或被釣魚取得。如果只憑一個密碼就能登入高權限帳號，拿到密碼的人可能直接取得全部能力。MFA要求額外的驗證因素。',
 '因素可理解成不同種類的證明，例如你知道的秘密，與你持有裝置提供的證明。不是隨便再問一個同類密碼，就一定形成有效的多因素保護。',
 '它讓單一密碼外洩不容易直接變成登入成功，但登入後能做什麼，仍由權限政策決定；帳號復原流程也要受保護。',[
 ['先保護高權限登入','Root與管理人員等高影響身分應優先採取適當MFA與登入保護。不要因為只有偶爾使用，就把保護或復原資訊隨意保存。'],
 ['確認第二因素真正獨立','裝置或驗證方法應依組織安全要求選擇與管理。使用者仍需辨認釣魚與非預期驗證要求，不能看到提示就全部核准。'],
 ['權限和憑證仍需管理','MFA不會自動把管理員權限縮小，也不表示任何程式金鑰都受同一登入保護。不同存取方式要分別確認適用機制。']
 ],'假設某位管理員密碼在另一個網站外洩。',['先停用或更新有風險憑證，檢查是否有非預期登入與操作。','確認AWS高權限身分已配置合適MFA，並檢查復原與裝置管理程序。','收斂日常工作權限，避免每次登入都使用超出需要的管理能力。'],'MFA是身分驗證的一層，不是權限最小化、操作稽核或憑證管理的替代品。','least-privilege','最小權限限制成功登入後的能力；MFA降低不該登入的人只憑密碼進入的風險。',['iam','iam-user'],'開啟MFA後，使用者原本過大的管理權限會自動消失嗎？','不會。驗證身分與授權操作是不同問題，仍需調整適用政策。');
 add('scp',
 '公司有很多AWS帳號時，可能需要一條共同底線，例如測試帳號不得執行某類高風險操作。若只靠每個帳號管理員自願維持相同設定，很容易產生落差。',
 'SCP是組織層級的權限上限，不是直接發給人員的許可證。某個動作沒有被上限排除，仍不代表使用者已經獲得執行它的實際權限。',
 '它能讓成員帳號一般身分受到共同護欄約束，但管理帳號本身與特定例外有不同適用範圍，不能把它說成控制所有AWS行為的萬用防火牆。',[
 ['把帳號放在治理階層','組織根、OU與帳號上的適用政策會共同影響有效上限。變更上層可能影響很多帳號，因此先理解繼承與測試範圍。'],
 ['上限不會主動授權','即使SCP允許某動作，身分仍需IAM等適用授權。反過來，成員帳號管理員給廣泛Allow，也不能直接越過適用的SCP限制。'],
 ['先在小範圍驗證','把新限制先用於測試帳號或OU，確認必要維運與自動化不會被阻斷。護欄太廣可能造成實際工作停擺，需要變更程序。']
 ],'假設正式環境允許某服務，但測試OU不得使用。',['將測試帳號放在對應OU，整理需要維持的例外與維運操作。','建立合適SCP限制，先測試預期被拒絕的操作與必須成功的操作。','再核對人員原有IAM權限，確認沒有把「SCP未禁止」誤解為已授權。'],'SCP與IAM權限是上限和實際授權的分工，兩者都可能影響最終請求。','policy','SCP不適用於管理帳號本身，服務連結角色等亦有特定例外；正式設計要閱讀官方適用範圍。',['organizations','policy'],'SCP寫了允許S3讀取，新的使用者就能讀所有S3嗎？','不能。SCP自己不發出讀取權限，使用者仍需適用IAM或資源端授權。');
 add('organizations',
 '正式系統、開發測試和安全日誌若都在同一帳號，權限與資源使用容易互相牽連。多帳號先分隔用途，Organizations再集中安排這些帳號的管理與帳務。',
 'AWS帳號不是一台主機，而是一個資源、身分及許多配額的重要邊界。加入同一組織，不等於帳號內所有資料和權限全部合併。',
 '它能把集中帳務、政策護欄與帳號生命週期整合管理，同時保留各帳號的隔離；但應用跨帳號存取仍需明確設計。',[
 ['先分出真正需要的隔離','正式、測試、日誌與安全用途可能有不同權限與責任。不要只為了帳單看起來簡單，就讓所有人共用同一組高權限憑證。'],
 ['用OU表達治理需求','把需要共同限制的帳號放到合適OU，套用組織政策。分類可以依風險與治理，不必完全複製公司的部門組織圖。'],
 ['帳務整合與資料授權分開','集中付款有助整體費用管理，卻不會讓某帳號自動取得另一帳號資料。跨帳號角色與資源政策仍需最小權限配置。']
 ],'假設測試程式常啟動大量主機，不能影響正式訂單。',['將測試與正式用途分到不同帳號，建立清楚的管理責任。','依需求給測試OU共同上限並監控費用，避免把所有測試都交給正式管理員身分。','需要發布到正式帳號時，使用受限跨帳號部署角色，而非共用正式root密碼。'],'組織管理讓隔離可被集中治理，不是消除隔離與身分邊界。','vpc','VPC隔離網路，AWS帳號還涉及權限、費用與許多資源邊界；兩者層次不同。',['iam','ou'],'加入同一Organizations後，各帳號資料會自動互通嗎？','不會。網路與資料授權仍須另行配置，集中帳務也不代表集中所有存取權。');
 add('ou',
 '當公司有幾十個帳號，逐一套用相同限制容易漏掉。OU讓你把需要共同治理的帳號放在同一階層群組，再於群組層級套用適當政策。',
 'OU是Organizations中的治理容器，不是網路位置或可執行程式的主機。帳號移到不同OU，可能改變適用的組織政策，因此不是純粹整理畫面的動作。',
 '依治理需求分組，有助於測試新限制、維持共同基線和降低管理錯誤；層級太複雜也會讓有效政策難以理解。',[
 ['先找共同規則','例如測試帳號可共用一組服務限制，正式帳號有另一套要求。分組要讓每個帳號的用途和責任可被清楚解釋。'],
 ['理解上層政策會影響下層','組織根和上層OU的適用限制可能延伸到下層帳號。只看帳號直接附加的政策，可能漏掉上層來源。'],
 ['移動帳號前先評估','把帳號放進更嚴格OU，可能讓既有自動化突然被拒絕。應先比對有效限制並在測試範圍驗證，而不是事後才找失敗原因。']
 ],'假設一個實驗帳號要正式承接生產工作。',['確認它目前所在OU及所有適用政策，整理正式用途需要的能力。','比對正式OU的安全基線與限制，先修正不符合的設定及操作流程。','按變更程序移動並驗證必要功能，確認不是單靠移動名稱就完成正式環境治理。'],'OU影響治理政策的適用範圍，不直接決定主機位址或資料庫位置。','subnet','子網路是VPC內的位址與AZ位置範圍，OU則是帳號治理分組，兩者不能互換。',['organizations','scp'],'把帳號移到新OU，是否一定不影響正在使用的權限？','不一定。適用組織政策可能改變，需先檢查及測試有效限制。');
 add('identity-center',
 '如果員工要使用很多AWS帳號，為每人每帳號建立不同登入很難維護。員工離職時也容易漏收權限。Identity Center協助以集中入口安排員工登入與帳號存取。',
 '它可連接企業維護的員工身分系統，並將員工或群組指派到帳號及權限集合。權限集合可先理解成某種職務在指定帳號應具有的操作規格。',
 '集中登入減少重複帳密與人員生命週期管理，但每個帳號裡的權限範圍仍需依工作配置，不能讓全部員工一次登入就成為全部帳號管理員。',[
 ['先使用可信的員工身分來源','企業身分提供者是管理員工登入的系統。透過支援方式整合後，可把到職、群組與離職管理連到實際員工身分。'],
 ['指派帳號和必要職務','例如開發人員在測試帳號可有開發權限，在正式帳號只能查閱監控。相同人員在不同帳號不必使用相同權限。'],
 ['登入後取得受控工作階段','員工由集中入口選擇帳號和角色進行工作。稽核與權限檢查仍需維持，集中登入不等於所有操作都自動符合最小權限。']
 ],'假設同一團隊需要查看四十個帳號的營運狀態。',['確認員工身分來源與群組，避免為每個帳號手動複製四十份員工密碼。','建立符合查閱工作的權限集合，將團隊指派到必要帳號。','測試他們可查看需要資訊，卻不能修改正式資源，並驗證離職移除流程。'],'這是員工多帳號存取管理，不是替商店客戶建立會員中心的同義服務。','cognito','Cognito主要面向你應用程式的會員身分；兩者服務的使用者情境與權限邊界不同。',['iam-role','organizations'],'網站客人註冊購物會員，是否就是Identity Center的主要情境？','不是。它主要處理員工集中存取AWS帳號與應用，購物會員應評估Cognito等應用身分方案。');
 add('cognito',
 '商店App需要讓客人註冊、登入和找回帳號，但不希望每位客人都成為能管理AWS資源的人員。Cognito協助處理應用程式使用者身分，與員工登入AWS帳號不同。',
 'User pool可先理解成處理會員驗證的目錄與登入能力；identity pool則可在符合設定時，為應用使用者換取受限制的AWS暫時憑證。兩者不是同一功能的不同叫法。',
 '把驗證集中後，後端仍需確認登入證明並判斷資料權限。證明「是某位會員」不等於允許他看所有會員的訂單。',[
 ['會員先完成驗證','應用引導使用者經設定的註冊或登入流程。成功後可取得代表登入結果的token，後端要按規則核對，不是相信任何自稱已登入的文字。'],
 ['後端再做授權','處理訂單的API應確認這位會員能存取哪些資料。例如將目前身分與訂單擁有人比對，不能只看請求裡填了哪個使用者編號。'],
 ['直接用AWS資源要另外限制','若透過identity pool提供AWS暫時憑證，角色政策仍須限制操作與資料範圍。不能為了上傳照片就讓所有會員取得整個帳號管理權。']
 ],'假設手機App讓會員上傳自己的照片並查看私人訂單。',['用合適會員驗證流程確認使用者，讓API驗證收到的登入證明。','訂單查詢依該身分核對擁有者，不接受任意替換編號就讀別人資料。','若讓App直接上傳S3，另外設計受限憑證或上傳授權，只開必要的個人資料範圍。'],'會員驗證、應用資料授權與AWS資源權限要分三層理解，不能只以登入成功概括全部。','identity-center','員工多帳號登入與一般App客戶登入是不同情境，服務選型要先辨認誰在使用系統。',['iam','sts'],'使用者通過Cognito登入，就能查看所有人的訂單嗎？','不能。登入確認身分，後端仍要限制該身分可存取的訂單範圍。');
 add('kms',
 '把資料加密，可以讓沒有正確金鑰的人不能直接讀內容；接下來的問題是誰保管金鑰、誰能使用、怎麼留下紀錄。KMS提供受控的金鑰管理與加解密能力。',
 '金鑰可理解成用於加解密的密碼學材料及其受管能力，不是資料庫登入密碼。許多資料服務使用KMS協助保護資料金鑰，而非把每個大型檔案全部交給一個簡單API直接處理。',
 '集中管理有助於限制使用與稽核，但資料權限和金鑰權限可能同時影響存取；會讀檔不代表一定能解開檔案。',[
 ['先看資料與金鑰分工','大量資料可由資料金鑰加密，再由KMS key保護那個資料金鑰，稱為信封加密。保存的是加密後的資料與受保護資料金鑰，不應長期留下明文秘密。'],
 ['授權誰可使用金鑰','金鑰政策、適用IAM與grants等機制共同影響使用。跨帳號分享加密資料時，必須同時核對資料端及金鑰端的允許範圍。'],
 ['管理整個生命週期','停用或刪除金鑰可能影響既有資料讀取，應先評估依賴。輪替也不表示所有舊資料立刻重新加密，需依服務實際方式理解。']
 ],'假設角色能讀S3物件，卻讀不了以SSE-KMS保存的報表。',['先確認物件使用哪個KMS key，以及失敗操作實際使用的身分。','檢查資料操作之外的金鑰政策、IAM及適用限制，不要直接把桶改公開。','給必要身分最小金鑰使用能力，測試合法讀取與不相關身分拒絕，保留稽核紀錄。'],'加密是資料、金鑰及使用權限一起運作的流程，不能只勾選加密就忽略授權。','secrets-manager','Secrets Manager保存應用需要取回的秘密，例如密碼；KMS主要管理加密金鑰及其使用，兩者可以互相配合。',['iam','sse-kms'],'擁有S3讀取權，就一定能讀取SSE-KMS物件嗎？','不一定。還需要符合對應KMS key的解密使用授權及其他適用限制。');
 add('sse-kms',
 '資料上傳到儲存服務後，也要保護保存中的內容。SSE-KMS表示由支援的AWS服務在伺服器端處理資料加密，並使用KMS協助管理和保護金鑰。',
 '以S3為例，應用仍像往常上傳或讀取物件，但服務在保存與讀回過程處理相應加解密。這不是把物件權限全部交給KMS，也不是自動讓網路使用HTTPS。',
 '選它通常與金鑰控制、授權與稽核需求有關。你需要了解使用哪一種KMS key、誰能使用，以及額外服務請求與費用的影響。',[
 ['上傳時加密資料','服務使用資料金鑰保護物件，再利用KMS key保護該資料金鑰。這讓資料與金鑰管理分工，不需要把明文金鑰直接寫在應用程式。'],
 ['讀取時同時檢查兩邊權限','物件讀取要符合S3授權，解開受保護資料金鑰還涉及KMS。跨帳號或由CloudFront讀來源時，也要按實際身分核對金鑰政策。'],
 ['把傳輸與保存分開','靜態加密保護保存中的資料；HTTPS保護傳輸路徑。兩者互補，不能因物件加密就允許敏感內容用不安全連線傳送。']
 ],'假設公司要分享加密報表給另一帳號的指定角色。',['先確認所用金鑰類型是否符合跨帳號需求，不能假設任何受管金鑰都能用相同分享方式。','在資料端限制指定角色的必要讀取，並在KMS端配置符合要求的金鑰使用授權。','測試合法角色能讀，其他身分不能讀；同時確認傳輸用HTTPS及金鑰停用後的營運影響。'],'SSE-KMS提供保存端加密和金鑰管理整合，但不替代資料權限、傳輸保護及生命週期規劃。','https','SSE-S3與SSE-KMS都可提供保存端加密，差別包含金鑰管理控制方式；不要把它們誤當成HTTP和HTTPS的差別。',['kms','s3'],'S3使用SSE-KMS，是否表示不再需要HTTPS？','不是。SSE-KMS保護保存中的資料，HTTPS處理傳輸中的保護，兩者需要分別設計。');
 data.tls.meaning='TLS是一套保護網路連線的規則，讓傳輸內容不容易被途中讀取或修改。一般網站通常由伺服器出示憑證，供瀏覽器確認連線對象；不是每位訪客都必須提供自己的客戶端憑證。若需要雙方都以憑證確認身分，則是另外安排的雙向驗證情境。這些連線保護也不能取代應用程式的資料存取授權。';

</script><script>
/* 從零讀懂詞條：glossary slice(58,116)。重點是機制與具體推理，不預設讀者認識相鄰服務。 */
window.TERM_LESSONS_B = (() => {
 const terms={}, glossary=new Map(window.GLOSSARY.map(entry=>[entry.id,entry]));

  terms[id]={startingPoint,meaning,why,how:how.map(([title,body])=>({title,body})),walkthrough:{situation,steps,result},compare:compare.map(([withTerm,explanation])=>({with:withTerm,explanation})),prerequisites,check:{question,answer},sources:[{title:base.term+' 官方說明',url:base.source}]};

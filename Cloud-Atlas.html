</script><script>
/* 零基礎術語教學：glossary 第117至173項；原創繁體中文，2026-11-07。 */
window.TERM_LESSONS_C = (() => {
 const lessons={},base=new Map((window.GLOSSARY||[]).map(term=>[term.id,term]));
 const add=(id,startingPoint,meaning,why,how,situation,steps,result,withTerm,explanation,prerequisites,question,answer)=>{
  const original=base.get(id);if(!original)throw new Error('Unknown glossary id '+id);
  lessons[id]={startingPoint,meaning:original.plain+' '+meaning,why,how:how.map(([title,body])=>({title,body})),walkthrough:{situation,steps,result},compare:[{with:withTerm,explanation}],prerequisites,check:{question,answer},sources:[{title:original.term+' 官方文件',url:original.source}]};
 };
 add('shield','網站平常每秒只處理幾百個連線，突然有大量電腦同時送流量，真正客人因此連不上。這種把入口塞滿的攻擊，不一定需要先猜中你的密碼。',
 '分散式阻斷服務攻擊是從許多來源同時消耗網路或服務容量。Shield的工作重點是協助應對這類流量攻擊，而不是檢查每個使用者是否有權讀取訂單。Standard與Advanced的功能、資格及費用不同，不能把它們當成完全相同的免費產品。',
 '只加大網站主機，可能增加費用卻仍讓入口飽和。需要在合適的AWS入口服務、防護能力與應用程式容量之間一起設計，讓惡意流量盡量不拖垮正式服務。',
 [['先找被耗盡的資源','辨認是網路頻寬、建立連線的能力，還是某個昂貴的HTTP功能被濫用。不同層次的問題，需要不同防護，不能只看總請求數增加。'],['利用合適入口承接流量','把公開網站放在CloudFront或其他支援的入口後，再評估Shield防護。入口分散流量的能力與後端仍可承受的正常工作量，都要納入考量。'],['補上應用層規則','對特定URL高頻呼叫、可疑來源或惡意內容，可以另外評估WAF規則。Shield不是登入系統，也不替代應用程式的權限檢查與速率限制。']],
 '一家票務網站售票時被大量流量打到無法開啟。',['先用監控區分正常搶票與可疑流量，確認瓶頸在入口還是購票程式。','使用支援的全球入口與防護，並針對重複打昂貴購票端點的行為設計WAF規則。','觀察真實使用者是否恢復服務，同時保留事件紀錄與後端容量警報。'],'目標是維持正常客人的可用性，而不是以為開啟某個服務就永遠不會受攻擊。','AWS WAF','WAF可以依HTTP請求內容建立規則，例如擋特定攻擊字串；Shield著重阻斷服務攻擊防護。兩者可以互補，不能互相取代。',['request','http','availability'],'Shield能不能判斷某個人可不可以查別人的訂單？','不能。那是應用的身分驗證與授權問題；Shield主要協助抵禦消耗服務容量的攻擊。');
 add('route53','人通常記住shop.example這種名稱，不會記住網站目前在哪台電腦、使用哪個數字位址。網站換位置後，也不希望每位客人都手動更新地址。',
 'DNS可以理解成查地址的系統。Route 53管理網域名稱的DNS記錄，讓查詢者取得該連到哪個服務的資訊。它也提供不同路由政策與健康檢查，但通常不位於每一個網頁內容封包的轉送路徑上。',
 '把名稱與實際服務位置分開，才能在換主機、使用負載平衡器或安排備援時維持相同網址。不過DNS查詢結果會被暫存，改記錄不等於全世界立即換到新位置。',
 [['建立名稱與目的地關係','在自己的DNS管理範圍裡建立記錄，例如讓www指向網站入口。A記錄、CNAME與Alias用途不同，需依目標服務與名稱位置選擇。'],['決定回答哪個目的地','可依需求選簡單、加權、延遲或容錯移轉等政策。政策是在DNS查詢時影響回答，不代表服務會替每個使用者的每個封包重新測速。'],['把健康與快取一起考慮','健康檢查可作為某些路由決策的依據；TTL決定查詢結果可以暫存多久。切換速度會受到快取、偵測時間及應用連線重用影響。']],
 '公司有正式網站與待命網站，希望正式站故障時導向備援。',['先讓兩個網站本身都能服務，DNS不會替你建立缺少的應用或資料。','配置對應的健康檢查和容錯移轉記錄，測試正常與故障時的DNS回答。','從不同查詢端測試快取到期後的行為，不能只用管理畫面已更新當作切換完成。'],'Route 53協助使用者找到入口，但入口是否正常、資料是否備妥仍是其他設計工作。','Application Load Balancer','ALB接收並轉送實際應用請求；Route 53主要回答名稱查詢。DNS切換和負載平衡是不同階段。',['dns','ip','ttl'],'把DNS記錄改成備援位址後，所有現有使用者會瞬間切換嗎？','不會。已快取的回答及仍在使用的連線可能暫時維持舊路徑，必須把TTL與故障偵測一起評估。');
 add('global-accelerator','全球客人到同一個應用的網路路徑長短不同。有些應用不是下載可快取的圖片，而是需要持續進行即時連線，還要求入口IP固定不變。',
 'Anycast表示相同入口IP可在多個網路位置被宣告。使用者流量進入合適的AWS邊緣入口後，Global Accelerator再沿AWS全球網路送往配置的健康端點。它不會把應用資料自動變成可快取物件。',
 '固定入口IP有利於合作方的防火牆白名單；全球網路路由與健康端點選擇則協助改善跨地區連線體驗。它仍需要可用的應用端點，不能取代資料複寫或後端容量規劃。',
 [['先有可服務的端點','端點是實際接收流量的AWS資源，例如支援的負載平衡器。若只有入口沒有應用，使用者仍拿不到需要的結果。'],['把端點放入合適群組','依Region等條件管理端點群組，設定流量控制與健康條件。調整流量比例時，應觀察實際請求與業務容量，而不是只看設定數字。'],['確認協定與真正瓶頸','Global Accelerator適用支援的TCP或UDP流量情境。若慢在資料庫查詢或程式運算，改全球入口並不會自動消除後端延遲。']],
 '遊戲公司要讓不同國家玩家連線，合作網路又要求固定入口IP。',['在需要的區域部署遊戲相關端點，先驗證每個端點可以獨立服務。','建立Global Accelerator並設定端點群組，使用它提供的固定入口位址。','測試端點故障與區域流量調整，也監測玩家的實際連線延遲。'],'它改進的是進入服務的網路路徑與入口穩定性，而不是把遊戲狀態複製到所有地方。','CloudFront','CloudFront主要處理HTTP內容傳遞與快取；Global Accelerator不提供物件快取，常用於固定IP與全球TCP或UDP入口需求。',['ip','latency','cloudfront'],'Global Accelerator會不會像圖片快取一樣保存每個玩家的遊戲回應？','不會。它負責流量入口與路由，應用狀態與資料保存仍由後端系統負責。');
 add('direct-connect','公司機房原本有自己的網路與資料，現在要長期和AWS交換大量資料。若完全經過一般網際網路，路徑與效能可能受到外部網路狀況影響。',
 'Direct Connect提供企業網路連到AWS的專用連線方式。實體線路、連接位置與邏輯連線設定各有工作要做，通常不是在畫面按一下就立刻取得一條跨城市專線。專用路徑也不代表所有內容已自動端到端加密。',
 '長期穩定的大量傳輸、企業網路整合或可預測的連線特性，可能值得使用專線。設計時還要比較建置時間、連線費、流量費、設備與真正的備援路徑。',
 [['規劃實體與合作方連線','確認企業設備如何連到支援的Direct Connect位置，是否使用合作服務商，以及頻寬需求。連接位置和AWS Region不是可以任意混為一談的名稱。'],['設定邏輯網路路由','依需要存取的AWS資源配置適當連線介面與路由。兩邊需要知道哪些位址要經過這條線，否則即使實體線已接好，資料也不一定能互通。'],['另外規劃加密與備援','若業務要求加密，需評估支援條件下的MACsec或VPN等設計。若只能接受很短中斷，也要安排不同連線、位置或備援方式。']],
 '公司每天要把機房資料大量同步到AWS，並要求連線故障仍能繼續營運。',['估算長期資料量及可接受中斷，先比較專線成本與一般網路方案。','規劃專線與對應路由，再測試實際來源到目的資源的存取。','切斷一條測試連線，確認備援真的能接手；不要把同一實體路徑上的兩個邏輯設定當成完整備援。'],'買到頻寬只是開始，能互通、符合加密要求並承受故障才是完整方案。','Site-to-Site VPN','VPN通常透過IPsec建立加密通道，可較快開始使用；Direct Connect重點是專用連線。它們可以組合使用，而不是只能二選一。',['ip','route-table','vpn'],'使用Direct Connect就代表不必再檢查資料傳輸加密嗎？','不代表。專用連線與加密是兩個問題，必須依業務要求及所選功能另外設計。');
 add('vpn','公司機房與AWS都能連上網際網路，但不想讓中間經過的網路任意讀取內部傳送內容。需要一條受保護的邏輯通道，把兩邊網路連起來。',
 'Site-to-Site VPN讓整個網站或機房網路，與AWS端的網路建立加密通道。可以把通道想成包在外層保護封套中的資料傳輸。連線兩端要互相認得、使用相容設定，也要有正確路由。',
 '它適合混合雲連線、快速建立受保護的網路通道，或作為其他連線的備援。加密能保護傳送內容，但不能讓壅塞的公網永遠穩定，也不會自動授權資料庫或檔案的使用權限。',
 [['準備兩端的網路設備','AWS端與企業端各有對應的VPN端點或設備。先確認公開連線位置、支援的設定及可管理性，不是每台用戶電腦各自登入一次。'],['讓資料知道要走通道','兩邊路由必須把目的網段導向VPN，安全規則也要允許所需流量。只看到通道顯示正常，不能證明某個應用真的可連。'],['測試故障與容量','檢查兩個通道及企業網路的切換方式，量測實際吞吐與延遲。多條通道若仍共用同一台機房設備或同一個ISP，還有共同故障點。']],
 '工程師在機房的應用要安全讀取AWS私有資料庫。',['建立機房到AWS的VPN，將資料庫網段路由到加密通道。','檢查資料庫安全群組、機房防火牆和DNS解析，並使用適當帳號與資料庫權限。','模擬單一通道中斷，觀察應用是否能恢復連線及是否需要重試。'],'VPN提供網路通道；能不能讀資料，仍取決於網路、身分與應用三方面設定。','Client VPN','Site-to-Site連接的是兩邊網路；讓個別員工從筆電遠端登入的需求，通常屬於用戶端VPN的另一種模式。',['ip','route-table','private-subnet'],'VPN通道顯示正常，資料庫一定能登入嗎？','不一定。還要確認路由、DNS、防火牆、安全群組和資料庫帳號權限。');
 add('tgw','公司有十幾個VPC和一個機房。如果每一對VPC都另外拉一條連線，很快就會出現難以理解的網路蜘蛛網，也難以分開正式與測試流量。',
 'Transit Gateway像網路樞紐，讓支援的VPC、VPN等連線先接到共同位置，再由路由表決定資料該去哪裡。接上同一個樞紐不表示全部網路必須彼此開放；路由表可以用來分組與隔離。',
 '它協助把大量點對點連線整理成較容易管理的中心結構。但樞紐也需要容量、路由和成本設計，不能只因為VPC很多就忽略資料處理費或權限邊界。',
 [['把網路接到樞紐','每個連接稱為attachment，可理解成某個網路的接入點。先確認位址範圍不衝突，因為相同位址可能讓目的地無法被唯一辨認。'],['決定使用哪張路由表','連線會關聯路由表，路由也可能透過設定傳播進入表內。先畫出哪個來源應能到哪個目的地，再配置規則，而非任意接受所有傳播。'],['同時處理兩端回程','樞紐知道路不代表VPC子網也知道路。來源與目的地的路由表、安全規則及回程方向都要完整，否則會出現只送得出去卻回不來。']],
 '三個產品VPC需要共用機房服務，但測試VPC不能連到正式資料庫。',['把各VPC與機房連線接入Transit Gateway，列出應允許的互通矩陣。','以不同路由表分開測試與正式路徑，只加入必要的共享服務路由。','從各來源實測允許與禁止的路徑，同時檢查安全群組與機房防火牆。'],'集中連線的目的是降低管理複雜度，不是取消每個環境的隔離需求。','VPC Peering','Peering是兩個VPC的直接連線，而且不提供一般轉送能力；Transit Gateway用樞紐路由管理多個網路的互通。',['vpc','route-table','peering'],'把測試和正式VPC接到同一Transit Gateway，是否必須互相開放？','不必。應用路由表及其他網路規則，只開放真正需要的連線。');
 add('peering','兩個獨立VPC裡的程式需要互相通訊，但不希望特地把服務公開到網際網路。最簡單的情境只有這兩個VPC，不需要一整個多網路樞紐。',
 'VPC Peering在兩個支援的VPC之間建立私有路由連線。它不是把兩個VPC合併成同一個VPC；各自的子網、路由與安全規則仍然存在。位址範圍也需要符合連線要求，不能彼此衝突。',
 '少量VPC之間可以用這種直接連線方式保持架構簡單。但當連線數量增加，或希望經第三個VPC轉送到其他地方時，就要重新評估適合的拓樸。',
 [['建立並接受連線關係','連線通常需要對方接受，跨帳號時也要有各自的管理權限。接受連線只代表網路關係建立，不代表已替所有應用開放存取。'],['在兩端加入路由與規則','來源子網要知道目的VPC位址往哪裡走，目的端也要有回程路徑。安全群組和網路ACL仍會影響封包能否通過。'],['記住不能任意轉送','若A與B有peering，B與C也有peering，不代表A可借B到C。這種轉送限制是選型關鍵，不能只看圖上線條接在一起就以為全都互通。']],
 '報表VPC需要從另一個產品VPC讀取內部API。',['確認兩個VPC的位址不重疊，建立並接受peering連線。','只為報表到產品API需要的網段與連接埠配置路由和安全規則。','若後來加入第三個VPC，重新檢查每條需求，不能假設現有連線自動提供轉送。'],'Peering解決兩個VPC的直接私有路徑，身分授權和應用存取仍需另行設定。','Transit Gateway','需要大量VPC集中互連或網路轉送時，樞紐式Transit Gateway通常更容易管理；它也有自己的費用與設計工作。',['vpc','cidr','route-table'],'A連B、B連C都有peering，A就一定能連C嗎？','不能這樣推論。Peering不提供一般轉送；A到C需要合適的直接或樞紐連線設計。');
 add('cloudwatch','網站客人說很慢，你需要知道是主機忙、程式錯誤，還是某個背景工作積壓。只看到網站還能打開，無法判斷系統是否正在接近故障。',
 'CloudWatch把系統的量測值與文字紀錄整理起來。指標是隨時間變化的數字，例如CPU使用率；日誌是程式寫出的事件內容；警報則依條件判斷是否需要通知或觸發支援的動作。',
 '它幫你從「感覺網站怪怪的」變成能觀察的證據。真正有用的監控應和使用者體驗及業務結果連結，而不是把所有數字都畫出來，卻沒有人知道警報代表什麼。',
 [['先決定要觀察的問題','除了主機CPU，也可觀察回應時間、錯誤率、佇列長度等訊號。不同AWS服務提供不同預設指標；作業系統記憶體等資料可能需要額外代理程式收集。'],['讓程式留下可追查日誌','日誌最好能連結同一個工作或請求，但避免記下密碼與完整敏感資料。收集、保留及查詢都可能計費，要設定合適保留時間。'],['設計可採取行動的警報','門檻、觀察期間與連續次數會影響警報。警報要能讓接收者知道接下來該檢查什麼，並測試通知和復原流程是否真的會執行。']],
 '訂單API偶爾回覆失敗，但團隊不知道發生在哪個時段。',['觀察API錯誤率與回應時間，先找出問題發生的時間窗。','依訂單或請求識別碼查相關日誌，確認是否和資料庫連線錯誤有關。','為持續的錯誤率升高建立警報，並寫下處理步驟及正常恢復的判定條件。'],'監控不是只收資料，而是讓人能從訊號找到問題並驗證修復。','CloudTrail','CloudWatch常回答系統運作如何；CloudTrail主要追查誰呼叫了哪些AWS API。主機變慢和誰刪除設定，是不同問題。',['request','latency','ec2'],'EC2的CPU正常，就能認定網站效能正常嗎？','不能。應用可能卡在資料庫、外部服務或佇列，應一起觀察回應時間、錯誤與相關日誌。');
 add('cloudtrail','某個儲存桶的設定突然改了。你想知道是誰操作、何時操作、用了哪個身分，而不是只知道現在的設定長什麼樣。',
 'CloudTrail記錄支援的AWS API活動。人從管理介面操作，背後通常也會呼叫API；程式使用角色執行管理工作，也會留下對應身分的紀錄。事件可以包含操作名稱、時間、來源與結果等資訊。',
 '它有助於稽核、事故調查與追蹤設定變更。事件涵蓋範圍、保存方式及費用要依需求設定，不能以為帳號裡每一次物件讀取或每一行程式動作都已自動永久保存。',
 [['先分清管理和資料活動','建立儲存桶、修改政策與讀取桶內物件不是完全相同的事件類型。若需要查S3物件層級存取，必須核對資料事件的設定範圍。'],['保存到能被保護的位置','依需要配置trail或其他支援的事件儲存方式，設定保存及存取權限。集中日誌帳號可以降低一般工作負載管理員修改稽核資料的能力。'],['從身分和請求開始調查','遇到異常先找對應時間、資源和API，再看使用的是人員、角色或服務身分。看到某個角色名稱，不等於已知道當時是哪個人觸發所有後續行為。']],
 '正式環境的安全群組被打開不需要的連接埠。',['以變更時間與安全群組識別碼查詢相關管理事件。','查看呼叫動作、使用身分與請求參數，再對照部署流程或人員操作紀錄。','修正設定並限制不必要的修改權限，確認事件日誌也有受到適當保護。'],'CloudTrail提供操作證據，但仍要結合情境判斷是否是誤操作、合法自動化或入侵。','AWS Config','Config較適合追蹤資源設定狀態與合規變化；CloudTrail記錄操作活動。它們可一起回答「改成什麼」與「誰做了改動」。',['api','iam-role','s3'],'開啟一般管理事件後，是否就能查所有S3物件讀取？','不能直接假設。物件層級活動屬於需要另外核對與設定的資料事件範圍。');
 add('config','公司規定正式儲存桶不可公開、安全群組不能任意開放，但資源很多，靠人每天打開畫面逐一檢查很容易漏掉，也看不出以前的設定。',
 'AWS Config記錄支援資源的配置與變更，並可用規則檢查是否符合要求。配置指的是資源目前如何設定，例如某個網路規則或加密選項；不是應用程式正在寫出的業務日誌。',
 '它讓治理要求可以持續被檢查，幫助找出偏離規範的資源。被標示不合規通常代表偵測到問題，不代表這項服務已阻止那次修改或自動修好了資源。',
 [['選擇要記錄哪些資源','確認服務支援的資源類型、區域與記錄設定。沒有納入記錄的資源，不能期待在歷史檢視中看見完整變更。'],['將要求轉成規則','可以使用支援的受管或自訂規則。規則要和實際安全目標對應，並定義合理例外，否則容易產生大量無法處理的警示。'],['安排發現後的處理','評估不合規項目後，可搭配支援的修正流程或人工處理。自動修正可能影響服務，應先驗證權限、例外與回復方式。']],
 '資安團隊想知道哪些正式資源沒有符合加密政策。',['啟用需要的配置記錄，並選用符合服務特性的加密檢查規則。','查看不合規資源及其設定歷史，判斷是新建時漏設，還是後來被改掉。','安排修正與再評估，另外透過CloudTrail查操作來源，以改善建立資源的流程。'],'Config把設定治理變成可持續檢查的工作，但規則與修正策略仍需由團隊設計。','服務控制政策SCP','SCP可以限制哪些操作被允許；Config主要檢查設定與合規。偵測已發生的偏差，和預先拒絕操作不是同一件事。',['policy','cloudtrail','scp'],'Config顯示一個資源不合規，代表它已被自動關閉嗎？','不代表。檢查結果與修正動作是分開的，必須查看是否另外配置了支援的修復流程。');
 add('guardduty','帳號裡可能出現異常登入來源、可疑網路活動或其他不尋常行為。團隊不一定能自己寫出所有威脅偵測規則，也不能只看單一錯誤日誌。',
 'GuardDuty分析支援的活動資料，產生稱為finding的安全發現。可以把finding理解成一份待調查的警示，描述觀察到的可疑行為與相關資源，而不是已證明所有細節的最終判決。',
 '它降低自己建立多種威脅偵測機制的負擔，但偵測之後仍要調查、確認影響並採取回應。啟用服務不代表所有流量已被阻擋，也不等於帳號從此不需要最小權限。',
 [['確認保護範圍與功能','GuardDuty有核心及其他保護能力，支援來源和收費依功能不同。應查看所在Region和帳號的啟用狀態，不要假設一處開啟就覆蓋整家公司所有環境。'],['閱讀finding的情境','注意受影響資源、時間、行為類型與嚴重度，再和實際應用用途比對。同一個網路行為在測試與正式系統裡，可能需要不同調查。'],['建立後續回應流程','可以把發現送到事件處理或通知流程，再由人工或經驗證的自動化採取隔離等動作。自動化本身需要權限與例外設計，避免誤傷正常服務。']],
 '一台EC2出現可疑的對外連線警示。',['先查看finding指出的主機、目的地與時間，確認是否為既有批准的工作。','保存必要證據，檢查主機角色權限、程式與相關網路紀錄。','依事件程序隔離或修復，再確認同類活動是否停止，並檢查其他資源。'],'安全發現是調查入口，不是可以省略判斷和回應的自動防火牆。','AWS WAF','WAF可依設定檢查並處理HTTP請求；GuardDuty主要偵測可疑活動並產生發現，兩者的工作階段不同。',['ec2','iam-role','cloudwatch'],'GuardDuty產生finding後，是否一定已替你封鎖那台主機？','不一定。偵測與阻擋是不同工作，需要檢查是否另外配置並成功執行回應流程。');
 add('cloudformation','如果測試環境是靠十幾次手動點選建立，幾週後要在正式環境重建，很容易忘記某條路由、權限或參數，兩個環境也難以比較差異。',
 'CloudFormation依文字範本建立與更新AWS資源。範本描述想要哪些資源及其關係，服務把這組資源作為stack管理。範本不是網站業務程式，而是建立網站所需環境的配置說明。',
 '把環境寫成可保存與審查的文字，能提高重複建立的能力，也方便追蹤修改原因。不過錯誤範本仍可能造成錯誤環境；使用自動化並不會自動證明架構安全或符合業務需求。',
 [['描述資源與參照關係','例如先有私有S3儲存桶，再讓CloudFront來源參照它。用資源間的參照表達關係，比把每次建立後才知道的名稱寫死更容易重用。'],['在修改前檢視影響','更新可能改動現有資源，也可能需要替換資源。檢視變更與資料保存策略很重要，尤其不能把重要資料的刪除風險只當成一般程式部署。'],['管理範本外的變動','若有人手動改動stack內資源，實際狀態可能偏離範本。需依支援能力檢查漂移，並決定把變動寫回範本或還原，而不是讓兩套設定長期不一致。']],
 '團隊要建立相同的測試網站與正式網站。',['將網路、運算與儲存設定寫成範本，把環境名稱及規模做成適當參數。','先在測試環境建立並驗證，再審查正式環境變更會建立、修改或替換哪些資源。','建立後測試網站功能，持續檢查是否有未納入範本的手動修改。'],'範本提高可重現性，但測試、資料保護與權限審查仍不可省略。','應用程式原始碼','應用程式處理訂單等業務；CloudFormation描述承載應用的AWS資源。兩者都能版控，但執行目的不同。',['iac','s3','cloudfront'],'範本能成功建立stack，是否代表網站一定安全且可用？','不代表。它表示部署操作成功，仍須驗證權限、網路、資料與實際應用行為。');
 add('iac','你希望知道上星期誰把環境改大、為什麼改，以及出問題時如何重建。若設定只存在某個人的記憶或管理畫面，審查與重現都很困難。',
 '基礎設施即程式碼是一種管理方式：把環境配置寫成文字，透過版本控制、審查與自動化來建立和修改。它不是某一個AWS產品的別名，也不是保證所有工具都使用相同語法。',
 '團隊可以像審查一般程式修改一樣，比較網路、機器與權限的差異。遇到災難或新增環境時，也較容易用同一份定義重建，減少人工遺漏。',
 [['寫出期望的環境','描述需要哪些資源、彼此怎麼連及可調整的參數。不要只把一份操作紀錄存成文件，卻仍讓建立環境完全依靠人工。'],['透過版本控制審查','每次變更保留原因及差異，讓其他人看到它是否擴大權限、增加成本或替換資料資源。文字可追蹤不等於內容自然正確。'],['讓實際環境持續對齊','如果部署後又隨意手動修改，程式碼就不再代表真實環境。應建立例外與回寫流程，並針對重要變更測試和驗證。']],
 '一家商店要把網站從單一測試環境擴展為測試與正式兩套。',['把共同的網路與服務配置寫成可重用定義，將兩套環境需要不同的值分成參數。','透過審查流程確認正式環境有適當備援與資料保存，而不是直接複製測試規模。','部署後比對實際資源，並把後續調整持續保存到版本紀錄。'],'重點是讓環境成為可審查、可重建的資產，而不是單純追求少按幾下滑鼠。','CloudFormation','IaC是一種做法；CloudFormation是能實作這種做法的AWS服務之一。理念和工具不要混成同一個名詞。',['compute','storage','policy'],'把建立環境的步驟寫成Word文件，就一定算完成IaC了嗎？','不一定。關鍵是資源定義能被版本化並由合適工具一致地建立與更新，而不是仍靠人逐步照做。');
 add('spot','有些工作可以失敗後重跑，例如產生縮圖或批次計算；另一些工作不能突然停止。既然對中斷的接受程度不同，就不必全部採用相同的運算購買方式。',
 'Spot讓你使用AWS當下可提供的閒置EC2容量，通常可降低運算單價。這些容量可能因AWS需求而被中斷，因此架構必須能承受資源離開，而不能把它當成廉價又永久保證的主機。',
 '它適合可重試、可分散或能保存進度的工作。真正的成本還要包括中斷後重跑、等待容量、保存狀態與工程管理工作，不能只比較畫面上的每小時單價。',
 [['把工作切成可恢復單位','若一台主機離開就得重跑兩天的計算，單價折扣未必划算。可以將工作拆小、定期保存進度，讓失敗只影響一小部分。'],['降低對單一容量池依賴','依工作相容性使用不同執行個體類型與位置，並採合適配置策略。只接受單一非常特定的機型，可能更容易遇到容量不足。'],['設計任務接手與中斷處理','工作佇列、重試與冪等可避免主機離開後資料遺失或重複處理。對支援的中斷通知也應有處理方式，但不能依賴永遠有足夠時間完成全部工作。']],
 '每天有十萬張產品圖片需要轉成小尺寸，晚一點完成仍可接受。',['把每張或小批圖片放進工作佇列，輸入與輸出保存在持久儲存。','由Spot工作者領取任務，完成並保存結果後再確認任務完成。','中斷時未完成工作可重新投遞，透過物件或任務識別碼避免重複輸出造成混亂。'],'Spot省的是可承受中斷工作的容量費用，恢復能力是採用前提。','Savings Plans','Savings Plans用長期用量承諾換折扣；Spot依閒置容量且可被中斷。折扣來源和運作限制不同。',['ec2','sqs','idempotency'],'能不能只為了單價低，就把不可中斷的單一付款主機換成Spot？','不能。先滿足可用性與中斷要求，只有能承受或妥善處理中斷的設計才適合。');
 add('savings-plans','網站每天都穩定使用一部分運算，但也有偶爾才出現的尖峰。如果確定某些用量會持續存在，可能用承諾換折扣；不確定的部分則要保留彈性。',
 'Savings Plans以一定期間內每小時的用量金額承諾，換取符合方案條件的運算折扣。重點是用量承諾，而不是先買下一台永遠不能變動的實體電腦；不同方案的適用服務與彈性也不同。',
 '長期穩定用量可能因此降低費用，但承諾過多會為沒用到的部分付出代價。應先改善過大或閒置資源，再決定可預測的基礎用量，而不是把目前浪費也一起承諾下來。',
 [['先整理真實基礎需求','檢查主機是否過大、工作是否能排程停止，以及容量是否真的全年穩定。先調整需求，才知道值得承諾的範圍。'],['比較方案的適用彈性','不同Savings Plans對運算服務、機型或區域的限制不相同。必須核對目前與未來可能採用的工作負載，不能只挑折扣百分比最大者。'],['持續追蹤使用與覆蓋','觀察承諾是否被充分使用、還有多少符合條件用量沒有折扣。尖峰可能仍以其他價格計費，不能把整張帳單都當成同一折扣。']],
 '公司觀察到最佳化後，全年仍固定需要一組基礎運算，促銷時才加開其他資源。',['先用歷史與未來計畫估計穩定底量，不把最大促銷尖峰直接當作全年承諾。','選符合未來服務與機型彈性的方案，評估期限和付款條件。','定期檢查承諾使用率，新增承諾前確認需求不是短期活動。'],'折扣應建立在清楚的穩定需求上，並不取代容量管理。','容量保留','價格折扣與某地點有沒有機器可以啟動是不同問題。不能因為有Savings Plans，就假設任何時候都已替你保留所需容量。',['compute','ec2','budgets'],'有Savings Plans就保證尖峰時一定能啟動指定AZ的EC2嗎？','不保證。用量折扣和容量保留需要分開評估，還要考慮配額與實際可用容量。');
 add('ri','某些服務有長期、可預測的固定使用需求，按需單價可能不是最合算的方式。但「預留」這個名稱，很容易讓人以為所有方案都同時買到了價格折扣與專用容量。',
 'Reserved Instances在EC2等服務中提供特定條件的預留型價格方案。以EC2而言，需要看區域或可用區範圍、方案類型與屬性等條件，才能判斷折扣如何套用以及是否有容量效果。',
 '穩定需求可以評估長期折扣，但服務、機型或使用方式改變時，適配程度也可能改變。挑選前要了解實際工作負載和承諾責任，而不是看見折扣就認為任何資源都能抵扣。',
 [['確認購買的服務與條件','EC2的RI不是能隨意套用到所有資料庫或Lambda的通用折價券。即使名稱相似，不同服務的預留方案也各有適用規則。'],['分開看價格與容量','以EC2方案為例，不同範圍會影響容量預留效果。題目若要求特定AZ一定有啟動容量，就要明確核對方案，而不是把所有RI一概視為答案。'],['觀察長期相容性','評估機型、平台、範圍與未來遷移計畫。用不到的承諾可能變成成本，因此先做資源調整與使用量分析，比直接購買最長期限更重要。']],
 '公司有一批長期運作的EC2，但一年後可能改用其他機型或容器服務。',['先確認目前哪些用量真的是穩定需求，並移除閒置或過大的規格。','比較RI與Savings Plans對未來變動的適用性，不只比較最高折扣。','若另外需要特定位置容量，單獨檢查能滿足該容量需求的方案。'],'價格最佳化不能忽略未來架構變動和容量要求。','Savings Plans','RI常依較具體屬性套用；Savings Plans以支援範圍內的用量承諾運作。兩者都需要核對條件，沒有一個永遠更好。',['ec2','savings-plans','az'],'「我買了RI」這句話足以判斷有沒有特定AZ的容量保障嗎？','不足。還要知道服務、方案範圍與屬性，不能只看預留這兩個字。');
 add('budgets','第一次使用雲端時，最令人擔心的常是月底才發現帳單超出預期。你需要提早知道費用接近某個數字，並清楚知道收到通知後誰要處理。',
 'AWS Budgets讓你設定成本或用量目標，追蹤實際或預估狀態，並在符合條件時發通知或執行支援的動作。預算本身不是所有AWS資源通用的即時電源總開關。',
 '它能協助團隊提早發現異常，但帳務資料與通知並非每個請求即時更新。即使有預算，仍要避免不必要資源、檢查服務費率並安排清理，不能把通知門檻當成絕對不會超過的上限。',
 [['定義追蹤範圍','可以依帳號、服務或支援的費用分類等方式縮小範圍。先知道要監控整個帳號還是某個實驗，否則一個總金額可能掩蓋特定專案的異常。'],['設定可行的通知門檻','依需要設定實際或預估門檻，確認通知對象有效。多個分段門檻可以讓團隊先調查，再決定是否限制新增資源。'],['另外設計限制與清理','若使用支援的Budget actions，必須核對動作、權限與核准流程。沒有設定的資源不會因預算數字而自動消失，也可能有持續計費的儲存與備份。']],
 '學生要做網站實驗，希望費用接近預期金額時立刻得到提醒。',['建立適合範圍的預算與多階段通知，並測試收件者確實能接收。','每次實驗前查看即將建立資源的費率，完成後刪除不再需要的資源。','收到提醒時查出主要費用來源，包括仍保留的磁碟、快照、流量與日誌。'],'預算是監控與治理工具，不能代替實際了解及管理資源。','Cost Explorer','Cost Explorer主要協助分析費用從哪裡來；Budgets用目標與門檻追蹤。分析和通知可以搭配使用。',['ec2','storage','cloudwatch'],'設一百美元預算，就能保證帳單絕不超過一百美元嗎？','不能。預算與通知不等於所有服務的硬性付款上限，仍需資源管理及合適限制。');
 add('dms','搬資料庫時，舊系統可能仍在接單。如果只是先複製資料、隔天再切換，這段時間新增的訂單可能沒有進入新系統，導致切換後資料不完整。',
 'DMS協助把支援來源的資料搬到支援目標。常見流程是先搬原有資料，再持續追蹤之後的變更。它主要處理資料移轉，不會自動讓每一種舊資料庫程式、SQL或預存程序都能在新引擎正確執行。',
 '它可以縮短最後切換時需要暫停寫入的時間，因為大量舊資料已經預先搬完。但成功遷移仍要處理結構相容性、來源日誌、網路、權限及實際資料驗證。',
 [['準備來源與目標','確認引擎和功能是否支援，建立適當連線、使用者權限與目標結構。不同引擎之間可能需要先做結構轉換及程式修改。'],['分開處理歷史與新增變更','完整載入搬移當下已有的資料；CDC則追蹤後續支援的變動。複製延遲會影響最後切換，來源也需要保留足夠的變更紀錄。'],['驗證後再切換應用','比對筆數或資料內容，測試交易與查詢，再安排短窗口控制寫入、追平變更並切換連線。也要事先想好失敗時如何回復。']],
 '機房訂單資料庫要搬到RDS，但不能停止營業一整天。',['先測試資料結構與應用相容性，配置DMS初始載入。','讓舊站繼續運作，同時追蹤新增訂單，監控同步落後情況。','切換時短暫控制寫入，驗證追平與資料正確後，才讓應用指向新資料庫。'],'DMS協助搬資料，完整遷移仍包含驗證、程式相容性和可回復的切換流程。','DataSync','DataSync主要移動檔案或物件；DMS理解支援的資料庫遷移與變更同步需求，不應因兩者都搬資料就混用。',['rds','cdc','replication'],'DMS能把資料搬成功，是否代表所有舊SQL都不必修改？','不代表。資料搬移與資料庫引擎功能相容是兩個問題，需要另外測試及處理。');
 add('cdc','搬一個還在營業的訂單系統時，最早複製的那份資料很快就會過時。你不希望每次有新訂單，就把整個資料庫全部重新複製一次。',
 '變更資料擷取關心的是「上次位置之後發生了哪些變動」。依資料庫與工具的支援方式，從來源的變更紀錄追蹤新增、修改及刪除，再套用到目標。它不是只定期比較檔案名稱的同步。',
 '持續傳送差異通常比反覆搬全部資料有效率，也能讓最後切換時只剩較小的資料落差。但來源必須提供可追蹤且保留足夠時間的紀錄，目標也要能正確套用。',
 [['先有一致的起始位置','先載入既有資料並建立後續追蹤位置，避免初始複製和新增變更之間出現缺口。不同工具與引擎有各自條件，不能自行猜測任意時間點都可以接續。'],['持續讀取與套用變動','追蹤新增訂單、更新付款狀態與刪除測試資料等事件。要理解哪些表或變更類型受支援，以及來源與目標結構是否相容。'],['觀察落後與故障恢復','變更可能不是瞬間抵達，必須監控複製延遲與錯誤。若停太久導致來源所需紀錄已消失，可能無法直接從原位置繼續。']],
 '一個訂單表有一百萬筆資料，每分鐘又有新訂單進來。',['先完成既有資料的初始載入，記下支援的變更追蹤位置。','將新增與更新持續送到目標，觀察是否有表格錯誤或延遲累積。','切換前暫停或控制來源寫入，確認目標追平，再決定應用連線切換。'],'CDC讓目標持續接近來源，而不是保證兩邊每一瞬間都完全相同。','備份','備份保存可還原的歷史狀態；CDC傳送持續發生的變更，錯刪也可能跟著傳過去，因此不能自然取代備份。',['dms','replication','backup'],'CDC正在運作，就能直接認定兩個資料庫即時完全一致嗎？','不能。要看複製延遲、套用錯誤與支援範圍，重要切換仍需驗證。');
 add('datasync','公司有很多檔案要從機房搬到AWS。手動複製很難持續追蹤進度、檢查傳輸結果，也不方便定期只補上後來改變的內容。',
 'DataSync協助在支援的檔案或物件儲存位置之間搬資料。它把傳輸、排程與驗證等部分工作服務化；但來源和目的地必須是支援的組合，也需要能連線及有讀寫權限。',
 '大量檔案遷移或定期同步時，專門的傳輸工具比一台臨時主機上的手動指令更容易管理。它不會自動讓舊應用改用新儲存，也不會把資料庫交易理解成檔案搬移。',
 [['選定來源與目的地','先確認是NFS、SMB、S3或其他支援位置，以及是否需要代理程式。要把實際資料類型與存取方式弄清楚，而不是只說「搬到雲端」。'],['配置任務的權限與網路','來源需要能讀，目的地需要能寫；企業防火牆、路由和AWS角色都可能阻擋。還要考慮檔案中繼資料與權限是否能按需求保留。'],['驗證、增量與最後切換','先做大量初次傳輸，再依需求補傳變更。檢查驗證結果、錯誤及資料完整性，最後安排應用停止舊位置寫入並切到新位置。']],
 '公司把共享檔案伺服器遷移到EFS，白天員工仍會修改文件。',['確認來源NFS與目標EFS的支援條件，配置必要連線與代理程式。','先傳大部分歷史檔案，再重跑任務補足後來變動的內容。','在切換窗口停止舊位置寫入，驗證最後差異及存取權限，再更新用戶端掛載。'],'資料傳過去與應用遷移完成是兩個階段，需要另外安排切換與驗收。','Storage Gateway','DataSync主要把資料搬到另一個位置；Storage Gateway提供應用持續使用的混合儲存介面。搬遷工具和長期存取橋接不同。',['storage','nfs','s3'],'DataSync成功傳完檔案，舊應用會自動開始使用新的EFS嗎？','不會。還要驗證資料與權限，並調整應用的實際連線或掛載位置。');
 add('storage-gateway','有些機房應用只能使用檔案分享、磁碟或磁帶備份介面，不能立刻改成呼叫雲端儲存API。你仍想利用AWS保存資料，而不把所有應用重寫。',
 'Storage Gateway提供支援的混合儲存介面，在應用熟悉的存取方式與AWS後端儲存之間做整合。不同類型處理檔案、磁碟區或虛擬磁帶需求，資料路徑與快取行為不能一概而論。',
 '它讓既有系統有機會繼續運作，同時使用雲端儲存能力。機房設備、網路可用性、本機快取及資料上傳狀態仍會影響體驗，不能把它理解成完全不依賴連線的無限硬碟。',
 [['先辨認應用需要的介面','應用要的是共享檔案、區塊磁碟還是磁帶備份？先選對支援的gateway類型，再核對來源作業系統、協定和功能相容性。'],['理解本機和雲端的分工','部分資料或工作會涉及本機儲存與快取，雲端則保存對應後端資料。寫入已被應用接受與資料已完成上傳，可能是不同時間點。'],['規劃斷線及還原情境','網路中斷時哪些資料可存取、寫入可維持多久，以及資料如何還原，都要依模式實測。也要監控快取、上傳進度與後端儲存費用。']],
 '公司原有備份程式只會寫入磁帶，但想減少實體磁帶管理。',['先確認備份軟體是否支援合適的虛擬磁帶介面與gateway模式。','配置機房端元件及網路，把小型測試備份送到AWS後端。','實際做一次還原，量測取回與復原時間，不能只以成功寫入作為驗收。'],'橋接既有介面能降低改寫負擔，仍須理解資料落地與復原方式。','直接使用S3','能修改應用時可以直接使用S3物件API；既有軟體若只懂檔案或磁帶介面，則需要適合的橋接，而不是假定S3就是一般共享磁碟。',['storage','s3','backup'],'使用gateway後，本機網路與快取容量還需要監控嗎？','需要。應用體驗與資料上傳可能仍依賴這些元件，不能只看雲端儲存還有空間。');
 add('mq','既有企業系統可能使用特定訊息協定與中介軟體，把付款、庫存與出貨工作串起來。搬到AWS時，全面重寫所有送收訊息程式可能比搬主機更困難。',
 '訊息代理是接收、暫存及轉交訊息的中間服務。Amazon MQ提供受管ActiveMQ或RabbitMQ，協助使用相應協定與功能的應用減少部分代理主機維護工作。它不是所有訊息服務都能直接互換的通用外殼。',
 '當遷移重點是保留既有協定與程式整合方式時，MQ可能降低改寫量。選擇時仍需檢查引擎版本、用戶端相容性、儲存、容量及高可用部署模式。',
 [['先確認程式使用的協定','找出應用如何建立連線、送訊息及確認完成。若已深度依賴既有broker功能，不能只因另一項服務也有queue就認為完全相容。'],['規劃代理的可用性與容量','不同引擎和部署模式的備援方式不同。估算訊息大小、速率與積壓時間，再設定適合容量，並監控消費者是否持續處理。'],['設計應用重連與冪等','即使使用受管代理，連線仍可能中斷。用戶端應有適當重試、確認和防止重複業務動作的設計，不能把代理成功收件當成下游一定完成。']],
 '機房應用已使用RabbitMQ，想移到AWS並盡量保留原程式。',['核對Amazon MQ支援的RabbitMQ功能及用戶端相容性。','建立合適部署並設定私有網路與身分權限，先以一組測試訊息驗證。','測試代理或連線中斷後的重新連線，確認訊息重試不會造成重複扣款。'],'選MQ的主要理由是既有協定與功能匹配，而不是因為所有排隊工作都需要它。','Amazon SQS','SQS是AWS受管佇列服務，使用自己的API與語意；MQ著重相容的傳統broker引擎與協定，遷移代價不同。',['sqs','idempotency','availability'],'現有RabbitMQ程式是否只改網址就一定能換成SQS？','不能保證。協定、用戶端程式及訊息語意不同，必須評估改寫與相容性。');
 add('msk','有些系統把訂單或裝置資料持續寫成事件紀錄，讓多個分析或處理程式各自讀取，而且需要在一定範圍內重讀舊資料。它和「領走一件工作就刪掉」不完全相同。',
 'Kafka把事件保存在可持續讀取的日誌中，資料通常分到多個partition，以支援平行處理。MSK協助管理Kafka基礎設施，但使用者仍需理解主題、分區、保留、用戶端與容量規劃。',
 '既有應用若已使用Kafka協定與生態工具，MSK可以減少自行維護叢集的部分工作。它不會替你決定事件格式、保序範圍，或保證所有下游處理永不重複。',
 [['把事件寫入合適主題','主題像一組同用途的事件紀錄，例如訂單狀態。事件內容與版本要有約定，否則多個消費者很難持續讀懂。'],['理解分區與各自讀取位置','同一分區內的順序和不同分區之間的順序不是一回事。消費者記錄自己讀到哪裡，因此不同處理程式可以有不同進度。'],['監控積壓與保留需求','若消費者落後太久，資料可能超出保留範圍。要配置網路、驗證、容量與資料保留，並測試故障後如何接續讀取。']],
 '公司既有Kafka管線同時供即時儀表板和每日報表使用。',['整理目前主題、分區與消費者進度需求，再核對MSK部署選項。','把測試事件送入新環境，確認不同消費者可獨立讀取與重讀。','測試停止一個消費者後的積壓與恢復，確認保留時間足夠支援業務。'],'受管Kafka減少基礎設施工作，但串流資料設計與消費者正確性仍需要團隊負責。','SQS','SQS常用來分配待辦工作；Kafka類串流日誌可讓多個讀者依自己的位置讀取。不能只用都有訊息就判定相同。',['kinesis','partition-key','idempotency'],'MSK是受管服務，還需要設計事件格式與消費者進度嗎？','需要。服務管理部分基礎設施，不會替應用定義資料契約、保留需求及處理語意。');
 add('appflow','業務資料可能在客戶關係管理、客服或其他SaaS系統裡，分析資料卻要放進AWS。每個系統自己寫連接、登入與欄位搬移程式，會增加維護負擔。',
 'AppFlow以支援的連接器，在SaaS應用與AWS服務之間設定資料傳送。SaaS可以理解成透過網路使用的現成軟體。能否傳哪些資料、用哪種觸發方式，取決於實際連接器與來源功能。',
 '當需求是把支援系統的資料定期送往分析位置時，設定式整合可能比自己維護一整套搬移程式簡單。但它不是任意軟體的通用資料線，也不會自動保證所有欄位符合隱私要求。',
 [['確認來源與目的地受支援','先查連接器可讀寫哪些物件、欄位與方向。不要只看產品名稱存在，就假設全部API或所有自訂功能都能搬。'],['配置登入與欄位映射','來源連線需要適當授權，再將來源欄位對應到目的資料結構。應排除不需要的個資和機密，並確認目的端儲存權限。'],['設定觸發與驗證','依功能選擇支援的排程或其他觸發方式，檢查失敗、重試與資料量。第一批成功不代表未來欄位變更後也一定正常。']],
 '公司想每天把支援的CRM客戶資料送到S3做分析。',['核對CRM連接器、可擷取欄位與所需帳號權限。','建立flow，把需要的欄位映射到目的資料，避免搬入不必要敏感資訊。','排程執行並檢查紀錄與輸出，對來源結構變更及傳送失敗建立處理方式。'],'AppFlow協助連接支援系統，資料治理與最終分析仍需要另外設計。','EventBridge','AppFlow偏向支援應用間的資料傳送；EventBridge偏向事件路由與觸發，兩者不是同一種整合模型。',['s3','api','eventbridge'],'只要某個SaaS有網頁，就一定能直接用AppFlow擷取所有資料嗎？','不一定。必須有支援的連接器與功能、合法授權，以及合適的欄位與方向。');
 add('resolver','企業員工可能用公司內部名稱連資料庫，AWS內的程式也有私有服務名稱。兩邊網路接通後，仍可能因為不知道名稱該向誰查，而無法找到目的地。',
 '現行文件稱Route 53 VPC Resolver，教材也可能沿用Route 53 Resolver。它處理VPC中的DNS解析及支援的混合查詢。Inbound端點讓其他網路把查詢送進AWS解析；outbound端點配合轉送規則，將適當名稱查詢送往企業等外部DNS伺服器。',
 '它解決的是名稱如何在不同網路範圍被查詢，不是單純打通IP路由。正確設計可以讓AWS與機房程式沿用可管理的私有名稱，同時避免把私有記錄公開到網際網路。',
 [['先畫出查詢的方向','是機房要查AWS私有名稱，還是AWS程式要查機房名稱？方向不同，所需端點與轉送規則也不同。先弄清查詢者與負責回答的DNS。'],['配置端點與可達路徑','DNS請求需要能經VPN、專線或其他合適路徑到達端點。安全規則及DNS使用的通訊方式也要允許，不能只開應用程式的連接埠。'],['測試精確名稱與回應','用實際名稱測試是否由預期的DNS回答，並排查轉送迴圈、錯誤規則與快取。查得到名稱後，仍要驗證應用連線及身分權限。']],
 'AWS內的應用要連機房的db.corp.example。',['確認這個名稱由機房DNS管理，且AWS到該DNS有網路路徑。','配置適當outbound端點與corp.example轉送規則。','先測試名稱解析得到正確私有IP，再測試資料庫連線；兩個檢查分開處理。'],'Resolver讓名稱查詢走對方向，並不替代資料傳輸路由或資料庫權限。','Route 53公開DNS','公開DNS讓網際網路查公開名稱；混合私有解析處理企業與VPC的內部名稱，不應把兩種用途混在一起。',['dns','vpc','vpn'],'機房可以ping到AWS主機，但查不到私有名稱，是不是一定要改公開DNS？','不是。先檢查私有DNS的責任範圍、Resolver方向、轉送規則與DNS網路連線。');
 add('directory','企業的Windows員工與應用可能已依靠一套集中帳號、群組和網域設定。若把工作負載搬到AWS，不能只建立幾台主機就假定原本的登入與目錄功能自然存在。',
 '目錄服務保存及管理使用者、群組與其他身分資訊，也可能提供Windows網域相關功能。AWS Directory Service有不同選項，可能提供受管目錄或協助連接既有目錄；各選項的能力與適用方式不同。',
 '它能協助需要相應企業目錄功能的工作負載，例如某些Windows共享檔案或網域加入需求。但員工登入AWS管理介面、網站顧客註冊，以及Windows網域驗證，是三個需要分清的情境。',
 [['確認應用真正依賴什麼','列出是否需要Active Directory相容能力、網域加入、群組或與機房目錄互通。不要只因為需要登入，就直接選某個目錄服務方案。'],['比較受管與連接方式','需要AWS內的受管目錄，和把驗證轉往原企業目錄，是不同設計。要核對功能、信任關係、網路及維運責任。'],['驗證DNS與網域連線','目錄與Windows網域功能常依賴正確DNS和網路通訊。設定完成後，測試使用者登入、群組存取以及故障時是否仍能工作。']],
 '公司要讓AWS內的Windows檔案服務沿用企業員工身分。',['先確認檔案服務的目錄整合要求與目前企業目錄的位置。','選擇相容的Directory Service或既有目錄整合模式，規劃私有連線與DNS。','測試不同群組的檔案權限，並驗證企業端連線中斷時的實際行為。'],'目錄解決身分基礎的一部分，仍須為每個應用設定實際授權。','Cognito與IAM Identity Center','Cognito常面向應用顧客；Identity Center常用於員工登入AWS帳號與應用；Windows目錄整合則有不同需求。',['identity-center','cognito','dns'],'網站只要顧客自行註冊，就一定需要Windows目錄服務嗎？','不一定。先判斷是消費者應用驗證、員工集中登入，還是Windows網域需求，再選服務。');
 add('ram','公司有多個AWS帳號，各自隔離正式、測試與團隊環境，但某些支援的基礎資源可以共用。如果每個帳號都重建一份，管理與費用可能增加。',
 'AWS RAM協助擁有者把支援的資源分享給其他帳號或組織範圍。分享的是特定服務支援的使用能力，不是把整個AWS帳號合併，也不是讓對方自動取得擁有者的所有管理權。',
 '它可以兼顧多帳號隔離與共用基礎設施，例如支援的網路資源分享。真正可分享的類型、接受程序與權限依資源而定，不能假設任何AWS資源都能直接套用同一種分享方式。',
 [['辨認資源擁有者與使用者','先確定哪個帳號管理生命週期，哪些帳號只需要使用。多帳號架構中的帳務、管理責任與資源擁有權仍需清楚。'],['建立合適的分享範圍','挑選支援資源及分享對象，依組織設定與情境處理接受程序。範圍應貼近實際需求，而不是為了方便分享給所有人。'],['檢查雙方仍需的權限','分享後，使用帳號可能仍需相應IAM權限與服務設定。也要理解取消分享後對現有工作負載的影響，不能只測試建立成功。']],
 '網路團隊希望多個應用帳號使用集中管理的支援網路資源。',['確認該資源類型能透過RAM分享，並決定由哪個帳號管理。','把資源分享給指定帳號或合適組織範圍，安排使用端必要的權限。','測試使用者能做需要的事、不能修改不屬於他的管理設定，並記錄退出與取消分享流程。'],'RAM分享使用範圍，並不取消原本的帳號隔離與責任分工。','跨帳號IAM角色','角色讓另一身分暫時取得指定操作權限；RAM則依服務功能分享特定資源，兩者不是每個情境都可互換。',['organizations','iam-role','policy'],'被RAM分享了一個資源，是否等於成為擁有者帳號的管理員？','不是。你取得的是該分享與服務所支援的能力，仍受相應權限和擁有權限制。');
 add('outposts','有些工作必須留在企業機房處理，例如和現場設備需要很短往返時間，或資料有在地處理要求。團隊又希望盡可能沿用熟悉的AWS工具與服務模式。',
 'Outposts把部分AWS基礎設施帶到客戶場地，提供支援的服務能力。它不是把整個AWS Region完整複製進機房；可用服務、規模、連線與硬體條件仍有明確限制。',
 '它可以協助特定在地運算與混合需求，但客戶仍需提供合適場地、電力、網路及其他支援條件。採購、維護與和Region的連線方式，也和一般雲端虛擬主機不同。',
 [['先確認為何必須在地','把延遲、資料位置、法規或設備依賴寫成明確需求。若一般Region已能滿足需求，就不應只因為名稱新穎而引入額外硬體。'],['核對支援的服務與場地','確認需要的服務、容量及部署選項能在Outposts提供，並檢查實體環境要求。不是所有Region功能都在現場可用。'],['設計Region連線與故障情境','理解本地工作負載和所屬Region之間的控制與資料依賴，實測網路中斷時能繼續哪些工作。仍需要備份、權限與災難復原設計。']],
 '工廠應用必須快速與現場設備互動，又希望使用支援的AWS運算能力。',['量測現場到Region的延遲，確認需求是否真的需要場內部署。','核對Outposts支援能力、容量和機房電力網路條件。','測試與Region連線中斷及現場設備故障，制定可接受的降級與復原流程。'],'Outposts是有條件的混合部署選項，而不是省去機房責任的魔法盒子。','Local Zones','Local Zones是AWS在特定城市附近提供的延伸位置；Outposts則部署在客戶場地，位置與責任分工不同。',['region','latency','compute'],'使用Outposts後，客戶還需要管理場地電力與網路嗎？','需要。AWS管理的基礎設施能力與客戶提供的現場條件要一起滿足。');
 add('local-zone','有些使用者集中在某個城市，而最近的完整Region仍不夠接近。應用中某部分工作需要更短延遲，但不一定要把整個系統搬到每個城市。',
 'Local Zone是與主要Region有關聯的延伸部署位置，提供支援的部分運算與相關能力。它不像一般快取節點只傳遞內容，也不是擁有完整服務清單的獨立Region。',
 '需要城市附近運算的特定工作負載，可以評估把延遲敏感的部分放近使用者。資料庫或其他依賴若仍在遠處，整個請求依然可能需要長距離往返。',
 [['找出真正延遲敏感的步驟','區分使用者到應用、應用到資料庫與其他服務的等待。只有某一段變近，不一定能大幅改善整個交易。'],['核對服務、網路與位置支援','不同Local Zone的支援服務與資源選擇不同，需確認你的方案可用。子網、位址和對父Region的連線也要一併設計。'],['安排資料與故障策略','如果應用需要頻繁同步遠端資料，近端運算的好處可能被抵消。要考慮資料放置、備援及Local Zone不可用時的回復方式。']],
 '城市中的影音應用需要較近的即時運算，但管理與部分資料服務仍在Region。',['量測各階段延遲，確認哪些運算搬近才有實際效益。','核對當地Local Zone的支援資源，配置需要的網路與資料路徑。','測試父Region依賴及本地故障，確認效能和可用性都符合需求。'],'選部署位置必須看整條資料路徑，不是只看使用者到主機的地理距離。','CloudFront邊緣節點','CloudFront主要傳遞與快取HTTP內容；Local Zones可提供特定近端運算資源，不能因都靠近使用者而視為同一能力。',['region','edge-location','latency'],'把應用放進Local Zone，所有資料庫查詢就一定變快嗎？','不一定。若資料庫仍在較遠位置，查詢仍需要相應網路往返，必須量測完整路徑。');
 add('rekognition','應用收到一張照片，想知道裡面可能有什麼，而不是只保存檔案。自行從零建立影像辨識程式，通常需要模型、訓練資料和專門知識。',
 'Rekognition提供支援的影像及影片分析功能，例如識別物件或場景。結果是模型對輸入內容的判斷，可能包含信心值；它不是像讀取資料庫欄位一樣保證每一個答案都正確。',
 '現成分析能力能減少自行訓練模型的工作，但必須檢查功能是否適用、準確度是否足夠，以及錯判後的處理方式。若涉及個人或敏感影像，也要先處理合法使用與資料保護。',
 [['決定要辨識什麼','先選對支援功能：找物件、分析影片與讀取文件表單不是同一問題。不同功能接受的輸入、輸出與限制需要個別核對。'],['送入支援的影像或影片','依功能提供檔案或支援的S3位置，配置讀取權限。圖片品質、角度、解析度與內容差異都可能影響結果。'],['把模型結果變成業務規則','設定適合的信心門檻，讓不確定內容進入人工複核或其他流程。不要把一次辨識結果直接當成不可質疑的事實。']],
 '電商想替商品照片提出可能的分類標籤。',['以代表性的商品照片測試物件標籤功能，觀察容易混淆的類別。','只把高信心且業務認可的標籤納入建議，不確定的讓人檢查。','持續評估新圖片與不同拍攝方式，調整流程而不是假設模型永遠準確。'],'Rekognition可提供判斷線索，應用仍要為錯判和不確定性設計。','Textract','Textract偏向從文件擷取文字、表格與表單結構；辨認照片裡的物件與讀懂發票欄位不是同一任務。',['s3','object','api'],'影像分析回傳一個標籤，能直接視為百分之百正確嗎？','不能。要考慮信心值、輸入品質、業務風險與必要的人工複核。');
 add('textract','發票或申請表可能是一張掃描圖片，程式看見的是像素，不是已整理好的姓名、日期和金額欄位。人工把每張文件重新輸入會耗時也容易出錯。',
 'Textract從支援的文件影像中擷取文字及特定結構資訊，例如表格與表單關係。OCR可理解成把圖片上的字辨認成可處理文字；結構擷取再進一步表達欄位或表格之間的關係。',
 '它可以減少文件輸入工作，但不是自動理解所有商業規則的會計人員。印章遮擋、模糊影像和不同版型可能影響結果，應依欄位重要性做驗證。',
 [['先辨認文件任務','只需要文字，還是需要表格或欄位配對？不同API與功能有不同輸出，需核對支援的文件形式與語言等限制。'],['選擇適當處理流程','依頁數、格式及功能選用支援的同步或非同步方式。大量文件可保存到S3並以工作流程追蹤完成狀態，不必讓使用者一直等待同一個請求。'],['驗證擷取後的欄位','將辨識結果轉為業務資料前，檢查金額、日期、必填欄位與信心等資訊。重要或不確定資料應送人工複核，保留來源以便追查。']],
 '公司每天收到許多掃描發票，想自動帶出日期與金額。',['用代表性文件測試合適功能，確認能取得需要的文字與結構。','把擷取結果映射為日期和金額欄位，再做格式與合理性檢查。','低信心或總額對不起來的文件交人員處理，不直接進付款流程。'],'文件辨識是輸入流程的一部分，不能省略後續驗證及責任判斷。','Comprehend','Textract把文件影像轉成文字或結構；Comprehend分析已經取得的文字含意。從圖片讀字與分析文字是兩個階段。',['s3','async','comprehend'],'Textract擷取出金額後，能完全不檢查就直接付款嗎？','不應如此。辨識可能出錯，還需要格式、金額與業務流程驗證，必要時人工複核。');
 add('comprehend','客服留言已經是文字，但程式仍不知道是在抱怨、詢問商品，還是提到某個地點。你需要的是分析文字中的資訊，而不是再把文字存一份。',
 'Comprehend提供支援的自然語言分析能力。自然語言是人平常說寫的語句；服務可依功能找出實體、關鍵詞或情緒等特徵。輸出是模型分析，不是保證了解說話者真正意圖的讀心術。',
 '它可以協助大量留言分類與整理，減少逐則人工閱讀。但語言、諷刺、上下文和專業詞都可能造成誤判，因此應依業務風險設計門檻與複核。',
 [['先取得可分析的文字','輸入若是語音，要先轉文字；若是掃描文件，可能要先做文字擷取。這些輸入轉換工具和文字分析服務有不同分工。'],['選擇支援的分析功能','識別人名地名、找關鍵詞及判斷情緒，回答的是不同問題。核對語言與功能支援，不要把一個分析結果當成所有任務的答案。'],['把結果作為流程線索','可以將可能負面留言送給客服優先查看，但仍保留原文和人工判斷。定期抽樣檢查錯誤，尤其不能只看一個情緒標籤就做高影響決策。']],
 '客服想從數千則商品評論中整理最常被抱怨的問題。',['先清理與合法取得評論文字，確認語言與分析功能相容。','用適合的文字分析取得關鍵詞與情緒等資訊，再按商品和問題聚合。','人工抽查代表性評論，確認結果不是被反諷、引用或特殊詞誤導。'],'Comprehend幫助整理線索，最後的業務解讀仍需看上下文。','Translate','Translate改變文字的語言；Comprehend分析文字特徵。翻譯成功不等於已完成情緒或實體分析。',['request','translate','transcribe'],'一則留言被標示負面，是否能直接當成客人一定要退款？','不能。情緒分析不是完整意圖或政策判斷，仍需讀原文與客服處理流程。');
 add('transcribe','電話錄音裡有重要內容，但人必須逐段播放才能查找。若先轉成文字，便較容易搜尋、整理或交給其他文字分析流程。',
 'Transcribe把音訊中的語音辨認為文字。它處理的是「說了哪些字」，不是自動把內容翻譯成另一語言，也不是保證每位說話者和每個專有名詞都辨認正確。',
 '它可降低大量錄音轉寫的人工負擔，但背景噪音、口音、多人重疊說話及特殊詞彙會影響品質。敏感錄音還需要適當同意、權限、保存期限與資料處理規範。',
 [['確認語言與音訊格式','選用支援的語言、輸入格式及合適模式。錄音檔批次處理和即時串流的要求不同，應依實際輸入來源核對。'],['處理並保留關聯資訊','讓轉寫結果能對應原始錄音和時間位置，方便回頭核對。依支援功能評估說話者或通道資訊，但不要假定任何錄音都能完美分離所有人。'],['驗證重要內容再往下用','客服摘要或搜尋可容忍某些錯字，法律、醫療或付款相關資訊可能需要更嚴格複核。模型轉寫結果應依用途決定驗證程度。']],
 '客服中心要讓主管搜尋曾提到退貨問題的錄音。',['將合法保存的錄音交給支援的轉寫流程，並保留錄音識別碼。','用轉寫文字建立搜尋或分類，找到候選錄音後提供對應時間位置。','針對關鍵爭議內容回聽原音確認，不把可能錯字當成確定證據。'],'語音轉文字讓內容更容易使用，但不是原始語音的無誤替代品。','Polly','Transcribe把聲音轉文字；Polly把文字讀成聲音，方向相反。Translate則負責改變文字語言。',['storage','async','polly'],'要把英文錄音變成中文文字，只用Transcribe就一定完成嗎？','不一定。轉寫先取得原語言文字，跨語言通常還需要相應翻譯流程與支援確認。');
 add('translate','網站已有中文商品介紹，卻需要讓不同語言的客人理解。人工翻譯大量更新內容很費時，因此想先得到機器翻譯，再按內容重要性安排審查。',
 'Translate把支援語言的文字轉成另一語言。它處理輸入文字，而不是直接替所有音訊、掃描文件或網站程式碼完成完整的在地化。語氣、術語與上下文仍會影響翻譯品質。',
 '大量一般內容可以透過翻譯服務提高產出速度，但法律條款、付款說明與品牌文案可能需要人工確認。不同語言的日期、貨幣、版面及文化表達，也不會只靠翻譯文字自動解決。',
 [['先取得正確的來源文字','若內容來自圖片或聲音，需要先擷取或轉寫。來源本身若有錯字或缺漏，翻譯結果也可能跟著失準。'],['核對語言與術語要求','選用支援的來源和目的語言，依功能評估自訂術語等能力。公司產品名稱和專業用語應有一致標準，而不是每次接受不同翻法。'],['依風險安排驗證','先用代表性內容測試，對高影響文字安排熟悉語言的人審查。留意編碼、長度及版面，避免翻譯後按鈕或頁面被文字撐壞。']],
 '電商要把經常更新的商品描述提供給日文使用者。',['取得乾淨的原始描述，將不能翻譯的產品代碼與名稱作適當處理。','使用支援語言進行翻譯，檢查術語和數量單位是否符合產品內容。','人工複核重要商品與安全說明，再測試實際頁面版型及字元顯示。'],'翻譯是多語系體驗的一部分，不等於完整在地化或零錯誤保證。','Transcribe','Transcribe辨認聲音中的文字；Translate在文字已存在後改變語言。若從音訊開始，兩個階段可能需要串接。',['transcribe','textract','api'],'中文翻成日文後，貨幣、日期格式與頁面版型都會自動正確嗎？','不會自然保證。這些屬於在地化與應用呈現，需要另外處理與測試。');
 add('polly','有些使用者需要用聽的接收文字資訊，例如語音提示、閱讀輔助或電話通知。自行錄製每一段會變動的內容，成本與更新速度都不理想。',
 'Polly把文字轉成支援的語音輸出。輸入是一段要朗讀的文字，輸出可以是應用播放的聲音。它不是在聽使用者說話，也不會自動替你完成對話理解與業務決策。',
 '對經常變動的訊息，文字轉語音能減少重新錄音的工作。仍要選合適語言、聲音與發音方式，並考慮使用者是否需要重播、文字替代或其他無障礙操作。',
 [['先準備適合朗讀的內容','網頁文字可能含縮寫、符號和網址，直接照念不一定好懂。應先把訊息整理成自然且不洩漏機密的口語內容。'],['選擇支援的聲音與設定','核對語言、聲音引擎及輸出格式等支援條件。數字、名稱與專有詞可能需要透過支援的標記或詞彙設定改善發音。'],['把聲音整合進應用','應用仍要負責播放、暫停、重播與錯誤處理。對可重用內容可評估適當保存及快取，同時遵守費用與使用條件。']],
 '物流App想把最新配送狀態唸給需要閱讀輔助的使用者。',['將配送狀態整理成短而清楚的句子，不把整份含個資的內部紀錄直接朗讀。','使用合適語言與聲音產生音訊，抽查地址代碼等容易唸錯的內容。','提供播放控制及相同意思的文字，讓不方便聽聲音的人也能理解。'],'Polly產生語音輸出，應用仍需設計實際可用的收聽體驗。','Transcribe','Polly是文字到語音；Transcribe是語音到文字。若要做對話，還需要理解輸入和決定回應內容的流程。',['response','storage','transcribe'],'Polly會自動聽懂客人問題並決定退款答案嗎？','不會。它主要把已準備的文字轉為語音，對話理解與退款規則需要其他設計。');
 add('sagemaker','有些問題沒有現成辨識API能直接解決，例如依公司的歷史資料預測特定商品需求。這時可能需要自行建立、訓練、評估及提供機器學習模型。',
 '模型可理解成從資料學得某種輸入與輸出關係的計算方法。SageMaker相關能力協助處理建立、訓練、部署及管理模型的工作；產品和模式不同，具體功能與費用也不同。它不是把資料丟進去就自然得到可靠答案的按鈕。',
 '平台可以減少自行整合運算與模型生命週期工具的負擔，但團隊仍需有合適資料、問題定義和評估方式。若現成的Textract或Rekognition已符合需求，從零訓練不一定是最省工作的方法。',
 [['先定義要預測的事情','清楚說出輸入是什麼、輸出要幫助哪個決策，以及錯誤代價。沒有明確目標，就很難知道模型到底有沒有變好。'],['用資料訓練並獨立評估','訓練資料讓模型學習，評估資料用來檢查它面對未見內容的表現。不能只用已看過的資料得分高，就認定真實世界也會準確。'],['選擇部署與監測方式','依需求決定批次預測或需要即時回應的服務方式，控制運算費用。上線後仍要觀察資料分布與結果品質，必要時重訓或改用其他方案。']],
 '零售商希望根據自己的歷史銷售與活動資料預測補貨量。',['先定義預測期間、可用資料及缺貨或過量的業務代價。','準備代表性訓練資料，以獨立期間資料評估，避免把未來資訊誤放進訓練。','選擇合適的批次預測流程，持續和實際需求比較，不直接把模型輸出視為必然正確。'],'平台提供工具，可靠的機器學習仍需要資料、評估與業務驗證。','現成AI服務','現成服務針對特定任務提供API；自行建模更有彈性，但通常需要更多資料與專業工作，應先比較需求匹配度。',['compute','storage','rekognition'],'模型在訓練資料上表現很好，就能保證正式預測準確嗎？','不能。必須用適當的獨立資料評估，並在上線後持續觀察真實表現。');
 add('pitr','資料庫昨天仍正常，今天上午有人誤刪重要資料。如果只能還原昨晚備份，今天早上的合法訂單也可能一起不見；你想回到錯刪之前的一個時間點。',
 '時間點還原利用服務支援的備份和變更紀錄，重建指定時間附近的資料狀態。它受到可還原時間窗口、備份設定與服務功能限制，不是任意回到資料庫從建立以來的每一秒。',
 '它能降低只靠定期完整備份時的資料落差，但實際還原仍需要時間，也可能建立新的資料庫資源。復原後應用如何改連線、如何處理之後新增的資料，也必須有程序。',
 [['先確保復原資料有被保存','確認自動備份、保留期與相關服務功能已啟用。等到資料被刪才想到要開啟，通常無法補回過去沒有保存的歷史。'],['找出合理的還原時間','先調查錯誤發生時間，再選擇錯誤之前的狀態。選得太早會少掉更多合法變更，太晚則可能已包含錯誤。'],['驗證新環境再恢復流量','依服務流程還原後，檢查資料和應用功能。若原系統仍繼續接受寫入，需要另外處理新舊資料與切換，不能直接讓兩邊同時任意寫。']],
 '上午十點誤刪訂單，但十點零五分才發現。',['先停止會繼續擴大影響的操作，保留調查所需時間與紀錄。','在可還原窗口內選擇誤刪前的時間，建立還原資料庫並檢查訂單。','依計畫處理誤刪後的合法交易，再切換應用與驗證服務，避免再次寫入錯誤狀態。'],'時間點還原提供回到較早狀態的能力，並不省略資料驗證與業務切換。','Multi-AZ備援','備援側通常也會接收到合法發出的刪除；它協助故障接手，不自然提供誤刪前歷史狀態。',['backup','rds','multi-az'],'已經有Multi-AZ，為什麼還要時間點還原？','因為誤刪或錯誤修改可能被複寫到備援，歷史還原與高可用接手解決不同問題。');
 add('warm-standby','公司擔心整個主要Region不能使用，又希望復原時不必從零建立全部系統。但平常在另一區域維持完整尖峰容量，成本可能太高。',
 'Warm standby是在復原位置維持一套縮小但完整運作的環境。它已能處理一定程度流量，災難時再增加容量。真正是否符合復原目標，要看資料、程式、依賴和切換流程的整體測試。',
 '這種策略在常駐成本與復原速度之間折衷，比純備份通常準備更完整，但仍需付出運算與資料複寫等費用。縮小系統不是一定能瞬間放大，配額、啟動與資料升級也會耗時。',
 [['維持可以工作的完整環境','復原區不只保留資料，還要有應用、網路、機密與其他必要元件。若還要部署缺少的核心部分，便不能只靠名稱認定是完整待命。'],['持續處理資料與版本一致','資料複寫可能有延遲，應用版本和設定也可能漂移。每次正常發版都要考慮備援環境，否則災難時才發現版本不相容。'],['演練擴容與流量切換','確認資料能成為可用狀態、容量能擴大、入口會改導向，並避免舊主站恢復後形成不受控雙寫。也要制定回切程序。']],
 '正式系統在主要Region運作，另一Region平常只維持較小的完整服務。',['定期向小型待命環境發送測試流量，證明它不是只存在於架構圖。','模擬主要區域失效，量測資料提升、擴容與路由切換所需時間。','用復原後實際可查到的資料和交易能力，驗證RTO與RPO是否達標。'],'Warm standby的價值要以演練結果證明，不能由策略名稱直接保證復原時間。','Pilot light','Pilot light通常保留核心元件與資料，接流量前還需啟動或部署其他部分；Warm standby已有縮小的完整運作環境。',['rto','rpo','replication'],'另一區域只有資料副本，應用主機還沒建立，能直接稱為Warm standby嗎？','不能只看有副本就這樣稱呼；要確認整套環境已能以縮小容量實際運作。');
 add('pilot-light','你希望災難時比單純找備份重建更快，但平常又不想讓另一套完整應用一直付費運作。可以先保存啟動復原所需的核心部分。',
 'Pilot light像保留能點燃整套系統的火種：核心資料與必要元件已準備或持續複寫，其他部分在復原時啟動或部署。它不等於平常就能立即接收完整正式流量。',
 '它通常比完整待命節省常駐資源，但災難發生時還有更多步驟需要完成。環境範本、機密、映像、配額與復原權限若沒準備好，資料已經在也可能無法恢復應用。',
 [['列出必須持續存在的核心','常見核心是資料複寫及復原必要的部分基礎資源。哪些元件需要常開，要依業務與服務能力設計，而不是套用一張通用圖。'],['把其餘建立流程自動化','保存可重現環境定義與相容應用版本，確認備援區有權限和容量。只留下人工操作筆記，往往無法穩定達成短復原目標。'],['量測從火種到完整服務','演練啟動、部署、資料提升、驗證與入口切換。總時間要包括等待和失敗重試，也要確認資料落差是否可接受。']],
 '公司選擇在復原Region持續同步資料，但平常不開全部應用主機。',['先確認資料與必要設定可以在復原區取得，並測試解密與讀取權限。','災難演練時用範本建立缺少的運算與依賴，讓應用連到可寫資料層。','驗證訂單查詢和寫入後才切換流量，再記錄實際時間與遺失資料範圍。'],'較低常駐成本會換來復原時更多工作，必須以自動化與演練控制風險。','Backup and restore','純備份策略主要在事故後還原並重建；Pilot light已持續保留部分核心能力，但仍不是完整運作的Warm standby。',['backup','rto','iac'],'採用Pilot light後，事故時還需要做什麼？','通常還要啟動或部署缺少元件、處理資料可用狀態、驗證應用並切換流量。');
 add('async','你上傳一段長影片後，若網頁必須一直等到轉檔完成才收到任何回應，可能等太久或連線中斷。其實系統可以先告訴你已收件，之後再通知結果。',
 '非同步把「接受工作」與「完成工作」分成不同時間。呼叫者先取得已接受或工作識別碼，不必一直卡在同一次呼叫等待全部執行完成。這是互動方式，不表示工作會自動更快。',
 '它適合耗時工作、削峰與鬆耦合流程，但需要追蹤狀態、處理重試及失敗。收到已接受，不能在業務上宣稱付款、出貨或資料處理一定已經成功。',
 [['先清楚定義接受的意思','服務確認輸入有效並保存待辦工作後，可以回覆已接受。回覆內容應讓呼叫者知道工作尚未完成，以及如何取得後續狀態。'],['用持久機制保存待辦','佇列或其他支援機制可避免請求離開後工作消失。執行者稍後取出處理，依容量限制下游，並安排重試與失敗紀錄。'],['讓結果可查且可重試','客戶端可查詢狀態或接收通知。重送與重複投遞可能發生，因此具有副作用的工作需要冪等與一致性設計。']],
 '使用者提交報表產生工作，產生時間可能要數分鐘。',['API先驗證參數並保存工作，回傳工作編號及已接受狀態。','背景工作者產生檔案，成功後更新狀態與下載位置，失敗則留下可理解原因。','使用者用工作編號查詢，介面分清排隊、處理中、成功與失敗。'],'非同步改善等待方式與系統解耦，但不會自然取消失敗、重複和狀態管理問題。','同步','同步通常等待這次工作回傳結果；非同步先接受再處理。是否使用多執行緒或哪種程式語言，並不是這個區分的唯一依據。',['request','response','sqs'],'API回覆已接受，是否就能顯示報表已經完成？','不能。應顯示工作狀態，等後端確認成功後才提供完成結果。');
 add('sync','有些動作需要立刻知道結果才能往下做，例如查商品價格後才能顯示結帳金額。呼叫者會等待被叫用的服務回應，而不是先拿一個工作編號離開。',
 '同步呼叫是在這次互動裡等待結果的模式。等待期間，對方可能成功、回錯誤，也可能超時。它描述的是呼叫者與工作結果的等待關係，不代表資料已在所有地方同步一致。',
 '立即需要結果的查詢常適合同步方式，但每增加一個同步依賴，就多一段可能延遲或失敗的路徑。需要設定超時、限制重試，並避免下游變慢時把全部資源卡住。',
 [['確認這一步真的需要立即結果','如果只需先收件，或工作時間很長，可以評估非同步。不要為了程式看起來直線好懂，就讓使用者等待數分鐘的背景工作。'],['給等待一個上限','網路或下游可能故障，應有合理超時與錯誤回應。呼叫者超時不代表下游一定停止執行，所以重試帶有副作用的操作要特別注意。'],['分開理解資料同步的用法','資料庫同步複寫通常涉及等待副本確認，是另一個具體機制。不能因為API是同步呼叫，就推論所有副本已是最新狀態。']],
 '結帳頁需要從價格服務取得最新金額後，再讓使用者確認。',['以同步請求取得價格，設定可接受的等待時間。','服務成功回應才顯示可確認金額；超時時提供可重試的狀態，不假裝價格已確認。','若後續付款可能被重送，使用適當交易識別與冪等，避免網路超時後重複扣款。'],'同步讓你在一次呼叫中等待結果，仍需面對超時和依賴故障。','同步資料複寫','API等待結果和資料副本等待確認是不同層面的同步；題目必須先看清楚正在談哪一種。',['request','response','idempotency'],'呼叫付款API超時，是否能肯定付款沒有發生？','不能。下游可能已完成但回應沒送回，應依交易識別查狀態並設計安全重試。');
 add('well-architected','同樣能顯示網頁的兩套系統，可能在故障、安全、費用和管理上差很多。你需要一組可以反覆詢問的問題，而不是只憑服務數量或架構圖漂亮程度評價設計。',
 'Well-Architected是一套檢視雲端架構的框架。六個支柱分別關心營運、安全、可靠、效能、成本與永續性，協助團隊看見需求、風險和取捨，而不是提供一張所有公司都能直接照抄的完美架構。',
 '它讓不同角色用共同語言討論設計。例如增加備援可能提高費用，減少浪費則不應犧牲必要可用性；必須先知道業務要求，才能判斷哪些改善值得做。',
 [['把業務要求變成可檢查問題','網站可停多久、資料可遺失多少、誰能看什麼、如何發現故障，都比「我們用了很多服務」更能評估設計。'],['從六個角度檢查','可靠性看故障與復原，效能看資源是否適配工作，成本看不必要支出等。支柱彼此相關，同一個設計變更可能同時影響數個面向。'],['形成有優先順序的改善','先處理高影響且明確的風險，再安排其他工作。每次變更後用測試、監控和成本資料驗證，不是填完問卷就代表永久合格。']],
 '電商能正常下單，但資料庫只在一個故障位置，備份也從未測試還原。',['先定義能接受的停機與資料損失，再找出目前單點和未驗證的復原風險。','比較多AZ、備份與演練等改善如何影響費用和維運。','依風險順序實作並驗證，保留後續檢查，而不是一次性取得某張架構圖就結案。'],'好的架構是在明確需求下持續改善，不是服務越多越好。','產品清單','框架是檢查設計品質的問題與原則；產品清單只列工具名稱。知道工具仍要理解為何使用。',['availability','rto','budgets'],'採用了所有常見AWS服務，就自然符合Well-Architected嗎？','不會。要看這些服務如何滿足業務要求，以及故障、安全、效能與成本是否經過驗證。');
 add('response','你按下查詢訂單，手機把問題送出去；幾秒後看見訂單內容或錯誤訊息。後面送回來的這一段結果，就是請求與回應互動中的另一半。',
 '回應可以包含狀態、資料和錯誤資訊。以HTTP為例，狀態碼告訴用戶端這次處理的大致結果，內容則可能是網頁、圖片或結構化資料。網路層收到回應和業務真的完成，也需要依API契約分開判斷。',
 '用戶端需要看懂結果才能決定顯示成功、要求補資料或重試。若所有情況都只回一個模糊的成功訊息，客人與維護人員都很難知道工作到底完成到哪裡。',
 [['把狀態與內容分開讀','狀態描述處理結果的類型，內容提供細節。例如查無訂單與伺服器錯誤，不應被應用當成完全相同的情況。'],['遵守已定義的業務契約','某些回應只代表已接受背景工作，而不是所有工作完成。用戶端和服務端需要對成功、處理中及失敗有一致理解。'],['處理回應沒有抵達的情況','網路可能讓請求已執行卻收不到結果。用戶端不能只因超時就確定沒有發生，尤其付款等操作要有查詢狀態與安全重試方式。']],
 '使用者送出訂單後，網站要告知訂單是否成立。',['服務先驗證輸入、保存必要訂單資料，再依契約回傳結果與訂單識別碼。','用戶端依狀態顯示成功或可理解的錯誤，不把所有非空文字都當成成功。','若連線中斷，利用先前交易識別查詢狀態，避免盲目建立重複訂單。'],'回應不只是把畫面送回去，它也是雙方對工作狀態的約定。','請求','請求提出要做的事；回應交代這次處理的結果。它們方向相反，但都要考慮格式、權限和錯誤。',['request','http','idempotency'],'沒有收到回應，就表示伺服器完全沒執行嗎？','不一定。可能已執行但回傳途中斷線，所以具有副作用的操作需要查詢與冪等策略。');
 add('compute','程式檔案放在硬碟上時不會自己工作。要計算價格、產生圖片或執行網站邏輯，需要有人提供處理指令與暫時放工作資料的能力。',
 '運算通常涉及處理器執行指令、記憶體保留執行中的資料，以及相關資源。雲端可以用虛擬主機、容器或函式等方式提供運算，這些方式讓你管理的層次不同，不是完全相同的產品。',
 '把程式保存和把程式執行分開，才能理解為什麼把檔案放進S3不會自動變成一台網站後端。選運算方式時，要看工作執行多久、何時啟動、需要多少控制權與如何計費。',
 [['先說明程式做哪種工作','處理即時請求、執行批次報表和長期運作的遊戲服務，對啟動時間、持續時間與容量的要求不同，不能只用同一種主機套全部問題。'],['選擇管理的抽象層','EC2較像租可控制的電腦；容器封裝程式並由平台安排執行；Lambda依事件執行函式。每種方式減少的管理工作與限制都不同。'],['把暫存與持久資料分開','記憶體與某些本機暫存資料可能隨程式停止或主機離開而消失。需要長期保存的訂單或檔案，要放到適合的持久儲存位置。']],
 '你要在圖片上加浮水印，原始圖片已存在S3。',['先選能執行圖片處理程式的運算方式，例如符合限制的Lambda或容器工作。','程式讀取原圖，在運算資源中處理，並將結果保存回持久儲存。','處理結束後釋放不需要的運算；不能只依賴處理時記憶體中的結果。'],'運算是讓程式做事，儲存是讓資料留下，兩者常合作但不是同一工作。','資料儲存','S3等儲存服務保存資料；EC2或Lambda等運算服務執行程式。知道檔案在哪裡，還要知道誰會處理它。',['ec2','lambda','storage'],'把Python程式上傳S3，它會自動開始處理所有圖片嗎？','不會。需要合適的運算服務、觸發方式與讀寫權限來執行該程式。');
 add('storage','程式可以重新啟動，但昨天已付款的訂單、使用者上傳照片和公司文件不能跟著消失。資料需要保存在程式停止後仍可取得的位置。',
 '資料儲存包含不同存取方式。物件儲存把資料當成帶名稱的完整物件；區塊儲存像主機可使用的磁碟；檔案儲存提供資料夾和共享檔案語意。選擇取決於應用怎麼讀寫，而不是只看哪個容量單價最低。',
 '適合的儲存能滿足存取速度、共享方式、資料保護與保留需求。持久保存也不等於永遠不會誤刪，因此還要考慮版本、備份、權限和還原測試。',
 [['先辨認資料使用方式','照片常以整個檔案上傳和下載，主機資料庫可能需要磁碟讀寫，多台Linux主機則可能要共享檔案。這些需求對應的介面不同。'],['看清楚資料生命週期','需要保存多久、多久讀一次、可否等待取回，都會影響服務與級別選擇。封存便宜不代表能立刻讀到資料。'],['同時設計保護與清理','限制誰能讀寫，安排適當加密、版本或備份，也設定不再需要的資料如何刪除。否則既可能遺失重要資料，也可能為多餘副本持續付費。']],
 '訂餐網站有商品照片、資料庫檔案和多台主機共用的上傳資料。',['分別列出整個物件、主機磁碟與共享檔案需求，不先把全部塞進同一服務。','比較S3、EBS、EFS等方式的介面、故障範圍與應用相容性。','為每種資料設定權限與還原方式，再測試程式停止或資源故障後仍可取得必要資料。'],'好的儲存選型從資料存取方式開始，並包含長期保護與成本管理。','記憶體與暫存','程式執行中的記憶體或可丟棄暫存，不適合當重要資料的唯一副本；需要持久性時必須另選合適服務。',['s3','ebs','efs'],'只要資料放在某台正在執行的程式記憶體裡，就算持久保存嗎？','不算。程式停止或主機故障可能讓它消失，重要資料需要適當持久儲存與保護。');
 add('trust-policy','公司可以設一個「報表閱讀員」職務，但還需要決定誰有資格擔任它。職務能做什麼，和誰能取得該職務，是兩個不同問題。',
 'IAM角色可讓受信任的身分暫時取得一組權限。信任政策寫在角色上，描述允許哪些主體透過適當方式取得角色。主體可能是AWS服務、另一個帳號中的角色或其他支援身分；不是任何知道角色名稱的人都能取得。',
 '把信任和操作權限分開，才能避免角色雖然權限不大，卻被不該使用的人取得，或只設定誰能使用卻忘記真正授權讀資料。跨帳號設計尤其要檢查兩邊的授權與條件。',
 [['找出誰要取得角色','先確認是EC2服務上的應用、人員，還是另一帳號的部署角色。不同使用方式的信任主體與動作不同，不能直接複製另一情境的政策。'],['限制取得角色的條件','信任政策可依支援條件縮小來源與情境。應避免為方便而信任過大的範圍，並理解政策中的Principal實際指向誰。'],['另外配置角色操作權限','取得角色後能否讀S3、解密或修改資源，要看角色相關權限與其他適用政策。成功取得暫時憑證不代表所有操作都被允許。']],
 'EC2上的程式要讀指定S3報表，但不應讓其他不相關身分使用相同角色。',['角色信任EC2服務，並透過合適instance profile方式提供給主機。','給角色只讀指定報表資源的操作權限，另外確認必要加密授權。','測試EC2程式可取得角色並讀報表，也檢查不受信任來源不能任意取得該角色。'],'信任政策是角色的入口規則，權限政策是進入後可以做的工作清單。','權限政策','權限政策回答可以對哪些資源執行哪些動作；信任政策回答誰能取得角色。兩份都叫政策，目的卻不同。',['iam-role','principal','assume-role'],'角色信任EC2後，EC2就自動擁有所有S3權限嗎？','不會。信任只允許取得角色，還需要角色操作權限及其他適用政策允許存取資料。');
 add('policy-action','要替一個報表程式開放權限，不能只說它可以使用S3。讀取物件、上傳物件、列出清單和刪除資料，是不同動作，風險也不同。',
 'Action是IAM政策內描述操作種類的欄位。AWS服務把可授權的操作命名，例如s3:GetObject代表取得物件。名稱通常有服務前綴與動作名；寫了這個欄位仍不代表請求一定成功，還要和資源及其他政策一起評估。',
 '把動作列清楚，才能依最小權限只開程式需要的能力。如果用大量萬用字元開放所有動作，一段只應讀資料的程式可能也能修改或刪除重要內容。',
 [['先把工作翻成操作','程式要讀一張圖片、查看清單還是建立儲存桶？先列實際工作，再查服務對應操作，不要由產品名稱猜一個看起來接近的字。'],['核對動作支援的資源類型','不同動作可能作用在儲存桶、物件或其他資源上，支援條件也不同。操作和Resource搭配不正確，政策看起來有Allow仍可能無效。'],['用正反測試驗證範圍','測試需要的操作成功，不需要的刪除或管理操作失敗。遇到拒絕時查原因，不是直接把Action改成星號解決所有問題。']],
 '網站程式只需要讀取商品圖片。',['找出讀取圖片物件所需的GetObject等實際操作，不先給全部S3管理權限。','將操作限制到商品圖片的物件資源，依需要另外處理清單或金鑰權限。','測試讀圖成功，同時確認不能刪圖或讀取其他業務資料。'],'精確的Action讓程式能做工作，又限制誤操作與被入侵後的影響範圍。','Resource','Action是做什麼；Resource是對哪個對象做。只寫一邊，不能完整表達一條授權規則。',['policy','policy-resource','least-privilege'],'只讀圖片的程式是否應直接使用s3:*避免麻煩？','不應。先確認真正需要的操作，用最小範圍授權並測試，避免不必要的刪除或管理能力。');
 add('policy-resource','兩個程式都可能需要讀檔案，但一個只能讀商品圖片，另一個才能讀財務報表。光知道都能讀，還不足以描述真正需要的權限。',
 'Resource欄位指出政策動作適用的資源範圍，常用ARN描述。ARN可理解成AWS用來明確識別資源的一種名稱格式；但不是把任何ARN填進去，所有動作都會自動在該資源上有意義。',
 '資源範圍限制程式能影響哪些資料。若程式只有很少動作，但Resource是所有資源，仍可能跨到不應接觸的儲存桶或資料。最小權限要同時限制操作和對象。',
 [['先分清資源層級','以S3為例，儲存桶與桶內物件是不同層級。列出桶清單與取得物件可能需要不同資源寫法，不能只沿用同一個名稱。'],['核對動作是否支援細分','有些操作可限制特定資源，有些需要較廣範圍或搭配條件。應查看該服務的授權文件，而不是以為所有操作都能用相同方式縮小。'],['小心萬用字元與前綴','使用prefix或星號時，要確認實際包含哪些資源，避免把相似名稱的敏感資料也納入。新增資源時也應重新檢查原規則是否過廣。']],
 '報表程式只應讀某個bucket的reports/資料。',['找出GetObject所需的物件資源格式，限制到指定bucket及reports/前綴。','若程式真的需要列清單，再依支援方式限制相應桶操作與前綴條件。','測試reports內成功、其他路徑與其他bucket被拒絕，避免只測成功案例。'],'Resource讓權限對準實際對象，不能和Action或Condition分開猜測。','檔案路徑','ARN不是任意作業系統檔案路徑；雖然部分資源名稱看起來像資料夾，仍需依AWS服務的資源語意判斷。',['arn','policy-action','s3'],'GetObject可以讀物件，就表示只要給bucket名稱一定能用嗎？','不一定。要使用與操作相符的物件資源範圍，並檢查其他適用政策與條件。');
 add('policy-effect','寫一條權限規則時，除了誰要做什麼、作用在哪裡，還必須表達這條規則是在允許還是禁止。這就是Effect的工作。',
 'IAM政策的Effect常見為Allow或Deny。Allow表示這條規則提供允許，Deny表示這條規則明確拒絕。AWS還會評估其他適用政策與限制，所以一條Allow並不是最後通行保證；適用的明確拒絕會優先。',
 '理解Effect可以避免常見錯誤：遇到AccessDenied就一直新增Allow。若真正原因是明確拒絕，新增更多允許不會把禁止蓋掉，也可能額外擴大其他不相關權限。',
 [['分清沒有允許與明確禁止','預設沒有得到允許，和某條規則明確寫Deny，不是相同來源。排查要先知道缺少允許，還是碰到禁止條件。'],['把規則套在實際請求','同一份政策可能包含多個statement，只有符合動作、資源及條件的規則才會影響該請求。不能只看到文件裡有Allow這個字就判斷成功。'],['沿著所有適用限制檢查','身分、資源政策和組織限制等可能共同影響。先確認實際身分與請求，再查明確拒絕、允許與權限上限，避免盲目給管理員。']],
 '角色允許刪除S3物件，但bucket政策對該情境明確Deny。',['確認請求確實由這個角色發出，動作與物件範圍都吻合。','讀取bucket政策的拒絕條件，判斷這次請求為何命中。','依業務需要修正合法路徑或過度限制，而不是用另一條Allow期待覆蓋Deny。'],'Effect不是政策建立時間的競賽；最近新增的Allow不會自然打敗既有明確Deny。','優先順序編號','IAM不是像某些網路規則依編號先後接受第一條。必須按IAM政策評估邏輯理解允許與拒絕。',['policy','policy-action','policy-condition'],'新增一條Allow，就一定能覆蓋另一條適用的Deny嗎？','不能。適用的明確拒絕會優先，必須理解拒絕來源與條件後再修正設計。');
 add('policy-condition','你可能希望同一個角色只有在使用安全連線、經過指定私有入口或符合其他情況時，才可以讀資料。只限制角色名稱和物件範圍仍不夠。',
 'Condition讓IAM政策規則依請求情境決定是否適用。條件會比較某個支援的條件鍵和值，例如來源端點或是否使用安全傳輸。它不是程式任意自訂一句中文判斷，而是服務支援的規則語法。',
 '條件能讓權限更貼近安全需求，但如果不知道條件鍵何時出現在請求中，可能誤擋合法服務或留下例外漏洞。必須理解操作情境與缺少條件鍵時的行為。',
 [['先描述想限制的情境','例如資料只能經指定VPC endpoint讀取，而不是只說要更安全。需求明確才能挑選對應條件與服務能力。'],['確認鍵與比較方式受支援','不同服務、動作及來源不一定提供相同情境資訊。布林、字串及其他條件運算子也有差異，不應只照抄另一份政策。'],['測試管理與服務存取路徑','限制來源可能連自己管理或AWS服務存取都一起擋住。先在測試資源驗證允許與拒絕，並保留必要且受控的維運路徑。']],
 '公司想限制某個S3 bucket，只讓指定私有端點的應用讀取。',['確認實際請求會經過該endpoint，並查清適用的來源端點條件鍵。','在測試政策內套用限制，測試指定路徑與其他路徑。','另外檢查管理、備份或CloudFront等所需服務是否仍有合法存取方式，避免鎖死。'],'條件是精細化限制，不是可以不理解資料流就任意加上的保護符號。','Security Group','安全群組控制網路連線；IAM Condition影響授權規則是否適用。能連到服務不代表已獲授權，兩者互補。',['policy','endpoint','sg'],'把限制SourceVpce的政策貼上後，是否不必再測試管理存取？','仍要測試。不同存取路徑的請求情境可能不同，錯誤條件可能阻擋必要管理或服務。');
 add('writer','一個資料庫叢集可能有多個節點，但應用需要知道往哪裡新增訂單或修改付款狀態。不是每個節點都一定能接受相同的寫入操作。',
 'Writer表示接受寫入的主要節點或其對應端點角色。以Aurora等設計為例，應用可透過支援的writer端點找到目前主要寫入位置。端點是連線名稱，和背後某台永遠不會變動的機器不是同一件事。',
 '把寫入與讀取用途分清楚，有助於讓資料更新到正確位置，也能讓可分攤的讀取交給其他節點。故障切換時，應用仍需能重新連線與處理暫時錯誤。',

 '訂單程式更新付款狀態，報表程式同時查詢歷史訂單。',['把需要寫入的交易送往正確writer路徑，確認最小資料庫權限。','將可接受讀取語意的報表導向合適reader，避免不必要地增加writer負載。','測試主要節點切換後應用是否重新連線，且重試不會產生重複交易。'],'Writer是資料庫中的操作角色與入口概念，不是只會寫、完全不能讀的文字標籤。','Reader','Reader常用於分擔讀取，但可能存在複寫延遲；需要最新交易結果時，應依服務的一致性與端點行為選擇。',['aurora','sql','idempotency'],'Writer故障切換後，應用是否永遠不需要重新連線？','不能這樣假設。需要按照服務與驅動建議處理連線中斷、重試及端點更新。');
 add('reader','很多人同時查商品或報表，主要資料庫可能忙於回覆相同類型的讀取。若有可提供查詢的副本，就有機會分攤部分負載。',
 'Reader表示提供讀取的節點或端點角色。在支援的叢集裡，應用可以把適合的查詢送往讀取入口。副本更新可能需要時間，所以能查得到資料不代表這一刻一定和writer完全一樣新。',
 '讀取節點可以改善可分散的查詢容量，但要先知道哪些查詢能容忍資料落差。把所有讀取任意改到reader，可能讓使用者剛付款後立即查不到更新。',
 [['把讀取需求分成不同類型','歷史報表、商品介紹和剛完成交易的確認，對新鮮程度要求不同。先判斷可接受的陳舊程度，再決定路徑。'],['理解端點如何分配連線','以Aurora reader endpoint等機制為例，分配可能依連線而不是每一條SQL。長期連線與連線池會影響實際負載分布。'],['監控延遲與故障行為','讀取副本可能落後或暫時不可用，要看複寫狀況和應用重試策略。增加副本不代表任何查詢都變快，查詢本身和索引也重要。']],
 '電商想把每日統計報表和付款後即時確認一起移到reader。',['先區分報表可以接受較早資料，而付款確認可能要求立即看見最新結果。','將適合的報表查詢送reader，依服務保證為交易確認選擇正確讀取路徑。','監控副本落後與連線分布，不只看有幾台reader就推定擴展成功。'],'讀擴展要和一致性需求一起設計，不是把所有SELECT換一個網址就完成。','Writer','Writer接受資料更新；reader常分擔查詢。端點角色不同，也要分清故障接手、副本延遲和讀取容量三種需求。',['sql','read-replica','consistency'],'付款成功後立即查不到新狀態，是否一定代表付款沒有保存？','不一定。可能查到尚未追上的讀取副本，應檢查讀取路徑與一致性要求。');
 add('iops','兩顆磁碟每秒傳的總資料量可能相似，但面對大量小筆隨機讀寫時，表現仍差很多。資料庫常不只在意一秒搬多少MB，也在意能完成幾次操作。',
 'IOPS代表每秒輸入輸出操作次數。一次操作讀寫多少資料，會影響同樣IOPS可以帶來的吞吐量；實際表現也受延遲、請求大小、主機與儲存限制等因素共同影響。',
 '它幫助描述儲存工作負載的需求，但單看更高數字不一定解決效能問題。若瓶頸在主機頻寬、資料庫鎖定或不良查詢，買更高IOPS可能只增加費用。',
 [['先看操作形態與大小','大量小筆隨機讀寫和連續搬大型檔案，對儲存的壓力不同。先量測真實操作，而不是直接把資料容量大當成IOPS一定高。'],['一起檢查吞吐與延遲','IOPS看次數，吞吐量看資料量，延遲看每次等待。這些指標互相影響，還有磁碟與執行個體的上限要一起考慮。'],['依量測選規格','選EBS等儲存類型時，核對支援的容量、IOPS與吞吐配置。調整後再次量測應用結果，避免為沒有使用到的性能付費。']],
 '資料庫在尖峰時變慢，團隊準備直接購買最高IOPS的磁碟。',['先查看實際磁碟操作次數、等待時間及主機限制，確認是否真是儲存瓶頸。','同時檢查查詢與索引，判斷是否能減少不必要的磁碟操作。','選滿足量測需求的儲存規格並重測，不把最高數字當作唯一答案。'],'IOPS是效能量度的一個面向，必須和整條資料路徑一起理解。','吞吐量','每秒一千次小操作與一千次大操作，資料總量可能差很多；IOPS不能直接當成MB每秒使用。',['ebs','throughput','latency'],'兩個工作都有一千IOPS，它們每秒傳的資料量一定相同嗎？','不一定。還要看每次操作大小、讀寫方式及其他限制。');
 add('smb','辦公室Windows電腦常透過網路開啟共用資料夾，好像檔案就在本機。背後需要一套讓用戶端與檔案伺服器溝通的規則。',
 'SMB是常見的網路檔案分享協定。用戶端透過它讀寫遠端檔案、處理支援的檔案操作，並配合適當身分與權限。它不是某個單一品牌硬碟，也不是任意物件網址的另一種名字。',
 '既有Windows應用若依賴SMB與企業目錄整合，遷移時要選支援相應能力的服務，例如合適的FSx for Windows配置。只挑一個便宜儲存桶，通常無法自然保留原應用介面。',
 [['先確認應用需要的檔案語意','應用是否依賴共享路徑、檔案鎖定或Windows權限？這些需求會影響服務選型，不能只看資料副檔名一樣就判定相容。'],['配置網路與身分整合','用戶端需要能到達檔案服務，並使用正確的目錄或帳號權限。網路通了仍可能因授權錯誤無法開檔。'],['測試並行與故障','多個人同時開同一檔案、應用重新連線以及服務故障後恢復，都應按真實工作測試。高可用部署也不取代備份和誤刪還原。']],
 '公司要把使用共享路徑的Windows文件系統搬到AWS。',['列出SMB版本、目錄整合及檔案權限等相容性要求。','評估支援的FSx for Windows部署，配置私有網路與相應身分。','測試多使用者存取、檔案鎖定、備份還原與故障後連線恢復。'],'選共享檔案服務時，協定與權限語意和容量一樣重要。','NFS與S3','NFS常見於Linux檔案分享；S3主要提供物件API。它們都保存資料，但並不自動提供相同SMB介面。',['fsx','directory','storage'],'Windows應用原本用SMB共享路徑，換成S3網址是否一定不需改程式？','不一定。物件API與共享檔案協定不同，需選相容介面或明確設計轉接與改寫。');
 add('nfs','多台Linux主機可能需要看到同一份資料夾，而不是各自保存互不一致的副本。網路檔案系統讓它們透過既定規則操作遠端檔案。',
 'NFS是讓主機經網路存取檔案系統的協定。掛載可以理解成把遠端檔案位置接入本機目錄樹，讓程式用熟悉的檔案路徑存取。它仍然經過網路，並不是遠端檔案真的被搬成本機硬碟。',
 '像EFS這類支援NFS的共享服務，可讓多台主機依相容條件存取同一份檔案。設計時要考慮權限、效能、網路路徑及並行操作，不能把共享檔案等同資料庫交易。',
 [['確認系統和協定相容','查作業系統、NFS版本及服務支援條件。主機能使用某個共享路徑，不代表所有應用所需的鎖定或效能行為都完全相同。'],['配置掛載位置和網路','以EFS為例，要安排合適掛載目標與安全群組，讓主機走預期路徑。掛載成功之後，也需要正確的檔案身分與權限。'],['驗證共享與故障行為','測試多台主機同時讀寫、主機重啟與服務路徑故障。重要檔案還需要備份，因為共享的刪除可能立即影響所有使用者。']],
 '兩台Linux網站主機需要共用使用者上傳的檔案。',['確認應用真的需要檔案介面，還是可以直接改用S3物件存取。','若需要NFS，評估EFS並建立合適的掛載路徑、網路與權限。','驗證兩台主機能讀到同一份資料，再測試並行、重啟及備份還原。'],'共享介面解決多主機存取，但不會替程式處理所有資料衝突和誤刪。','EBS','EBS主要提供區塊磁碟，並非一般情況下任意跨AZ多主機共享的NFS檔案服務；兩者使用方式不同。',['efs','ec2','storage'],'把NFS掛載進目錄後，資料是否就變成本機的獨立副本？','不是。程式通常仍透過網路操作共享檔案，遠端連線與服務狀況會影響存取。');
 add('image','程式在開發者電腦能跑，換到另一台主機卻缺少套件或使用不同設定。你希望把程式與需要的執行環境一起封裝，減少每次重新安裝的差異。',
 '容器映像是用來啟動容器的封裝範本，包含程式、相依套件與啟動資訊等內容。映像本身不是正在執行的程式；平台根據映像建立容器後，工作才真正開始。',
 '同一份映像可以在符合條件的執行環境建立多份容器，提高部署一致性。但裡面若含漏洞或寫死的機密，也會被一併散布，因此映像建置與更新是重要管理工作。',
 [['把程式與需要的套件封裝','建置時明確定義依賴與啟動方式，避免靠某台手動調好的電腦。也要留意作業系統與處理器架構相容性，並非任何映像都能在任何主機執行。'],['保存可識別的版本','把映像存到ECR等合適registry，使用版本或不可變內容識別管理部署。一直覆寫同一標籤而不追蹤內容，會讓回復與稽核變困難。'],['把執行狀態放在適當位置','容器可被替換，重要資料與執行時秘密通常要透過合適外部機制提供。不要把資料庫唯一副本或長期金鑰直接封進映像。']],
 '團隊想讓測試和正式網站使用相同程式版本。',['建置一份可追蹤的映像，檢查相依套件與安全性。','將同一映像版本部署到測試，通過驗證後再部署正式環境。','把兩個環境的設定與秘密分開提供，並保留能退回的映像版本。'],'映像讓程式封裝一致，環境權限、資料與容量仍需另外設計。','AMI與容器','AMI是啟動EC2虛擬主機的範本；容器映像用來啟動容器。它們在不同管理層次，不能直接當成相同檔案。',['container','ecs','ami'],'映像已上傳ECR，是否表示網站程式已經在執行？','不是。還需要合適的運算與編排服務取得映像、建立容器並讓它實際運作。');
 add('orchestration','一個容器能在一台電腦啟動，不代表網站已能全天服務。你還需要決定開幾份、放在哪裡、壞掉時誰補回，以及新版本怎麼逐步換上。',
 '容器編排處理這些安排工作。它依你指定的期望狀態，協調容器的執行位置、數量與生命週期等事務。ECS與EKS提供不同管理方式；Fargate則是支援情境下執行容器的運算方式，概念層次不同。',
 '當容器與主機數量增加，人工逐台啟動和監看很難可靠。編排可以減少重複管理工作，但應用仍要適合被替換，並清楚處理外部資料、連線、健康檢查與權限。',
 [['說明想維持的狀態','例如網站需要兩份健康容器，分散在合適故障位置。平台知道目標後才能安排及補回，但還要有足夠底層運算容量。'],['把網路、資料與權限接好','容器如何被入口找到、去哪裡保存訂單、以哪個角色讀秘密，都需要定義。程式只在容器內跑起來，不代表外部使用者已能存取。'],['設計更新與失敗處理','部署新版本要逐步替換、檢查健康與排空舊連線；失敗時應能回復。擴展也要看下游資料庫與其他服務是否承受得住。']],
 '網站需要平常維持兩份容器，促銷時增加，單份故障後自動補回。',['建立合適服務定義，指定映像、資源、網路、角色與健康檢查。','設定期望份數及擴展策略，把健康容器接到負載平衡入口。','停止一份測試容器並部署新版本，驗證補回、流量導向、更新與回復流程。'],'編排維持系統安排，應用正確性與資料安全仍由完整架構共同負責。','單一容器與Fargate','容器是執行中的封裝程式；編排決定如何管理多份容器；Fargate提供免管理節點的執行容量。三者並非同義詞。',['container','ecs','fargate'],'只要容器能在筆電啟動，就表示高可用編排已完成嗎？','沒有。還需安排多份、故障補回、健康路由、資料保存和安全更新等整套工作。');

   a:n('AZ A裡執行網站程式的EC2主機或ECS容器。它收到請求後執行訂單邏輯。','和AZ B的應用一起處理訪客；放在私有子網路，讓公開入口集中到ALB。','這一台或這個AZ故障時，ALB應把新流量導向仍健康的B端；ASG可補回相應容量。','如果購物車只存在此主機記憶體，換到B端就可能遺失，應把必要狀態放到共享服務。'),
   b:n('AZ B中與A端功能相同的另一組應用運算。它不是只放著不用的圖案，而是可接受流量的實際目標。','分散單AZ故障風險，也可共同增加處理量。','A故障時B端必須有足夠容量承接；若兩端都依賴同一個失效服務，單純多台主機仍無法救回。','B端跨AZ讀寫主要資料庫，需一併考慮延遲、資料庫連線數與流量費。'),
   db:n('主要RDS資料庫，負責保存會員、訂單等需要持久保存的關聯式資料。圖中應用對它讀寫。','把資料集中到資料庫，應用主機才能替換或擴展，而不丟掉訂單。','主要節點失效後由Multi-AZ機制切換；應用仍要處理短暫斷線並重新連線。','資料庫可能成為所有應用共同的瓶頸；增加EC2不會自動增加資料庫寫入能力。'),
   standby:n('另一個AZ的傳統RDS Multi-AZ DB instance備援節點，維持資料副本供容錯接手。','主要資料庫或其AZ故障時，備援可被提升以恢復服務。','接手仍需要偵測、切換及連線恢復時間；不能宣稱完全零停機。','本圖的傳統standby不供應用讀取；若是Multi-AZ DB cluster或讀取副本，能力不同。')
  },
  edges:[
   e('users','edge','瀏覽器透過HTTPS向CloudFront要求頁面或資料，WAF依所設規則檢查HTTP請求。','檢查網站憑證與HTTPS設定；身份驗證仍由應用或相應服務負責。','若得到403，除了權限也要看WAF規則；TLS失敗先查網域與憑證。'),
   e('edge','alb','CloudFront沒有可用快取，或該請求不應快取時，才把要求送往ALB來源。','來源連線應依需求使用HTTPS，並限制繞過CloudFront直接進來源的方式。','常見問題包括來源網域、連線協定、憑證、ALB listener與安全群組設定。'),
   e('alb','a','ALB從健康目標中選到AZ A的應用，將HTTP請求轉交給它。','應用SG僅允許來自ALB SG的必要應用埠，而不是任意公網來源。','目標未健康時查target group註冊、健康檢查path、目標埠與應用日誌。'),
   e('alb','b','另一部分請求送到AZ B的健康應用；A失效時，B是可繼續接單的一個位置。','B端也只應接收ALB的相應連線，保持兩端設定一致。','若B端設定與A不同，可能只在部分訪客遇到錯誤；用主機識別與日誌定位。'),
   e('a','db','A端程式向主要資料庫發SQL讀寫，例如新增訂單後讀回結果。','DB SG信任應用SG；資料庫帳密或IAM驗證另行設定，必要時使用TLS。','能連網但登入失敗要查資料庫憑證；連不上則查DB endpoint、SG、路由與連線上限。'),
   e('b','db','B端也寫到同一個主要資料庫，避免兩台應用各自保存不同訂單帳本。','跨AZ也不取消身分與TLS要求；不要為方便把DB開放到0.0.0.0/0。','資料庫切換後，舊連線可能失效；程式需重新解析endpoint並以合適策略重連。'),

 'serverless':{
  source:'https://docs.aws.amazon.com/lambda/latest/dg/with-sqs.html',
  nodes:{
   user:n('Web或手機App是操作介面，Cognito可協助管理登入並提供使用者token。','使用者能送出訂單並得到工作編號，不必等寄信、付款等所有背景工作完成。','重複按送出或網路重試可能產生相同業務要求；前端提示不能取代後端冪等。','token代表登入資訊，不應把能任意操作AWS的長期管理員金鑰交給App。'),
   api:n('API Gateway提供一個可呼叫的API入口，接收請求並轉交Lambda。','把使用者驗證、流量節流與後端程式分開管理。','入口拒絕可能來自token、authorizer、節流或路由設定；不一定是Lambda本身錯誤。','API類型與授權功能有差異，應先確認使用HTTP API還是REST API及對應需求。'),
   fn:n('第一個Lambda驗證要求、建立業務編號並把工作送入SQS。','快速回覆已接受，使慢速背景處理不占住使用者連線。','如果送SQS失敗卻仍回覆已接受，就會出現使用者以為成功但工作遺失的情況。','回覆202或工作ID代表已接受，並不代表所有業務副作用都已完成。'),
   queue:n('SQS保存等待處理的工作訊息，讓工作量尖峰先排隊。','把接單速度與背景處理速度分開，避免下游被一瞬間的大量請求壓垮。','消費者故障時訊息可再次出現；若長時間沒消費，積壓會增加且需注意保留期。','標準queue至少一次投遞，可能重複；visibility timeout要配合處理時間。'),
   worker:n('背景Lambda收到SQS批次訊息後，執行實際工作並保存結果。','用受控的並行量逐步處理訂單，而不是無限制同時打資料庫或付款API。','函式逾時或部分批次失敗可能造成重試；應使用部分批次回應與業務冪等。','如果副作用是外部付款，單一DynamoDB條件寫入不一定完整涵蓋付款與狀態更新的故障窗。'),
   db:n('DynamoDB依訂單ID保存狀態或結果，並可利用條件寫入檢查某筆工作是否已處理。','讓重複訊息不至於建立兩筆獨立訂單，也讓客戶端能查詢進度。','錯誤的key或條件可能把合法不同訂單當成重複；監控條件失敗及讀寫錯誤。','表設計須符合主要查詢方式；不能把任意JOIN需求直接交給此表。'),
   dlq:n('死信佇列保存超過設定重試條件的問題訊息。','讓正常工作繼續，並讓維運能找出始終處理失敗的訂單。','如果沒監控DLQ，失敗訂單可能長期沒人處理；資料保存時間也要規劃。','修復程式或資料後再redrive；不要無條件反覆送回形成失敗循環。')
  },

   e('api','fn','API Gateway依路由同步呼叫接單Lambda，並把其結果回傳用戶端。','Lambda的resource policy需允許相應API來源呼叫；execution role是函式往外操作的權限。','路由整合錯誤、函式格式不符或超時都可能造成入口錯誤；對照API與Lambda日誌。'),
   e('fn','queue','接單函式把包含orderId等必要資料的工作訊息送進queue，成功後才回覆接受。','函式execution role需允許對指定queue執行SendMessage；不要給所有queue管理權。','檢查queue ARN、區域、IAM與加密權限；失敗時不能假裝工作已排入。'),
   e('queue','worker','Lambda事件來源對應會輪詢SQS，再以訊息批次呼叫worker；不是SQS無條件直接推送每筆函式。','輪詢所需SQS權限由對應角色取得；加密queue另確認KMS使用權。','查事件來源是否啟用、批次失敗、並行限制及visibility timeout，避免成功訊息反覆重做。'),
   e('worker','db','Worker依orderId寫入訂單結果，利用條件或交易控制重複處理。','只授予該表必要PutItem/UpdateItem等權限；敏感結果避免原樣寫進log。','ConditionalCheckFailed可能是正常防重或真正key設計錯誤，應分開處理，不要全部當暫時故障重試。'),
   e('queue','dlq','來源queue依redrive policy，將接收重試次數超過條件的訊息移到DLQ。','限制DLQ管理與redrive權限，確保調查人員能讀取但不任意丟棄證據。','看ApproximateReceiveCount、DLQ訊息及函式log，修復原因後再以受控速率重送。')
  ]
 },

 short('foundations','從一筆訂單開始：我們要做出什麼？',
  '我們一起走完一筆正常完成的訂單。你在手機上看見雞肉飯每份100元，選了兩份，確認共200元後按下送出。接著，店員在餐廳的接單畫面看見「雞肉飯兩份」。店員確認今天能提供，接受這筆訂單，並把餐點、數量、金額與接受結果記下來。完成後，你的手機顯示「訂單已接受」。稍後重新打開頁面，仍能查到同一筆內容。下面把這段過程逐步拆開。',
  '把它想成真的點餐：看菜單、交出點單、店員處理、留下紀錄。接下來才逐步把每個動作對應到網站。',
  '依序說出這筆訂單的四個動作：客人選好送出、店員收到、確認接受、留下紀錄並回覆。',[
   ['先看客人要做什麼','客人打開網站，是想訂到自己要的餐點。因此網站先要讓他看見餐點名稱與價格，再選擇數量，並確認即將送出的內容。這裡的「畫面」，就是手機上看得到的文字、圖片與按鈕。先把這些操作說清楚，我們才知道網站應該提供哪些東西。','菜單寫著雞肉飯每份100元，你選兩份。送出前，畫面應讓你確認「雞肉飯、兩份、共200元」，而不是只給一個沒有說明的按鈕。'],
   ['第二步：店員收到餐點與數量','客人按下送出之後，這個例子裡的店員已經在接單畫面看見「雞肉飯兩份」。我們把這件事稱為「餐廳收到訂單」。到這一步，只能確定店員知道客人選了什麼，還沒有說店員答應提供餐點。收到之後，才進行下一步的確認。','此時店員可以讀到餐點與數量；客人也還在等餐廳的確認結果。先把故事停在這個狀態，再看下一步。'],
   ['第三步：店員確認可以提供，接受訂單','接著，店員查看餐點供應情況，確認今天能提供兩份雞肉飯，於是決定接受。這裡的「接受」，就是餐廳答應準備這份餐點。到這一步，客人的選擇已經送到、店員也已確認能做；接下來要把這個結果記下來，方便之後查看。','店員確認「兩份雞肉飯可以準備」。我們這筆例子的結果已明確是接受，下面不會突然改成餐廳沒收到或餐點售完。'],
   ['第四步：把已接受的訂單記下來，再告訴客人','店員接受後，網站留下「雞肉飯、兩份、200元、已接受」這筆紀錄，再把接受結果顯示給客人。保存紀錄的用途，是讓稍後要準備餐點的店員與想查訂單的客人，都能找到剛才的內容。這一步承接的是上一段已經接受的訂單。','你關掉訂餐頁面再打開，查到同一筆「雞肉飯兩份，已接受」。能再次查到，是因為前面已把這筆內容留下。']
  ],'把剛才正常完成的雞肉飯訂單連起來看。以下每一步都承接前一步已經發生的結果。',
  ['客人確認雞肉飯兩份、共200元，按下送出；店員的接單畫面隨後顯示這份選擇。','店員讀到兩份雞肉飯，確認可以提供，接受這筆訂單。','網站把餐點、數量、金額與接受結果留下，再告訴客人已接受；稍後雙方仍能查到同一筆內容。'],
  '這一課走完的是一筆正常訂單：選好送出 → 店員收到 → 確認接受 → 留下紀錄並回覆。下一課才把「送出後，選擇怎麼交到餐廳」拆開說明。',
  '在剛才的例子中，客人重新打開頁面，仍能查到雞肉飯兩份。這份資訊來自哪一步？',
  ['第一步看見菜單上的餐點與價格。','第三步店員確認今天能提供餐點。','第四步把餐點、數量、金額與接受結果留下。'],2,
  ['菜單提供可選餐點與價格，沒有記下這位客人實際訂了什麼。','這一步決定是否接受；接下來第四步才把這筆訂單的內容留下。','正確。前文第四步已說明：把訂單內容留下，所以稍後能再查到。']);
 short('web-request','按下送出之後：請求與回應',
  '上一課留下了客人、畫面、處理與紀錄四個位置。現在要解決第一個空白：客人在手機上按下按鈕，餐廳的系統怎麼知道他選了什麼？本課只追蹤一來一回的訊息，先不討論加密或網站流量增加。',
  '像把寫好的點單交給櫃檯，再等櫃檯回覆是否接受；交出點單與收到答覆是兩個動作。',
  '能依序指出用戶端送請求、伺服器處理、回傳回應的三個動作。',[
   ['需要一端提出要求','手機上的瀏覽器會依你的操作送出訊息，例如想讀菜單，或想建立一筆訂單。主動提出要求的一端叫用戶端。請求裡必須帶足夠的資料，接收方才知道要做什麼；光是按了一個按鈕，對方不會自動知道你的意思。','點兩份飯時，送出的資料至少要能表示餐點與數量，而不只是「有一個人按了按鈕」。'],
   ['需要另一端接收並處理','接收要求、執行處理並交回結果的電腦，叫伺服器。這是一種提供服務的角色，不是只有某種特別品牌的電腦才做得到。它會執行網站程式，讀取需要的資料，再依規則判斷結果。','餐廳系統收到兩份飯的要求，查價格與庫存，再決定是否接受；這不是手機畫面自己決定的。'],
   ['答覆與成功要分開看','HTTP是網站交換請求與回應時使用的一套規則。回應可以表示成功，也可以表示找不到餐點或發生錯誤。收到回應只表示對方交回了結果，不表示每一筆訂單都成功；沒有收到回應，也不一定代表對方完全沒有處理。','客人斷網前訂單可能已保存，只是成功回應沒有回到手機。之後會再學如何處理這種不確定性。']
  ],'客人點兩份飯，網站卻回覆「已售完」。訊息流程是否仍然完成？',
  ['用戶端把餐點與數量送成請求。','伺服器處理後發現庫存不足。','回應把拒絕原因交回客人；通訊完成，訂單沒有被接受。'],'現在能追蹤一來一回。下一個問題是：伺服器拿到訊息後，靠什麼規則處理，又把結果放在哪裡？',
  '收到「已售完」的答覆，最合理的理解是？',['沒有發生任何通訊。','請求與回應已完成，但業務要求未成功。','伺服器一定壞了。'],1,
  ['對方有回覆，表示通訊流程已經發生。','正確。通訊成功與業務成功是不同判斷。','正常的庫存判斷也能回覆售完。']);
 short('program-data','程式負責處理，資料負責留下結果',
  '現在知道訊息會抵達伺服器，但「伺服器處理」仍然是一個黑盒子。這課把黑盒子拆成程式與資料：前者決定怎麼做，後者保存做了什麼。先理解這個分工，才不會把後面的運算與儲存服務混成同一件事。',
  '食譜像處理規則，訂單簿像保存的資料；有食譜不表示已經記下今天的訂單。',
  '能分清程式碼、正在執行的工作與需要長期保存的訂單。',[
   ['程式是處理規則','程式碼是人寫給電腦的指示，例如餐點數量乘以單價，再檢查折扣。程式碼被保存成檔案時不會自己計算，必須有電腦執行。之後談運算服務，就是在安排這項執行工作所需要的資源。','把計算總價的文字存進檔案，不等於任何一張訂單已經被計算；要真的執行它才會產生結果。'],
   ['執行中的資料不一定長期留下','電腦執行時會在記憶體放暫時資料，例如目前正在計算的總價。程式結束、設備故障或環境被替換後，不能依賴這些暫存內容繼續存在。需要日後查詢的資料應寫到合適的持久保存位置。','你可以重新計算購物車總價，但已接受的訂單不能只存在某次程式的記憶體裡。'],
   ['先處理，再確認保存結果','網站要安排處理與保存的順序，並檢查保存是否成功。這是應用的責任，不是租到一台電腦就自動完成。現在先記住：要讓餐廳日後查到訂單，必須有明確的保存步驟。','若先顯示成功卻沒有確認訂單留下，客人與餐廳對這筆交易的認知就可能不同。']
  ],'開發者重開網站程式後，所有剛才接受的訂單都不見了。',
  ['先問訂單是否只放在執行中的記憶體。','區分可重啟的處理程式與應保留的訂單資料。','加入持久保存與讀回檢查，再測試程式重啟後是否還能查到。'],'處理能力與保存能力是兩種需求。接下來先了解為何要租用資源，再分別替兩種需求選工具。',
  '要讓程式重啟後仍查得到訂單，應先確保什麼？',['畫面按鈕夠大。','訂單有寫入合適的持久保存位置。','程式碼檔名包含訂單。'],1,
  ['畫面可讀性不會保存訂單。','正確。不能只依賴執行中的暫存內容。','命名不會取代實際保存步驟。']);
 short('cloud-rental','先理解雲端：哪些工作交給供應商？',
  '我們已知道網站需要執行程式與保存資料。若自己準備，就要買設備、接電、接網路並維護。現在的問題是：小餐廳是否必須先做好這些事才能開始？這課介紹租用資源的方式，以及租用後仍要自己負責的工作。',
  '租廚房設備可以省下買設備與部分維護，但菜單、食材與出餐規則仍要由餐廳安排。',
  '能說出雲端供應商提供的資源，以及使用者仍需安排的程式、資料與權限。',[
   ['租用的是能力與服務','AWS提供運算、儲存與其他服務，你可以透過管理介面或程式要求使用。設備仍然存在，只是實體設施由供應商管理。不同服務交付的能力不同，不能把雲端看成一個會自動完成全部網站的產品。','租到可執行程式的電腦，與租到保存圖片的服務，是兩種不同選擇；它們可能一起支援同一個網站。'],
   ['管理責任取決於服務','有的服務讓你管理一台電腦環境，有的服務只要求你交付檔案或資料。交由供應商處理的部分增加，通常代表你直接控制的底層細節減少。但業務規則、資料用途與誰能操作，仍需要自己決定。','供應商可以管理儲存設備故障，卻不會自動知道哪一份薪資檔案應該讓哪些員工讀取。'],
   ['使用與費用要一起確認','租用資源常能按需要建立與釋放，但每種服務有自己的計費項目。停止其中一項工作不代表所有相關費用都停止。現在先建立「使用了什麼，就逐項檢查」的習慣；折扣方案與成本優化稍後再學。','關掉執行程式的電腦，不代表另外保存的圖片與磁碟也被刪除或不再計費。']
  ],'老闆認為有AWS帳號後，網站就會自動計算訂單並保護所有資料。',
  ['先列出要租的能力：執行程式、保存圖片、保存訂單。','再列出自己要完成的事：部署程式、規劃資料、設定存取權限。','分別確認供應商與團隊的責任，不把租用當成完整交付。'],'接下來先租一台能執行程式的電腦，理解最基本的EC2用途。',
  '使用雲端後，誰決定訂單金額怎麼計算？',['AWS會替每間餐廳自動決定。','仍由應用程式的設計者安排。','完全不需要程式。'],1,
  ['基礎設施供應商不會知道你的定價規則。','正確。租用資源不會取代業務程式。','需要有實際執行處理規則的程式。']);
 short('ec2-first','第一台 EC2：讓訂餐程式有地方執行',
  '我們已決定租用資源，也知道程式必須在電腦上執行。這課只回答「把訂餐程式放在哪裡跑」：先使用EC2租一台可管理的電腦環境。不比較大量規格，不討論自動擴展或高效能叢集。',
  '像租一間工作室：空間與設備可用，但你仍要裝好需要的工具，並真的開始工作。',
  '能說出EC2提供電腦環境，而應用部署與資料保存仍需另外安排。',[
   ['先有電腦環境','EC2可讓你建立執行個體，常見方式是一台虛擬電腦。你選擇作業系統與適合的資源規格，再在上面安裝程式。CPU執行指令，記憶體放執行中的工作資料；現在只需要理解分工，不必記住所有型號。','訂餐程式原本能在一台Linux電腦執行，就可以評估在相容的EC2環境部署；不是把檔案上傳後任何程式都自然相容。'],
   ['開機與提供網站是兩步','EC2顯示正在執行，只能說電腦環境已啟動。網站程式也必須啟動，並能接收需要的請求。外面的手機如何抵達它，還涉及網路與入口；這些會在第二階段逐項補上，現在不要把開機當成網站完成。','你租到店面並開燈，不代表櫃檯有人接單；同樣地，EC2啟動不表示訂餐程式已經在接收要求。'],
   ['記錄哪些事情仍由自己管理','一般EC2環境裡，團隊仍要部署應用、維護作業系統、限制存取並規劃資料保存。先把它當成一台有管理責任的租用電腦。後面介紹其他運算方式時，再比較哪些責任可以交給服務。','若把唯一訂單只留在某次程式的記憶體，換一台EC2不會自動找回它；運算與資料保存仍是兩個問題。']
  ],'EC2已開機，工程師卻還沒有安裝訂餐程式。客人能直接下單嗎？',
  ['確認電腦環境存在，但處理訂單的程式尚未部署。','安排相容的應用部署與啟動。','之後再配置請求抵達它的網路路徑，並另外保存需要長期留下的資料。'],'我們替處理工作找到位置。下一課替菜單照片找保存位置，觀察它與租電腦有何不同。',
  'EC2正在執行，能直接證明什麼？',['每筆訂單一定有備份。','電腦環境已啟動，應用仍需確認。','所有人都能安全連到網站。'],1,
  ['備份需要另外規劃與檢查。','正確。應用與網路也要各自驗證。','開機不代表路徑或權限已設定正確。']);
 short('s3-first','第一份 S3 檔案：替菜單照片找保存位置',
  'EC2解決執行程式的位置，餐廳還有照片與菜單文件要保存。若換掉主機，不希望重新尋找每張圖片。因此先把這些檔案的保存工作獨立出來。本課只學S3的基本存取模型，版本、加密和分發稍後再談。',
  '像有索引的倉庫：先決定在哪個倉庫、用什麼名稱保存，取件時再用同樣的資訊找到它。',
  '能用儲存桶、物件名稱與內容描述一張照片在S3的位置。',[
   ['把一份檔案看成物件','S3以物件方式保存資料。先把物件理解成檔案內容，加上辨認它的名稱與描述資訊。這不是一台讓你登入後安裝訂餐程式的電腦；它提供保存與取回資料的服務介面。','一張飯盒照片可以是一個物件；上傳計算總價的程式檔，也只是保存那份內容，不會讓它自動執行。'],
   ['用桶與名稱找到內容','物件放在儲存桶，名稱叫key。一般讀取會指定桶與key，例如某個桶中的images/rice.jpg。名稱裡的斜線能幫助組織，但先不要把它當成與電腦上的資料夾行為完全相同。','商品名稱改了，不表示照片內容會自己變；程式要知道該讀取哪個key，以及新內容是否已寫入。'],
   ['先知道誰在讀，再談公開','檔案保存完成，不等於已讓所有網友讀取。應用或使用者需要經過適用的存取檢查。現在先分開「檔案存在」與「某個人能讀」兩件事；第二階段會回來教如何安全分享。','工程師能看到照片，不代表客人的瀏覽器也有相同權限。遇到讀不到時，不能直接把整個桶公開當成唯一答案。']
  ],'主機需要重建，但菜單照片已獨立放在S3。重建程式時要重新拍照嗎？',
  ['確認照片仍保存在指定的桶與key。','重新部署應用，讓它知道照片位置。','再確認新應用具備需要的讀取權限，不把檔案存在等同自動可讀。'],'現在圖上有EC2處理程式、S3保存檔案。下一課問：訂單能否只像照片一樣保存？',
  '把訂餐程式檔放到S3，最直接完成了什麼？',['保存程式檔內容。','自動建立完整訂餐系統。','自動替所有人執行程式。'],0,
  ['正確。保存內容與執行程式是不同工作。','還需要運算、資料與網路等安排。','S3一般物件保存不會任意執行你的程式。']);
 short('database-first','訂單為什麼需要資料庫？',
  '照片可以整份保存與取回，但訂單常要依顧客查詢、修改狀態、檢查哪些還沒出餐。如果每次都掃過全部檔案自己找，應用會承擔更多工作。本課先理解資料庫提供的操作能力，不急著比較所有資料庫品牌。',
  '照片倉庫擅長按名稱取件；有欄位與查詢規則的訂單簿則能找出某位客人的未完成訂單。',
  '能從查詢與更新需求，說明為何訂單適合使用資料庫。',[
   ['先寫出要問的問題','資料庫選擇先從資料如何被使用開始。你要找某筆訂單、某位客人的全部訂單，還是當天未出餐清單？不同問題需要不同資料組織與查詢方式。不要因為兩種服務都能保存資料，就認為操作能力相同。','「取回rice.jpg」與「查出小明今天尚未完成的訂單」是不同的存取需求，後者還涉及多筆資料的條件。'],
   ['把訂單拆成有意義的欄位','一筆訂單可以包含訂單編號、顧客、金額與狀態。資料庫提供依特定模型保存、查詢及更新資料的能力。關聯式資料庫常用資料表與關係組織內容，RDS提供受管理的關聯式資料庫選項；本課只先認識它的角色。','狀態從已接受改為已出餐，是更新某筆資料；不是重新上傳整個網站，也不需要更換執行程式的電腦。'],
   ['應用仍決定正確流程','資料庫不會替餐廳發明訂單規則。應用要把正確資料寫入、檢查結果並在需要時查回。受管理服務能承擔部分維護工作，但權限、資料模型與復原需求仍要設計；之後再逐步學交易與故障接手。','客人取消訂單時，應用應確認目前是否還能取消，再更新狀態；不能只因資料庫支援修改就任意改掉已完成訂單。']
  ],'老闆要看今天還沒出餐的訂單，工程師只有一大堆以隨機檔名保存的文字檔。',
  ['先明確定義日期、狀態與顧客等查詢需要。','設計對應欄位，讓應用使用合適的資料庫操作。','驗證能建立、查詢與更新訂單，再依規模比較更深入的模型。'],'EC2執行處理、S3保存檔案、資料庫管理訂單。先停下來把三種工作分清，再進入連線設計。',
  '選擇訂單保存方式前，最應先問什麼？',['服務名稱是否最流行。','資料會如何查詢與更新。','是否能把全部工作放同一個名稱底下。'],1,
  ['流行程度無法代替工作需求。','正確。操作模式會影響合適的資料模型。','同一個名稱不代表每種工作都適合。']);
 short('checkpoint-web','停下來整理：畫出第一版訂餐網站',
  '前面分別認識了訊息、程式與三種資源。現在先不增加新服務，避免只記得零散名稱。我們把同一張訂單完整走一遍：手機提出要求、程式處理、查詢菜單與保存訂單，再回傳結果。本課的成果是一張你自己能解釋的圖。',
  '像排練一次餐廳出餐：每個位置都有人負責，但要真的交接一次，才知道責任是否接得起來。',
  '不看答案也能畫出手機、EC2、S3與資料庫，並說出每條箭頭的用途。',[
   ['先畫工作，再填服務','先畫客人、處理、檔案與訂單四個位置，再把已學服務放回去。EC2負責執行程式，S3保存照片等檔案，資料庫負責依模型操作訂單。四個位置不代表只能有四台設備；目前畫的是分工。','若有人把S3放在計算總價的位置，先請他說明誰在執行計算，再修正服務與工作的對應。'],
   ['每條箭頭只說一件事','手機把餐點與數量交給應用，應用依規則計算並把訂單寫入資料庫，再回覆結果。需要圖片時則由適當讀取流程取回S3內容。現在只畫概念流向；下一階段會分清公開入口與內部連線。','把箭頭標成「建立訂單」或「讀取照片」，比只寫「連線」更能看出為什麼兩個位置需要互動。'],
   ['把未知問題留在圖旁邊','我們還沒有證明手機能抵達應用，也沒有設定誰能讀資料。把這兩個問題留在圖上，作為下一階段要解決的需求。已經知道缺什麼，比假裝整個系統完成更有幫助。','在手機到應用旁寫「怎麼到達？」；在應用到資料旁寫「誰允許它讀？」。它們會分別帶出網路與身分。']
  ],'請向不懂AWS的餐廳老闆解釋：為什麼畫面、程式、照片與訂單不能只用一個服務名稱帶過？',
  ['先說四項工作，而不先唸產品名稱。','再用已學工具逐一對應，描述一筆訂單的去向。','最後明確指出網路可達與權限尚未完成，下一階段有具體目標。'],'如果還分不清執行與保存，先回前兩課重畫。能說清楚後，再開始學怎麼把這些位置接起來。',
  '目前最合理的下一個問題是？',['直接比較全球災難復原策略。','確認手機與應用如何連線，以及誰能讀資料。','背下所有進階服務縮寫。'],1,
  ['先完成基本路徑，再處理更大故障範圍。','正確。這是我們圖上尚未解決的兩個具體問題。','更多名稱不會自動補上連線與權限。']);
 short('network-first','資料如何抵達：位址、連接埠與路徑',
  '第一版圖已分清各項工作，但紙上的箭頭不會自動成為連線。手機要知道送往哪個位置，程式也要在那裡接收。本課先建立位址、連接埠與路徑三個概念，下一課才把它們放進VPC。',
  '像寄件要有收件地址、目的窗口與可通行的道路；只知道其中一項不夠。',
  '能把連線問題分成目的位址、程式接收位置與網路路徑。',[
   ['位址表示送往哪裡','網路用IP位址等資訊定位目的端。人通常使用網站名稱，DNS能幫忙查出連線需要的位址；這課先把它當作查地址的步驟，不展開DNS路由策略。沒有正確目的地，資料就無法照預期抵達。','打開訂餐網站時，名稱不是程式本身；它幫助瀏覽器找到要連線的位置。'],
   ['程式要在適當位置接收','同一台電腦能執行多項服務，通訊埠協助區分網路接收位置。應用需要在合適位址與通訊埠接收要求。電腦開著但應用沒接收，與網路防護阻擋，是兩種不同問題。','大樓地址正確，點餐櫃檯卻沒人值班，客人仍然無法下單；開放道路不會自動啟動應用。'],
   ['去程與回程都需要路','資料從來源到目的地會經過網路路徑，回應也要能返回。路由決定資料往哪裡走，安全規則決定哪些流量可通過。之後會把這些分成不同設定；現在先避免把全部連線問題都叫做權限不足。','程式可以有讀取訂單的權限，但如果根本連不到資料庫，就還沒走到資料操作的授權檢查。']
  ],'EC2開著、應用已啟動，但手機仍連不上。',
  ['先確認使用的名稱與位址是否指向正確位置。','確認應用接收位置與網路路徑。','再確認安全規則與回程，而非立刻給應用更多資料權限。'],'下一課用VPC把路徑畫成具體的網路範圍、子網路與路由。',
  '讓應用擁有更多S3讀取權限，是否一定能修好手機連不到應用？',['一定，所有問題都由IAM控制。','不一定，必須先確認應用與網路路徑。','只要EC2開機就不可能連線失敗。'],1,
  ['資料授權不會建立網路路徑。','正確。先找出失敗發生在哪一段。','應用接收與連線條件仍可能不成立。']);
 short('identity-first','連得到之後：誰可以對資料做什麼？',
  '網路路徑讓要求有機會抵達，卻不能代表任何到達的人都能讀訂單。這課先分清身分與授權：確認誰在提出要求，再判斷能操作哪些資料。下一課IAM才會把這個句子寫成具體政策。',
  '走得到公司門口，與有門禁權限進入薪資室，是兩個不同條件。',
  '能用「誰、對什麼、做什麼」寫出一條存取需求。',[
   ['先辨認提出要求的身分','要求可能來自員工，也可能來自網站程式。認證是在確認提出要求的身分，不是決定它能做所有事。網站顧客登入與應用向AWS服務提出要求，也可能使用不同身分機制，不能把所有密碼混在一起。','顧客登入訂餐網站後，不會因此成為餐廳的AWS管理員；應用讀照片也不應使用顧客的私人密碼。'],
   ['把允許範圍寫成完整句子','授權回答特定身分能否對指定資源執行某種動作。讀照片、寫訂單、刪除紀錄是不同操作。只給工作需要的範圍，能減少程式出錯或身分遭濫用時的影響。','「網站程式可以讀商品圖片」比「網站程式可以操作帳號內一切資料」更接近真正需要。'],
   ['用成功與失敗一起驗證','只測試能讀照片，無法證明它不能刪照片或讀薪資。授權應同時檢查應成功與應失敗的要求。連線可達、身分確認與操作允許各自完成，才形成完整存取流程。','網站讀菜單照片應成功；同一身分刪除全部照片應失敗。兩種結果都符合設計，才算驗證範圍。']
  ],'報表程式只需要讀取每日訂單，工程師卻給它刪除所有資料的能力。',
  ['先確認它需要的身分、資料範圍與動作。','移除與報表工作無關的刪除與其他資料存取。','驗證讀取成功、禁止動作失敗，再導入IAM政策。'],'現在有了授權句子。下一課學IAM如何表達它，以及程式如何取得適當角色。',
  '程式已能連到儲存服務，就表示可以刪除裡面的資料嗎？',['不表示，還要檢查身分與刪除授權。','表示，網路可達就是完整權限。','只要知道檔名就能刪除。'],0,
  ['正確。路徑與操作授權不同。','網路規則不會替代資料操作政策。','知道名稱不等於具有該項權限。']);
 short('encryption-first','資料在路上與存放時，要保護什麼？',
  '已經會限制誰能操作資料，仍要問：資料傳送或保存時，內容如何受到保護？這課先把存取權限與加密分開，理解傳輸中與存放中的差異。下一課再介紹金鑰管理與程式機密，先不進入信封加密流程。',
  '門禁控制誰能領文件；受保護的運送與鎖箱則處理文件在不同階段如何被保護。',
  '能在訂單路徑上分別標示傳輸保護與儲存保護。',[
   ['權限與加密處理不同面向','授權決定誰可以要求操作；加密依演算法與金鑰保護內容。服務可能替已授權者解密，因此「資料已加密」不代表錯誤授權自動無害。兩種控制應互相配合，而不是二選一。','若薪資檔案允許錯誤對象讀取並解密，檔案已加密仍沒有達到想要的存取限制。'],
   ['傳送途中需要保護','HTTPS在HTTP通訊上使用TLS等保護機制。瀏覽器到網站是一段，應用到資料庫可能是另一段；保護第一段不表示其他連線自動一起受到保護。先沿箭頭逐段檢查，而不是只看首頁有沒有鎖頭。','客人安全地把訂單交給網站，不代表網站再把資料送往別處時一定使用同樣的保護方式。'],
   ['保存下來也有獨立需求','資料存在磁碟或儲存服務中時，可以使用適用的靜態加密。這與傳輸保護不同，還需要決定誰能使用相關金鑰。下一課才拆開金鑰與機密管理，現在先完成兩個保護階段的辨認。','在訂單保存位置旁標記靜態加密，在連線箭頭旁標記傳輸保護；兩個標記不能互相代替。']
  ],'網站用了HTTPS，團隊因此認為資料庫保存方式與金鑰權限都不用再檢查。',
  ['指出HTTPS處理的是相關通訊連線。','另外檢查應用到資料庫的連線與資料保存保護。','再檢查誰能讀取與解密，避免用一個安全設定代表全部。'],'下一課將用KMS管理金鑰，並分開處理程式需要使用的密碼與機密。',
  '網站用了HTTPS，能直接推出資料庫磁碟已加密嗎？',['能，所有加密都是同一個設定。','不能，它們保護不同階段。','能，而且所有人都無法讀資料。'],1,
  ['傳輸與靜態加密需要分別確認。','正確。逐段、逐個保存位置檢查。','HTTPS不會取消所有授權讀取。']);
 short('failure-first','先讓一台壞掉：什麼叫單點故障？',
  '現在的網站已有基本路徑與保護，但仍只有一份處理能力。假設那台電腦突然停止，客人會在哪裡卡住？這課只識別故障造成的中斷，先不直接堆出完整高可用架構。先看見問題，後面才知道每個備援元件為何存在。',
  '只有一個點餐窗口時，窗口停止服務就無法接單；多準備一個窗口還要確認它真的能接手。',
  '能在既有圖上指出單點，以及故障後仍可做與不能做的工作。',[
   ['沿原本流程找中斷','回到手機、應用、圖片與訂單資料圖。逐一假設某個位置停止，問下一步是否還能完成。不要只數電腦台數；若兩台應用都依賴同一個不可用位置，整個訂單流程仍可能停止。','照片暫時讀不到，也許菜單文字仍能顯示；訂單保存位置不可用，則不能輕易告訴客人已接受訂單。'],
   ['可重啟不等於不中斷','工程師稍後能重建主機，與現在能繼續服務是不同目標。要降低中斷，就需可接手的能力、偵測故障的方法與把要求轉向健康位置的安排。之後會分課處理，不把三項工作混成「多放一台」而已。','備用點餐機放在倉庫、沒開機也沒有連線，並不能立即代替正在故障的窗口。'],
   ['先寫出可以接受的結果','餐廳需要的是壞一台仍能接單、幾分鐘內恢復，還是晚點重建即可？先說容忍程度，才能比較成本與設計。現在只練習說明故障與影響，較正式的時間與資料目標會在復原課再量化。','如果是內部每晚報表，短暫等待可能可接受；客人付款流程的中斷，可能帶來不同影響。']
  ],'網站只有一台應用主機，它停止後圖片仍存在，訂單資料也沒消失，但客人不能下新單。',
  ['分清資料仍在與服務能使用。','指出處理要求這一層是目前的單點。','記下需要第二份處理能力與切換路徑，再問兩份放在哪裡才不容易一起故障。'],'下一課才引入Region與AZ：不是多背位置名稱，而是判斷兩份資源會不會被同一次故障影響。',
  '資料還在，但客人無法下單，主要描述哪種問題？',['此刻無法提供需要的服務。','所有資料必然永久遺失。','只要加密就會恢復。'],0,
  ['正確。可用性與資料是否遺失要分開判斷。','中斷不一定等於資料消失。','加密不是故障接手機制。']);
 short('region-first','兩份放在哪裡：Region 與 AZ',
  '上一課發現需要可接手的處理能力。但兩台電腦若同受一處設施故障影響，仍可能一起停止。現在才需要學資源位置：Region協助選擇地理區域，AZ協助理解區域內隔離的故障範圍。本課先處理位置，不深入流量切換。',
  '兩間廚房若共用同一個故障來源，就可能一起停工；分散位置是為了降低共同失效的風險。',
  '能解釋為何兩份應用放在不同AZ，比只增加同AZ台數更能承受單一AZ故障。',[
   ['先決定在哪個區域提供服務','Region是一個地理區域。選擇時會考慮使用者距離、資料所在地需求與服務供應。這個決定與要幾台電腦不同：選定一個Region後，仍需要安排裡面的資源位置與連線。','服務主要給日本客人使用時，可以評估合適地理區域，但距離不是唯一條件，也要確認資料與功能需求。'],
   ['再看區域內的隔離位置','Region包含多個可用區，簡稱AZ；它們具備隔離設施以降低共同故障風險。一個AZ可由一個或多個資料中心組成。跨AZ安排資源是在處理一個AZ失效的情境，不代表對所有災難都已完成設計。','兩台應用都在同一AZ，仍會一起受到該AZ故障影響；跨AZ才跨過這個故障範圍。'],
   ['位置分散之後仍需接手','兩份資源在不同AZ，只完成了位置安排。還需要讓請求抵達健康應用，以及讓資料層有合適的可用性。下一課會檢查每一層，之後再分別學入口與容量，不把跨AZ當成自動完成整套網站。','你在另一個AZ放了應用，但所有訂單仍依賴原本不可用的資料位置，客人可能仍無法下單。']
  ],'兩台應用都放在同一AZ，團隊聲稱已能承受該AZ完全停止。',
  ['先辨認兩台共用的故障範圍。','把需要承受AZ故障的能力分散到不同AZ。','繼續檢查入口、資料與剩餘容量，確認不是只改位置。'],'位置有了理由，下一課把單點檢查延伸到整個流程，再逐個補入口與擴展。',
  '跨AZ部署最直接針對哪個情境？',['降低單一AZ故障一起影響全部副本的風險。','自動找回任何誤刪資料。','保證整個Region停止也完全不受影響。'],0,
  ['正確。先對應清楚故障範圍。','誤刪與歷史復原需要另外設計。','跨AZ不等同跨Region。']);
 short('scale-first','不是只有故障：客人變多時怎麼辦？',
  '現在已有入口把請求分給健康應用，但午餐尖峰可能讓每台都忙不過來。這不是主機故障，而是工作量超過處理能力。本課先判斷哪裡忙、加什麼才有用，下一課再學Auto Scaling如何調整台數。',
  '窗口都正常卻排很長的隊，與窗口壞掉不同；增加人手前先確認是點餐慢、做餐慢還是付款慢。',
  '能分清增加單台資源、增加處理副本與下游瓶頸。',[
   ['先找真正忙碌的位置','請求變慢可能是CPU計算、記憶體、磁碟或外部等待造成。先看證據再增加資源，否則可能替不忙的位置付更多費用。後面會專門學監控，現在先練習提出該觀察的問題。','訂單資料庫很慢時，把網頁主機數量加倍，可能只是讓更多請求同時去等同一個資料庫。'],
   ['變大與變多有不同條件','增加單台規格是讓一份工作有更多資源；增加副本則讓多份工作分攤流量。後者需要入口分流，也要讓請求不依賴某台主機獨有的資料。前面學的狀態外部化，現在成為擴展的條件。','如果登入資料只在第一台記憶體，客人被分到第二台就可能失去狀態；增加主機前要先處理這個依賴。'],
   ['新增能力需要時間','新主機要啟動、載入程式並完成就緒檢查，不能把建立要求送出當成即時可用。還要留意資料庫與外部服務承受的總流量。下一課再用容量下限、目標與上限控制這個過程。','午餐十二點整才開始啟動需要十分鐘的應用，前十分鐘仍可能排隊；可預期尖峰需要提前準備。']
  ],'每天十二點網站變慢，但所有主機都還健康。',
  ['先比較尖峰前後的工作量與各層等待。','確認應用是主要瓶頸，且能用多份副本分攤。','安排提前就緒與下游容量，再用自動化調整台數。'],'先知道擴展要解決什麼，下一課才設定Auto Scaling的容量與政策。',
  '看到網站變慢，第一步最合理的是？',['無條件把每個服務都加倍。','先找出忙碌或等待的位置。','假定所有變慢都是主機壞掉。'],1,
  ['可能增加費用卻沒有改善瓶頸。','正確。不同限制需要不同處理。','過載與故障是不同原因。']);
 short('recovery-first','副本也可能一起錯：備份與復原目標',
  '我們已處理部分故障接手，但有人誤刪訂單時，副本可能忠實地複製同一個錯誤。這時需要的是回到較早的資料狀態。本課把「繼續服務」與「找回資料」分開，再介紹兩個描述復原需求的時間目標。',
  '另一台收銀機能接手工作，訂單簿的歷史影本則能找回被擦掉的內容，兩者目的不同。',
  '能用可停多久、可少多少資料，分別解釋RTO與RPO。',[
   ['接手不會自動撤回錯誤','複寫讓多份資料跟上變更，備份則提供可用來還原的保存點。若錯誤刪除也被複寫，正常副本可能不再包含較早內容。先看需要防範哪類事故，再選版本、備份或其他保護。','兩個位置都已收到刪除訂單的操作，換到另一個位置不會自動找回昨天那筆資料。'],
   ['RTO問可以停多久','復原時間目標RTO描述業務最多能接受服務中斷多久。需要下載備份、建立環境與驗證結果，都可能占用時間。有備份不代表立刻恢復，必須測試整個還原流程所需時間。','餐廳若只能接受半小時中斷，還原流程實測兩小時就不符合需求，即使資料最後找得回來。'],
   ['RPO問可以少哪段資料','復原點目標RPO描述可接受的資料落差，以時間衡量。若只靠昨晚備份，今天新增訂單可能不在其中；仍要看是否有其他可還原機制。下一課才比較復原策略，先把兩種目標寫清楚。','能在十分鐘內開好網站，卻只找回昨天資料，代表恢復速度與資料落差仍是兩個獨立結果。']
  ],'備份可還原到一小時前，重建需要二十分鐘；業務只允許遺失五分鐘資料。',
  ['把重建時間與資料保存點分開記錄。','即使二十分鐘符合中斷容忍，仍要檢查資料落差。','目前一小時的復原點不滿足五分鐘的資料目標，需改善保存機制。'],'下一課才用RTO與RPO比較災難復原方案，避免先背策略名稱再猜用途。',
  '要求最多只能少五分鐘的資料，主要是在描述？',['RPO。','只是在描述CPU速度。','只是在描述RTO。'],0,
  ['正確。描述可接受的復原資料落差。','處理速度不直接等同復原點。','RTO描述中斷時間目標。']);
 short('event-first','可以稍後做的工作：從等候到訊息',
  '客人送出訂單後，有些工作要立即完成，例如確認是否接受；寄通知、產生報表等工作可能可以稍後做。若把全部工作串在同一條等待路徑，較慢的附屬工作就會拖住下單。本課先劃分立即與稍後，再介紹事件與佇列。',
  '櫃檯先接受有效訂單，再把待做事項交到工作清單；清單不會自己做菜，仍需要處理者。',
  '能區分接受訂單、保存待辦與完成後續工作的三個時間點。',[
   ['先確認哪些結果必須立即知道','不是所有工作都能改成稍後處理。顧客是否成功下單，要有明確接受條件；非核心通知則可能允許延後。先依業務定義成功，才能拆流程，不能只為了快就先回覆所有事情已完成。','訂單已可靠接受與簡訊已寄出可以是不同狀態；畫面應清楚表達，而不是把後者假裝已經完成。'],
   ['事件描述已發生的事','事件是訊息，例如「某筆訂單已接受」或「某張照片已上傳」。它提供後續程式需要的資訊或資料位置，但不是執行工作的程式本身。處理者收到後，仍需依權限與規則讀資料並完成動作。','照片上傳事件可以指出桶與key，縮圖程式再去讀內容；不必把整張照片都塞進事件文字。'],
   ['佇列保存待處理訊息','佇列可先保留待辦，讓處理者依能力取出。這能緩衝工作量與部分短暫中斷，但不保證工作自然完成，也不取消重試與重複處理風險。下一課會拆開SQS的取件、完成與失敗流程。','通知系統暫時停止時，訂單接受與通知待辦可分開；恢復後仍要處理積壓，不能把待辦存在當成通知已送達。']
  ],'寄信服務變慢，客人每次下單都要等待很久，團隊想把通知移到後面。',
  ['先定義訂單何時才算可靠接受。','把可延後的通知保存成待處理工作。','安排處理者與失敗追蹤，回覆時只承諾已經完成的結果。'],'先理解工作交接，再學SQS如何保存與重送訊息；Lambda則稍後負責執行其中的程式。',
  '通知訊息進入佇列，能直接表示什麼？',['通知已到每位客人手上。','待處理工作已交入佇列，仍需後續執行。','不需要任何處理程式。'],1,
  ['進入待辦不代表後續動作完成。','正確。接受、排隊與完成是不同狀態。','佇列保存工作描述，不會替代業務程式。']);

 short('cloud-location','資源放在哪裡：先認識區域與位置',
  '已知道AWS提供租用能力，準備建立資源時還會遇到位置選擇。先用地圖理解Region與AZ，讓下一階段的網路範圍有位置可以對照。本課只學資源在哪裡；為何要跨位置備援，會等實際討論故障時再回來。',
  '先選在哪個城市工作，再看城市裡不同的工作地點；現在只辨認位置，不急著安排備用據點。',
  '能畫出一個Region裡有多個AZ，並說出EC2需要安排所在位置。',[
   ['區域是地理選擇','Region表示AWS的一個地理區域。建立許多種類資源時，要先選使用哪個區域。選擇會影響資料位置、使用者距離與可用服務；現在先認得這個範圍，不必背下所有區域代碼。','你想查看先前建立的EC2，若切到另一個區域，可能看不到那項區域資源；不是它必然已被刪除。'],
   ['區域內有多個可用區','AZ是Region內隔離的位置，可由一個或多個資料中心組成。現在先把它畫成大框裡的多個小框；後面談網路時，會知道子網路屬於特定AZ。詳細故障隔離理由會在第三階段建立。','一個Region不等於一台電腦；一個AZ也不是只能放一台EC2。地點範圍與資源數量要分開看。'],
   ['在原圖補上位置，不增加功能','把EC2等資源放進對應的地點框，並註記位置不會自動提供功能或資料副本。現在只需要知道資源不是漂浮在抽象雲朵裡。是否要另一份、放在哪裡，要有明確需求才決定。','在另一個Region建立空間，不會自動讓原本訂單出現；資料搬移與複寫是之後另外安排的工作。']
  ],'工程師在東京區域建立一台EC2，切到其他區域後找不到它。',
  ['先確認目前管理介面選到哪個區域。','回到資源原本所在位置查看。','分清地點選擇與資源是否存在，不先認定資料已遺失。'],'下一課先用這些位置容納應用的連線路徑；跨AZ備援會在看見單點故障後再教。',
  'Region與AZ最基本的關係是？',['Region包含多個AZ。','AZ包含全球所有Region。','每個Region只等於一台EC2。'],0,
  ['正確。先畫大範圍與內部隔離位置。','層級相反。','地理範圍與電腦數量不同。']);
 short('architecture-principles','整合回顧：品質目標與共用責任',
  '整個網站已經能描述處理、保護、接手、擴展與費用，現在才適合把這些判斷整理成架構品質。這課用熟悉的具體決定理解六大支柱，再檢查使用不同服務時，哪些責任由AWS處理，哪些仍由團隊完成。這些原本放在第一課的內容，現在可以回到實際經驗解釋。',
  '像餐廳開起來後再檢查服務品質：不只做得出餐，還要安全、穩定、有效率，並能長期營運。',
  '能把已學設計對應到品質目標，並說明租用不同服務時管理責任如何改變。',[
   ['品質目標來自實際需求','安全關心誰能做什麼與資料保護；可靠性關心故障後是否仍能提供所需功能；效能效率關心資源是否適合工作；成本最佳化關心滿足需求後如何減少不必要支出。這些是同一架構的不同觀察角度，不是互不相關的產品清單。','跨AZ副本改善特定故障可用性，但也增加費用；不能單看一個數字，就把整個方案判定為最好。'],
   ['補上持續營運與永續','營運卓越關心如何部署、觀察、改善與回應事故；永續性則關心使用資源的效率及環境影響。連同前面四個角度，形成Well-Architected六大支柱。現在可把它們當成檢查清單，逐項詢問，而不是第一次看見就硬背名稱。','可重建配置、監控與還原演練讓系統更容易維持；減少無效工作與閒置資源也能改善資源使用。'],
   ['逐項分配供應商與團隊責任','AWS負責其提供的雲端基礎設施，客戶仍需管理自己的資料、授權與應用。服務抽象層不同，交由供應商處理的項目也不同。比較EC2與受管理資料庫時，要逐項問作業系統、資料模型、備份設定與應用驗證由誰負責，而非籠統說全部外包。','使用EC2仍要安排主機裡的系統維護；使用RDS可交出更多資料庫管理工作，但不會替你決定訂單欄位或誰能讀資料。']
  ],'團隊用受管理服務後停止檢查資料存取與備份還原，認為所有安全與可靠性都由供應商保證。',
  ['把資料、授權、應用與基礎設施責任逐項列出。','依實際服務分配責任，不把受管理等同所有工作消失。','用各品質角度檢查缺口，再確認方案是否滿足既定限制。'],'這份回顧把已做過的設計整理成判斷框架。下一課才把它對應考綱與情境題。',
  '受管理服務減少維護後，哪個判斷仍合理？',['客戶不必再決定資料權限。','責任會依服務改變，仍需逐項確認自己的資料與應用責任。','所有品質目標都會自動達成。'],1,
  ['資料授權仍需要設計。','正確。必須看服務與具體責任。','服務功能不能取代完整設計與驗證。']);

 a['network-security'].steps[2]={title:'把規則放回同一個網站',explanation:'回到公開入口、應用與資料庫。先列出必要流量，再讓資料庫只接受應用需要的連線，應用只接受入口需要的連線。安全群組處理相關資源的通行範圍，ACL處理子網路邊界。這些規則不會取代IAM的資料操作授權；兩種檢查需要分別成立。',example:'應用可連到資料庫通訊埠，不代表它有權讀每張表；角色可讀S3，也不表示任何網路路徑都已建好。'};
 a['network-security'].workedExample={situation:'訂餐網站已能連線，但資料庫允許任意來源建立連線。團隊想縮小暴露範圍，又不影響應用正常下單。',reasoning:['先畫出入口到應用、應用到資料庫的必要方向與通訊埠。','讓資料庫安全群組只允許需要的應用來源，再確認相關ACL與回程不會阻擋。','測試應用可正常使用、無關來源無法建立不必要連線，同時保留資料操作授權。'],conclusion:'先限制必要連線，再分別驗證網路通行與資料權限。私有端點是另一種路徑設計，可在考點筆記補充。'};
 a['network-security'].intro='VPC已決定資料往哪裡走，IAM已決定誰能操作資料；現在回到中間的連線，限制哪些流量能抵達應用與資料庫。本課先比較安全群組與網路ACL，再把允許範圍放回訂餐網站。私有端點不在這一輪主線裡，理解基本連線後再展開考點筆記。';
 a['network-security'].outcome='能區分安全群組與ACL，並替入口、應用、資料庫限制必要連線。';
 a['s3-security'].steps[2]={title:'只分享需要的物件與時間',explanation:'顧客下載一份收據，不代表他需要讀取整個桶。預先簽署URL是一種有時效、依簽署者權限操作指定物件的方式；它提供受控分享入口，但不是完整的使用者登入系統。先依對象、物件與時間限制分享，不因讀圖失敗就把全部內容設公開。',example:'網站確認顧客可下載自己的收據後，提供短時間有效的指定檔案連結，而不是把所有顧客收據都公開。'};
 a['s3-security'].workedExample.reasoning[1]='對讀圖失敗，先確認使用的身分與指定物件權限，若需分享單一檔案就評估受控連結；不為了排錯全面公開桶。CloudFront會在分發階段另教。';
 a.elb.steps[0]={title:'先讓客人只找一個共同入口',explanation:'負載平衡器接收客人的要求，再把它交給後方適合的應用。listener描述入口接收的連線，目標群組描述可接收某類流量的一組後端。先把這三個位置畫清楚：客人、入口、應用；入口不代替應用完成訂單規則，也不保存整個購物車。',example:'客人只使用同一個網站入口，後方兩台健康應用都能處理訂單；不必叫客人自行挑選哪台主機。'};
 a.elb.steps[1]={title:'再決定要求交給哪一類應用',explanation:'Application Load Balancer簡稱ALB，能理解HTTP請求中的主機名稱與網址路徑。若網站把訂單與菜單分成不同應用，可依/orders與/menu送到對應目標群組。現在先用我們熟悉的HTTP網站練習；需要其他傳輸協定時，再展開筆記比較NLB。',example:'同一入口收到/menu交給菜單應用，收到/orders交給訂單應用。每組仍需自己執行正確處理與保存資料。'};
 a.elb.intro='我們已有多份能接手的應用，接下來還缺一個共同入口，讓客人不用自己猜哪台健康。本課先以HTTP訂餐網站認識負載平衡器，依序學入口、目標群組、路由與健康檢查。等這條流程清楚後，再在考點筆記比較其他協定使用的NLB。';
 a.autoscaling.steps[1].explanation='目標追蹤策略嘗試把某個可用指標維持在設定目標附近。CPU可能適合計算型工作，每個目標的請求量則可能更貼近網站流量。先觀察工作實際忙在哪裡，再設定策略；若程式主要在等外部服務，CPU很低也可能已有大量要求等待，單看CPU會錯過壓力。';
 a.autoscaling.workedExample.reasoning[2]='檢查資料庫連線與查詢負擔，避免無限制增加應用台數。需要更多處理方式時先記下瓶頸，之後的快取與非同步課程會分別回來解決。';

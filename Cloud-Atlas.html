  function prerequisiteHTML(ids){return ids.length?`<section class="term-prerequisites"><strong>這些概念不熟時，再點開補充</strong><div>${ids.map(id=>`<button type="button" data-term-open="${escape(id)}">${escape(termName(id))} ↗</button>`).join('')}</div><small>放心往下查，按「上一步」就能回來繼續讀。</small></section>`:'';}
  function termContent(entry,detail,prerequisites=[]) {
    if(!pinned || !detail)return `<p class="term-simple-definition">${escape(entry.plain)}</p>${prerequisiteHTML(prerequisites)}<div class="term-analogy"><strong>先用生活經驗理解</strong><p>${escape(entry.analogy)}</p></div><h3>具體例子</h3><p>${escape(entry.example)}</p><div class="term-confusion"><strong>容易混淆的地方</strong><p>${escape(entry.confusedWith)}</p></div>`;
    return `<section class="term-start"><span class="tag">先從你熟悉的問題開始</span><p>${escape(detail.startingPoint)}</p></section><section><h3>它到底是什麼？</h3><p>${escape(detail.meaning)}</p></section>${prerequisiteHTML(prerequisites)}<div class="term-analogy"><strong>生活比喻幫你建立畫面</strong><p>${escape(entry.analogy)}</p></div><section><h3>為什麼需要它？</h3><p>${escape(detail.why)}</p></section><section class="term-how"><h3>拆開來，一步一步看</h3>${detail.how.map((step,i)=>`<div class="term-mechanism"><span>${i+1}</span><div><h4>${escape(step.title)}</h4><p>${escape(step.body)}</p></div></div>`).join('')}</section><section class="term-case"><span class="tag gold">完整案例</span><h3>${escape(detail.walkthrough.situation)}</h3><ol>${detail.walkthrough.steps.map(step=>`<li>${escape(step)}</li>`).join('')}</ol><div class="term-result"><strong>最後發生了什麼？</strong><p>${escape(detail.walkthrough.result)}</p></div></section><section><h3>跟其他概念差在哪裡？</h3>${detail.compare.map(item=>`<div class="term-compare"><h4>${escape(termName(item.with))}</h4><p>${escape(item.explanation)}</p></div>`).join('')}</section><section class="term-self-check"><h3>換你用自己的話想一次</h3><p>${escape(detail.check.question)}</p><details><summary>想過之後，再看解釋</summary><p>${escape(detail.check.answer)}</p></details></section>`;
  }
  function renderTerm(focusHeading=false) {
    const current=termNavigation.current(),panel=document.getElementById('term-popover');if(!current||!panel)return;
    const entry=lookup.get(current.id),detail=termLessons[current.id],history=termNavigation.snapshot();
    const previous=history.items[history.index-1],next=history.items[history.index+1];
    const prerequisites=(detail?.prerequisites||[]).filter(id=>lookup.has(id)&&id!==current.id);
    panel.classList.toggle('is-reader',pinned);
    panel.innerHTML=`<div class="term-dialog-header"><div class="popover-head"><div><span class="popover-label">${pinned?'名詞閱讀室 · 點內文名詞可繼續往下查':'名詞快速理解 · 點一下可完整閱讀'}</span><h2 id="term-popover-title" tabindex="-1">${escape(entry.term)}</h2></div><div class="term-header-actions">${pinned?`<div class="term-font-tools"><button type="button" data-term-font="-10" aria-label="縮小閱讀室文字">A−</button><output data-term-scale>${scale}%</output><button type="button" data-term-font="10" aria-label="放大閱讀室文字">A＋</button></div>`:''}<button type="button" data-close-term aria-label="關閉名詞解釋">×</button></div></div><div class="term-navigation"><button type="button" data-term-back ${previous?'':'disabled'} aria-label="${previous?'回到上一個名詞：'+escape(termName(previous.id)):'沒有上一個名詞'}">← 上一步</button><span role="status">${history.index+1} / ${history.items.length} 層</span><button type="button" data-term-forward ${next?'':'disabled'} aria-label="前往下一個名詞">下一步 →</button></div><nav class="term-breadcrumbs" aria-label="名詞閱讀路徑"><ol>${history.items.map((item,i)=>`<li><button type="button" data-term-jump="${i}" ${i===history.index?'aria-current="page"':''}>${escape(termName(item.id))}</button></li>`).join('')}</ol></nav>${pinned?`<details class="term-search-details" ${termSearchOpen?'open':''}><summary>找其他名詞</summary><div class="term-search"><label for="term-dialog-search">不懂哪個名詞？可以直接找</label><div class="term-search-field"><input id="term-dialog-search" type="search" autocomplete="off" placeholder="例如 S3、EC2、Lambda、虛擬電腦"><div id="term-search-results" aria-live="polite" hidden></div></div><div class="term-quick-links">快速開啟：${['s3','ec2','lambda'].filter(id=>lookup.has(id)&&id!==current.id).map(id=>`<button type="button" data-term-open="${id}">${escape(id==='s3'?'S3':id==='ec2'?'EC2':'Lambda')}</button>`).join('')}</div></div></details>`:''}</div><div class="term-dialog-body" id="term-dialog-body">${termContent(entry,detail,prerequisites)}<section class="term-sources"><h3>AWS 官方延伸閱讀</h3>${(detail?.sources?.length?detail.sources:[{title:'官方主題說明',url:entry.source}]).map(source=>`<a href="${escape(source.url)}" target="_blank" rel="noopener noreferrer">${escape(source.title)} ↗</a>`).join('')}</section></div><div class="term-dialog-footer">${pinned?'<small>點虛線字繼續查；可返回原閱讀位置。Esc 關閉。</small>':'<button type="button" data-term-expand>展開完整教學與案例 →</button><small>內文中的虛線名詞也可以點開，並可返回上一步。</small>'}</div>`;
    panel.hidden=false;setTermModal(pinned);annotate(panel.querySelector('.term-dialog-body'),current.id);positionTerm();
    const body=panel.querySelector('.term-dialog-body');body.scrollTop=current.scroll;
    if(focusHeading)panel.querySelector('#term-popover-title').focus({preventScroll:true});
  }
  function rememberTermScroll(){termNavigation.remember(document.getElementById('term-dialog-body')?.scrollTop||0);}
  function termHasFocus(){return document.activeElement===trigger||document.getElementById('term-popover')?.contains(document.activeElement);}
  function navigateTerm(id) {
    if(!lookup.has(id))return;
    clearTimeout(hideTimeout);rememberTermScroll();
    if(termNavigation.open(id)){pinned=true;renderTerm(true);}
  }
  function openTerm(button, pin=false) {
    if(!lookup.has(button.dataset.term)||pinned&&!pin)return;
    clearTimeout(hideTimeout);trigger?.setAttribute('aria-expanded','false');trigger=button;pinned=pin;
    termSearchOpen=!matchMedia('(max-width: 600px)').matches;
    if(pin){document.getElementById('reading-settings').hidden=true;document.getElementById('reading-toggle').setAttribute('aria-expanded','false');}
    termNavigation.open(button.dataset.term,true);button.setAttribute('aria-expanded','true');renderTerm(pin);
  }

  function setScale(value,persist=true) {
    const numeric=Number(value);scale=Number.isFinite(numeric)?Math.max(90,Math.min(200,Math.round(numeric/10)*10)):100;
    document.documentElement.style.setProperty('--text-scale',String(scale/100));
    const slider=document.getElementById('text-scale');
    if(slider){slider.value=String(scale);slider.setAttribute('aria-valuetext',scale+'%');}
    const output=document.getElementById('text-scale-value');if(output)output.textContent=scale+'%';
    const toggle=document.getElementById('reading-toggle');if(toggle)toggle.textContent='Aa '+scale+'%';
    document.querySelectorAll('[data-term-scale]').forEach(output=>output.textContent=scale+'%');
    if(persist)try{localStorage.setItem(key,String(scale));}catch{}
    positionTerm();
  }

  function diagramState(id) {
    if(!diagramStates.has(id))diagramStates.set(id,{step:0,node:null,edge:0,failed:null,zoom:100,mode:'flow'});
    return diagramStates.get(id);
  }
  function explorerHTML(architecture) {
    const id=escape(architecture.id);
    return `<div class="diagram-explorer" data-explorer="${id}"><div class="diagram-toolbar"><div><strong>親手追一次資料流</strong><span>點元件看作用，點箭頭看傳什麼</span></div><div class="diagram-zoom" aria-label="架構圖縮放"><button type="button" data-diagram-action="zoom-out" data-architecture="${id}" aria-label="縮小架構圖">−</button><output data-diagram-zoom="${id}">100%</output><button type="button" data-diagram-action="zoom-in" data-architecture="${id}" aria-label="放大架構圖">＋</button><button type="button" data-diagram-action="reset" data-architecture="${id}">重設</button></div></div><div class="flow-controls"><button type="button" data-diagram-action="previous" data-architecture="${id}">← 上一步</button><span data-flow-label="${id}"></span><button type="button" data-diagram-action="next" data-architecture="${id}">下一步 →</button></div><div class="diagram-inspector" data-inspector="${id}" aria-live="polite"></div></div>`;
  }
  function updateDiagram(id) {
    const architecture=(window.ARCHITECTURES||[]).find(a=>a.id===id);
    const data=window.DIAGRAM_GUIDES?.[id];if(!architecture || !data)return;
    const state=diagramState(id),card=document.getElementById('arch-'+id);if(!card)return;
    const svg=card.querySelector('.diagram-stage svg');
    if(svg)svg.style.setProperty('--diagram-zoom',String(state.zoom/100));
    card.querySelector(`[data-diagram-zoom="${id}"]`).textContent=state.zoom+'%';
    const current=architecture.edges[state.step];
    card.querySelector(`[data-flow-label="${id}"]`).textContent=`第 ${state.step+1} / ${architecture.edges.length} 步：${current[2]}`;
    card.querySelector('[data-diagram-action="previous"]').disabled=state.step===0;
    card.querySelector('[data-diagram-action="next"]').disabled=state.step===architecture.edges.length-1;
    card.querySelector('[data-diagram-action="zoom-out"]').disabled=state.zoom<=75;
    card.querySelector('[data-diagram-action="zoom-in"]').disabled=state.zoom>=200;
    card.querySelectorAll('[data-arch-node]').forEach(node=>{
      const selected=state.mode==='node'?node.dataset.archNode===state.node:[current[0],current[1]].includes(node.dataset.archNode);
      node.classList.toggle('diagram-selected',selected);node.classList.toggle('diagram-failed',node.dataset.archNode===state.failed);
      node.setAttribute('aria-pressed',String(selected));
    });
    card.querySelectorAll('[data-arch-edge]').forEach(edge=>{
      edge.classList.toggle('diagram-selected',state.mode!=='node' && Number(edge.dataset.archEdge)===state.step);
      const connection=architecture.edges[Number(edge.dataset.archEdge)];
      edge.classList.toggle('diagram-disrupted',!!state.failed&&[connection[0],connection[1]].includes(state.failed));
    });
    const inspector=card.querySelector(`[data-inspector="${id}"]`);
    if(state.mode==='node' && state.node) {
      const node=architecture.nodes.find(n=>n.id===state.node),info=data.nodes[state.node];
      inspector.innerHTML=`<div class="inspector-heading"><span class="tag">元件解釋</span><h3>${escape(node.t)}</h3></div><div class="inspector-grid"><div><h4>它是什麼？</h4><p>${escape(info.what)}</p></div><div><h4>為什麼放在這裡？</h4><p>${escape(info.why)}</p></div><div><h4>失效時會發生什麼？</h4><p>${escape(info.failure)}</p></div><div><h4>選它的代價與限制</h4><p>${escape(info.tradeoff)}</p></div></div><button type="button" class="fault-toggle ${state.failed===state.node?'is-failed':''}" data-diagram-action="failure" data-architecture="${escape(id)}">${state.failed===state.node?'恢復此元件':'推演這個元件失效'}</button>${state.failed?`<div class="failure-explanation"><strong>故障推演：${escape(node.t)}</strong><p>${escape(info.failure)}</p><small>紅色標出該元件相連的路徑；這是教學推演，不代表其他元件一定同時失效。備援與切換方式請依本圖解說判斷。</small></div>`:''}`;
    } else {
      const info=data.edges.find(e=>e.from===current[0]&&e.to===current[1]);
      const from=architecture.nodes.find(n=>n.id===current[0]),to=architecture.nodes.find(n=>n.id===current[1]);
      inspector.innerHTML=`<div class="inspector-heading"><span class="tag">資料流 · 第 ${state.step+1} 步</span><h3>${escape(from.t)} → ${escape(to.t)}</h3></div><div class="inspector-grid"><div><h4>這一步傳什麼？</h4><p>${escape(info?.what||current[2])}</p></div><div><h4>需要什麼權限與保護？</h4><p>${escape(info?.security||'依來源與目的地的服務政策限制存取。')}</p></div><div><h4>如果這一步不通？</h4><p>${escape(info?.failure||'檢查來源、目的地與這條連線的設定。')}</p></div></div><p class="diagram-tip">綠色框與實線是目前追蹤的路徑。可直接點圖中的其他元件或箭頭。</p>`;
    }
    annotate(inspector);
  }

  function enhance() {
    closeTerm();
    if(!document.createElement)return;
    document.querySelectorAll('.architecture-card').forEach(card=>{
      const id=card.id.replace(/^arch-/,''),architecture=window.ARCHITECTURES.find(a=>a.id===id);
      if(architecture && !card.querySelector('.diagram-explorer')){
        card.querySelector('.diagram-stage').insertAdjacentHTML('afterend',explorerHTML(architecture));
        updateDiagram(id);
      }
    });
    annotate(document.getElementById('main'));
  }

  function init() {
    if(!document.createElement)return;
    const header=document.querySelector('.topbar');
    header.insertAdjacentHTML('beforeend','<button id="reading-toggle" class="reading-toggle" type="button" aria-expanded="false" aria-controls="reading-settings" aria-label="調整全站文字大小">Aa 100%</button>');
    document.body.insertAdjacentHTML('beforeend',`<section id="reading-settings" class="reading-settings" aria-label="全站閱讀設定" hidden><div class="popover-head"><h2>文字大小</h2><button type="button" data-close-reading aria-label="關閉閱讀設定">×</button></div><p>所有頁面的內文、選單、按鈕、表格與架構圖文字一起調整。</p><label for="text-scale">目前大小 <output id="text-scale-value">100%</output></label><input id="text-scale" type="range" min="90" max="200" step="10" value="100"><div class="reading-presets"><button type="button" data-text-size="100">標準 100%</button><button type="button" data-text-size="130">大字 130%</button><button type="button" data-text-size="160">特大 160%</button><button type="button" data-text-size="200">最大 200%</button></div><small>設定會保存在這個瀏覽器。架構圖也有獨立縮放。</small></section><div id="term-backdrop" class="term-backdrop" hidden></div><section id="term-popover" class="term-popover" role="dialog" aria-modal="false" aria-labelledby="term-popover-title" hidden></section>`);
    setScale(scale,false);
    document.getElementById('text-scale').addEventListener('input',event=>setScale(event.target.value));
    document.addEventListener('toggle',event=>{if(event.target.matches?.('.term-search-details'))termSearchOpen=event.target.open;},true);
    document.addEventListener('input',event=>{
      if(event.target.id==='term-dialog-search'){
        const query=event.target.value.trim().toLowerCase(),results=document.getElementById('term-search-results');
        results.hidden=!query;
        const matches=searchTerms(query,termNavigation.current()?.id);
        results.innerHTML=matches.length?matches.map(entry=>`<button type="button" data-term-open="${escape(entry.id)}"><strong>${escape(entry.term)}</strong><span>${escape(entry.plain)}</span></button>`).join(''):'<p>找不到這個名詞，可以試試英文名稱或中文意思。</p>';
        return;
      }
      if(event.target.id!=='glossary-filter')return;
      const query=event.target.value.trim().toLowerCase();let count=0;
      document.querySelectorAll('[data-glossary-entry]').forEach(card=>{
        const entry=lookup.get(card.dataset.glossaryEntry);
        const matches=[entry.term,...entry.aliases,entry.plain,entry.example].join(' ').toLowerCase().includes(query);
        card.hidden=!matches;if(matches)count++;
      });
      document.getElementById('glossary-visible').textContent=count+' / '+entries.length+' 個名詞';
      document.getElementById('glossary-empty').hidden=count!==0;
    });
    document.addEventListener('pointerover',event=>{
      const button=event.target.closest?.('.term');if(button&&!button.closest('#term-popover'))openTerm(button,false);
      if(event.target.closest?.('#term-popover'))clearTimeout(hideTimeout);
    });
    document.addEventListener('pointerout',event=>{
      if(!pinned && event.target.closest?.('.term,#term-popover') && !event.relatedTarget?.closest?.('.term,#term-popover'))hideTimeout=setTimeout(()=>{if(!termHasFocus())closeTerm();},240);
    });
    document.addEventListener('focusin',event=>{
      if(suppressTermFocus)return;
      const button=event.target.closest?.('.term');
      if(button&&!button.closest('#term-popover'))openTerm(button,false);
      else if(!pinned&&trigger&&!event.target.closest?.('#term-popover')&&event.target!==trigger)closeTerm();
    });
    document.addEventListener('keydown',event=>{
      if(event.key==='Escape'){
        closeTerm(true);document.getElementById('reading-settings').hidden=true;document.getElementById('reading-toggle').setAttribute('aria-expanded','false');
      }
      if(event.key==='Tab'&&pinned){
        const panel=document.getElementById('term-popover');
        const focusable=[...panel.querySelectorAll('button:not([disabled]),a[href],input:not([disabled]),summary,[tabindex="0"]')].filter(element=>element.getClientRects().length);
        const first=focusable[0],last=focusable.at(-1);
        if(event.shiftKey&&(document.activeElement===first||!panel.contains(document.activeElement))){event.preventDefault();last?.focus();}
        else if(!event.shiftKey&&(document.activeElement===last||!panel.contains(document.activeElement))){event.preventDefault();first?.focus();}
      }
      const target=event.target.closest?.('[data-arch-node],[data-arch-edge]');
      if(target && ['Enter',' '].includes(event.key)){event.preventDefault();target.dispatchEvent(new MouseEvent('click',{bubbles:true}));}
    });
    document.addEventListener('click',event=>{
      const related=event.target.closest?.('[data-term-open]');if(related){navigateTerm(related.dataset.termOpen);return;}
      const back=event.target.closest?.('[data-term-back]'),forward=event.target.closest?.('[data-term-forward]'),jump=event.target.closest?.('[data-term-jump]');
      if(back||forward||jump){rememberTermScroll();const moved=back?termNavigation.back():forward?termNavigation.forward():termNavigation.jump(Number(jump.dataset.termJump));if(moved)renderTerm(true);return;}
      if(event.target.closest?.('[data-term-expand]')){rememberTermScroll();pinned=true;renderTerm(true);return;}
      const termFont=event.target.closest?.('[data-term-font]');if(termFont){setScale(scale+Number(termFont.dataset.termFont));return;}
      const term=event.target.closest?.('.term,.term-more');
      if(term){if(term.closest('#term-popover'))navigateTerm(term.dataset.term);else if(trigger===term&&pinned)closeTerm(true);else openTerm(term,true);return;}
      if(event.target.closest?.('[data-close-term]')){closeTerm(true);return;}
      if(event.target.closest?.('#term-backdrop')){closeTerm(true);return;}
      if(!event.target.closest?.('#term-popover'))closeTerm();
      const size=event.target.closest?.('[data-text-size]');if(size)setScale(size.dataset.textSize);
      const reading=document.getElementById('reading-settings'),toggle=document.getElementById('reading-toggle');
      if(event.target.closest?.('#reading-toggle')){reading.hidden=!reading.hidden;toggle.setAttribute('aria-expanded',String(!reading.hidden));return;}
      if(event.target.closest?.('[data-close-reading]')||!event.target.closest?.('#reading-settings')){reading.hidden=true;toggle.setAttribute('aria-expanded','false');}
      const check=event.target.closest?.('[data-guide-check]');
      if(check){const guide=guides[check.dataset.guideCheck],selected=Number(check.dataset.answer),section=check.closest('.understanding-check');
        section.querySelectorAll('[data-guide-check]').forEach(button=>{
          button.classList.toggle('check-selected',button===check);button.setAttribute('aria-pressed',String(button===check));
          button.classList.toggle('check-correct',Number(button.dataset.answer)===guide.check.answer);
        });
        section.querySelector('.check-feedback').innerHTML=`<h3>${selected===guide.check.answer?'✓ 你抓到重點了':'先別急，看看這個差別'}</h3><p>${escape(guide.check.explanations[selected])}</p><details><summary>比較三個選項的原因</summary><ul>${guide.check.explanations.map((text,i)=>`<li><strong>${String.fromCharCode(65+i)}${i===guide.check.answer?'（正確）':''}：</strong>${escape(text)}</li>`).join('')}</ul></details>`;
        annotate(section.querySelector('.check-feedback'));return;
      }
      const node=event.target.closest?.('[data-arch-node]'),edge=event.target.closest?.('[data-arch-edge]'),control=event.target.closest?.('[data-diagram-action]');
      const id=node?.dataset.architecture||edge?.dataset.architecture||control?.dataset.architecture;if(!id)return;
      const state=diagramState(id),architecture=window.ARCHITECTURES.find(a=>a.id===id);
      if(node){state.mode='node';state.node=node.dataset.archNode;state.failed=null;}
      if(edge){state.mode='flow';state.step=Number(edge.dataset.archEdge);state.failed=null;}
      if(control){
        const action=control.dataset.diagramAction;
        if(action==='previous'||action==='next'){state.mode='flow';state.failed=null;state.step=Math.max(0,Math.min(architecture.edges.length-1,state.step+(action==='next'?1:-1)));}
        if(action==='zoom-in')state.zoom=Math.min(200,state.zoom+25);
        if(action==='zoom-out')state.zoom=Math.max(75,state.zoom-25);
        if(action==='reset'){Object.assign(state,{step:0,node:null,edge:0,failed:null,zoom:100,mode:'flow'});}
        if(action==='failure'&&state.node)state.failed=state.failed===state.node?null:state.node;
      }
      updateDiagram(id);
    });
    window.addEventListener('resize',positionTerm);
    window.addEventListener('scroll',event=>{if(event.target?.closest?.('#term-popover'))return;if(trigger&&!pinned&&!termHasFocus())closeTerm();else positionTerm();},true);
  }
  window.CloudAtlasUX={enhance,lessonGuide,glossaryPage,matchTerms,setScale,guides,createTermHistory,termLessons,searchTerms};
  init();
})();

</script><script>
'use strict';
(() => {
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

let storageOK=true;
const fresh=()=>({version:1,completed:[],lastLesson:null,mistakes:[],history:[],labs:[],session:null});
let state=fresh();
try{const raw=JSON.parse(localStorage.getItem(KEY));if(raw&&raw.version===1)state={...state,...raw};}catch{storageOK=false;}

 const end=`<section class="lesson-result" id="recap"><h2>回到我們的網站：這次改變了什麼？</h2><p>${esc(p.change)}</p><p>${esc(c.teachingResult)}</p><details class="recap-guide"><summary>需要複習時，沿本課範例再走一次</summary><ol>${c.reviewSteps.map(step=>`<li>${esc(step)}</li>`).join('')}</ol></details>${p.position===stage.lessons.length-1?`<div class="path-checkpoint"><strong>階段完成前，停一下</strong><p>${esc(stage.checkpoint)}</p></div>`:''}<button class="btn" data-action="complete" data-id="${esc(id)}">${done?'取消完成標記':'✓ 我已讀完講解與本課回顧，標記完成'}</button></section>`;

function diagram(a){
 const centers={};a.nodes.forEach(n=>centers[n.id]=[n.x+100,n.y+34]);
 let content='<defs><marker id="arrow-'+a.id+'" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#9eb58c"/></marker></defs>';
 content+=(a.zones||[]).map(z=>'<rect class="zone" x="'+z.x+'" y="'+z.y+'" width="'+z.w+'" height="'+z.h+'" rx="12"/><text class="zone-label" x="'+(z.x+16)+'" y="'+(z.y+23)+'">'+esc(z.label)+'</text>').join('');
 content+=a.edges.map(([from,to,label],i)=>{
  const f=centers[from],t=centers[to],dx=t[0]-f[0],dy=t[1]-f[1],vertical=Math.abs(dy)>Math.abs(dx);let x1=f[0],y1=f[1],x2=t[0],y2=t[1];
  if(vertical){y1+=Math.sign(dy)*34;y2-=Math.sign(dy)*40;}else{x1+=Math.sign(dx)*100;x2-=Math.sign(dx)*106;}
  const path='M'+x1+','+y1+' L'+x2+','+y2;
  return '<g class="diagram-edge" data-arch-edge="'+i+'" data-architecture="'+a.id+'" role="button" tabindex="0" aria-label="資料流：'+esc(label)+'"><path class="edge-hit" d="'+path+'"/><path class="wire" marker-end="url(#arrow-'+a.id+')" d="'+path+'"/><text x="'+((x1+x2)/2+3)+'" y="'+((y1+y2)/2-6)+'" text-anchor="middle" font-size="8" fill="#607651" paint-order="stroke" stroke="#f7f9f4" stroke-width="4">'+esc(label)+'</text></g>';
 }).join('');
 content+=a.nodes.map((n,i)=>'<g class="diagram-node" data-arch-node="'+n.id+'" data-architecture="'+a.id+'" role="button" tabindex="0" aria-label="查看元件說明：'+esc(n.t)+'"><title>'+esc(n.t+'：'+n.s)+'</title><rect class="'+(i===0?'node-accent':'node')+'" x="'+n.x+'" y="'+n.y+'" width="200" height="68" rx="8"/><text class="node-title" x="'+(n.x+100)+'" y="'+(n.y+29)+'" text-anchor="middle">'+esc(n.t)+'</text><text class="node-sub" x="'+(n.x+100)+'" y="'+(n.y+49)+'" text-anchor="middle">'+esc(n.s)+'</text></g>').join('');
 return '<svg viewBox="0 0 800 430" role="group" aria-label="'+esc(a.title)+'互動架構圖"><title>'+esc(a.title)+'</title><desc>'+esc(a.summary)+' 可點選元件與箭頭，或用Tab及Enter操作。</desc>'+content+'</svg>';
}

function practice(){return `${heading('理解多少，用情境來驗證。',`${Q.length} 道本站原創練習題，單選與多選均有完整選項解析。`)}${state.session&&!state.session.finished?`<div class="callout"><h3>你有一份尚未完成的${state.session.mode==='exam'?'模擬考':'練習'}</h3><p>已作答 ${Object.keys(state.session.responses).length} / ${state.session.ids.length} 題${state.session.mode==='exam'?'；倒數自開始時間持續計算':''}。</p><a class="btn" href="#quiz">繼續作答 →</a></div>`:''}<div class="two-col"><section class="panel"><div class="eyebrow">練習模式</div><h2>依領域練習，即時看懂解析</h2><p class="muted">不限時；每題送出後可看解析。多選題必須完整選對，才算答對。</p><div class="settings"><label>練習範圍<select id="practice-domain"><option value="all">所有領域</option>${Object.entries(D).filter(([id])=>id!=='D0').map(([id,d])=>`<option value="${id}">${id} ${d.short}</option>`).join('')}<option value="mistakes">僅錯題</option></select></label><label>題數<select id="practice-size"><option>10</option><option>20</option><option>30</option><option value="all">全部可用題目</option></select></label><button class="btn" data-action="start-practice">開始練習 →</button></div></section><section class="exam-info"><div class="eyebrow">最終模擬考</div><h2>65 題，130 分鐘。</h2><p class="muted">限時作答、標記複查、交卷後看解析。</p><dl><dt>領域抽題</dt><dd>20 / 17 / 15 / 13</dd><dt>計分方式</dt><dd>每題同權、完整選對</dd><dt>本站複習參考目標</dt><dd>80% 正確率</dd></dl><button class="btn" data-action="start-exam">開始模擬考 →</button><small>近似官方權重配題；本站65題均計入本地正確率。AWS正式考試有15題不計分且使用尺度分，本站不模擬官方評分模型。</small></section></div><div class="section-head"><h2>作答前，記住這三件事</h2></div><div class="grid"><div class="panel"><h3>先找硬性限制</h3><p class="note">RTO/RPO、資料模型、不可中斷、最少維運、最低成本；先刪除不滿足需求的選項。</p></div><div class="panel"><h3>多選，必須完整</h3><p class="note">題目會標示需選幾項。部分選對不給分，沒有倒扣；正式考試請依題目指示。</p></div><div class="panel"><h3>從理由學，不背位置</h3><p class="note">題序每次打亂，選項順序保留以維持解析對應。重做同題可能提高成績，不能當作獨立準備度評估。</p></div></div>${historyHTML()}`;}
function shuffle(items){const a=[...items];for(let i=a.length-1;i>0;i--){let j;try{const x=new Uint32Array(1);crypto.getRandomValues(x);j=x[0]%(i+1);}catch{j=Math.floor(Math.random()*(i+1));}[a[i],a[j]]=[a[j],a[i]];}return a;}
function startSession(mode,domain='all',size=10){if(state.session&&!state.session.finished){toast('已有未完成測驗，請先完成或放棄。');location.hash='#quiz';return;}let chosen=[];if(mode==='exam'){for(const [d,n]of Object.entries({D1:20,D2:17,D3:15,D4:13})){const pool=Q.filter(q=>q.domain===d);if(pool.length<n){toast('題庫數量不足，暫時無法建立模擬考。');return;}chosen.push(...shuffle(pool).slice(0,n));}}else{const pool=Q.filter(q=>domain==='all'||(domain==='mistakes'?state.mistakes.includes(q.id):q.domain===domain));chosen=shuffle(pool).slice(0,size==='all'?pool.length:Number(size));}if(!chosen.length){toast('這個範圍還沒有題目。請選擇其他領域。');return;}state.session={mode,ids:shuffle(chosen).map(q=>q.id),index:0,responses:{},revealed:[],flags:[],startedAt:Date.now(),endAt:mode==='exam'?Date.now()+130*60*1000:null,finished:false};save();if(location.hash==='#quiz')render();else location.hash='#quiz';}
const equal=(a,b)=>a.length===b.length&&[...a].sort((x,y)=>x-y).every((v,i)=>v===[...b].sort((x,y)=>x-y)[i]);
function quiz(){const s=state.session;if(!s||s.finished)return `<div class="empty"><h2>目前沒有進行中的測驗</h2><p>先選擇練習模式，或開始完整模擬考。</p><a class="btn" href="#practice">前往測驗中心</a></div>`;const q=Q.find(q=>q.id===s.ids[s.index]);if(!q)return notFound();const reveal=s.revealed.includes(q.id),answer=s.responses[q.id]||[];return `<div class="exam-toolbar"><div><span class="tag">${s.mode==='exam'?'模擬考':'練習模式'}</span><span class="tag gold">第 ${s.index+1} / ${s.ids.length} 題</span></div>${s.mode==='exam'?'<div><span class="note">剩餘時間 </span><span class="timer" id="timer"></span></div>':'<span class="note">不限時 · 送出本題後可查看解析</span>'}<button class="btn ghost" data-action="abandon">放棄本次測驗</button></div><div class="quiz-layout"><section class="panel"><div class="row between"><div>${tag(q.domain+' · '+D[q.domain].short)}${tag(q.topic,'blue')}</div><button class="btn ghost" data-action="flag">${s.flags.includes(q.id)?'★ 已標記':'☆ 標記複查'}</button></div><h1 class="question">${esc(q.question)}</h1><div class="note">${q.answers.length>1?`多選題 · 請選 ${q.answers.length} 項`:'單選題 · 請選 1 項'}</div><div>${q.options.map((o,i)=>`<label class="option ${answer.includes(i)?'selected':''} ${reveal?(q.answers.includes(i)?'correct':answer.includes(i)?'incorrect':''):''}"><input type="${q.answers.length>1?'checkbox':'radio'}" name="answer" value="${i}" ${answer.includes(i)?'checked':''} ${reveal?'disabled':''}><span class="letter">${String.fromCharCode(65+i)}</span><span>${esc(o)}</span></label>`).join('')}</div>${reveal?explanationHTML(q,answer):''}<div class="quiz-controls"><button class="btn secondary" data-action="prev-q" ${s.index===0?'disabled':''}>← 上一題</button>${s.mode==='practice'&&!reveal?`<button class="btn" data-action="reveal">送出本題，看解析</button>`:''}<button class="btn ${s.index===s.ids.length-1?'secondary':''}" data-action="next-q" ${s.index===s.ids.length-1?'disabled':''}>下一題 →</button></div></section><aside class="panel" style="align-self:start"><h3>答題導覽</h3><div class="note">綠底：已作答 · 底線：已標記</div><div class="question-palette">${s.ids.map((id,i)=>`<button class="${s.responses[id]?.length?'answered':''} ${i===s.index?'current':''} ${s.flags.includes(id)?'flagged':''}" data-action="jump-q" data-index="${i}" aria-label="第${i+1}題${s.responses[id]?.length?'已作答':'未作答'}${s.flags.includes(id)?'，標記複查':''}">${i+1}</button>`).join('')}</div><p class="note" id="answered-count">已作答 ${Object.keys(s.responses).filter(id=>s.responses[id].length).length} / ${s.ids.length} 題<br>未作答視為答錯。</p><button class="btn" style="width:100%" data-action="submit-exam">結束並交卷</button></aside></div>`;}
function explanationHTML(q,answer){const ok=equal(answer,q.answers);return `<div class="explanation"><h3>${ok?'✓ 回答正確':'再看一次這個取捨'} · 正解 ${q.answers.map(x=>String.fromCharCode(65+x)).join('、')}</h3><p>${esc(q.explanation)}</p><ul>${q.optionExplanations.map((x,i)=>`<li><strong>${String.fromCharCode(65+i)}${q.answers.includes(i)?' ✓':''}：</strong>${esc(x)}</li>`).join('')}</ul>${sourceLink(q.source,'核對 AWS 官方說明')}</div>`;}
function finishSession(auto=false){const s=state.session;if(!s||s.finished)return;const stats={D1:{correct:0,total:0},D2:{correct:0,total:0},D3:{correct:0,total:0},D4:{correct:0,total:0}};let correct=0;for(const id of s.ids){const q=Q.find(q=>q.id===id);if(!q)continue;stats[q.domain].total++;const ok=equal(s.responses[id]||[],q.answers);if(ok){correct++;stats[q.domain].correct++;state.mistakes=state.mistakes.filter(x=>x!==id);}else if(!state.mistakes.includes(id))state.mistakes.push(id);}s.finished=true;s.result={correct,total:s.ids.length,percent:Math.round(correct/s.ids.length*100),stats,auto,elapsed:Math.min(Date.now()-s.startedAt,s.mode==='exam'?130*60*1000:Infinity)};state.history.unshift({date:new Date().toISOString(),mode:s.mode,...s.result});state.history=state.history.slice(0,30);save();location.hash='#results';render();}
function results(){const s=state.session;if(!s?.finished)return `<div class="empty"><h2>先完成一次測驗</h2><p>交卷後會在此看到領域表現與完整解析。</p><a class="btn" href="#practice">開始測驗</a></div>`;const r=s.result;return `${heading('讓每一道錯題，成為下一次的判斷力。',r.auto?'時間已到，系統已自動交卷。':'本次作答已儲存在這個瀏覽器。')}<section class="panel"><div class="eyebrow">本次${s.mode==='exam'?'模擬考':'練習'}結果</div><div class="result-score">${r.percent}<small>%</small></div><p class="muted">${r.correct} / ${r.total} 題正確 · 用時 ${Math.floor(r.elapsed/60000)} 分 ${Math.floor(r.elapsed/1000)%60} 秒</p><div class="callout"><p>${r.percent>=80?'已達本站自訂複習目標。請繼續驗證你能解釋每個選項的取捨。':'建議先閱讀弱項課程，再遮住解析重新練習。'} 本站正確率不等於 AWS 尺度分，也不能預測正式考試結果。</p></div><div class="score-grid">${Object.entries(r.stats).map(([d,v])=>`<div class="stat"><label>${D[d].short}</label><strong>${v.total?Math.round(v.correct/v.total*100):'—'}<small>${v.total?'%':'無題目'}</small></strong><small>${v.correct} / ${v.total} 題</small></div>`).join('')}</div><div class="link-row" style="margin-top:20px"><a class="btn" href="#mistakes">複習錯題 →</a><a class="btn secondary" href="#courses">回到課程</a><a class="btn secondary" href="#practice">再次練習</a></div></section><div class="section-head"><h2>逐題回顧 · ${r.total} 題</h2></div><section class="panel">${s.ids.map((id,i)=>{const q=Q.find(q=>q.id===id),answer=s.responses[id]||[],ok=equal(answer,q.answers);return `<details class="review-item"><summary>${ok?'✓':'✕'} ${i+1}. ${esc(q.question)}</summary><p class="muted">你的答案：${answer.length?answer.map(x=>String.fromCharCode(65+x)).join('、'):'未作答'}</p><ol type="A">${q.options.map(x=>`<li>${esc(x)}</li>`).join('')}</ol>${explanationHTML(q,answer)}</details>`;}).join('')}</section>`;}
function historyHTML(){return state.history.length?`<div class="section-head"><h2>最近的練習紀錄</h2></div><div class="table-wrap"><table><thead><tr><th>日期</th><th>模式</th><th>答對題數</th><th>正確率</th></tr></thead><tbody>${state.history.slice(0,10).map(h=>`<tr><td>${new Date(h.date).toLocaleString('zh-TW')}</td><td>${h.mode==='exam'?'模擬考':'練習'}</td><td>${h.correct} / ${h.total}</td><td>${h.percent}%</td></tr>`).join('')}</tbody></table></div>`:'';}

function sources(){return `${heading('知識有來源，判斷有依據。','教材與題目為原創繁體中文整理，官方文件連結附於各課與各題。')}<section class="article narrow"><h2 style="margin-top:0">考試規格與內容邊界</h2><p>資料查核日為 2026 年 11 月 7 日。SAA-C03 官方考綱權重：安全30%、韌性26%、效能24%、成本20%；正式考試65題、130分鐘，50題計分與15題不計分，最低通過為720尺度分（100–1000）。USD 150為基準費用，匯率、稅額與政策以報名頁為準。</p><p>本站提供 ${C.length} 堂核心課程、8 組架構圖、10 個實作、9 組選型比較與 ${Q.length} 道原創題，涵蓋四大領域及常見服務。官方考綱的服務清單非窮盡清單；本站不是所有 AWS 功能的百科，也不保證涵蓋每一個正式考題。</p>${[
['AWS Certified Solutions Architect – Associate','https://aws.amazon.com/certification/certified-solutions-architect-associate/','考試時間、題數、費用與報考資訊'],
['SAA-C03 官方 Exam Guide','https://docs.aws.amazon.com/aws-certification/latest/solutions-architect-associate-03/solutions-architect-associate-03.html','領域、任務、尺度分與服務範圍'],
['SAA-C03 官方 In-scope services','https://docs.aws.amazon.com/aws-certification/latest/solutions-architect-associate-03/saa-03-in-scope-services.html','考綱內服務清單；非窮盡清單且可能更新'],
['AWS Skill Builder','https://skillbuilder.aws/','官方考前學習、Practice Question Set 與 Practice Exam；部分資源需登入或付費'],
['AWS Well-Architected Framework','https://docs.aws.amazon.com/wellarchitected/latest/framework/welcome.html','六大支柱與架構最佳實務'],
['AWS Architecture Center','https://aws.amazon.com/architecture/','參考架構、架構決策與官方圖解'],
['AWS Workshops','https://workshops.aws/','延伸動手做的官方工作坊'],
['AWS Pricing Calculator','https://calculator.aws/','部署前估算資源與流量費用'],
['AWS 文件入口','https://docs.aws.amazon.com/','查核區域支援、配額、限制與最新功能']
].map(([t,u,b])=>`<a class="link-card" href="${u}" target="_blank" rel="noopener noreferrer">${t} ↗<small>${b}</small></a>`).join('')}<h2>測驗如何運作</h2><p>單選題選1項，多選題完整選對才得分；本站每題同權、不倒扣、不給部分分。模擬考依四領域抽取20、17、15、13題，共65題，130分鐘。這是近似權重的學習工具，沒有模擬官方未計分題或尺度化評分。80%只是本站自訂複習參考目標。</p><p>題目全部為本站原創，並非官方題庫或真題。題庫有重複練習效應，建議另用 AWS 官方練習資源驗證陌生情境的判斷力。</p><h2>學習紀錄與隱私</h2><p>課程完成度、實作、錯題、作答與最近30次成績，儲存在瀏覽器 localStorage。沒有帳號、後端或跨裝置同步；清除瀏覽資料或換網址會影響紀錄。請用左側匯出／匯入保存備份。測驗重新整理可恢復，計時考試的期限持續計算；不同分頁請避免同時作答。</p><p>${storageOK?'目前瀏覽器允許本機儲存。':'目前瀏覽器限制本機儲存；本次狀態僅保留於記憶體，請匯出。'} 此單檔版使用系統字體，教材與測驗不需要網路。外部官方連結需要網路。</p><h2>更新與使用</h2><p>服務行為、配額、費用及考綱會改版。每課與每題保留官方來源，遇到版本差異時以AWS官方最新文件為準。架構圖為教學示意，非直接可部署的完整設計。實作需自行建立 AWS 測試資源並清理。</p><p>Cloud Atlas 是獨立學習素材，未受 AWS 背書或認證；AWS 與相關服務名稱歸各權利人所有。GitHub 星數為查核當下的 repository 數字。</p></section>`;}
function search(term){const t=term.toLowerCase();const lessons=C.filter(c=>[c.title,c.summary,...c.sections.flatMap(s=>[s.title,s.body,...(s.bullets||[])])].join(' ').toLowerCase().includes(t));const questions=Q.filter(q=>[q.question,q.topic].join(' ').toLowerCase().includes(t));return `${heading(`搜尋「${esc(term)}」`,`找到 ${lessons.length} 堂課、${questions.length} 道相關練習題。`)}${lessons.length?`<div class="grid">${lessons.map(card).join('')}</div>`:'<div class="empty">沒有找到課程。試試英文服務名稱，例如 S3、IAM、RDS。</div>'}${questions.length?`<div class="section-head"><h2>相關情境</h2></div><div class="panel">${questions.slice(0,20).map(q=>`<div class="review-item">${tag(q.domain+' · '+q.topic)}<p>${esc(q.question)}</p><button class="btn ghost" data-action="topic-practice" data-domain="${q.domain}">練習此領域 →</button></div>`).join('')}</div>`:''}`;}
function notFound(){return `<div class="empty"><h2>找不到這個學習節點</h2><p>請從完整課程重新選擇。</p><a class="btn" href="#courses">瀏覽全部課程</a></div>`;}
function syncMenu(){const sidebar=$('#sidebar');const hidden=matchMedia('(max-width: 850px)').matches&&!sidebar.classList.contains('open');sidebar.inert=hidden;sidebar.setAttribute('aria-hidden',String(hidden));}
function render(){let hash=location.hash.slice(1)||'home', [page,...rest]=hash.split('/'),arg;try{arg=decodeURIComponent(rest.join('/'));}catch{arg='';}const routes={home,courses:()=>courses(arg||'all'),lesson:()=>lesson(arg),architectures,labs,reference,practice,quiz,results,mistakes,plan,skills,sources,glossary:()=>window.CloudAtlasUX.glossaryPage(),search:()=>search(arg)};$('#main').innerHTML=(routes[page]||notFound)();$('#page-name').textContent=pageNames[page]||'學習空間';document.title=(pageNames[page]||'Cloud Atlas')+' · Cloud Atlas SAA-C03';$$('nav a').forEach(a=>a.classList.toggle('active',a.dataset.nav===(page==='lesson'?'courses':['quiz','results'].includes(page)?'practice':page)));$('#sidebar').classList.remove('open');$('.menu-toggle').setAttribute('aria-expanded','false');syncMenu();updateSide();window.CloudAtlasUX?.enhance();if(lastRoute!==hash){window.scrollTo(0,0);lastRoute=hash;}tick();}
function tick(){const s=state.session;if(s&&!s.finished&&s.mode==='exam'){const ms=s.endAt-Date.now();if(ms<=0){finishSession(true);toast('考試時間已到，已自動交卷。');return;}const el=$('#timer');if(el){const secs=Math.ceil(ms/1000);el.textContent=`${String(Math.floor(secs/60)).padStart(2,'0')}:${String(secs%60).padStart(2,'0')}`;if(secs<300)el.style.color='#a65f45';}}}
document.addEventListener('click',e=>{const scroll=e.target.closest('[data-scroll]');if(scroll){e.preventDefault();document.getElementById(scroll.dataset.scroll)?.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'instant':'smooth',block:'start'});return;}const el=e.target.closest('[data-action]');if(!el)return;const a=el.dataset.action,s=state.session;if(a==='download-template')download('static-site.json',JSON.stringify(window.STATIC_SITE_TEMPLATE,null,2));else if(a==='quick')startSession('practice');else if(a==='start-practice')startSession('practice',$('#practice-domain').value,$('#practice-size').value);else if(a==='start-exam')startSession('exam');else if(a==='topic-practice')startSession('practice',el.dataset.domain==='D0'?'all':el.dataset.domain,10);else if(a==='retry-mistakes')startSession('practice','mistakes','all');else if(a==='complete'){const id=el.dataset.id;state.completed=state.completed.includes(id)?state.completed.filter(x=>x!==id):[...state.completed,id];save();render();toast(state.completed.includes(id)?'已標記完成，繼續累積你的架構地圖。':'已取消完成標記。');}else if(a==='print')window.print();else if(a==='skill-filter'){skillFilter=el.dataset.id;render();}else if(a==='remove-mistake'){state.mistakes=state.mistakes.filter(id=>id!==el.dataset.id);save();render();}else if(a==='download-diagram'){const d=ARCHITECTURES.find(d=>d.id===el.dataset.id);const wrapper=document.createElement('div');wrapper.innerHTML=diagram(d);const svg=wrapper.firstElementChild;svg.setAttribute('xmlns','http://www.w3.org/2000/svg');const style=document.createElementNS('http://www.w3.org/2000/svg','style');style.textContent='text{font-family:sans-serif}.wire{stroke:#99ad88;stroke-width:1.5;fill:none;stroke-dasharray:4 4}.node{fill:#fff;stroke:#becdb2}.node-accent{fill:#e3edda;stroke:#9db78b}.node-title{font-size:13px;fill:#4e6e40;font-weight:600}.node-sub{font-size:9px;fill:#748768}.zone{fill:#f1f6eb;stroke:#c9d9be;stroke-dasharray:5 4}.zone-label{font-size:10px;fill:#718663}';svg.prepend(style);download(d.id+'.svg',svg.outerHTML,'image/svg+xml');}else if(s&&!s.finished){if(a==='prev-q'){s.index=Math.max(0,s.index-1);save();render();}if(a==='next-q'){s.index=Math.min(s.ids.length-1,s.index+1);save();render();}if(a==='jump-q'){s.index=Number(el.dataset.index);save();render();}if(a==='flag'){const id=s.ids[s.index];s.flags=s.flags.includes(id)?s.flags.filter(x=>x!==id):[...s.flags,id];save();render();}if(a==='reveal'){const id=s.ids[s.index],q=Q.find(q=>q.id===id),answer=s.responses[id]||[];if(answer.length!==q.answers.length){toast(`請選擇 ${q.answers.length} 個選項。`);return;}s.revealed.push(id);save();render();}if(a==='submit-exam'){const unanswered=s.ids.filter(id=>!s.responses[id]?.length).length;if(window.confirm(`${unanswered?`還有 ${unanswered} 題未作答，將以答錯計算。`:'所有題目皆已作答。'}確定結束並交卷？`))finishSession();}if(a==='abandon'&&window.confirm('確定放棄本次測驗？本次答案將清除，不會記入成績。')){state.session=null;save();location.hash='#practice';}}});
document.addEventListener('change',e=>{if(e.target.matches('input[name="answer"]')){const s=state.session;if(!s||s.finished)return;const id=s.ids[s.index];if(s.revealed.includes(id))return;const answers=$$('input[name="answer"]:checked').map(n=>Number(n.value));if(answers.length)s.responses[id]=answers;else delete s.responses[id];save();$$('.option').forEach(label=>label.classList.toggle('selected',label.querySelector('input').checked));const answeredCount=$('#answered-count');if(answeredCount)answeredCount.innerHTML=`已作答 ${Object.keys(s.responses).length} / ${s.ids.length} 題<br>未作答視為答錯。`;const btn=$(`[data-action="jump-q"][data-index="${s.index}"]`);btn?.classList.toggle('answered',answers.length>0);}if(e.target.dataset.lab){const id=e.target.dataset.lab;state.labs=e.target.checked?[...new Set([...state.labs,id])]:state.labs.filter(x=>x!==id);save();toast(e.target.checked?'已記錄實作完成。':'已取消實作完成。');}});
$('.menu-toggle').addEventListener('click',()=>{const open=$('#sidebar').classList.toggle('open');$('.menu-toggle').setAttribute('aria-expanded',String(open));syncMenu();});
document.addEventListener('keydown',e=>{if(e.key==='/'&&!['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName)){e.preventDefault();$('#global-search').focus();}if(e.key==='Escape'){$('#sidebar').classList.remove('open');$('.menu-toggle').setAttribute('aria-expanded','false');$('#global-search').blur();syncMenu();}});
$('#global-search').addEventListener('keydown',e=>{if(e.key==='Enter'){const q=e.target.value.trim();if(q)location.hash='#search/'+encodeURIComponent(q);}});
function download(name,content,type='application/json'){const url=URL.createObjectURL(new Blob([content],{type}));const a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),3000);}
$('#export-progress').addEventListener('click',()=>download('cloud-atlas-progress-'+new Date().toISOString().slice(0,10)+'.json',JSON.stringify(state,null,2)));
$('#import-progress').addEventListener('change',async e=>{const file=e.target.files?.[0];if(!file)return;try{if(file.size>5e6)throw Error();const data=JSON.parse(await file.text());if(data.version!==1||!Array.isArray(data.completed)||!Array.isArray(data.mistakes)||!Array.isArray(data.history)||!Array.isArray(data.labs))throw Error();if(!window.confirm('匯入將取代目前瀏覽器的學習紀錄，確定繼續？'))return;state={...fresh(),completed:data.completed.filter(id=>C.some(c=>c.id===id)),mistakes:data.mistakes.filter(id=>Q.some(q=>q.id===id)),labs:data.labs.filter(id=>LABS.some(l=>l.id===id)),lastLesson:typeof data.lastLesson==='string'?data.lastLesson:null,history:data.history.filter(h=>['exam','practice'].includes(h.mode)&&Number.isFinite(h.percent)&&h.percent>=0&&h.percent<=100&&Number.isFinite(h.correct)&&Number.isFinite(h.total)&&!isNaN(Date.parse(h.date))).slice(0,30),session:null};save();render();toast('學習紀錄已匯入；為避免計時衝突，未匯入進行中測驗。');}catch{toast('無法匯入：請選擇本站匯出的有效 JSON 紀錄。');}finally{e.target.value='';}});
matchMedia('(max-width: 850px)').addEventListener?.('change',syncMenu);window.addEventListener('hashchange',render);setInterval(tick,1000);render();
})();

</script></body></html>
